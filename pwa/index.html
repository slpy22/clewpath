<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b8f94">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ClewPath">
<title>ClewPath</title>
<link rel="icon" type="image/png" sizes="32x32" href="vendor/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="vendor/favicon-16.png">
<link rel="apple-touch-icon" href="vendor/apple-touch-icon.png">
<link rel="manifest" href="app.webmanifest">
<style>
  :root{
    --bg:#0e1116; --surface:#161b22; --surface2:#1b222b; --line:#262d37; --line2:#333c48;
    --ink:#e7ebf1; --ink2:#b2bbc7; --muted:#8a94a1;
    --accent:#36cbcf; --accent2:#0b8f94; --accent-wash:#123033;
    --good:#4fb47e; --warn:#d69b44; --crit:#e0776d;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,monospace;
    --sans:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#f7f8fa;--surface:#fff;--surface2:#f1f3f6;--line:#e2e6ec;--line2:#d3d9e1;
      --ink:#12161c;--ink2:#454e5b;--muted:#6b7480;--accent:#0b8f94;--accent2:#0a7a7f;--accent-wash:#e5f4f4;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  /* 더블탭 확대 차단(앱/모바일에서 오조작 잦음). manipulation = 팬·핀치는 허용,
     더블탭 줌만 제거 — touch-action 은 상속이 안 돼 전 요소에 건다. */
  *{touch-action:manipulation}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;overflow:hidden;}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;font-size:16px}
  .mono{font-family:var(--mono)}
  .hidden{display:none!important}

  /* ---- 페어링 ---- */
  #pair{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;
    gap:16px;padding:28px;max-width:440px;margin:0 auto}
  #pair h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.02em}
  #pair p{color:var(--muted);margin:0 0 12px;font-size:.9rem}
  #pair p.sit.crit{color:var(--crit)}
  #pair label{font-size:.8rem;color:var(--ink2);font-family:var(--mono);
    text-transform:uppercase;letter-spacing:.08em}
  #pair input{width:100%;margin-top:6px;padding:13px 14px;border-radius:11px;
    background:var(--surface);border:1px solid var(--line2);color:var(--ink);outline:none}
  #pair input:focus{border-color:var(--accent)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;
    border-radius:12px;background:var(--accent2);color:#fff;font-weight:650}
  .btn:active{opacity:.85}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
  .err{color:var(--crit);font-size:.85rem;min-height:1.2em}

  /* ---- 앱 셸 ---- */
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 16px 10px;
    background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header .title{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .grow{flex:1}
  /* 지금 보고 있는 PC 선택 — 제목 옆 select. 클릭하면 저장된 PC + localhost 목록. */
  header .pcname{font-size:.8rem;color:var(--ink);background-color:var(--surface2);
    border:1px solid var(--line);padding:4px 22px 4px 8px;border-radius:8px;
    max-width:min(40vw,220px);min-width:0;flex:0 1 auto;cursor:pointer;font-family:inherit;text-overflow:ellipsis;
    -webkit-appearance:none;appearance:none;   /* iOS 기본 흰 상자 대신 어두운 칩 + ▾ */
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 12px) 55%,calc(100% - 8px) 55%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .dot.on{background:var(--good)} .dot.off{background:var(--crit)}
  header button.icon{width:38px;height:38px;border-radius:10px;font-size:1.1rem;color:var(--ink2)}
  header button.icon:active{background:var(--surface2)}
  #main{flex:1;min-height:0;overflow:hidden}
  #paneList,#paneDetail{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:calc(16px + var(--safe-b))}
  #resizer{display:none}   /* 모바일: 구분선 리사이저 숨김 */
  /* 모바일: 한 화면씩(목록↔상세 전환) */
  #app[data-view=detail] #paneList{display:none}
  #app[data-view=list] #paneDetail{display:none}
  .detail-empty{display:none}

  /* ---- 목록 ---- */
  .search{position:sticky;top:0;z-index:2;padding:12px 14px;background:var(--bg)}
  .search input{width:100%;padding:12px 14px;border-radius:11px;background:var(--surface);
    border:1px solid var(--line);color:var(--ink);outline:none}
  .search input:focus{border-color:var(--accent)}
  /* 라벨 필터 칩 */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .fchip{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line2);color:var(--ink2);font-size:.82rem;white-space:nowrap}
  .fchip.on{background:var(--accent2);color:#fff;border-color:transparent;font-weight:600}
  .fchip:active{opacity:.8}
  /* 세션 행 — 폴더보다 들여쓰기 + 큰 터치 버튼 */
  .glist{padding-left:14px;background:var(--surface)}
  .srow{display:flex;align-items:stretch;background:var(--surface);
    border-bottom:1px solid var(--line);border-left:2px solid var(--line2)}
  .srow:last-child{border-bottom:none}
  .sinfo{flex:1;min-width:0;padding:12px 8px 12px 14px;text-align:left;background:transparent}
  .sinfo:active{background:var(--surface2)}
  .sr1{display:flex;align-items:center;gap:6px;min-width:0}
  .sname{font-weight:620;font-size:.95rem;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .schip{flex:none;font-size:.66rem;padding:1px 7px;border-radius:999px;
    background:var(--accent-wash);color:var(--accent);font-family:var(--mono);
    border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
  /* 페어링 상태 칩(design DR-6): 배경 없이 1px 외곽선, 항상 아이콘+텍스트, 행당 1개. 기존 토큰만 쓴다 */
  .schip.st{background:transparent;font-family:var(--sans);font-size:.72rem;padding:2px 8px}
  .schip.st-crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 55%,transparent)}
  .schip.st-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
  .schip.st-warn.dimtext{color:var(--muted)}
  .schip.st-accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
  .schip.st-muted{color:var(--muted);border-color:var(--line2)}
  .smeta2{font-size:.75rem;color:var(--muted);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap}
  /* 픽커 미표시(에이전트/포크 산물) 세션: 일반 세션과 구분되게 흐리게 */
  .srow.dim .sname{color:var(--muted)}
  .srow.dim .sinfo{opacity:.62}
  .srow.dim.sel .sinfo{opacity:1}   /* 선택 시엔 또렷하게 */
  .schip.gone{background:transparent;color:var(--muted);border-color:var(--line2);font-family:var(--sans)}
  .schip.gone.hot{color:#e5534b;border-color:color-mix(in srgb,#e5534b 45%,transparent);background:color-mix(in srgb,#e5534b 10%,transparent)}
  .k-gone{--k:#e5534b}
  .schip.bg{background:color-mix(in srgb,#a371f7 14%,transparent);color:#a371f7;border-color:color-mix(in srgb,#a371f7 40%,transparent);font-family:var(--sans)}
  .schip.gear{background:color-mix(in srgb,var(--muted) 16%,transparent);
    color:var(--muted);border-color:color-mix(in srgb,var(--muted) 30%,transparent)}
  /* 재개 모델 칩: 감지값=흐리게, 설정됨(오버라이드)=또렷하게. 클릭=모델 설정 */
  .schip.model{background:color-mix(in srgb,var(--muted) 12%,transparent);color:var(--muted);
    border-color:color-mix(in srgb,var(--muted) 26%,transparent);cursor:pointer}
  .schip.model.set{background:var(--accent-wash);color:var(--accent);
    border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
  .spath{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sbtn{width:54px;flex:none;display:grid;place-items:center;font-size:1.3rem;
    border-left:1px solid var(--line);background:transparent}
  .sbtn:active{background:var(--surface2)}
  .sbtn.resume{color:var(--accent)}
  .sbtn.rename{color:var(--ink2)}
  .chip{font-size:.68rem;padding:2px 7px;border-radius:999px;background:var(--accent-wash);
    color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
    font-family:var(--mono);white-space:nowrap}
  .empty{padding:40px 20px;text-align:center;color:var(--muted)}
  /* 폴더 그룹 헤더 — 강한 대비 */
  /* 목록 보기 전환(세션 | 그룹) */
  .lview{display:flex;gap:4px;margin:12px 14px 0;padding:3px;border-radius:11px;background:var(--surface);border:1px solid var(--line)}
  /* 보기 전환 + 검색 — 스크롤해도 위에 남는다(2026-10-14 사장님). 안의 .search 는 이 머리에 실려 함께 고정 */
  .lhead{position:sticky;top:0;z-index:5;background:var(--bg)}
  .lview button{flex:1;padding:8px 0;border-radius:8px;color:var(--ink2);font-size:.88rem;background:transparent}
  .lview button.on{background:var(--accent2);color:#fff;font-weight:600}
  .lview+.search{padding-top:10px}
  /* ---- 📁 파일 보기(VS Code 탐색기·편집기) ---- */
  .fbex{display:flex;align-items:center;gap:8px;padding:12px 8px 6px 16px}
  .fbex-t{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
  .fbex-n{font-size:.72rem;color:var(--muted)}
  .fbex .acts{margin-left:auto;display:flex;gap:2px}
  .fbex .acts button{width:28px;height:26px;border-radius:7px;color:var(--muted);display:flex;align-items:center;justify-content:center}
  .fbex .acts button svg{width:16px;height:16px}
  .fbex .acts button:hover{background:var(--surface2);color:var(--ink)}
  .fbfilter{position:relative;display:block;margin:2px 10px 8px}
  .fbfilter .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);display:flex}
  .fbfilter .si svg{width:14px;height:14px}
  .fbfilter input{width:100%;height:32px;padding:0 10px 0 30px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:.84rem;outline:none;-webkit-appearance:none;appearance:none}
  .fbfilter input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .fbtree{padding:0 6px 18px;font-size:13px;outline:none}
  .fbrow{position:relative;display:flex;align-items:center;height:24px;padding:0 8px 0 2px;margin:1px 0;border-radius:6px;
    cursor:pointer;white-space:nowrap;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;transition:background .08s}
  .fbrow:hover{background:var(--surface)}
  .fbrow.sel{background:var(--accent-wash)}
  .fbrow.sel::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:2px;border-radius:2px;background:var(--accent)}
  .fbtree:focus-visible .fbrow.sel{box-shadow:inset 0 0 0 1px var(--accent)}
  .fbrow .ig,.fbnote-row .ig{flex:none;width:14px;align-self:stretch;position:relative}
  .fbrow .ig::before,.fbnote-row .ig::before{content:'';position:absolute;left:8px;top:-1px;bottom:-1px;border-left:1px solid var(--line2);opacity:.5}
  .fbtree:hover .ig::before{opacity:1}
  .fbrow .tw,.fbnote-row .tw{flex:none;width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .fbrow .tw svg{width:13px;height:13px;transition:transform .12s ease}
  .fbrow .tw.open svg{transform:rotate(90deg)}
  .fbrow .fi{flex:none;width:18px;height:16px;margin-right:6px;display:flex;align-items:center;justify-content:center;color:#d6a243}
  .fbrow .fi svg{width:16px;height:16px}
  .fbrow .ic{flex:none;width:18px;margin-right:6px;text-align:center;font:700 9.5px/1 ui-monospace,Consolas,Menlo,monospace;letter-spacing:-.03em}
  .fbrow.blocked .ic{font-size:11px}
  .fbrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .fbrow.heavy .nm,.fbrow.heavy .fi{opacity:.5} .fbrow.blocked .nm{color:var(--muted)}
  .fbrow .meta{flex:none;color:var(--muted);font-size:.72rem;margin-left:6px}
  .fbrow.root{height:32px;margin-top:3px;position:sticky;top:0;z-index:1;background:var(--bg)}   /* 긴 폴더를 내려도 어느 작업 폴더인지 보이게 */
  .fbrow.root:hover{background:var(--surface)} .fbrow.root.sel{background:var(--accent-wash)}
  .fbrow.root .fi{color:var(--accent)}
  .fbrow.root .rn{font-weight:650}
  .fbrow.root .rp{margin-left:8px;font-size:.76em;color:var(--muted)}
  .fbrow .rcount{flex:none;margin-left:6px;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--surface2);
    border:1px solid var(--line);color:var(--ink2);font-size:.68rem;font-weight:600;display:flex;align-items:center;justify-content:center}
  .fbrow .rlive{flex:none;width:7px;height:7px;border-radius:50%;background:var(--good);margin-left:6px;box-shadow:0 0 0 3px rgba(58,192,106,.18)}
  .fbnote-row{display:flex;align-items:center;min-height:22px;padding:0 8px 0 2px;color:var(--muted);font-size:.78rem;font-style:italic}
  .fbnote-row .nm{flex:1;min-width:0;white-space:normal}
  .fbnote-row.err{color:var(--crit);font-style:normal}
  @media (pointer:coarse){ .fbrow{height:34px} .fbrow.root{height:42px} .fbtree{font-size:14.5px} .fbnote-row{min-height:30px} }
  .fbnote{padding:6px 14px;color:var(--muted);font-size:.8rem}
  .fbpick{cursor:pointer} .fbpick-name{font-weight:600}
  #paneDetail.fb-mode{padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:0}
  .fbtabs{flex:none;display:flex;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
  .fbtabs::-webkit-scrollbar{display:none}
  .fbtab{flex:none;display:flex;align-items:center;gap:4px;padding:7px 4px 7px 12px;font-size:.84rem;color:var(--ink2);
    border-right:1px solid var(--line);cursor:pointer;max-width:220px;touch-action:manipulation}
  .fbtab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fbtab .tdesc{color:var(--muted);font-size:.74rem;margin-left:2px;white-space:nowrap}
  .fbtab.on{background:var(--bg);color:var(--ink);box-shadow:inset 0 2px 0 var(--accent)}
  .fbtab.preview .nm{font-style:italic}
  .fbtab .x{width:24px;height:24px;border-radius:5px;color:var(--muted);font-size:1rem;line-height:1;flex:none}
  .fbcrumb{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:2px;row-gap:4px;padding:5px 10px;font-size:.78rem;
    color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--line)}   /* 폰: 도구 버튼은 다음 줄로 */
  .fbcrumb>button{color:var(--muted);background:transparent;padding:3px 4px;font-size:inherit;flex:none}
  .fbcrumb .sep{opacity:.6}
  .fbcrumb .tools{margin-left:auto;display:flex;gap:6px;padding-left:10px}
  .fbcrumb .tools button{border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--ink2);font-size:.78rem}
  .fbcrumb .tools button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .fbbody{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg)}
  .fbbody>.fbed{position:absolute;inset:0}
  .fbbody>.fbscroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 18px calc(16px + var(--safe-b))}
  .fb-empty{color:var(--muted);text-align:center;margin-top:20vh}
  .fbmd{color:var(--ink);line-height:1.65;max-width:920px;font-size:.95rem;word-break:break-word}
  .fbmd h1,.fbmd h2{border-bottom:1px solid var(--line);padding-bottom:.25em}
  .fbmd pre{background:var(--surface);padding:10px 12px;border-radius:8px;overflow:auto}
  .fbmd code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
  .fbmd :not(pre)>code{background:var(--surface);padding:1px 5px;border-radius:5px}
  .fbmd table{border-collapse:collapse;display:block;overflow-x:auto} .fbmd td,.fbmd th{border:1px solid var(--line);padding:4px 8px}
  .fbmd img{max-width:100%} .fbmd a{color:var(--accent)} .fbmd blockquote{margin:0;padding-left:12px;border-left:3px solid var(--line2);color:var(--ink2)}
  .fbimg{max-width:100%;height:auto;display:block;margin:0 auto;background:repeating-conic-gradient(#8883 0 25%,transparent 0 50%) 0 0/16px 16px}
  .fbinfo{color:var(--ink2);font-size:.92rem;line-height:1.7;max-width:640px}
  .ghead.grp{display:flex;align-items:center;gap:6px}
  .ghead.grp .gtext{flex:1;min-width:0;text-align:left;background:transparent;color:inherit}
  .ghead.grp .gopen{padding:7px 12px;border-radius:9px;background:var(--accent2);color:#fff;font-size:.8rem;flex:none}
  .ghead.grp .gset{width:34px;height:34px;border-radius:9px;color:var(--muted);flex:none}
  .gnew{display:block;margin:16px 14px 24px;width:calc(100% - 28px)}
  /* 👥 팀 보기(팀 통합, 2026-10-13): 목록 칸에서 펼쳐 보고 관리 — 팝업 없이 */
  .tcard{border-bottom:1px solid var(--line)}
  .tcard.arch .ghead{border-left-color:var(--line2);opacity:.85}
  .ghead .tcode{margin-left:8px;font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--muted)}
  .ghead .gpath.warn{color:var(--warn);font-weight:650}
  .tbody{background:var(--surface);padding:4px 0 10px}
  .ttabs{display:flex;gap:4px;padding:8px 12px 6px;overflow-x:auto;scrollbar-width:none}
  .ttabs button{flex:none;padding:6px 12px;border-radius:999px;font-size:.8rem;color:var(--ink2);
    background:var(--surface2);border:1px solid var(--line)}
  .ttabs button.on{background:var(--accent2);color:#fff;border-color:transparent;font-weight:650}
  .tlist{padding:0 0 0 14px}
  .tlist .srow{border-left:2px solid var(--line2)}
  .srow.tk.warn{border-left-color:var(--warn)}
  .tmini{flex:none;padding:0 12px;font-size:.76rem;color:var(--accent);background:transparent}
  .tid{flex:none;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
  .tst{flex:none;font-size:.7rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2)}

  .askopt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface2))}
  .askopt:disabled{opacity:.55;cursor:default}
  .planbody{font-size:.85rem;border-left:3px solid var(--line);padding-left:10px;margin:8px 0;
    max-height:40vh;overflow:auto;white-space:pre-wrap}
  /* 웹 재개: 작업 중 보낸 메시지의 대기/실패 칩 */
  .qchip{font-size:.72rem;color:var(--muted);margin-top:4px;font-style:italic}
  .qchip.fail{color:#f85149}
  /* 구조화 도구 카드 (웹 재개 스트림 + 뷰어 공용). 기본은 접힘 - 헤더 탭으로 펼침 */
  .tcard{border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--surface);overflow:hidden;max-width:100%}
  .tchead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 11px;
    background:none;border:0;color:var(--ink);font-size:.84rem;cursor:pointer}
  .tchead .ttitle{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .tchead .tmeta{margin-left:auto;font-size:.72rem;color:var(--muted);flex:none}
  .tchead .tmeta.ok{color:#3fb950} .tchead .tmeta.err{color:#f85149}
  .tcbody{border-top:1px solid var(--line);padding:8px 11px;font-size:.8rem;overflow-x:auto}
  .tcbody pre{margin:0;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:.76rem}
  .tdiff{font-family:ui-monospace,Consolas,monospace;font-size:.76rem;white-space:pre-wrap;word-break:break-all}
  .tdiff .dl{padding:0 4px;border-radius:3px}
  .tdiff .add{background:rgba(63,185,80,.14);color:#2ea043}
  .tdiff .del{background:rgba(248,81,73,.12);color:#d1453b}
  .tmini{font-size:.76rem;color:var(--muted);padding:2px 4px}
  .todorow{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:.84rem}
  .todorow.done{color:var(--muted);text-decoration:line-through}
  .todorow.now{color:var(--accent);font-weight:600}
  .devrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .devrow>div:first-child{flex:1;min-width:0}
  .devrow .devname{font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .devrow .devname .did{font-family:var(--mono);font-size:.7rem;color:var(--muted);font-weight:400}
  .devrow .devmeta{font-size:.78rem;color:var(--muted);margin-top:2px}
  .devrow .devbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
  /* 비활성 상태(해제됨·폐기 대기)는 버튼만 흐린다 — 이름·칩·meta 는 정상 대비 유지(DR-6) */
  .btn[disabled]{opacity:.45;cursor:default}
  @media (max-width:420px){ .devrow{flex-wrap:wrap} .devrow .devbtns{width:100%;justify-content:flex-start} }
  .diag{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin:-4px 0 10px}
  .sheet-main{font-size:1rem;margin:2px 0 8px}
  .sheet-sub{font-size:.85rem;color:var(--muted);line-height:1.5}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.sm{padding:7px 12px;font-size:.82rem;flex:none;min-height:44px;min-width:44px}   /* 터치 최소 44px(DR-13) */
  .btn.danger{background:transparent;border:1px solid color-mix(in srgb,var(--crit) 45%,transparent);color:var(--crit)}
  .backbar{display:flex;align-items:center;gap:6px;padding:8px 10px;
    position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line)}
  .backbar button{padding:10px 14px;border-radius:10px;color:var(--accent);font-weight:650;font-size:.95rem}
  .backbar button:active{background:var(--surface2)}

  /* ---- 뷰어 / 재개 스트림 ---- */
  .stream{display:flex;flex-direction:column;gap:10px;padding:14px}
  .msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:.92rem;white-space:pre-wrap;
    word-break:break-word;overflow-wrap:anywhere}
  .msg.user{align-self:flex-end;background:var(--accent2);color:#fff;border-bottom-right-radius:4px}
  .msg.assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--line);
    border-bottom-left-radius:4px}
  .msg pre{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;
    overflow-x:auto;font-family:var(--mono);font-size:.82rem;margin:6px 0;white-space:pre;line-height:1.45}
  .msg code{background:var(--bg);border:1px solid var(--line2);border-radius:5px;padding:.05em .35em;
    font-family:var(--mono);font-size:.86em}
  .msg pre code{background:none;border:none;padding:0}
  .msg.user pre,.msg.user code{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.25)}
  .msg table{border-collapse:collapse;margin:8px 0;font-size:.82rem;display:block;
    overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
  .msg th,.msg td{border:1px solid var(--line2);padding:6px 10px;text-align:left;white-space:nowrap}
  .msg th{background:var(--surface2);font-weight:650}
  .msg.user th{background:rgba(0,0,0,.25)}
  .msg.user th,.msg.user td{border-color:rgba(255,255,255,.25)}
  .msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:.78rem;
    font-family:var(--mono);max-width:100%;text-align:center;padding:2px}
  .tool{align-self:flex-start;font-family:var(--mono);font-size:.78rem;color:var(--warn);
    background:color-mix(in srgb,var(--warn) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
    padding:6px 10px;border-radius:10px}
  .result{align-self:center;font-size:.76rem;color:var(--muted);font-family:var(--mono);
    border-top:1px dashed var(--line2);width:100%;text-align:center;padding-top:8px}
  /* '작업 중…' 진행 표시기 */
  .busy{align-self:flex-start;display:flex;align-items:center;gap:4px;
    color:var(--muted);font-size:.85rem;padding:8px 12px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:4px}
  .busy .bdot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bd 1.2s infinite}
  .busy .bdot:nth-child(2){animation-delay:.15s}
  .busy .bdot:nth-child(3){animation-delay:.3s}
  @keyframes bd{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
  .composer .send.working{background:var(--surface2);color:var(--muted)}
  /* 승인 카드(향후 non-skip 모드에서 채워짐) */
  .approve{align-self:stretch;background:var(--surface);border:1px solid var(--warn);
    border-radius:14px;padding:14px}
  .approve .q{font-weight:620;margin-bottom:10px}
  .approve .row2{display:flex;gap:10px}
  .approve .row2 .btn{flex:1;padding:12px}

  .composer{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + var(--safe-b));
    background:var(--surface);border-top:1px solid var(--line)}
  .composer textarea{flex:1;resize:none;max-height:120px;padding:11px 13px;border-radius:12px;
    background:var(--bg);border:1px solid var(--line2);color:var(--ink);outline:none;line-height:1.4}
  .composer textarea:focus{border-color:var(--accent)}
  .composer .send{width:46px;height:46px;border-radius:12px;background:var(--accent2);color:#fff;
    font-size:1.2rem;flex:none;align-self:flex-end}
  .composer .send:disabled{opacity:.4}

  .toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.85rem;
    z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:.95}
  .spin{width:22px;height:22px;border:2.5px solid var(--line2);border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;margin:30px auto;display:block}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---- 웹터미널(재개) — 기존 terminal.html 을 iframe 으로 임베드 ---- */
  /* grid(auto 1fr)로 [뒤로가기 바 · iframe] 배치. flex 대신 grid 인 이유:
     iframe 은 intrinsic 150px 를 가진 replaced 요소라 flex:1 로는 세로가 안 늘어나는
     브라우저가 있다. grid 1fr 트랙은 iframe 을 확실히 늘려 패널을 꽉 채운다. */
  /* auto = 뒤로가기 바, minmax(0,1fr) = iframe. minmax(0,·) 가 핵심:
     1fr 트랙의 기본 최소는 min-content 라 iframe(intrinsic 150px)이 컨테이너보다 커져
     화면 밖으로 넘칠 수 있다. 최소를 0 으로 눌러 정확히 가용 공간에만 맞춘다. */
  /* [뒤로가기 바(auto) · 터미널 영역(1fr)]. iframe 은 replaced 요소라 grid stretch 로도,
     height:100%(컨테이너 전체 기준이라 바 높이만큼 넘침)로도 트랙에 못 맞춘다 — 둘 다 실측 확인.
     그래서 iframe 을 div(.term-frame)로 감싼다: div 는 grid 트랙(1fr)에 정확히 stretch 되고,
     iframe 은 그 div 를 position:absolute·inset:0 로 채워 항상 딱 맞는다. */
  /* 행: [뒤로가기 바(auto)] [터미널 탭 스트립(auto)] [터미널 영역(1fr)] (+보조키 바는 암묵 행) */
  #paneDetail.term-mode{padding:0;overflow:hidden;display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0}
  #paneDetail.term-mode>.term-frame{position:relative;min-height:0;overflow:hidden;background:#0d1117}
  #paneDetail.term-mode>.term-frame>iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #paneDetail.term-mode>.backbar{min-width:0}
  /* 터미널 탭 스트립 — 모니터 범례(.mon-legend: lchip/ldot/lx/ladd/sel/lact)를 그대로 재사용.
     차이는 '줄바꿈 대신 가로 스크롤'(모바일 칩 스트립) 뿐. dead = PTY 가 죽은(재개 시 새 스폰) 탭. */
  .term-tabs{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--line);
    scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  .term-tabs .lchip{flex:none;max-width:46vw}
  .term-tabs .lchip .lname{overflow:hidden;text-overflow:ellipsis}
  .term-tabs .lchip.dead{opacity:.55}
  /* 다른 기기가 가져간 탭(v0.9.4) — 누르면 가져오기. 0.9.7: 전경 탭의 .sel 실선 outline 이 1px 점선 테두리를
     가려 안 보였다(사장님 실기) → outline 자체를 주황 점선으로, 글자도 주황 + 👀 접두로 한눈에 */
  .term-tabs .lchip.taken{border:1px dashed var(--warn);color:var(--warn);
    background:color-mix(in srgb,var(--warn) 10%,transparent);opacity:.95}
  .term-tabs .lchip.taken.sel{outline:2px dashed var(--warn);font-weight:650}
  .term-tabs .lchip.taken .lname::before{content:'👀 '}
  .term-tabs .lchip.taken .lx{color:var(--warn)}
  .term-tabs .lchip.dead .ldot{background:var(--muted)!important}
  /* 상태 밑줄(v0.8.3): 목록 뱃지와 같은 색 의미(파랑 작업 중·주황 권한/입력 대기·초록 완료).
     세션 식별색(.ldot)과 겹치지 않게 칩 안쪽 하단 3px 바(::after). 진행형 상태는 깜빡임.
     밑줄 자리를 위해 탭 칩은 범례 칩보다 아래 여백을 조금 더 둔다(모든 칩 동일 높이). */
  .term-tabs .lchip{position:relative;padding:4px 10px 6px}
  .term-tabs .lchip.st::after{content:'';position:absolute;left:10px;right:10px;bottom:2px;height:3px;
    border-radius:2px;background:var(--st)}
  .term-tabs .lchip.st.stpulse::after{animation:stblink 1.4s ease-in-out infinite}
  @keyframes stblink{0%,100%{opacity:1}50%{opacity:.2}}
  /* 탭 즉시 전환(v0.8.0): 터미널 영역(wrap)이 grid 1fr 행을 차지하고, 그 안에 탭별 host 를
     절대배치로 보유한다. 전경(.on)만 표시 — 숨은 탭의 xterm 버퍼는 그대로 남는다. */
  #paneDetail.term-mode>.term-wrap{position:relative;min-height:0;overflow:hidden;background:#0d1117}
  .term-wrap>.thost{position:absolute;inset:0;display:none}
  .term-wrap>.thost.on{display:block}
  .term-wrap>.thost>iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .term-note{padding:18px}

  /* ---- 모바일 터미널 UX (M2 스파이크, 기획서 §5) — 보조키 바 · 최신 복귀 ---- */
  /* 터치 기기에서만 표시(pointer:coarse). 키보드 위 고정은 grid 마지막 auto 행이 담당 —
     소프트 키보드가 뷰포트를 줄이면 행 전체가 따라 올라온다. */
  .term-keybar{display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    background:#161b22;border-top:1px solid #30363d;overflow-x:auto;
    -webkit-user-select:none;user-select:none;touch-action:pan-x}
  .term-keybar button{flex:1 0 auto;min-width:36px;padding:9px 10px;border:1px solid #30363d;
    border-radius:8px;background:#21262d;color:#e6edf3;font-size:13px;
    font-family:ui-monospace,"Cascadia Code",Consolas,monospace}
  .term-keybar button:active{background:#30363d}
  .term-keybar button.armed{background:var(--accent);color:#fff;border-color:var(--accent)}
  .term-kbwrap{min-width:0}
  .term-compose{gap:4px;padding:6px 8px 0;background:#161b22;border-top:1px solid #30363d}
  .term-compose input{flex:1;min-width:0;padding:9px 10px;border:1px solid #30363d;border-radius:8px;
    background:#0d1117;color:#e6edf3;font-size:16px}
  .term-compose input:focus{outline:none;border-color:var(--accent)}
  .term-compose button{padding:9px 12px;border:1px solid #30363d;border-radius:8px;background:#21262d;
    color:#e6edf3;font-size:13px;-webkit-user-select:none;user-select:none}
  .term-compose button.go{background:var(--accent);border-color:var(--accent);color:#fff}
  .term-compose+.term-keybar{border-top:0}
  .term-jump{position:absolute;right:14px;bottom:14px;z-index:5;padding:8px 14px;
    border-radius:18px;border:1px solid #30363d;background:rgba(33,38,45,.92);
    color:#58a6ff;font-size:13px;display:none}

  /* ---- 모달 (프로파일/폴더변경/사용량) ---- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;
    align-items:center;justify-content:center;z-index:100;padding:14px}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    width:min(680px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal-head h3{margin:0;font-size:1rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modal-head .x{width:34px;height:34px;border-radius:9px;font-size:1.1rem;color:var(--muted);flex:none}
  .modal-head .x:active,.modal-head .x:hover{background:var(--surface2)}
  .modal-body{padding:16px 18px;overflow-y:auto}
  .modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .modal-foot .btn{padding:11px 20px;width:auto}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:.76rem;color:var(--ink2);margin-bottom:5px;
    font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
  .field input,.field textarea,.field select{width:100%;padding:10px 12px;border-radius:10px;
    background:var(--bg);border:1px solid var(--line2);color:var(--ink);outline:none;font-size:15px}
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{resize:vertical;min-height:64px;font-family:var(--mono);font-size:13px}
  .modal-body h3{font-size:.78rem;font-family:var(--mono);text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
  .utable{width:100%;border-collapse:collapse;font-size:.84rem}
  .utable th,.utable td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums}
  .utable th{color:var(--muted);font-family:var(--mono);font-size:.7rem;text-transform:uppercase}
  .qrbox{background:#fff;padding:12px;border-radius:12px;display:flex;justify-content:center;margin:8px 0 14px}
  .qrbox img{width:210px;height:210px;image-rendering:pixelated}

  /* ---- 오케스트레이션 관제 타임라인 ---- */
  .mon-ov{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column}
  .mon-ov.inline{position:relative;inset:auto;z-index:auto;flex:1;min-height:0}
  #paneDetail.mon-mode{padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:0}
  .ghead.grp.sel{background:var(--accent-wash)}
  .mon-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--surface)}
  .mon-head h3{margin:0;font-size:1rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mon-head .x{width:34px;height:34px;border-radius:9px;font-size:1.1rem;color:var(--muted);flex:none}
  .mon-head .x:active,.mon-head .x:hover{background:var(--surface2)}
  .mon-live{font-size:.72rem;font-family:var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .mon-live .dot2{width:9px;height:9px;border-radius:50%;background:#3ac06a}
  .mon-live.on .dot2{animation:monpulse 2s infinite}
  .mon-live.off .dot2{background:var(--muted);animation:none}
  @keyframes monpulse{0%{box-shadow:0 0 0 0 rgba(58,192,106,.5)}70%{box-shadow:0 0 0 7px rgba(58,192,106,0)}100%{box-shadow:0 0 0 0 rgba(58,192,106,0)}}
  .mon-body{flex:1;overflow-y:auto;padding:12px 14px;background:var(--bg)}
  .mrow{border-left:3px solid var(--line);padding:7px 10px;margin:5px 0;border-radius:0 8px 8px 0;background:var(--surface)}
  .mrow.sub{margin-left:22px}
  .mrow-h{display:flex;align-items:center;gap:8px;font-size:.8rem;margin-bottom:3px}
  .mrow-h .mlab{font-weight:600}
  .mrow-h .mtime{color:var(--muted);font-family:var(--mono);font-size:.68rem;margin-left:auto}
  .mcall{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;background:var(--accent-wash);
    color:var(--accent);border-radius:7px;padding:3px 8px;margin:3px 6px 3px 0}
  .mcall b{font-weight:600}
  .mtext{font-size:.86rem;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
  .mtool{display:inline-block;font-size:.72rem;font-family:var(--mono);color:var(--ink2);
    background:var(--surface2);border-radius:6px;padding:2px 7px;margin:3px 5px 0 0}
  .mres{font-size:.76rem;color:var(--ink2);border-left:2px solid var(--line2);padding-left:8px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
  .mon-empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:.86rem}
  .mon-legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;
    border-bottom:1px solid var(--line);background:var(--surface)}
  .mon-legend .lchip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;
    padding:2px 8px;border-radius:999px;border:1px solid var(--line2)}
  .mon-legend .lchip .ldot{width:8px;height:8px;border-radius:50%;flex:none}
  .mon-legend .lchip .lx{cursor:pointer;color:var(--muted);font-weight:700;padding:0 2px}
  .mon-legend .lchip .lx:hover{color:var(--danger,#e5534b)}
  .mon-legend .ladd{cursor:pointer;font-size:.72rem;padding:3px 10px;border-radius:999px;
    border:1px dashed var(--line2);color:var(--accent);background:none}
  /* 타임라인 필터 바(v0.8.4): 종류 단일 선택 + 세션별 숨김. 행은 .fhid 로만 숨긴다(재렌더 없음). */
  .mon-filter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 14px;
    border-bottom:1px solid var(--line);background:var(--surface);font-size:.72rem}
  .mon-filter .fsep{width:1px;height:16px;background:var(--line2);margin:0 2px}
  .mon-filter .fchip{cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
    border:1px solid var(--line2);background:none;color:var(--ink2);font-size:.72rem;font-family:inherit}
  .mon-filter .fchip.on{background:var(--accent-wash);color:var(--accent);border-color:var(--accent)}
  .mon-filter .fchip.off{opacity:.45;text-decoration:line-through}
  .mon-filter .fchip .ldot{width:8px;height:8px;border-radius:50%;flex:none}
  .mon-filter .fcount{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:.68rem;white-space:nowrap}
  .mrow.fhid{display:none}
  /* 뷰어 실시간 배지 */
  .vlive{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-family:var(--mono);
    color:var(--muted);margin-left:auto;white-space:nowrap}
  .vlive .vdot{width:8px;height:8px;border-radius:50%;background:#3ac06a;flex:none}
  .vlive.off .vdot{background:var(--muted)}
  .vlive.on .vdot{animation:monpulse 2s infinite}
  /* 관제 분할: 좌 타임라인 / 우 선택세션 뷰어 */
  .mon-split{flex:1;display:flex;min-height:0;position:relative}
  .mon-split .mon-body{min-width:0}
  .mon-viewer{width:42%;min-width:290px;max-width:640px;border-left:1px solid var(--line);
    display:flex;flex-direction:column;background:var(--surface);min-height:0}
  .mon-viewer.hide{display:none}
  .mon-resizer{width:7px;flex:none;cursor:col-resize;background:var(--surface);position:relative}
  .mon-resizer::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:2px;height:26px;border-radius:2px;background:var(--line2)}
  .mon-resizer:hover::before,.mon-resizer.dragging::before{background:var(--accent);height:44px}
  .mon-resizer.gone{display:none}
  .mon-vhead{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    gap:8px;flex-wrap:wrap;background:var(--surface2)}
  .mon-vhead .vname{font-weight:600;font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
  .mon-vbody{flex:1;overflow-y:auto;padding:10px 12px;min-height:0}
  .mon-follow{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;color:var(--muted);cursor:pointer;white-space:nowrap}
  .mon-follow input{width:15px;height:15px}
  .mon-vtoggle{width:34px;height:34px;border-radius:9px;color:var(--muted);flex:none;font-size:1rem}
  .mon-vtoggle:hover,.mon-vtoggle:active{background:var(--surface2)}
  .mon-save{position:relative}
  .mon-save.saved{color:var(--accent)}   /* 저장된 그룹으로 관전 중 */
  .mon-save.dirty::after{content:'';position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;
    background:#e8a03c;box-shadow:0 0 0 2px var(--surface)}   /* 저장 그룹과 구성이 달라짐 */
  .mon-legend .lchip{cursor:pointer}
  .mon-legend .lchip.sel{outline:2px solid var(--accent);outline-offset:1px}
  .mon-legend .lchip .lact{width:7px;height:7px;border-radius:50%;background:var(--accent);
    animation:monpulse 1.4s infinite;flex:none}
  /* 터미널 탭 스트립 — 모바일/터치: 범례용 작은 칩(.72rem)은 손가락에 너무 작다(폰 실측).
     44px 급 터치 타깃으로 키우고 × 히트 영역을 넓히되 겉모습 부피는 음수 마진으로 상쇄.
     범례 규칙(.mon-legend .lchip)과 특이성이 같아 반드시 그 뒤에 와야 이긴다. */
  @media (max-width:879px), (pointer: coarse){
    .term-tabs{padding:6px 10px;gap:8px}
    .term-tabs .lchip{font-size:.92rem;padding:8px 12px 10px;min-height:40px;gap:7px;max-width:70vw}
    .term-tabs .lchip.st::after{left:12px;right:12px;bottom:3px}
    .term-tabs .lchip.sel{font-weight:650;background:var(--surface2);outline-width:2px}
    .term-tabs .lchip .ldot{width:10px;height:10px}
    .term-tabs .lchip .lact{width:9px;height:9px}
    .term-tabs .lchip .lx{font-size:1.1rem;padding:6px 8px;margin:-6px -8px -6px -2px;min-width:32px;text-align:center}
    .term-tabs .ladd{font-size:.92rem;padding:8px 14px;min-height:40px}
    .mon-filter .fchip{font-size:.85rem;padding:6px 12px;min-height:36px}
  }
  @media(max-width:760px){ .mon-viewer{position:absolute;inset:0;width:auto;min-width:0;max-width:none;z-index:3}
    .mon-resizer{display:none} }
  .mpick{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0}
  .mpick .mp-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
  .mpick .mp-mgr{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:4px;flex:none}
  .mpick input[type=checkbox],.mpick input[type=radio]{width:18px;height:18px;flex:none}

  /* ---- 데스크톱(≥880px): master-detail 2-pane ---- */
  @media (min-width:880px){
    body{background:var(--surface2)}
    /* 데스크톱: 클라이언트 영역 가로 전체 사용(좌우 여백 없음). */
    #app{width:100%;background:var(--bg)}
    #pair{max-width:460px}
    /* 좌(목록) + 우(상세) 동시 표시. 모바일용 한-화면 규칙은 무효화 */
    #main{display:grid;grid-template-columns:var(--list-w,350px) 7px 1fr;grid-template-rows:minmax(0,1fr)}
    /* 데스크톱 2단: 두 pane 을 항상 표시. 단 term-mode(터미널)는 grid 로 둬야 하므로 제외 —
       이 !important 가 term-mode 의 display:grid 를 뭉개면 iframe 영역이 무너진다(실측 확인). */
    #app[data-view] #paneList,
    #app[data-view] #paneDetail:not(.term-mode):not(.fb-mode):not(.mon-mode){display:block!important}
    #app[data-view] #paneDetail.mon-mode{display:flex!important}
    #app[data-view] #paneDetail.fb-mode{display:flex!important}   /* 파일 편집기는 목록(탐색기)과 나란히 항상 보임 */
    #paneDetail{font-size:15px}
    /* 드래그 구분선 */
    #resizer{display:block;position:relative;cursor:col-resize;background:var(--surface);
      border-left:1px solid var(--line);border-right:1px solid var(--line)}
    #resizer::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      width:2px;height:26px;border-radius:2px;background:var(--line2);transition:background .12s}
    #resizer:hover::before,#resizer.dragging::before{background:var(--accent);height:40px}
    body.col-resizing{cursor:col-resize;user-select:none}
    .backbar.tolist{display:none}              /* '목록' 뒤로가기 숨김(목록 항상 보임) */
    .backbar.toonly>.toback{display:none}      /* 터미널·뷰어 줄: '목록' 버튼만 숨기고 나머지 버튼은 둔다 */
    .detail-empty{display:flex;height:100%;align-items:center;justify-content:center;
      color:var(--muted);padding:40px;text-align:center}
    .sbtn{width:56px;font-size:1.3rem}
    .msg{max-width:80%}
    /* 마우스 hover 피드백(터치엔 영향 없음) */
    .srow:hover{background:var(--surface2)}
    .srow.sel{background:var(--accent-wash)}
    .srow.sel .sname{color:var(--accent)}
    .ghead:hover{filter:brightness(1.08)}
    .sbtn:hover{background:var(--surface2)}
    .backbar button:hover{background:var(--surface2)}
  }
</style>
</head>

<!-- ===== 앱 ===== -->

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="native-bridge.js"></script>
<script>
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const LS = window.localStorage;

// ---- 실행 모드: local(006 직접 fetch) vs relay(WS RPC). 서버가 주입, 없으면 경로로 추론 ----
// 앱(Capacitor)은 브리지가 'relay' 를 강제한다 — 로컬 번들이라 경로 추론이 어긋나기 때문.
const SM_MODE_RAW="{{MODE}}", SM_BASE_RAW="{{BASE}}";
const MODE=(window.ClewBridge&&ClewBridge.modeOverride())
  ||((SM_MODE_RAW.indexOf('{{')<0 && SM_MODE_RAW)?SM_MODE_RAW
  :(location.pathname.indexOf('/relay/')>=0?'relay':'local'));
// 프로토콜 버전(기획서 §12-8): 앱은 스토어 심사에 묶여 웹·Host 보다 늦게 갱신되므로,
// auth 에서 서로 pv 를 교환해 불일치를 사용자에게 알린다.
const PV=2;   // 2(0.11.0): notice·bye_device·서버 self-revoke — Host pv≥2 에서만 '해제 완료' 로 표시(E-D17)
const APIBASE=(SM_BASE_RAW.indexOf('{{')<0)?SM_BASE_RAW:'';
function qs(o){ if(!o)return''; const e=Object.entries(o).filter(([k,v])=>v!=null&&v!=='');
  return e.length?'?'+e.map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&'):''; }

// ---- WS URL 유도 (/app 옆의 /ws). 로컬/nginx 모두 자동 대응 ----
function wsUrl(){
  const o=window.ClewBridge&&ClewBridge.wsBaseOverride();   // 앱: 페어링 링크에서 저장한 릴레이 주소
  if(o) return o;
  const base = location.pathname.replace(/\/(app|index\.html)\/?$/,'').replace(/\/$/,'');
  const proto = location.protocol==='https:'?'wss':'ws';
  return `${proto}://${location.host}${base}/ws`;
}

// ---- 여러 PC 지원: 페어링한 PC 들을 목록으로 보관하고 전환한다 ----
// 저장 형태: sm_pcs = [{room, cs, cp, dev, name, added, last}]
// 활성 PC 의 자격은 기존 키(sm_room/sm_cs/sm_cp/sm_devtoken)에 미러링해
// 기존 접속 경로(clientJwt/conn)가 그대로 동작하게 한다.
function pcsLoad(){ try{ const a=JSON.parse(LS.getItem('sm_pcs')||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function pcsSave(a){ LS.setItem('sm_pcs', JSON.stringify(a)); }
function pcName(pc){ return pc.name || ('PC ' + String(pc.room).replace(/^rm_/,'').slice(0,6)); }
function pcsUpsert(c){
  if(!c||!c.room) return;
  const a=pcsLoad(); const i=a.findIndex(x=>x.room===c.room);
  // name: 사용자가 붙인 이름 우선, 없으면 Host 가 auth 응답에 준 hostname(B-1 PC 이름 자동).
  // pv: 마지막 auth 의 Host 규약 버전 — 구 Host 게이팅(E-D17)에 쓴다.
  const rec={room:c.room, cs:c.cs||'', cp:c.cp||'', dev:c.dev||'',
             name:(i>=0?a[i].name:'')||c.name||'',
             pv:(c.pv|0)||(i>=0?(a[i].pv|0):0),
             added:(i>=0?a[i].added:Date.now()), last:Date.now()};
  // state: removed(⛔ PC 에서 해제)·changed(⛔ 페어링 바뀜)·reissued(🔄 QR 바뀜). 같은 자격이면 유지, 새 QR 이면 해제
  const st=('state' in c)?c.state:((i>=0&&a[i].cp===rec.cp&&a[i].dev===rec.dev)?a[i].state:undefined);
  if(st) rec.state=st;
  if(i>=0) a[i]=rec; else a.push(rec);
  pcsSave(a);
}
function pcsActivate(room){
  const pc=pcsLoad().find(x=>x.room===room); if(!pc) return null;
  LS.setItem('sm_room',pc.room);
  if(pc.cs&&pc.cp){ LS.setItem('sm_cs',pc.cs); LS.setItem('sm_cp',pc.cp); }
  else { LS.removeItem('sm_cs'); LS.removeItem('sm_cp'); }
  if(pc.dev){ LS.setItem('sm_devtoken',pc.dev); conn.devToken=pc.dev; }
  else { LS.removeItem('sm_devtoken'); conn.devToken=''; }
  LS.removeItem('sm_cjwt');          // 자격이 바뀌었으니 캐시된 JWT 폐기(필수)
  LS.removeItem('sm_grace');         // 2FA 신뢰도 PC 단위
  pc.last=Date.now(); pcsUpsert(pc);
  refreshPcSelect();                 // 헤더 select 를 현재 PC 로 갱신 + 타이틀
  return pc;
}
function pcsRemove(room){ pcsSave(pcsLoad().filter(x=>x.room!==room)); }
function pcMarkState(room, st){
  const a=pcsLoad(); const i=a.findIndex(x=>x.room===room); if(i<0) return false;
  if(st) a[i].state=st; else delete a[i].state; pcsSave(a); return true;
}
const PC_STATE_CHIP={
  removed:{icon:'⛔', text:'PC 에서 해제됨', tone:'crit'},
  changed:{icon:'⛔', text:'페어링 바뀜', tone:'crit'},
  reissued:{icon:'🔄', text:'QR 바뀜', tone:'accent'}
};
// ---- 폐기 큐(0.11.0 B-4, eng E-D18): 폰이 스스로 자격을 폐기(self-revoke). 항목은 발급한 CP 주소(cp)를 품는다 ----
// 저장이 확정된 뒤에야 자격을 지운다(persistSync) — 앱 저장소 퇴거·종료에도 재시도 자료가 남게. 90일 지나면 포기(E-5 안전망).
const REVOKE_Q='sm_revoke_queue';
function revokeQLoad(){ try{ const a=JSON.parse(LS.getItem(REVOKE_Q)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
async function revokeQSave(a){
  if(a.length) LS.setItem(REVOKE_Q, JSON.stringify(a)); else LS.removeItem(REVOKE_Q);
  try{ if(window.ClewBridge&&ClewBridge.persistSync) await ClewBridge.persistSync(REVOKE_Q); }catch(e){}
}
async function revokeEnqueue(pc){
  if(!pc||!pc.cs||!pc.cp) return false;                  // 공유토큰(구형)은 폐기할 자격이 없다
  let cp=''; try{ cp=cpBase(); }catch(e){}
  if(!cp) return false;
  const q=revokeQLoad().filter(x=>x.public_id!==pc.cp);
  q.push({cp, public_id:pc.cp, secret:pc.cs, room:pc.room, ts:Date.now()});
  await revokeQSave(q); return true;
}
// 200(폐기됨/이미 폐기)·401(자격 없음) = 완료로 큐에서 뺀다. 그 외(404 구 CP·5xx·네트워크)는 남긴다.
async function revokeFlush(){
  const q=revokeQLoad(); if(!q.length) return {done:[], left:0};
  const keep=[], done=[];
  for(const it of q){
    let ok=false;
    try{ const r=await fetch(String(it.cp).replace(/\/$/,'')+'/client/revoke-self',{method:'POST',
           headers:{'Content-Type':'application/json'}, body:JSON.stringify({public_id:it.public_id, secret:it.secret})});
         ok=(r.status===200||r.status===401); }catch(e){}
    if(ok) done.push(it.room);
    else if(Date.now()-(it.ts||0) < 90*86400000) keep.push(it);
  }
  await revokeQSave(keep);
  return {done, left:keep.length};
}
// 사용자가 붙이는 이름은 여기로만(pcsUpsert 는 '기존 이름 우선' 이라 hostname 이 사용자 이름을 못 덮는다).
// 빈 이름 = 사용자 이름 해제 → 다음 auth 의 hostname 으로 다시 채워진다.
function pcsSetName(room, name){
  const a=pcsLoad(); const i=a.findIndex(x=>x.room===room); if(i<0) return false;
  a[i].name=String(name||'').trim(); pcsSave(a); return true;
}

// ---- client JWT: 기기 전용 secret 을 단기 JWT 로 교환(캐시+사전갱신) ----
function cpBase(){
  // 앱(로컬 번들): 페이지 origin 이 capacitor://localhost 라 유도가 불가능 —
  // 페어링 때 저장한 릴레이 WS 주소(wss://host[/relay]/ws)에서 CP 를 유도한다.
  // (이게 빠져서 앱이 JWT 없이 릴레이에 붙어 4401 나던 버그 - 맥 측 실측)
  const o=window.ClewBridge&&ClewBridge.wsBaseOverride();
  if(o){
    try{
      const u=new URL(o.replace(/^ws/,'http'));
      const p=u.pathname.replace(/\/relay\/ws\/?$/,'').replace(/\/ws\/?$/,'');
      return u.origin + p + '/cp';
    }catch(e){}
  }
  // 웹: 릴레이가 /relay/ 로 서빙되면 CP 는 같은 호스트의 /cp/
  const m=location.pathname.match(/^(.*)\/relay\//);
  return (location.origin + ((m&&m[1])||'') + '/cp');
}
async function clientJwt(force){
  const cs=LS.getItem('sm_cs'), cpid=LS.getItem('sm_cp');
  if(!cs||!cpid) return null;                       // 구 방식(공유 토큰) 사용 중
  if(!force){
    try{ const c=JSON.parse(LS.getItem('sm_cjwt')||'null');
      // 만료 5분 전부터는 미리 갱신 (폰이 끊긴 사이 만료되는 걸 줄임)
      if(c&&c.token&&c.exp&&(c.exp-300)*1000>Date.now()) return c.token;
    }catch(e){}
  }
  try{
    const r=await fetch(cpBase()+'/client/token',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({public_id:cpid,secret:cs})});
    if(!r.ok){ if(r.status===401){ pcMarkState(LS.getItem('sm_room'),'changed');
        toast('PC 에서 페어링이 바뀌었습니다(해제 또는 QR 재발급) — 새 QR 을 스캔하세요'); } return null; }
    const j=await r.json();
    LS.setItem('sm_cjwt',JSON.stringify({token:j.token,exp:j.expires_at}));
    return j.token;
  }catch(e){
    // CP 불통: 캐시된 JWT 가 아직 유효하면 그걸로 버틴다
    try{ const c=JSON.parse(LS.getItem('sm_cjwt')||'null');
      if(c&&c.token&&c.exp*1000>Date.now()) return c.token; }catch(_){}
    return null;
  }
}

// ---- RPC over WebSocket ----
function u8ToB64u(u8){ let s=''; u8.forEach(b=>s+=String.fromCharCode(b));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
class Conn{
  constructor(){ this.ws=null; this.seq=0; this.waiters=new Map(); this.streams=new Map();
    this.onstatus=()=>{}; this.peer=false;
    this.devToken=LS.getItem('sm_devtoken')||''; this.authed=false; this.cid=null; this.onauth=null;
    // E2EE: 페어링 때 받은 룸 키(sm_e2ee_<room>). 송수신을 각각 직렬화해
    // WebCrypto 비동기 완료 순서가 프레임 순서를 깨지 않게 한다(터미널 입력 필수).
    this.e2eeKey=null; this._txq=Promise.resolve(); this._rxq=Promise.resolve(); }
  async _seal(obj){
    const nonce=crypto.getRandomValues(new Uint8Array(12));
    const pt=new TextEncoder().encode(JSON.stringify(obj));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:nonce},this.e2eeKey,pt));
    const raw=new Uint8Array(13+ct.length); raw[0]=1; raw.set(nonce,1); raw.set(ct,13);
    return {v:1,e:'a1',p:u8ToB64u(raw)};
  }
  async _openEnv(env){
    const raw=b64uToU8(env.p);
    if(raw[0]!==1) throw new Error('bad version');
    const pt=new Uint8Array(await crypto.subtle.decrypt(
      {name:'AES-GCM',iv:raw.subarray(1,13)},this.e2eeKey,raw.subarray(13)));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  _tx(obj){                              // 유일한 송신 경로(암호화 여부 일원화)
    if(!this.e2eeKey){ try{this.ws.send(JSON.stringify(obj));}catch(e){} return; }
    this._txq=this._txq.then(async()=>{ const env=await this._seal(obj);
      this.ws.send(JSON.stringify(env)); }).catch(()=>{});
  }
  _doAuth(){   // 기기 토큰이 있으면 릴레이 연결 직후 기기 인증 → {ok,error,data} (토큰 없으면 null)
    if(!this.devToken){ this.authed=false; return Promise.resolve(null); }
    // name: 폰이 자기 이름을 보고한다(B-1) — Host 는 등록부의 임시 이름만 이걸로 채운다.
    return this.req('auth',{token:this.devToken,pv:PV,name:deviceSelfName()}).then(r=>{
      this.authed=!!(r&&r.ok);
      // 접속한 PC(호스트)의 버전 — 우선 auth 응답값으로 표시, 이어서 최신 여부까지 확인.
      if(this.authed && r.data && r.data.ver){ showVer(r.data.ver, null); refreshVer(); }
      // pv 핸드셰이크: Host 가 더 새 프로토콜이면(스토어 심사로 앱만 뒤처진 상황)
      // 기능이 조용히 깨지기 전에 업데이트를 안내한다. 응답에 pv 가 없으면 구 Host(호환 유지).
      if(this.authed && r.data && (r.data.pv|0)>PV && !this._pvWarned){
        this._pvWarned=true;
        toast('PC 프로그램이 더 새 통신 규약을 사용합니다 — 이 앱/화면을 업데이트해 주세요');
      }
      // 페어링 중(_pairing)에는 전역 onauth(자격 상실 화면·로그아웃)를 부르지 않는다 — 결과는 doPair 가
      // connect() 의 auth 필드로 받아 되돌리기(pairRollback)까지 스스로 처리한다.
      if(this.onauth && !this._pairing)this.onauth(this.authed, r&&r.error);
      return {ok:this.authed, error:(r&&r.error)||null, data:(r&&r.data)||null};
    }).catch(e=>({ok:false, error:String((e&&e.message)||e||'auth_failed'), data:null}));
  }
  async connect(room,token){
    this._room=room; this._token=token;           // 재접속에 사용
    // E2EE 키 로드(페어링 때 저장됨). 없으면 평문(구 페어링 호환).
    this.e2eeKey=null;
    const rk=LS.getItem('sm_e2ee_'+room);
    if(rk && window.crypto && crypto.subtle){
      try{ this.e2eeKey=await crypto.subtle.importKey('raw', b64uToU8(rk), 'AES-GCM',
             false, ['encrypt','decrypt']); }catch(e){}
    }
    const cjwt=await clientJwt(false);            // 기기 전용 자격이 있으면 JWT 로
    return new Promise((res,rej)=>{
      let done=false;
      let url=`${wsUrl()}?role=client&room=${encodeURIComponent(room)}&v=1`;
      if(cjwt) url+=`&jwt=${encodeURIComponent(cjwt)}`;
      else if(token) url+=`&token=${encodeURIComponent(token)}`;
      const ws=new WebSocket(url); this.ws=ws;
      ws.onopen=()=>{};
      const dispatch=(m)=>{
        if(m.type==='res'||m.type==='pong'){
          if(m.error==='auth_required'&&this.onauth)this.onauth(false,'auth_required');
          if((m.error==='e2ee_key_mismatch'||m.error==='e2ee_required')&&!this._e2eeWarned){
            this._e2eeWarned=true;
            toast(m.error==='e2ee_required'
              ?'이 PC 가 종단 암호화를 요구합니다 - 새 QR 로 재페어링해 주세요'
              :'암호화 키가 맞지 않습니다 - 이 기기를 다시 페어링해 주세요'); }
          const w=this.waiters.get(m.id);
          if(w){this.waiters.delete(m.id); w(m);} return; }
        if(m.type==='stream'){ const h=this.streams.get(m.id); if(h)h(m); return; }
        if(m.type==='notice'){ if(this.onnotice) this.onnotice(m); return; }   // 0.11.0: PC 가 이 기기를 해제/재발급
      };
      ws.onmessage=(ev)=>{
        let m; try{m=JSON.parse(ev.data);}catch(e){return;}
        // 릴레이가 직접 보내는 제어 프레임(암호화 대상 아님)
        if(m.type==='hello'){ this.peer=!!m.peer_present; this.cid=m.cid||null;
          this.onstatus(true,this.peer);
          // connect() 의 resolve 값에 auth 결과를 싣는다(eng E-D16): hello 는 릴레이 입장일 뿐이라
          // 기기 인증 실패(만료 QR 등)를 '성공' 으로 오해하지 않게. reject 는 안 한다(onauth 경로 유지).
          if(!done){ if(this.devToken){ this._doAuth().then(a=>{ if(!done){done=true;res({...m, auth:a});} }); }
                     else { done=true; res({...m, auth:null}); } }
          return; }
        if(m.type==='peer'){ if(m.event==='agent_online'){ this.peer=true; setTimeout(()=>{ try{ refreshVer(); }catch(e){} }, 3000);   // PC 재기동(업데이트) 뒤 버전 확인
            // 릴레이 연결은 살아 있고 PC 만 재기동된 경우: 끊긴 전경 터미널을 다시 붙인다(전엔 화면 복귀·재접속 때만 → 오래 끊김, 2026-10-12)
            setTimeout(()=>{ try{ reattachForegroundTab(); }catch(e){} }, 1500); }
          if(m.event==='agent_offline')this.peer=false; this.onstatus(true,this.peer); return; }
        // 나머지: 봉투면 복호(수신 직렬화로 순서 보존) 후 디스패치
        this._rxq=this._rxq.then(async()=>{
          if(m&&m.e==='a1'&&m.p){
            if(!this.e2eeKey) return;      // 키 없이 온 봉투는 처리 불가
            try{ m=await this._openEnv(m); }catch(e){ return; }
          }
          dispatch(m);
        }).catch(()=>{});
      };
      ws.onclose=(ev)=>{ this.onstatus(false,false);
        if(!done){done=true;rej(new Error(this._closeMsg(ev&&ev.code)));}
        for(const w of this.waiters.values())w({ok:false,error:'disconnected'});
        this.waiters.clear();
        // 릴레이가 끊기면 서버측 rid 는 전부 죽는다(커넥터가 client_offline 로 파이프 해체).
        // 핸들러를 남겨두면 '살아있다고 착각하는 죽은 스트림'이 된다(재연결 후 조용한 사망) —
        // eof 를 통지해 화면이 '연결 종료'를 그리고 termView 가 재접속 대상임을 알게 한다.
        for(const h of this.streams.values()){ try{h({eof:true});}catch(e){} }
        this.streams.clear();
        this._scheduleReconnect(ev&&ev.code); };
      ws.onerror=()=>{ if(!done){done=true;rej(new Error('연결 실패'));} };
    });
  }
  req(method,params={}){
    return new Promise((res)=>{
      // 소켓이 안 열려 있으면 즉시 실패. _tx 는 닫힌 소켓의 send 예외를 삼켜 프레임을 버리므로
      // 여기서 안 막으면 waiter 가 영원히 대기한다(재연결 뒤에도 미해소 — relay e2e 실측).
      // onclose 가 남은 waiter 에 주는 것과 같은 답을 준다.
      if(!this.ws||this.ws.readyState!==1){ res({ok:false,error:'disconnected'}); return; }
      const id='c'+(++this.seq); this.waiters.set(id,res);
      this._tx({v:1,type:'req',id,method,params});
    });
  }
  // 로컬 006 /api/* 제네릭 호출
  async api(verb,path,{query,body,grace,otp}={}){
    // grace/otp: 특권 경로(터미널 종료 등)는 커넥터가 start 와 같은 2FA 게이트를 건다
    const r=await this.req('api',{verb,path,query,body,grace,otp});
    if(!r.ok){
      if(r.data&&r.data.status){ const e=new Error('HTTP '+r.data.status);
        e.status=r.data.status; e.json=r.data.json; throw e; }
      throw new Error(r.error||'api error');
    }
    if(r.data.status>=400){ const e=new Error('HTTP '+r.data.status);
      e.status=r.data.status; e.json=r.data.json; throw e; }
    return r.data.json;
  }
  startResume(sessionId,onFrame,inplace,cred){
    const id='s'+(++this.seq); this.streams.set(id,onFrame);
    this._tx({v:1,type:'req',id,method:'resume',
      params:{session_id:sessionId,skip:!(cred&&cred.safe),inplace:!!inplace,
        grace:(cred&&cred.grace)||'',otp:(cred&&cred.otp)||''}});
    return {
      id,
      input:(text)=>this._tx({v:1,type:'stream_in',id,
        data:{type:'user',message:{role:'user',content:[{type:'text',text}]}}}),
      close:()=>this.streams.delete(id),
    };
  }
  // 웹터미널 스트림(원시 텍스트). onData(data,eof)
  startTerminal(sessionId,onData,cred){
    const id='t'+(++this.seq);
    this.streams.set(id,(m)=>{ if(m.eof){onData(null,true,m.error);} else onData(m.data,false); });
    this._tx({v:1,type:'req',id,method:'terminal',
      params:{session_id:sessionId,skip:!(cred&&cred.safe),   // safe=권한확인 유지(원격 승인용)
        grace:(cred&&cred.grace)||'',otp:(cred&&cred.otp)||'',
        screen:(cred&&cred.screen)||''}});   // 화면 커서: 재접속 때 이 화면이 못 본 델타만 리플레이
    return { send:(obj)=>this._tx({v:1,type:'stream_in',id,data:obj}),
             // close 는 서버에 stream_close 를 보내 이 rid 의 로컬 WS 를 끊게 한다
             // (배경 탭 detach: 화면만 뗌, PTY 는 persist 유지). 이게 없으면 릴레이
             // 모드에서 close 가 클라 핸들러만 지우고 서버 화면은 계속 붙어 있었다.
             close:()=>{ try{this._tx({v:1,type:'stream_close',id});}catch(e){} this.streams.delete(id); } };
  }
  // 오케스트레이션 관제 스트림(읽기전용). onEvent(dataStr, eof, error)
  startMonitor(ids,manager,onEvent,gid){
    const id='mon'+(++this.seq);
    this.streams.set(id,(m)=>{ if(m.eof){onEvent(null,true,m.error);} else onEvent(m.data,false); });
    this._tx({v:1,type:'req',id,method:'monitor',params:gid?{ids,manager,gid}:{ids,manager}});
    return {
      add:(sid,role)=>this._tx({v:1,type:'stream_in',id,
        data:{type:'add',session_id:sid,role:role||'sub'}}),
      remove:(sid)=>this._tx({v:1,type:'stream_in',id,
        data:{type:'remove',session_id:sid}}),
      close:()=>this.streams.delete(id),
    };
  }
  _closeMsg(code){
    if(code===4402) return '기기 자격이 만료·거부되었습니다(갱신 후 재시도)';
    if(code===4403) return '이 room 이 더 이상 유효하지 않습니다 — 재페어링이 필요합니다';
    if(code===4426) return '앱/커넥터 버전이 낮습니다 — 업데이트가 필요합니다';
    if(code===4401) return '접속 자격이 올바르지 않습니다(토큰/room 확인)';
    return '연결이 끊겼습니다';
  }
  _scheduleReconnect(code){
    if(this._stopped) return;                       // 사용자가 로그아웃한 경우
    if(code===4403||code===4426){                   // 재시도해도 소용없는 사유
      toast(this._closeMsg(code)); return; }
    if(this._retryTimer) return;
    this._retry=Math.min((this._retry||0)+1,6);
    const wait=Math.min(1000*Math.pow(2,this._retry-1),30000);
    this._retryTimer=setTimeout(async()=>{
      this._retryTimer=null;
      if(code===4402) await clientJwt(true);        // 만료 추정 → JWT 강제 갱신
      try{ await this.connect(this._room,this._token); this._retry=0; toast('다시 연결됨'); loadList();
        reattachForegroundTab(); }              // 보고 있던 터미널 탭을 persist PTY 에 다시 붙인다
      catch(e){ this._scheduleReconnect(); }
    },wait);
  }
  logout(){ this._stopped=true;
    if(this._retryTimer){clearTimeout(this._retryTimer);this._retryTimer=null;}
    try{this.ws&&this.ws.close();}catch(e){} }
}

const conn=new Conn();

// ---- Transport 추상화: UI 는 T.* 만 호출. 로컬/릴레이 구현만 다르다 ----
const relayT={
  mode:'relay', needsPairing:true,
  async list(p){ const r=await conn.req('list_sessions',p); if(!r.ok)throw new Error(r.error||'목록 실패'); return r.data; },
  api:(v,p,o)=>conn.api(v,p,o),
  resume:(id,cb,opts)=>conn.startResume(id,cb,opts&&opts.inplace,opts),
  terminal:(id,cb,opts)=>conn.startTerminal(id,cb,opts),
  monitor:(ids,manager,cb,gid)=>conn.startMonitor(ids,manager,cb,gid),
  async exportSession(id,wd){ const r=await conn.req('export',{session_id:id,include_workdir:!!wd});
    if(!r.ok)throw new Error(r.error||'내보내기 실패'); return r.data; },
  async importSession(file,opts){ const b64=await fileToB64(file);
    const r=await conn.req('import',Object.assign({filename:file.name,b64},opts));
    return r.data || {error:r.error||'가져오기 실패'}; },
  grant(otp){ return conn.req('grant',{otp}).then(r=>{ if(!r.ok)throw new Error(r.error||'인증 실패'); return r.data; }); },
  logout(){ resetDevice(); },
};
const localT={
  mode:'local', needsPairing:false,
  async list(p){ const r=await fetch(APIBASE+'/api/v1/sessions'+qs(p));
    if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); },
  async api(v,p,{query,body}={}){
    const r=await fetch(APIBASE+p+qs(query),{method:v,
      headers:body?{'Content-Type':'application/json'}:{},
      body:body?JSON.stringify(body):undefined});
    if(!r.ok){ const e=new Error('HTTP '+r.status); e.status=r.status;
      try{e.json=await r.json();}catch(_){}
      throw e; }
    return r.json();
  },
  resume(id,cb,opts){
    const proto=location.protocol==='https:'?'wss':'ws';
    const ep=(opts&&opts.inplace)?'resume-inplace':'resume';
    // src=pwa: 사람이 이 화면에서 친 말임을 Host 에 알린다(팀 장부의 '사장님 입력' 판정 — 스크립트의 in-place 재개와 구분)
    const ws=new WebSocket(`${proto}://${location.host}${APIBASE}/api/v1/${ep}/${id}?skip=${(opts&&opts.safe)?0:1}&src=pwa`);
    ws.onmessage=(ev)=>{ let d; try{d=JSON.parse(ev.data);}catch(e){return;} cb({data:d}); };
    ws.onclose=()=>cb({eof:true});
    return { input:(text)=>ws.send(JSON.stringify(
              {type:'user',message:{role:'user',content:[{type:'text',text}]}})),
             close:()=>{try{ws.close();}catch(e){}} };
  },
  monitor(ids,manager,cb,gid){
    const proto=location.protocol==='https:'?'wss':'ws';
    let url=`${proto}://${location.host}${APIBASE}/ws/monitor?ids=${encodeURIComponent(ids)}`;
    if(manager)url+=`&manager=${encodeURIComponent(manager)}`;
    if(gid)url+=`&gid=${encodeURIComponent(gid)}`;   // 저장 그룹 화면은 구성원 변경을 서버가 밀어 준다
    const ws=new WebSocket(url);
    ws.onmessage=(ev)=>cb(ev.data,false);
    ws.onclose=()=>cb(null,true);
    ws.onerror=()=>{};
    const ctl=(o)=>{ try{ws.send(JSON.stringify(o));}catch(e){} };
    return {
      add:(sid,role)=>ctl({type:'add',session_id:sid,role:role||'sub'}),
      remove:(sid)=>ctl({type:'remove',session_id:sid}),
      close:()=>{try{ws.close();}catch(e){}},
    };
  },
  async importSession(file,opts){

// 절대 시각 표기(현지 시간). ISO 문자열 또는 epoch 초(mtime) 모두 허용.
function absTime(v){
  if(v===null||v===undefined||v==='') return '';
  const d = (typeof v==='number') ? new Date(v*1000) : new Date(v);
  if(isNaN(d.getTime())) return '';
  const p=n=>String(n).padStart(2,'0');
  const now=new Date(), sameYear=d.getFullYear()===now.getFullYear();
  return (sameYear?'':d.getFullYear()+'-')
       + p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function relTime(iso){ if(!iso)return''; const t=new Date(iso); const s=(Date.now()-t)/1000;
  if(isNaN(s))return''; if(s<3600)return Math.floor(s/60)+'분 전';
  if(s<86400)return Math.floor(s/3600)+'시간 전'; return Math.floor(s/86400)+'일 전'; }
// ended_at(없으면 mtime) 기준 상대시간
function relFrom(s){ const t = s.ended_at ? Date.parse(s.ended_at) : (s.mtime? s.mtime*1000 : 0);
  if(!t||isNaN(t)) return ''; const sec=Math.max(0,(Date.now()-t)/1000);
  if(sec<3600)return Math.floor(sec/60)+'분 전';
  if(sec<86400)return Math.floor(sec/3600)+'시간 전'; return Math.floor(sec/86400)+'일 전'; }
function fmtBytes(b){ if(!b)return'0'; const u=['B','KB','MB','GB']; let i=0;
  while(b>=1024&&i<3){b/=1024;i++;} return b.toFixed(b<10&&i>0?1:0)+u[i]; }

let CLOCK_SKEW=0;
function sessionBadge(s){
  const rt=s.runtime; if(!rt||!rt.phase) return null;
  const now=Date.now()/1000+CLOCK_SKEW;
  const fresh=(t,w)=>typeof t==='number'&&t>0&&(now-t)<w;
  const M=60;
  // permission/waiting 은 Stop(턴 종료)이 걷어가므로 게이트는 유령 방지용(호스트 재기동 등)
  if(rt.phase==='permission'&&fresh(rt.permission_at,30*M)) return {c:'#e8a03c',pulse:true,text:'권한 대기'};
  if(rt.phase==='waiting'  &&fresh(rt.waiting_at,30*M))     return {c:'#e8a03c',pulse:true,text:'입력 대기'};
  // thinking 은 턴이 길 수 있어 창을 넉넉히(2h) - 정상 종료는 Stop 이 ready 로 바꾼다
  if(rt.phase==='thinking' &&fresh(rt.thinking_at,120*M))   return {c:'#2f81f7',pulse:true,text:'작업 중'};
  // 턴은 끝났지만 백그라운드 쉘·모니터가 남아 있음(Host 가 판정, 매 목록마다 새로 — 신선도 게이트 불필요)
  if(rt.phase==='background') return {c:'#a371f7',pulse:true,text:'백그라운드'};
  if(rt.phase==='ready'    &&fresh(rt.ready_at,60*M))       return {c:'#3fb950',pulse:false,text:'완료'};

}

// 이 세션이 ClewPath 밖(직접 연 터미널·다른 화면)에서 사용 중인 것으로 보이는가.

// 아닌 경우. 동시 재개는 대화 트리 분기·원격 승인 오주입을 일으키므로(재개 방식
// 문서 참고) 재개 직전에 경고한다. 훅 이벤트를 읽기만 하는 판정이라
// 'claude 파일 무단 수정 금지' 원칙과 무관.
function externallyActive(s){
  // 1차(확정): claude 공식 실시간 점유(agents --json, 서버가 s.agent 로 조인).
  // 대화형 세션이 우리 PTY(live_terminal) 밖에서 열려 있으면 충돌 확정.
  // (bg 점유는 별도의 잠금 게이트 showBgHold 가 처리)
  if(s.agent&&s.agent.kind==='interactive'&&!s.live_terminal) return true;
  // 1차-b(확정): 피어 레지스트리(~/.claude/sessions) — 살아 있는 대화형 세션은 여기 반드시 있다
  if(s.peer&&!s.live_terminal) return true;
  // 2차(폴백): 훅 신선도 휴리스틱 - agents 데이터가 없는 환경(구 CLI 등)용
  const rt=s.runtime;
  if(!rt||!rt.phase||s.live_terminal) return false;   // PTY 소유 시 재개=재접속이라 무관
  const now=Date.now()/1000+CLOCK_SKEW;
  const recent=(t,w)=>typeof t==='number'&&t>0&&(now-t)<w;
  const M=60;
  // ① active_at: 모든 훅 이벤트가 갱신하는 생존 신호 - 최근 10분 내 이벤트가
  //   있었으면 그 세션의 claude 가 어딘가에 떠 있을 개연성이 높다(대화형은
  //   턴이 끝나도 프로세스가 유지되므로 ready 직후도 충돌 위험군이 맞다).
  //   Host 재기동으로 phase 가 소실돼도 이벤트 하나면 복원되는 견고한 기준.
  // ② 진행형 phase: 창을 뱃지와 일관되게(thinking 은 긴 턴 대비 120분 -
  //   30분으로 좁혔다가 실측에서 경고 미발화 사고)
  return recent(rt.active_at,10*M)
      || (rt.phase==='thinking'  &&recent(rt.thinking_at, 120*M))
      || (rt.phase==='permission'&&recent(rt.permission_at,30*M))
      || (rt.phase==='waiting'   &&recent(rt.waiting_at,   30*M));
}

  }
  if(name==='TodoWrite'){
    const card=el('div','tcard'); const body=el('div','tcbody');   // 진행판이라 항상 펼침
    (inp.todos||[]).forEach(td=>{
      const st=td.status;
      const row=el('div','todorow'+(st==='completed'?' done':st==='in_progress'?' now':''));
      row.appendChild(el('span',null, st==='completed'?'☑':st==='in_progress'?'▶':'☐'));
      row.appendChild(el('span',null, st==='in_progress'?(td.activeForm||td.content||''):(td.content||'')));
      body.appendChild(row);
    });
    card.appendChild(body); container.appendChild(card);
    return;
  }
  if(name==='Read'||name==='Grep'||name==='Glob'||name==='LS'){
    const icon={Read:'📖',Grep:'🔎',Glob:'🗂',LS:'📁'}[name];
    const label=name==='Read'?_base(inp.file_path)
      : name==='Grep'?'"'+(inp.pattern||'')+'"'
      : (inp.pattern||inp.path||'');
    const row=el('div','tmini',icon+' '+name+' · '+label);
    container.appendChild(row);
    onResult(r=>{ row.textContent+= r.is_error?' · 실패':(' · '+String(r.text||'').split('\n').length+'줄'); });
    return;
  }
  if(name==='Task'){
    const c=_tcard(container,'🤖',String(inp.description||'서브 작업'),'실행 중…');
    if(inp.prompt) c.body.appendChild(el('pre',null,String(inp.prompt).slice(0,2000)));
    onResult(r=>{ c.meta.textContent=r.is_error?'오류':'완료'; c.meta.classList.add(r.is_error?'err':'ok');
      const d=el('div'); d.innerHTML=mdToHtml(String(r.text||'').slice(0,4000)); c.body.appendChild(d); });
    return;
  }
  if(name==='AskUserQuestion'){          // 뷰어(정적)용 - 스트림은 버튼 카드가 먼저 가로챔
    (inp.questions||[]).forEach(q=>{
      const c=_tcard(container,'❓',q.question||'질문','');
      (q.options||[]).forEach(o=>c.body.appendChild(el('div','tmini','· '+(o.label||''))));
    });
    return;
  }
  if(name==='ExitPlanMode'){
    const c=_tcard(container,'📋','실행 계획','');
    const d=el('div'); d.innerHTML=mdToHtml(String(inp.plan||'')); c.body.appendChild(d);
    return;
  }
  const row=el('div','tmini','🔧 '+name);   // 알 수 없는 도구
  container.appendChild(row);
  onResult(r=>{ row.textContent='🔧 '+name+(r.is_error?' · 실패':' · 완료'); });
}
function feedToolResults(items, pend){
  (items||[]).forEach(r=>{ const h=pend&&pend[r.tool_use_id];
    if(h){ try{h(r);}catch(e){} delete pend[r.tool_use_id]; } });
}

// ---- 웹 재개: 선택지/플랜 승인 카드 ----
// headless 스트림에도 도구 호출 내용(질문+선택지)은 그대로 오므로, 버튼으로
// 렌더하고 탭하면 답을 채팅 메시지로 보낸다. (도구 자체는 실패하지만 Claude 는
// 이어지는 사용자 답을 받아 진행한다)
function renderAskCard(container, input, sendText){
  const qs=(input&&input.questions)||[];
  if(!qs.length) return false;
  qs.forEach(q=>{
    const card=el('div','askcard');
    card.appendChild(el('div','askq','❓ '+(q.question||'선택해 주세요')));
    const wrap=el('div','askopts');
    const multi=!!q.multiSelect, chosen=new Set();
    (q.options||[]).forEach(o=>{
      const b=el('button','askopt');
      b.appendChild(document.createTextNode(o.label||''));
      if(o.description){ const d=document.createElement('small'); d.textContent=o.description; b.appendChild(d); }
      b.onclick=()=>{
        if(card.dataset.done) return;
        if(multi){ b.classList.toggle('on');
          if(chosen.has(o.label)) chosen.delete(o.label); else chosen.add(o.label); return; }
        card.dataset.done='1'; b.classList.add('on');
        wrap.querySelectorAll('button').forEach(x=>x.disabled=true);
        sendText((q.header?q.header+': ':'')+(o.label||''));
      };
      wrap.appendChild(b);
    });
    card.appendChild(wrap);
    if(multi){
      const ok=el('button','askopt on','선택 완료 →');
      ok.style.marginTop='6px';
      ok.onclick=()=>{ if(card.dataset.done||!chosen.size) return;
        card.dataset.done='1';
        wrap.querySelectorAll('button').forEach(x=>x.disabled=true); ok.disabled=true;
        sendText((q.header?q.header+': ':'')+[...chosen].join(', ')); };
      card.appendChild(ok);
    }
    container.appendChild(card);
  });
  return true;
}
function renderPlanCard(container, input, sendText, focusInput){
  const card=el('div','askcard');
  card.appendChild(el('div','askq','📋 실행 계획 승인 요청'));
  const plan=el('div','planbody'); plan.innerHTML=mdToHtml(String((input&&input.plan)||''));
  card.appendChild(plan);
  const wrap=el('div','askopts');
  const ok=el('button','askopt','✅ 계획대로 진행');
  const no=el('button','askopt','✍ 수정 의견 직접 입력');
  ok.onclick=()=>{ if(card.dataset.done) return; card.dataset.done='1';
    ok.classList.add('on'); ok.disabled=no.disabled=true;
    sendText('계획을 승인합니다. 그대로 진행해 주세요.'); };
  no.onclick=()=>{ if(!card.dataset.done && focusInput) focusInput(); };
  wrap.appendChild(ok); wrap.appendChild(no);
  card.appendChild(wrap);
  container.appendChild(card);
  return true;
}

let MODEL_OPTS=null;
async function loadModelOpts(){
  if(MODEL_OPTS) return MODEL_OPTS;
  try{ const r=await T.api('GET','/api/models'); MODEL_OPTS=r.models||[]; }
  catch(e){ MODEL_OPTS=[]; }
  return MODEL_OPTS;
}
function modelShort(id){
  if(!id) return '';
  const map={'claude-opus-5':'Opus 5','claude-sonnet-5':'Sonnet 5','claude-opus-4-8':'Opus 4.8',
             'claude-fable-5-1':'Fable 5.1','claude-fable-5':'Fable 5','claude-opus-5-1':'Opus 5.1',
             'claude-haiku-4-5-20251001':'Haiku 4.5'};
  if(map[id]) return map[id];
  return id.replace(/^claude-/,'').replace(/-\d{6,}$/,'');   // 폴백 축약
}
async function showModelPicker(s){
  const opts=await loadModelOpts();

  const info=el('div','cwd'); info.style.marginTop='6px';
  info.textContent='감지(마지막 사용): '+(modelShort(det)||'없음')
    +(cur?('   ·   설정됨: '+modelShort(cur)):'   ·   설정 없음(감지값으로 재개)');

      try{ await T.api('POST','/api/sessions/'+s.session_id+'/model',{body:{model:id}});

function showResumeChooser(s){
  if(s.live_terminal){ loadTerminal(s); return; }   // 이미 돌고 있으면 그냥 돌아간다
  // [사전 확인] 픽커 미표시 세션(에이전트/포크 산물)은 재개 옵션을 고르기 전에
  // 먼저 성격을 알린다 - 승인해야 옵션 모달로 넘어간다(사용자 요청 순서).
  if(s.picker_hidden && !s.picker_expose){

    'web|true'  :'채팅 화면에서 이어쓰기 · 도구 자동 허용',
    'web|false' :'⚠ 웹 화면은 확인을 물을 수 없어, 도구 실행이 필요한 작업은 거부됩니다 (조회·질문용)',
    'term|true' :'터미널 화면 그대로 · 도구 자동 허용',

  };

      const w=el('div'); w.style.cssText='display:flex;gap:8px;margin:6px 0 12px';
      opts.forEach(o=>{ const b=el('button','btn'+(o.v===cur?'':' ghost'),o.t);
        b.style.flex='1'; b.onclick=()=>{onSel(o.v);render();}; w.appendChild(b); });

    };
    seg('화면',[{v:'web',t:'🌐 웹 (채팅)'},{v:'term',t:'🖥 터미널'}],pref.how,v=>pref.how=v);
    seg('권한',[{v:true,t:'⚡ YOLO (자동 허용)'},{v:false,t:'✋ 일반 (권한 확인)'}],pref.yolo,v=>pref.yolo=v);
    grid.appendChild(el('div','cwd',CAPTION[pref.how+'|'+pref.yolo]));

  mbtn.onclick=()=>{ closeModal(); showModelPicker(s); };

    // 이어재개는 claude 가 거부한다("still running as a background agent" -

  openModal('재개', body, [go]);
}
