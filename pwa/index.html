<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b8f94">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="세션">
<title>ClewPath</title>
<link rel="manifest" href='data:application/json,{"name":"ClewPath","short_name":"ClewPath","display":"standalone","background_color":"%230e1116","theme_color":"%230b8f94","icons":[]}'>
<style>
  :root{
    --bg:#0e1116; --surface:#161b22; --surface2:#1b222b; --line:#262d37; --line2:#333c48;
    --ink:#e7ebf1; --ink2:#b2bbc7; --muted:#8a94a1;
    --accent:#36cbcf; --accent2:#0b8f94; --accent-wash:#123033;
    --good:#4fb47e; --warn:#d69b44; --crit:#e0776d;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,monospace;
    --sans:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#f7f8fa;--surface:#fff;--surface2:#f1f3f6;--line:#e2e6ec;--line2:#d3d9e1;
      --ink:#12161c;--ink2:#454e5b;--muted:#6b7480;--accent:#0b8f94;--accent2:#0a7a7f;--accent-wash:#e5f4f4;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;overflow:hidden;}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;font-size:16px}
  .mono{font-family:var(--mono)}
  .hidden{display:none!important}

  /* ---- 페어링 ---- */
  #pair{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;
    gap:16px;padding:28px;max-width:440px;margin:0 auto}
  #pair h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.02em}
  #pair p{color:var(--muted);margin:0 0 12px;font-size:.9rem}
  #pair label{font-size:.8rem;color:var(--ink2);font-family:var(--mono);
    text-transform:uppercase;letter-spacing:.08em}
  #pair input{width:100%;margin-top:6px;padding:13px 14px;border-radius:11px;
    background:var(--surface);border:1px solid var(--line2);color:var(--ink);outline:none}
  #pair input:focus{border-color:var(--accent)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;
    border-radius:12px;background:var(--accent2);color:#fff;font-weight:650}
  .btn:active{opacity:.85}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
  .err{color:var(--crit);font-size:.85rem;min-height:1.2em}

  /* ---- 앱 셸 ---- */
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 16px 10px;
    background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header .title{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex:none}
  header .grow{flex:1}
  /* 지금 보고 있는 PC 선택 — 제목 옆 select. 클릭하면 저장된 PC + localhost 목록. */
  header .pcname{font-size:.8rem;color:var(--ink);background:var(--surface2);
    border:1px solid var(--line);padding:3px 6px;border-radius:8px;
    max-width:42vw;flex:none;cursor:pointer;font-family:inherit;
    -webkit-appearance:auto;appearance:auto}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .dot.on{background:var(--good)} .dot.off{background:var(--crit)}
  header button.icon{width:38px;height:38px;border-radius:10px;font-size:1.1rem;color:var(--ink2)}
  header button.icon:active{background:var(--surface2)}
  #main{flex:1;min-height:0;overflow:hidden}
  #paneList,#paneDetail{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:calc(16px + var(--safe-b))}
  #resizer{display:none}   /* 모바일: 구분선 리사이저 숨김 */
  /* 모바일: 한 화면씩(목록↔상세 전환) */
  #app[data-view=detail] #paneList{display:none}
  #app[data-view=list] #paneDetail{display:none}
  .detail-empty{display:none}

  /* ---- 목록 ---- */
  .search{position:sticky;top:0;z-index:2;padding:12px 14px;background:var(--bg)}
  .search input{width:100%;padding:12px 14px;border-radius:11px;background:var(--surface);
    border:1px solid var(--line);color:var(--ink);outline:none}
  .search input:focus{border-color:var(--accent)}
  /* 라벨 필터 칩 */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .fchip{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line2);color:var(--ink2);font-size:.82rem;white-space:nowrap}
  .fchip.on{background:var(--accent2);color:#fff;border-color:transparent;font-weight:600}
  .fchip:active{opacity:.8}
  /* 세션 행 — 폴더보다 들여쓰기 + 큰 터치 버튼 */
  .glist{padding-left:14px;background:var(--surface)}
  .srow{display:flex;align-items:stretch;background:var(--surface);
    border-bottom:1px solid var(--line);border-left:2px solid var(--line2)}
  .srow:last-child{border-bottom:none}
  .sinfo{flex:1;min-width:0;padding:12px 8px 12px 14px;text-align:left;background:transparent}
  .sinfo:active{background:var(--surface2)}
  .sr1{display:flex;align-items:center;gap:6px;min-width:0}
  .sname{font-weight:620;font-size:.95rem;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .schip{flex:none;font-size:.66rem;padding:1px 7px;border-radius:999px;
    background:var(--accent-wash);color:var(--accent);font-family:var(--mono);
    border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
  .smeta2{font-size:.75rem;color:var(--muted);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap}
  .spath{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sbtn{width:54px;flex:none;display:grid;place-items:center;font-size:1.3rem;
    border-left:1px solid var(--line);background:transparent}
  .sbtn:active{background:var(--surface2)}
  .sbtn.resume{color:var(--accent)}
  .sbtn.rename{color:var(--ink2)}
  .chip{font-size:.68rem;padding:2px 7px;border-radius:999px;background:var(--accent-wash);
    color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
    font-family:var(--mono);white-space:nowrap}
  .empty{padding:40px 20px;text-align:center;color:var(--muted)}
  /* 폴더 그룹 헤더 — 강한 대비 */
  .ghead{width:100%;display:flex;align-items:center;gap:10px;padding:14px 14px;
    background:var(--surface2);border:none;border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);border-left:4px solid var(--accent2);text-align:left}
  .ghead:active{filter:brightness(1.12)}
  .ghead .chev{color:var(--accent);font-size:.72rem;width:14px;flex:none}
  .ghead .gtext{flex:1;min-width:0}
  .ghead .gbase{font-weight:750;font-size:1rem;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ghead .gpath{font-family:var(--mono);font-size:.72rem;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ghead .gcount{font-size:.78rem;font-weight:650;color:var(--accent);background:var(--accent-wash);flex:none;
    border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
    border-radius:999px;padding:3px 11px;font-variant-numeric:tabular-nums}

  /* ---- 상세 ---- */
  .detail{padding:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:.8rem;font-family:var(--mono);text-transform:uppercase;
    letter-spacing:.1em;color:var(--muted)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem}
  .kv .k{color:var(--muted)} .kv .v{text-align:right;font-variant-numeric:tabular-nums}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .actions .btn{padding:15px}
  .actions .btn.full{grid-column:1/-1}
  /* 릴레이 접속 인증 모드 배지(로컬 전용). fallback 은 무음 실패 방지용으로 눈에 띄게. */
  .connbadge{font-family:ui-monospace,monospace;font-size:.7rem;font-weight:700;
    padding:3px 8px;border-radius:999px;border:1px solid;cursor:pointer;flex:none;white-space:nowrap}
  .connbadge.jwt{color:var(--good);border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
  .connbadge.fallback{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
  .connbadge.shared{color:var(--muted);border-color:var(--line2)}
  /* 버전 표기. 업데이트가 있으면 accent 로 바뀌어 눈에 띈다(로컬만). */
  .verbadge{font-family:ui-monospace,monospace;font-size:.68rem;color:var(--muted);
    flex:none;white-space:nowrap;align-self:center}
  .verbadge.upd{color:var(--accent);cursor:pointer;font-weight:700}
  .firstrun{background:color-mix(in srgb,var(--accent) 10%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
    border-radius:12px;padding:14px 16px;margin:12px 0;font-size:.92rem;line-height:1.6}
  .firstrun b{color:var(--accent)}
  .devrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .devrow>div:first-child{flex:1;min-width:0}
  .devrow .devname{font-weight:600;font-size:.95rem}
  .devrow .devmeta{font-size:.78rem;color:var(--muted);margin-top:2px}
  .btn.sm{padding:7px 12px;font-size:.82rem;flex:none}
  .btn.danger{background:transparent;border:1px solid color-mix(in srgb,var(--crit) 45%,transparent);color:var(--crit)}
  .backbar{display:flex;align-items:center;gap:6px;padding:8px 10px;
    position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line)}
  .backbar button{padding:10px 14px;border-radius:10px;color:var(--accent);font-weight:650;font-size:.95rem}
  .backbar button:active{background:var(--surface2)}

  /* ---- 뷰어 / 재개 스트림 ---- */
  .stream{display:flex;flex-direction:column;gap:10px;padding:14px}
  .msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:.92rem;white-space:pre-wrap;
    word-break:break-word;overflow-wrap:anywhere}
  .msg.user{align-self:flex-end;background:var(--accent2);color:#fff;border-bottom-right-radius:4px}
  .msg.assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--line);
    border-bottom-left-radius:4px}
  .msg pre{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;
    overflow-x:auto;font-family:var(--mono);font-size:.82rem;margin:6px 0;white-space:pre;line-height:1.45}
  .msg code{background:var(--bg);border:1px solid var(--line2);border-radius:5px;padding:.05em .35em;
    font-family:var(--mono);font-size:.86em}
  .msg pre code{background:none;border:none;padding:0}
  .msg.user pre,.msg.user code{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.25)}
  .msg table{border-collapse:collapse;margin:8px 0;font-size:.82rem;display:block;
    overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
  .msg th,.msg td{border:1px solid var(--line2);padding:6px 10px;text-align:left;white-space:nowrap}
  .msg th{background:var(--surface2);font-weight:650}
  .msg.user th{background:rgba(0,0,0,.25)}
  .msg.user th,.msg.user td{border-color:rgba(255,255,255,.25)}
  .msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:.78rem;
    font-family:var(--mono);max-width:100%;text-align:center;padding:2px}
  .tool{align-self:flex-start;font-family:var(--mono);font-size:.78rem;color:var(--warn);
    background:color-mix(in srgb,var(--warn) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
    padding:6px 10px;border-radius:10px}
  .result{align-self:center;font-size:.76rem;color:var(--muted);font-family:var(--mono);
    border-top:1px dashed var(--line2);width:100%;text-align:center;padding-top:8px}
  /* '작업 중…' 진행 표시기 */
  .busy{align-self:flex-start;display:flex;align-items:center;gap:4px;
    color:var(--muted);font-size:.85rem;padding:8px 12px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:4px}
  .busy .bdot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bd 1.2s infinite}
  .busy .bdot:nth-child(2){animation-delay:.15s}
  .busy .bdot:nth-child(3){animation-delay:.3s}
  @keyframes bd{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
  .composer .send.working{background:var(--surface2);color:var(--muted)}
  /* 승인 카드(향후 non-skip 모드에서 채워짐) */
  .approve{align-self:stretch;background:var(--surface);border:1px solid var(--warn);
    border-radius:14px;padding:14px}
  .approve .q{font-weight:620;margin-bottom:10px}
  .approve .row2{display:flex;gap:10px}
  .approve .row2 .btn{flex:1;padding:12px}

  .composer{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + var(--safe-b));
    background:var(--surface);border-top:1px solid var(--line)}
  .composer textarea{flex:1;resize:none;max-height:120px;padding:11px 13px;border-radius:12px;
    background:var(--bg);border:1px solid var(--line2);color:var(--ink);outline:none;line-height:1.4}
  .composer textarea:focus{border-color:var(--accent)}
  .composer .send{width:46px;height:46px;border-radius:12px;background:var(--accent2);color:#fff;
    font-size:1.2rem;flex:none;align-self:flex-end}
  .composer .send:disabled{opacity:.4}

  .toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.85rem;
    z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:.95}
  .spin{width:22px;height:22px;border:2.5px solid var(--line2);border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;margin:30px auto;display:block}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---- 웹터미널(재개) — 기존 terminal.html 을 iframe 으로 임베드 ---- */
  /* grid(auto 1fr)로 [뒤로가기 바 · iframe] 배치. flex 대신 grid 인 이유:
     iframe 은 intrinsic 150px 를 가진 replaced 요소라 flex:1 로는 세로가 안 늘어나는
     브라우저가 있다. grid 1fr 트랙은 iframe 을 확실히 늘려 패널을 꽉 채운다. */
  /* auto = 뒤로가기 바, minmax(0,1fr) = iframe. minmax(0,·) 가 핵심:
     1fr 트랙의 기본 최소는 min-content 라 iframe(intrinsic 150px)이 컨테이너보다 커져
     화면 밖으로 넘칠 수 있다. 최소를 0 으로 눌러 정확히 가용 공간에만 맞춘다. */
  /* [뒤로가기 바(auto) · 터미널 영역(1fr)]. iframe 은 replaced 요소라 grid stretch 로도,
     height:100%(컨테이너 전체 기준이라 바 높이만큼 넘침)로도 트랙에 못 맞춘다 — 둘 다 실측 확인.
     그래서 iframe 을 div(.term-frame)로 감싼다: div 는 grid 트랙(1fr)에 정확히 stretch 되고,
     iframe 은 그 div 를 position:absolute·inset:0 로 채워 항상 딱 맞는다. */
  #paneDetail.term-mode{padding:0;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
  #paneDetail.term-mode>.term-frame{position:relative;min-height:0;overflow:hidden;background:#0d1117}
  #paneDetail.term-mode>.term-frame>iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #paneDetail.term-mode>.backbar{min-width:0}
  .term-note{padding:18px}

  /* ---- 모달 (프로파일/폴더변경/사용량) ---- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;
    align-items:center;justify-content:center;z-index:50;padding:14px}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    width:min(680px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal-head h3{margin:0;font-size:1rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modal-head .x{width:34px;height:34px;border-radius:9px;font-size:1.1rem;color:var(--muted);flex:none}
  .modal-head .x:active,.modal-head .x:hover{background:var(--surface2)}
  .modal-body{padding:16px 18px;overflow-y:auto}
  .modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .modal-foot .btn{padding:11px 20px;width:auto}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:.76rem;color:var(--ink2);margin-bottom:5px;
    font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
  .field input,.field textarea,.field select{width:100%;padding:10px 12px;border-radius:10px;
    background:var(--bg);border:1px solid var(--line2);color:var(--ink);outline:none;font-size:15px}
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{resize:vertical;min-height:64px;font-family:var(--mono);font-size:13px}
  .modal-body h3{font-size:.78rem;font-family:var(--mono);text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
  .utable{width:100%;border-collapse:collapse;font-size:.84rem}
  .utable th,.utable td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums}
  .utable th{color:var(--muted);font-family:var(--mono);font-size:.7rem;text-transform:uppercase}
  .qrbox{background:#fff;padding:12px;border-radius:12px;display:flex;justify-content:center;margin:8px 0 14px}
  .qrbox img{width:210px;height:210px;image-rendering:pixelated}

  /* ---- 데스크톱(≥880px): master-detail 2-pane ---- */
  @media (min-width:880px){
    body{background:var(--surface2)}
    /* 데스크톱: 클라이언트 영역 가로 전체 사용(좌우 여백 없음). */
    #app{width:100%;background:var(--bg)}
    #pair{max-width:460px}
    /* 좌(목록) + 우(상세) 동시 표시. 모바일용 한-화면 규칙은 무효화 */
    #main{display:grid;grid-template-columns:var(--list-w,350px) 7px 1fr;grid-template-rows:minmax(0,1fr)}
    /* 데스크톱 2단: 두 pane 을 항상 표시. 단 term-mode(터미널)는 grid 로 둬야 하므로 제외 —
       이 !important 가 term-mode 의 display:grid 를 뭉개면 iframe 영역이 무너진다(실측 확인). */
    #app[data-view] #paneList,
    #app[data-view] #paneDetail:not(.term-mode){display:block!important}
    #paneDetail{font-size:15px}
    /* 드래그 구분선 */
    #resizer{display:block;position:relative;cursor:col-resize;background:var(--surface);
      border-left:1px solid var(--line);border-right:1px solid var(--line)}
    #resizer::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      width:2px;height:26px;border-radius:2px;background:var(--line2);transition:background .12s}
    #resizer:hover::before,#resizer.dragging::before{background:var(--accent);height:40px}
    body.col-resizing{cursor:col-resize;user-select:none}
    .backbar.tolist{display:none}              /* '목록' 뒤로가기 숨김(목록 항상 보임) */
    .detail-empty{display:flex;height:100%;align-items:center;justify-content:center;
      color:var(--muted);padding:40px;text-align:center}
    .sbtn{width:56px;font-size:1.3rem}
    .msg{max-width:80%}
    /* 마우스 hover 피드백(터치엔 영향 없음) */
    .srow:hover{background:var(--surface2)}
    .srow.sel{background:var(--accent-wash)}
    .srow.sel .sname{color:var(--accent)}
    .ghead:hover{filter:brightness(1.08)}
    .sbtn:hover{background:var(--surface2)}
    .backbar button:hover{background:var(--surface2)}
  }
</style>
</head>
<body>

<!-- ===== 페어링 ===== -->

  <div>
    <h1>ClewPath</h1>
    <p>내 PC에 연결합니다.<br>
      PC의 로컬 웹(<span class="mono">127.0.0.1:5100</span>) → <b>📱</b> → <b>＋ 새 기기 추가</b> 에서
      <b>QR을 스캔</b>하거나, 거기 표시된 <b>페어링 링크를 붙여넣으세요.</b></p>

<!-- ===== 앱 ===== -->
<div id="app" class="hidden">
  <header>
    <span class="dot" id="status"></span>
    <span class="title" id="head">세션</span>

    <span class="connbadge hidden" id="conn-badge" title="릴레이 접속 인증 모드"></span>
    <button class="icon hidden" id="btn-devices" title="외부 접속 기기 관리">📱</button>

    <button class="icon" id="btn-usage" title="API 사용량">📈</button>
    <button class="icon" id="btn-refresh" title="새로고침">⟳</button>

  </header>
  <main id="main"><div id="paneList"></div><div id="resizer" title="드래그로 폭 조절 · 더블클릭 초기화"></div><div id="paneDetail"></div></main>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const LS = window.localStorage;

// ---- 실행 모드: local(006 직접 fetch) vs relay(WS RPC). 서버가 주입, 없으면 경로로 추론 ----
const SM_MODE_RAW="{{MODE}}", SM_BASE_RAW="{{BASE}}";
const MODE=(SM_MODE_RAW.indexOf('{{')<0 && SM_MODE_RAW)?SM_MODE_RAW
  :(location.pathname.indexOf('/relay/')>=0?'relay':'local');
const APIBASE=(SM_BASE_RAW.indexOf('{{')<0)?SM_BASE_RAW:'';
function qs(o){ if(!o)return''; const e=Object.entries(o).filter(([k,v])=>v!=null&&v!=='');
  return e.length?'?'+e.map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&'):''; }

// ---- WS URL 유도 (/app 옆의 /ws). 로컬/nginx 모두 자동 대응 ----
function wsUrl(){
  const base = location.pathname.replace(/\/(app|index\.html)\/?$/,'').replace(/\/$/,'');
  const proto = location.protocol==='https:'?'wss':'ws';
  return `${proto}://${location.host}${base}/ws`;
}

// ---- 여러 PC 지원: 페어링한 PC 들을 목록으로 보관하고 전환한다 ----
// 저장 형태: sm_pcs = [{room, cs, cp, dev, name, added, last}]
// 활성 PC 의 자격은 기존 키(sm_room/sm_cs/sm_cp/sm_devtoken)에 미러링해
// 기존 접속 경로(clientJwt/conn)가 그대로 동작하게 한다.
function pcsLoad(){ try{ const a=JSON.parse(LS.getItem('sm_pcs')||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function pcsSave(a){ LS.setItem('sm_pcs', JSON.stringify(a)); }
function pcName(pc){ return pc.name || ('PC ' + String(pc.room).replace(/^rm_/,'').slice(0,6)); }
function pcsUpsert(c){
  if(!c||!c.room) return;
  const a=pcsLoad(); const i=a.findIndex(x=>x.room===c.room);
  const rec={room:c.room, cs:c.cs||'', cp:c.cp||'', dev:c.dev||'',
             name:(i>=0?a[i].name:'')||c.name||'',
             added:(i>=0?a[i].added:Date.now()), last:Date.now()};
  if(i>=0) a[i]=rec; else a.push(rec);
  pcsSave(a);
}
function pcsActivate(room){
  const pc=pcsLoad().find(x=>x.room===room); if(!pc) return null;
  LS.setItem('sm_room',pc.room);
  if(pc.cs&&pc.cp){ LS.setItem('sm_cs',pc.cs); LS.setItem('sm_cp',pc.cp); }
  else { LS.removeItem('sm_cs'); LS.removeItem('sm_cp'); }
  if(pc.dev){ LS.setItem('sm_devtoken',pc.dev); conn.devToken=pc.dev; }
  else { LS.removeItem('sm_devtoken'); conn.devToken=''; }
  LS.removeItem('sm_cjwt');          // 자격이 바뀌었으니 캐시된 JWT 폐기(필수)
  LS.removeItem('sm_grace');         // 2FA 신뢰도 PC 단위
  pc.last=Date.now(); pcsUpsert(pc);
  refreshPcSelect();                 // 헤더 select 를 현재 PC 로 갱신 + 타이틀
  return pc;
}
function pcsRemove(room){ pcsSave(pcsLoad().filter(x=>x.room!==room)); }

// ---- client JWT: 기기 전용 secret 을 단기 JWT 로 교환(캐시+사전갱신) ----
function cpBase(){
  // 릴레이가 /relay/ 로 서빙되면 CP 는 같은 호스트의 /cp/
  const m=location.pathname.match(/^(.*)\/relay\//);
  return (location.origin + ((m&&m[1])||'') + '/cp');
}
async function clientJwt(force){
  const cs=LS.getItem('sm_cs'), cpid=LS.getItem('sm_cp');
  if(!cs||!cpid) return null;                       // 구 방식(공유 토큰) 사용 중
  if(!force){
    try{ const c=JSON.parse(LS.getItem('sm_cjwt')||'null');
      // 만료 5분 전부터는 미리 갱신 (폰이 끊긴 사이 만료되는 걸 줄임)
      if(c&&c.token&&c.exp&&(c.exp-300)*1000>Date.now()) return c.token;
    }catch(e){}
  }
  try{
    const r=await fetch(cpBase()+'/client/token',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({public_id:cpid,secret:cs})});
    if(!r.ok){ if(r.status===401){ toast('이 기기 인증이 해제되었습니다 — 재페어링 필요'); } return null; }
    const j=await r.json();
    LS.setItem('sm_cjwt',JSON.stringify({token:j.token,exp:j.expires_at}));
    return j.token;
  }catch(e){
    // CP 불통: 캐시된 JWT 가 아직 유효하면 그걸로 버틴다
    try{ const c=JSON.parse(LS.getItem('sm_cjwt')||'null');
      if(c&&c.token&&c.exp*1000>Date.now()) return c.token; }catch(_){}
    return null;
  }
}

// ---- RPC over WebSocket ----
class Conn{
  constructor(){ this.ws=null; this.seq=0; this.waiters=new Map(); this.streams=new Map();
    this.onstatus=()=>{}; this.peer=false;
    this.devToken=LS.getItem('sm_devtoken')||''; this.authed=false; this.cid=null; this.onauth=null; }
  _doAuth(){   // 기기 토큰이 있으면 릴레이 연결 직후 기기 인증
    if(!this.devToken){ this.authed=false; return Promise.resolve(); }
    return this.req('auth',{token:this.devToken}).then(r=>{
      this.authed=!!(r&&r.ok);
      // 접속한 PC(호스트)의 버전 — 우선 auth 응답값으로 표시, 이어서 최신 여부까지 확인.
      if(this.authed && r.data && r.data.ver){ showVer(r.data.ver, null); refreshVer(); }
      if(this.onauth)this.onauth(this.authed, r&&r.error);
    });
  }
  async connect(room,token){
    this._room=room; this._token=token;           // 재접속에 사용
    const cjwt=await clientJwt(false);            // 기기 전용 자격이 있으면 JWT 로
    return new Promise((res,rej)=>{
      let done=false;
      let url=`${wsUrl()}?role=client&room=${encodeURIComponent(room)}&v=1`;
      if(cjwt) url+=`&jwt=${encodeURIComponent(cjwt)}`;
      else if(token) url+=`&token=${encodeURIComponent(token)}`;
      const ws=new WebSocket(url); this.ws=ws;
      ws.onopen=()=>{};
      ws.onmessage=(ev)=>{
        let m; try{m=JSON.parse(ev.data);}catch(e){return;}
        if(m.type==='hello'){ this.peer=!!m.peer_present; this.cid=m.cid||null;
          this.onstatus(true,this.peer);
          if(!done){ if(this.devToken){ this._doAuth().finally(()=>{ if(!done){done=true;res(m);} }); }
                     else { done=true; res(m); } }
          return; }
        if(m.type==='peer'){ if(m.event==='agent_online')this.peer=true;
          if(m.event==='agent_offline')this.peer=false; this.onstatus(true,this.peer); return; }
        if(m.type==='res'||m.type==='pong'){
          if(m.error==='auth_required'&&this.onauth)this.onauth(false,'auth_required');
          const w=this.waiters.get(m.id);
          if(w){this.waiters.delete(m.id); w(m);} return; }
        if(m.type==='stream'){ const h=this.streams.get(m.id); if(h)h(m); return; }
      };
      ws.onclose=(ev)=>{ this.onstatus(false,false);
        if(!done){done=true;rej(new Error(this._closeMsg(ev&&ev.code)));}
        for(const w of this.waiters.values())w({ok:false,error:'disconnected'});
        this.waiters.clear();
        this._scheduleReconnect(ev&&ev.code); };
      ws.onerror=()=>{ if(!done){done=true;rej(new Error('연결 실패'));} };
    });
  }
  req(method,params={}){
    return new Promise((res)=>{
      const id='c'+(++this.seq); this.waiters.set(id,res);
      this.ws.send(JSON.stringify({v:1,type:'req',id,method,params}));
    });
  }
  // 로컬 006 /api/* 제네릭 호출
  async api(verb,path,{query,body}={}){
    const r=await this.req('api',{verb,path,query,body});
    if(!r.ok){
      if(r.data&&r.data.status){ const e=new Error('HTTP '+r.data.status);
        e.status=r.data.status; e.json=r.data.json; throw e; }
      throw new Error(r.error||'api error');
    }
    if(r.data.status>=400){ const e=new Error('HTTP '+r.data.status);
      e.status=r.data.status; e.json=r.data.json; throw e; }
    return r.data.json;
  }
  startResume(sessionId,onFrame,inplace,cred){
    const id='s'+(++this.seq); this.streams.set(id,onFrame);
    this.ws.send(JSON.stringify({v:1,type:'req',id,method:'resume',
      params:{session_id:sessionId,skip:true,inplace:!!inplace,
        grace:(cred&&cred.grace)||'',otp:(cred&&cred.otp)||''}}));
    return {
      id,
      input:(text)=>this.ws.send(JSON.stringify({v:1,type:'stream_in',id,
        data:{type:'user',message:{role:'user',content:[{type:'text',text}]}}})),
      close:()=>this.streams.delete(id),
    };
  }
  // 웹터미널 스트림(원시 텍스트). onData(data,eof)
  startTerminal(sessionId,onData,cred){
    const id='t'+(++this.seq);
    this.streams.set(id,(m)=>{ if(m.eof){onData(null,true,m.error);} else onData(m.data,false); });
    this.ws.send(JSON.stringify({v:1,type:'req',id,method:'terminal',
      params:{session_id:sessionId,skip:true,
        grace:(cred&&cred.grace)||'',otp:(cred&&cred.otp)||''}}));
    return { send:(obj)=>this.ws.send(JSON.stringify({v:1,type:'stream_in',id,data:obj})),
             close:()=>this.streams.delete(id) };
  }
  _closeMsg(code){
    if(code===4402) return '기기 자격이 만료·거부되었습니다(갱신 후 재시도)';
    if(code===4403) return '이 room 이 더 이상 유효하지 않습니다 — 재페어링이 필요합니다';
    if(code===4426) return '앱/커넥터 버전이 낮습니다 — 업데이트가 필요합니다';
    if(code===4401) return '접속 자격이 올바르지 않습니다(토큰/room 확인)';
    return '연결이 끊겼습니다';
  }
  _scheduleReconnect(code){
    if(this._stopped) return;                       // 사용자가 로그아웃한 경우
    if(code===4403||code===4426){                   // 재시도해도 소용없는 사유
      toast(this._closeMsg(code)); return; }
    if(this._retryTimer) return;
    this._retry=Math.min((this._retry||0)+1,6);
    const wait=Math.min(1000*Math.pow(2,this._retry-1),30000);
    this._retryTimer=setTimeout(async()=>{
      this._retryTimer=null;
      if(code===4402) await clientJwt(true);        // 만료 추정 → JWT 강제 갱신
      try{ await this.connect(this._room,this._token); this._retry=0; toast('다시 연결됨'); loadList(); }
      catch(e){ this._scheduleReconnect(); }
    },wait);
  }
  logout(){ this._stopped=true;
    if(this._retryTimer){clearTimeout(this._retryTimer);this._retryTimer=null;}
    try{this.ws&&this.ws.close();}catch(e){} }
}

const conn=new Conn();

// ---- Transport 추상화: UI 는 T.* 만 호출. 로컬/릴레이 구현만 다르다 ----
const relayT={
  mode:'relay', needsPairing:true,
  async list(p){ const r=await conn.req('list_sessions',p); if(!r.ok)throw new Error(r.error||'목록 실패'); return r.data; },
  api:(v,p,o)=>conn.api(v,p,o),
  resume:(id,cb,opts)=>conn.startResume(id,cb,opts&&opts.inplace,opts),
  terminal:(id,cb,opts)=>conn.startTerminal(id,cb,opts),
  async exportSession(id,wd){ const r=await conn.req('export',{session_id:id,include_workdir:!!wd});
    if(!r.ok)throw new Error(r.error||'내보내기 실패'); return r.data; },
  async importSession(file,opts){ const b64=await fileToB64(file);
    const r=await conn.req('import',Object.assign({filename:file.name,b64},opts));
    return r.data || {error:r.error||'가져오기 실패'}; },
  grant(otp){ return conn.req('grant',{otp}).then(r=>{ if(!r.ok)throw new Error(r.error||'인증 실패'); return r.data; }); },
  logout(){ showLogoutChoice(); },
};
const localT={
  mode:'local', needsPairing:false,
  async list(p){ const r=await fetch(APIBASE+'/api/v1/sessions'+qs(p));
    if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); },
  async api(v,p,{query,body}={}){
    const r=await fetch(APIBASE+p+qs(query),{method:v,
      headers:body?{'Content-Type':'application/json'}:{},
      body:body?JSON.stringify(body):undefined});
    if(!r.ok){ const e=new Error('HTTP '+r.status); e.status=r.status;
      try{e.json=await r.json();}catch(_){}
      throw e; }
    return r.json();
  },
  resume(id,cb,opts){
    const proto=location.protocol==='https:'?'wss':'ws';
    const ep=(opts&&opts.inplace)?'resume-inplace':'resume';
    const ws=new WebSocket(`${proto}://${location.host}${APIBASE}/api/v1/${ep}/${id}?skip=1`);
    ws.onmessage=(ev)=>{ let d; try{d=JSON.parse(ev.data);}catch(e){return;} cb({data:d}); };
    ws.onclose=()=>cb({eof:true});
    return { input:(text)=>ws.send(JSON.stringify(
              {type:'user',message:{role:'user',content:[{type:'text',text}]}})),
             close:()=>{try{ws.close();}catch(e){}} };
  },
  async importSession(file,opts){
    const fd=new FormData(); fd.append('file',file);
    if(opts.new_cwd)fd.append('new_cwd',opts.new_cwd);
    fd.append('overwrite', opts.overwrite?'true':'false');
    fd.append('restore_workdir', opts.restore_workdir?'true':'false');
    const r=await fetch(APIBASE+'/api/import',{method:'POST',body:fd});
    try{ return await r.json(); }catch(_){ return {error:'HTTP '+r.status}; }
  },
  grant(){ return Promise.resolve({}); },   // 로컬은 인증 불필요
  logout(){ location.reload(); },
};
let T = MODE==='relay' ? relayT : localT;
let SESSIONS=[];
let SELECTED_ID=null;

// ---- 2-pane 헬퍼 (모바일=한화면 전환, 데스크톱=좌목록+우상세 동시) ----
const paneList=()=>$('#paneList'), paneDetail=()=>$('#paneDetail');
function showListPane(){ $('#app').setAttribute('data-view','list'); }
function showDetailPane(){ $('#app').setAttribute('data-view','detail'); }
function detailPlaceholder(txt){ const p=paneDetail(); p.classList.remove('term-mode'); p.innerHTML='';
  p.appendChild(el('div','detail-empty',txt||'왼쪽에서 세션을 선택하세요')); }
function highlightSelected(){ document.querySelectorAll('.srow').forEach(r=>
  r.classList.toggle('sel', r.dataset.sid===SELECTED_ID)); }

// ---- UI helpers ----
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function setStatus(on,peer){ const d=$('#status');
  d.className='dot '+(on?(peer?'on':'off'):'off');
  $('#head').firstChild&&(0); }
// ---- 릴레이 접속 인증 모드 배지 (로컬 전용) ----
const CONN_LABEL={jwt:'🔐 JWT', fallback:'⚠ 공유토큰', shared:'공유토큰'};
async function refreshConnBadge(){
  if(MODE!=='local') return;
  const el=$('#conn-badge'); if(!el) return;
  let st; try{ st=await T.api('GET','/api/owner/connection'); }catch(e){ el.classList.add('hidden'); return; }
  if(st.app_url) RELAY_APP_URL=st.app_url;          // 로컬→릴레이 이동 시 쓸 실제 주소
  refreshPcSelect();                                // app_url 반영해 '다른 PC' 항목 갱신
  const m=st.mode||'shared';
  el.textContent=CONN_LABEL[m]||m;
  el.className='connbadge '+m;
  el.classList.remove('hidden');
  el._st=st;
  el.onclick=()=>showConnInfo(el._st);
}
function showConnInfo(st){
  const body=el('div'); const line=(t)=>body.appendChild(el('div','cwd',t));
  const m=st.mode||'shared';
  line('릴레이 접속 인증 모드: '+(CONN_LABEL[m]||m));
  if(m==='jwt') line('컨트롤플레인이 발급한 단기 JWT로 접속 중입니다(권장 상태).');

// 절대 시각 표기(현지 시간). ISO 문자열 또는 epoch 초(mtime) 모두 허용.
function absTime(v){
  if(v===null||v===undefined||v==='') return '';
  const d = (typeof v==='number') ? new Date(v*1000) : new Date(v);
  if(isNaN(d.getTime())) return '';
  const p=n=>String(n).padStart(2,'0');
  const now=new Date(), sameYear=d.getFullYear()===now.getFullYear();
  return (sameYear?'':d.getFullYear()+'-')
       + p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function relTime(iso){ if(!iso)return''; const t=new Date(iso); const s=(Date.now()-t)/1000;
  if(isNaN(s))return''; if(s<3600)return Math.floor(s/60)+'분 전';
  if(s<86400)return Math.floor(s/3600)+'시간 전'; return Math.floor(s/86400)+'일 전'; }
// ended_at(없으면 mtime) 기준 상대시간
function relFrom(s){ const t = s.ended_at ? Date.parse(s.ended_at) : (s.mtime? s.mtime*1000 : 0);
  if(!t||isNaN(t)) return ''; const sec=Math.max(0,(Date.now()-t)/1000);
  if(sec<3600)return Math.floor(sec/60)+'분 전';
  if(sec<86400)return Math.floor(sec/3600)+'시간 전'; return Math.floor(sec/86400)+'일 전'; }
function fmtBytes(b){ if(!b)return'0'; const u=['B','KB','MB','GB']; let i=0;
  while(b>=1024&&i<3){b/=1024;i++;} return b.toFixed(b<10&&i>0?1:0)+u[i]; }

function b64uToU8(s){ const p='='.repeat((4-s.length%4)%4);
  const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(b, c=>c.charCodeAt(0)); }
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
async function pushCurrentSub(){

       return reg ? await reg.pushManager.getSubscription() : null; }catch(e){ return null; }
}

async function togglePush(){
  const b=$('#btn-push');

    const existing=await pushCurrentSub();

      await existing.unsubscribe();
      toast('알림을 껐습니다'); refreshPushBtn(); return;

  return parts[parts.length-1]||p; }
function groupRepr(list){ // 대표 cwd: 가장 짧은(루트) 경로
  const cwds=list.map(s=>s.cwd).filter(Boolean);
  return cwds.length? cwds.sort((a,b)=>a.length-b.length)[0] : (list[0].project_folder||'(기타)'); }

    latest:list.reduce((m,s)=>Math.max(m,Date.parse(s.ended_at||'')||0),0)}));

let _term=null;   // 활성 외부 터미널 정리 핸들

function loadXterm(){
  if(_xtermP) return _xtermP;
  const base = MODE==='relay'
    ? location.pathname.replace(/\/(app|index\.html)\/?$/,'').replace(/\/$/,'')+'/vendor'
    : APIBASE+'/static/vendor';
  _xtermP=new Promise((res,rej)=>{
    const css=document.createElement('link'); css.rel='stylesheet'; css.href=base+'/xterm.min.css';
    document.head.appendChild(css);
    const s1=document.createElement('script'); s1.src=base+'/xterm.min.js';
    s1.onload=()=>{ const s2=document.createElement('script'); s2.src=base+'/addon-fit.min.js';
      s2.onload=()=>res(); s2.onerror=()=>rej(new Error('addon-fit')); document.head.appendChild(s2); };
    s1.onerror=()=>rej(new Error('xterm.js')); document.head.appendChild(s1);
  });
  return _xtermP;
}
// 모바일: 터치 슬라이드 → xterm 뷰포트를 직접 스크롤(과거 이력 보기).
// capture 단계로 xterm 내부 핸들러보다 먼저 가로채고, 뷰포트 scrollTop 을 직접 이동.
function attachTouchScroll(host, term){
  const vp=()=>host.querySelector('.xterm-viewport');
  let ty=null, startTop=0;
  host.addEventListener('touchstart',e=>{
    if(e.touches.length===1){ ty=e.touches[0].clientY; const v=vp(); startTop=v?v.scrollTop:0; }
  }, {passive:true, capture:true});
  host.addEventListener('touchmove',e=>{
    if(ty==null||e.touches.length!==1) return;
    const v=vp(); if(!v) return;
    v.scrollTop = startTop + (ty - e.touches[0].clientY);
    e.preventDefault(); e.stopPropagation();
  }, {passive:false, capture:true});
  host.addEventListener('touchend',()=>{ ty=null; }, {passive:true, capture:true});
}
async function loadTerminal(s){
  let cred={};

  const main=paneDetail(); main.classList.remove('term-mode'); main.innerHTML='';
  $('#head').textContent='터미널 재개';
  const bar=backbar('상세',()=>{ if(_term){_term.close();_term=null;} loadDetail(s); });
  const hist=el('button',null,'📖 이력'); hist.title='과거 대화를 뷰어로 보기';
  hist.style.cssText='margin-left:auto;color:var(--accent);padding:10px 14px;font-weight:650';
  hist.onclick=()=>{ if(_term){_term.close();_term=null;} loadViewer(s); };
  bar.appendChild(hist);
  main.appendChild(bar);
  showDetailPane();
  main.classList.add('term-mode');
  if(MODE==='local'){
    // 로컬: 기존 웹터미널 페이지를 iframe 재사용. iframe 은 grid 트랙에 직접 안 늘어나므로
    // div(.term-frame)로 감싸고 그 안에서 absolute 로 채운다(위 CSS 참고).
    const wrap=el('div','term-frame');
    const frame=document.createElement('iframe');
    frame.src=`${APIBASE}/terminal?id=${encodeURIComponent(s.session_id)}&skip=1`;
    frame.setAttribute('allow','clipboard-read; clipboard-write');
    wrap.appendChild(frame); main.appendChild(wrap); return;
  }
  // 외부(릴레이): 내장 xterm 을 띄우고 릴레이 terminal 스트림에 연결(in-place)
  const host=el('div'); host.style.cssText='flex:1;min-height:0'; main.appendChild(host);
  try{ await loadXterm(); }catch(e){
    main.classList.remove('term-mode'); main.innerHTML='';
    main.appendChild(el('div','term-note','xterm 로드 실패: '+e.message)); return; }
  const term=new Terminal({fontSize:13,cursorBlink:true,scrollback:10000,
    fontFamily:'ui-monospace,"Cascadia Code",Consolas,monospace',
    theme:{background:'#0d1117',foreground:'#e6edf3',cursor:'#58a6ff'}});
  const fit=new FitAddon.FitAddon(); term.loadAddon(fit); term.open(host);
  attachTouchScroll(host, term);
  const tc=T.terminal(s.session_id,(data,eof,err)=>{
    if(eof){ if(err==='2fa_invalid'||err==='2fa_required') clearGrace();
      term.write('\r\n\x1b[91m── '+(err?otpErrMsg(err):'연결 종료')+' ──\x1b[0m\r\n'); }
    else term.write(data); }, cred);
  // 크기가 실제로 바뀔 때만 통지(ResizeObserver 가 자주 불려도 과다 전송 방지)
  let _lastDim='';
  const doResize=()=>{ try{ fit.fit();
    const dim=term.cols+'x'+term.rows; if(dim!==_lastDim){ _lastDim=dim; tc.send({type:'resize',cols:term.cols,rows:term.rows}); }
  }catch(e){} };
  const onWin=()=>doResize(); window.addEventListener('resize',onWin);
  // 컨테이너가 실제 크기를 얻거나 바뀔 때마다 채운다 — 초기 레이아웃/창 리사이즈 모두.
  let ro=null;
  if(window.ResizeObserver){ ro=new ResizeObserver(doResize); ro.observe(host); }
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(doResize);
  _term={ close:()=>{ try{tc.close();}catch(e){} window.removeEventListener('resize',onWin); if(ro)ro.disconnect(); } };
  term.onData(d=>tc.send({type:'input',data:d}));

}

function renderHistoryMsg(wrap,m){

  if(m.role==='user'){ if(text){ const d=el('div','msg user'); d.textContent=text; wrap.appendChild(d); } return; }

// 최소 마크다운 → HTML. XSS 안전: 먼저 이스케이프하고 내가 넣는 태그만 허용.
function mdToHtml(src){
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const inl=s=>{ s=esc(s);
    s=s.replace(/`([^`\n]+)`/g,(m,c)=>'<code>'+c+'</code>');
    s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
    return s; };
  const fences=[];
  src=String(src).replace(/```[^\n]*\n?([\s\S]*?)```/g,(m,code)=>{
    fences.push(code); return '\uE010'+(fences.length-1)+'\uE011'; });
  const lines=src.split('\n'); const out=[]; let i=0;
  const hasPipe=l=>l.indexOf('|')>=0;
  const isSep=l=>/^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(l);
  const cells=l=>{ let x=l.trim(); if(x[0]==='|')x=x.slice(1); if(x[x.length-1]==='|')x=x.slice(0,-1);
    return x.split('|').map(c=>c.trim()); };
  while(i<lines.length){
    const l=lines[i];
    if(hasPipe(l) && i+1<lines.length && isSep(lines[i+1])){
      const head=cells(l); i+=2; const body=[];
      while(i<lines.length && hasPipe(lines[i]) && lines[i].trim()){ body.push(cells(lines[i])); i++; }
      let tb='<table><thead><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead>';
      if(body.length) tb+='<tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody>';
      out.push(tb+'</table>'); continue;
    }
    let h=l.match(/^#{1,6}\s+(.+)$/); if(h){ out.push('<strong>'+inl(h[1])+'</strong>'); i++; continue; }
    let b=l.match(/^\s*[-*]\s+(.+)$/); if(b){ out.push('\u2022 '+inl(b[1])); i++; continue; }
    out.push(inl(l)); i++;
  }
  let html=out.join('\n');
  html=html.replace(/\uE010(\d+)\uE011/g,(m,k)=>'<pre>'+esc(fences[+k])+'</pre>');
  return html;
}

// ---- 재개(스트리밍 + 입력) ----
async function loadResume(s, inplace){
  const isIn = inplace!==false;   // 기본 in-place(실제 세션)
  let cred={};
  if(isIn){ cred=await ensurePriv(); if(cred===null) return; }   // 외부 in-place → grace/2차 인증
  const main=paneDetail(); main.classList.remove('term-mode'); main.innerHTML='';
  $('#head').textContent='재개';
  main.appendChild(backbar('상세',()=>{sess&&sess.close();loadDetail(s);}));
  showDetailPane();
  const stream=el('div','stream'); main.appendChild(stream);
  stream.appendChild(el('div','result', isIn
    ? '⚠ 실제 세션을 그대로 이어갑니다 (in-place)'
    : '🔱 복제본에서 진행 — 원본은 보존됩니다'));
  // composer (상세 pane 하단 고정)
  const comp=el('div','composer');
  const ta=el('textarea'); ta.rows=1; ta.placeholder='메시지 입력…';
  ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';};
  const send=el('button','send','↑');
  comp.appendChild(ta); comp.appendChild(send);
  main.appendChild(comp);
  let sess=null, busy=false, busyEl=null;
  const cleanup=()=>{ comp.remove(); };
  // back 시 composer 제거
  const obs=new MutationObserver(()=>{ if(!document.contains(stream)){cleanup();obs.disconnect();} });
  obs.observe(main,{childList:true});
  // busyEl 이 있으면 그 위에 삽입(진행표시기는 항상 맨 아래 유지)
  const push=(cls,txt)=>{ const d=el('div',cls); if(txt!=null)d.textContent=txt;
    if(busyEl) stream.insertBefore(d,busyEl); else stream.appendChild(d);
    main.scrollTop=main.scrollHeight; return d; };
  const setBusy=(on)=>{ busy=on; send.disabled=on;
    send.classList.toggle('working',on); send.textContent=on?'…':'↑';
    if(on){ if(!busyEl){ busyEl=el('div','busy');
      busyEl.innerHTML='<span class="bdot"></span><span class="bdot"></span><span class="bdot"></span>'
        +'<span style="margin-left:6px">작업 중…</span>';
      stream.appendChild(busyEl); main.scrollTop=main.scrollHeight; } }
    else if(busyEl){ busyEl.remove(); busyEl=null; } };
  // 과거 이력 먼저 표시(끝부분)
  const loading=push('msg sys','과거 대화 불러오는 중…');
  try{ const hist=await fetchRecentMessages(s.session_id,120); loading.remove();
    for(const m of hist) renderHistoryMsg(stream,m);
    if(hist.length) stream.appendChild(el('div','result','── 여기서 이어서 대화 ──'));
  }catch(e){ loading.textContent='(과거 이력 로드 실패)'; }
  main.scrollTop=main.scrollHeight;
  sess=T.resume(s.session_id,(f)=>{
    if(f.eof){ setBusy(false);
      if(f.error==='2fa_invalid'||f.error==='2fa_required') clearGrace();  // 만료 → 재인증
      push('result', f.error?('종료: '+otpErrMsg(f.error)):'— 세션 종료 —'); return; }
    const ev=f.data||{};
    if(ev.type==='system'){ if(ev.subtype==='init')push('msg sys','● 세션 시작'); return; }
    if(ev.type==='assistant'){ const c=ev.message&&ev.message.content;
      if(Array.isArray(c))for(const x of c){
        if(x.type==='text'){ const d=push('msg assistant',''); d.innerHTML=mdToHtml(x.text); }
        else if(x.type==='tool_use'){ const d=push('tool','🔧 '+x.name+' 실행 중…'); d.dataset.tool='1'; }
      } return; }
    if(ev.type==='result'){ setBusy(false);
      const cost=ev.total_cost_usd!=null?(' · $'+ev.total_cost_usd):'';
      push('result','완료'+cost); return; }
    if(ev.type==='user'){ return; } // tool_result 에코 생략
  },Object.assign({inplace:isIn},cred));
  const doSend=()=>{ const t=ta.value.trim(); if(!t||busy)return;
    push('msg user',t); ta.value=''; ta.style.height='auto';
    setBusy(true); sess.input(t); };
  send.onclick=doSend;
  ta.onkeydown=(e)=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();} };
}

// ---- export / import ----
function b64toBlob(b64,type){ const bin=atob(b64); const n=bin.length; const arr=new Uint8Array(n);
  for(let i=0;i<n;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:type||'application/zip'}); }
function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>{ const s=String(r.result); const i=s.indexOf(','); res(i>=0?s.slice(i+1):s); };
  r.onerror=()=>rej(new Error('파일 읽기 실패')); r.readAsDataURL(file); }); }
function chk(label){ const wrap=el('label'); wrap.style.cssText='display:flex;align-items:center;gap:8px;margin:10px 0;font-size:.9rem;cursor:pointer';
  const input=document.createElement('input'); input.type='checkbox'; wrap.appendChild(input);
  wrap.appendChild(document.createTextNode(' '+label)); return {wrap,input}; }
function dlBlob(blob,filename){ const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000); }

// ---- 모달 시스템 ----
function closeModal(){ const o=$('#overlay'); if(o)o.remove(); }
function openModal(title, bodyEl, footChildren){
  closeModal();
  const ov=el('div','overlay'); ov.id='overlay';
  const m=el('div','modal');
  const h=el('div','modal-head'); h.appendChild(el('h3',null,title));

  m.appendChild(h);
  const b=el('div','modal-body'); if(bodyEl)b.appendChild(bodyEl); m.appendChild(b);

    footChildren.forEach(c=>f.appendChild(c)); m.appendChild(f); }
  ov.appendChild(m);

  document.body.appendChild(ov);

function field(label,inp){ const f=el('div','field'); f.appendChild(el('label',null,label)); f.appendChild(inp); return f; }
function inputEl(val){ const i=el('input'); i.value=(val==null?'':val); return i; }
function askOtp(){ const c=prompt('2차 인증 코드 (인증앱 6자리):'); if(c==null)return null; return (c||'').trim(); }
// 특권(in-place/터미널) 자격 확보: 유효 grace 있으면 코드 없이, 없으면 OTP 1회 → grace 캐시.
// 반환 {grace} / {} (로컬) / null(취소·실패)
async function ensurePriv(){
  if(MODE!=='relay') return {};
  let st; try{ st=await T.api('GET','/api/owner/2fa/status'); }catch(e){ st={required:false}; }
  if(!st.required) return {};   // 2FA 꺼짐 → 코드 불필요
  let g=null; try{ g=JSON.parse(LS.getItem('sm_grace')||'null'); }catch(e){}
  if(g&&g.exp&&g.exp*1000>Date.now()+5000) return {grace:g.grace};
  const otp=askOtp(); if(otp==null) return null;
  try{ const r=await T.grant(otp); if(r&&r.grace)LS.setItem('sm_grace',JSON.stringify(r));
    return {grace:r&&r.grace}; }
  catch(e){ toast('인증 실패: '+otpErrMsg(e.message)); return null; }
}
function clearGrace(){ LS.removeItem('sm_grace'); }
function otpErrMsg(err){ return err==='2fa_invalid'?'2차 인증 실패(코드 불일치/만료)'
  :err==='2fa_required'?'2차 인증 미설정 — PC에서 🔒 보안에서 먼저 설정하세요':(err||''); }

// ---- 보안(2차 인증) 켜기/끄기/설정 ----
async function showSecurity(){
  let st; try{ st=await T.api('GET','/api/owner/2fa/status'); }catch(e){ st={required:false,has_secret:false}; }
  const body=el('div');
  const line=(t)=>body.appendChild(el('div','cwd',t));
  line('2차 인증(TOTP): '+(st.required?'켜짐 ✅':'꺼짐 ⚠'));
  line(st.required
    ? '외부에서 in-place 재개·터미널(실제 세션 조작)에 인증앱 6자리 코드가 필요합니다. 한 번 인증하면 일정 시간 이 기기를 신뢰합니다.'
    : '외부에서 in-place 재개·터미널이 코드 없이 릴레이 토큰만으로 가능합니다(보안 약함). 켜는 것을 권장합니다.');
  // grace(기기 신뢰) 상태 + 해제
  let gr=null; try{ gr=JSON.parse(LS.getItem('sm_grace')||'null'); }catch(e){}
  if(st.required && gr&&gr.exp&&gr.exp*1000>Date.now()){
    const mins=Math.round((gr.exp*1000-Date.now())/60000);
    line('이 기기 인증 유지 중 — 약 '+(mins>=60?Math.round(mins/60)+'시간':mins+'분')+' 남음');
    const unlock=el('button','btn ghost','🔓 이 기기 인증 해제'); unlock.style.marginTop='8px';
    unlock.onclick=()=>{ clearGrace(); toast('인증 해제됨'); closeModal(); };
    body.appendChild(unlock);
  }
  if(MODE!=='local'){
    line('켜기/끄기·설정 변경은 이 PC(로컬 127.0.0.1)에서만 가능합니다.');
    openModal('🔒 보안 · 2차 인증', body); return;
  }
  // ---- 로컬: 설정(QR) 표시 ----
  const doProvision=async()=>{
    try{
      const r=await T.api('POST','/api/owner/2fa/provision',{body:{}});
      body.innerHTML='';
      body.appendChild(el('div','cwd','2차 인증이 켜졌습니다. 인증앱(Google Authenticator·Authy 등)으로 QR을 스캔하거나 비밀키를 입력하세요. 창을 닫으면 다시 볼 수 없습니다:'));
      if(r.qr_svg){ const qb=el('div','qrbox'); const im=document.createElement('img');
        im.src=r.qr_svg; im.alt='2FA QR'; qb.appendChild(im); body.appendChild(qb); }
      body.appendChild(field('비밀키 (수동 입력용)', inputEl(r.secret)));
      body.appendChild(field('otpauth URI', inputEl(r.otpauth)));
    }catch(e){ toast('설정 실패: '+e.message); }
  };
  const toggle=async(on)=>{
    try{ await T.api('POST','/api/owner/2fa/toggle',{body:{on}}); toast(on?'2FA 켜짐':'2FA 꺼짐'); showSecurity(); }
    catch(e){ if(e.status===409){ doProvision(); } else toast('실패: '+e.message); }
  };
  const foot=[];
  if(st.required){
    const off=el('button','btn ghost','2FA 끄기'); off.onclick=()=>{
      if(confirm('2차 인증을 끄면 외부에서 코드 없이 실제 세션 조작이 가능해집니다. 계속?')) toggle(false); };
    const re=el('button','btn','QR 재설정'); re.onclick=doProvision;
    foot.push(off, re);
  }else if(st.has_secret){
    const on=el('button','btn','2FA 켜기'); on.onclick=()=>toggle(true);
    const re=el('button','btn ghost','새 QR로 설정'); re.onclick=doProvision;
    foot.push(re, on);
  }else{
    const setup=el('button','btn','2FA 설정(켜기)'); setup.onclick=doProvision;
    foot.push(setup);
  }
  openModal('🔒 보안 · 2차 인증', body, foot);
}

// ---- 외부 접속 기기(조회/등록/삭제) — 로컬 전용. 기기 인증은 항상 켜짐(끌 수 없음) ----
function relTs(sec){ if(!sec)return '미접속';
  const d=Date.now()/1000-sec; if(d<60)return '방금'; if(d<3600)return Math.floor(d/60)+'분 전';
  if(d<86400)return Math.floor(d/3600)+'시간 전'; return Math.floor(d/86400)+'일 전'; }
async function showDevices(){
  let st; try{ st=await T.api('GET','/api/owner/devices'); }catch(e){ toast('기기 목록 실패: '+e.message); return; }
  const body=el('div'); const line=(t)=>body.appendChild(el('div','cwd',t));
  const blockAll = !st.active;   // 등록 기기 0 = 외부 전면 차단
  line('외부(릴레이) 기기 인증: '+(blockAll?'🛑 전면 차단중(등록 기기 없음)':'항상 켜짐 ✅'));
  line('등록된 기기만 외부에서 접속할 수 있습니다. 삭제하면 다음 요청부터 즉시 차단되며, 이미 열려 있던 연결도 끊깁니다.');
  line('이 보호는 끌 수 없습니다 — 끄면 기기 삭제가 실효를 잃기 때문입니다. (이 PC 로컬 접속은 항상 가능)');
  const list=el('div'); list.style.marginTop='8px';
  (st.devices||[]).forEach(d=>{
    const row=el('div','devrow'); const info=el('div');
    info.appendChild(el('div','devname',(d.revoked?'🚫 ':'📱 ')+d.name));
    const meta=[]; meta.push(d.last_seen?('최근 '+relTs(d.last_seen)):'미접속');
    if(d.revoked)meta.push('폐기됨');
    info.appendChild(el('div','devmeta',meta.join(' · ')));
    row.appendChild(info);
    if(!d.revoked){
      const qr=el('button','btn ghost sm','🔄 QR');
      qr.title='QR/링크 다시 만들기 (이전 QR 은 무효)';
      qr.onclick=()=>reissueDevice(d);
      row.appendChild(qr);
    }
    const del=el('button','btn ghost sm','🗑 삭제');
    del.onclick=async()=>{
      if(!confirm('"'+d.name+'" 기기를 삭제할까요?\n이 기기의 접속 토큰이 무효화되어, 다시 쓰려면 새로 페어링해야 합니다.'))return;
      try{ await T.api('POST','/api/owner/devices/'+d.id+'/delete',{body:{}}); toast('삭제됨'); showDevices(); }
      catch(e){ toast('실패: '+e.message); } };
    row.appendChild(del);
    list.appendChild(row);
  });
  if(!(st.devices||[]).length) list.appendChild(el('div','cwd','아직 등록된 기기가 없습니다.'));
  body.appendChild(list);
  const add=el('button','btn','＋ 새 기기 추가'); add.onclick=addDevice;
  openModal('📱 외부 접속 기기', body, [add]);
}
async function copyText(t){
  // 127.0.0.1/https 는 보안 컨텍스트라 clipboard API 사용 가능. 실패 시 구식 방법으로 폴백.
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{
      const ta=document.createElement('textarea');
      ta.value=t; ta.style.cssText='position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      const ok=document.execCommand('copy'); ta.remove(); return ok;
    }catch(_){ return false; }
  }
}
function fieldWithCopy(label, value){
  const f=el('div','field');
  f.appendChild(el('label',null,label));
  const row=el('div'); row.style.cssText='display:flex;gap:6px;align-items:stretch';
  const inp=inputEl(value); inp.readOnly=true; inp.style.flex='1';
  inp.onclick=()=>inp.select();
  const btn=el('button','btn ghost sm','📋 복사'); btn.style.flex='none';
  btn.onclick=async()=>{
    const ok=await copyText(value);
    btn.textContent = ok ? '✓ 복사됨' : '복사 실패';
    if(ok) toast('클립보드에 복사됨');
    setTimeout(()=>{ btn.textContent='📋 복사'; }, 1800);
  };
  row.appendChild(inp); row.appendChild(btn);
  f.appendChild(row);
  return f;
}

async function reissueDevice(d){
  if(!confirm('"'+d.name+'" 의 QR/링크를 다시 만들까요? 이전 QR 은 즉시 무효가 되며, 그 기기는 새 QR 로 다시 페어링해야 합니다.'))return;
  try{
    const r=await T.api('POST','/api/owner/devices/'+d.id+'/reissue',{body:{}});
    const body=el('div');
    openModal('🔄 '+d.name+' — 새 QR', body);
    showPairResult(body, r);
  }catch(e){ toast('재발급 실패: '+e.message); }
}

async function editProfile(s){
  let data; try{ data=await T.api('GET',`/api/sessions/${s.session_id}/profile`); }
  catch(e){ toast('프로파일 로드 실패: '+e.message); return; }
  const p=data.profile||{}, eff=data.effective||{};
  const body=el('div');
  const permSel=el('select');
  ['','plan','acceptEdits','bypassPermissions','default'].forEach(v=>{
    const o=el('option',null,v||'(기본)'); o.value=v; if((p.permission_mode||'')===v)o.selected=true; permSel.appendChild(o); });
  const fModel=inputEl(p.model), fBudget=inputEl(p.max_budget_usd),
        fDenied=inputEl((p.denied_tools||[]).join(', ')), fAllowed=inputEl((p.allowed_tools||[]).join(', ')),
        fDeny=inputEl((p.deny_patterns||[]).join(' | ')), fPc=inputEl(p.max_prompt_chars), fOc=inputEl(p.max_output_chars);
  const fSys=el('textarea'); fSys.value=p.system_prompt||'';
  body.appendChild(field('권한 모드', permSel));
  body.appendChild(field('모델', fModel));
  body.appendChild(field('호출당 예산 $ (max budget)', fBudget));
  body.appendChild(field('차단 도구 (쉼표)', fDenied));
  body.appendChild(field('허용 도구 화이트리스트 (쉼표, 비우면 전체)', fAllowed));
  body.appendChild(field('금지 정규식 ( | 로 구분)', fDeny));
  body.appendChild(field('시스템 프롬프트 추가', fSys));
  body.appendChild(field('입력 길이 제한', fPc));
  body.appendChild(field('출력 길이 제한', fOc));
  body.appendChild(el('div','cwd','실효(전역∩프로파일) 차단도구: '+((eff.denied_tools||[]).join(', ')||'-')));
  const csv=v=>v.split(',').map(x=>x.trim()).filter(Boolean);
  const num=v=>{ const n=parseFloat(v); return isNaN(n)?null:n; };
  const int=v=>{ const n=parseInt(v); return isNaN(n)?null:n; };
  const save=el('button','btn','저장');
  save.onclick=async()=>{
    const payload={ permission_mode:permSel.value||null, model:fModel.value.trim()||null,
      max_budget_usd:num(fBudget.value), denied_tools:csv(fDenied.value), allowed_tools:csv(fAllowed.value),
      deny_patterns:fDeny.value.split('|').map(x=>x.trim()).filter(Boolean),
      system_prompt:fSys.value.trim()||null, max_prompt_chars:int(fPc.value), max_output_chars:int(fOc.value) };
    try{ await T.api('POST',`/api/sessions/${s.session_id}/profile`,{body:payload});
      toast('프로파일 저장됨'); closeModal(); }catch(e){ toast('저장 실패: '+e.message); }
  };
  const clr=el('button','btn ghost','초기화');
  clr.onclick=async()=>{ try{ await T.api('POST',`/api/sessions/${s.session_id}/profile`,{body:{}});
    toast('프로파일 초기화'); closeModal(); }catch(e){ toast('실패: '+e.message); } };
  openModal('🛡 API 정책 (가드레일) — '+s.session_id.slice(0,8), body, [clr, save]);
}

// ---- 2패널 폭 드래그 조절(데스크톱) ----
(function initResizer(){
  const rz=$('#resizer'), main=$('#main'); if(!rz||!main)return;
  const KEY='sm_listw', MINL=260, MIND=380;
  const saved=LS.getItem(KEY); if(saved)main.style.setProperty('--list-w',saved);
  let dragging=false;
  function ptX(e){ return e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX; }
  function onMove(e){ if(!dragging)return;
    const rect=main.getBoundingClientRect();
    let w=ptX(e)-rect.left;
    w=Math.max(MINL, Math.min(w, rect.width-MIND-7));   // 7px = 구분선 폭
    main.style.setProperty('--list-w', Math.round(w)+'px');
    e.preventDefault();
  }
  function stop(){ if(!dragging)return; dragging=false;
    rz.classList.remove('dragging'); document.body.classList.remove('col-resizing');
    const v=main.style.getPropertyValue('--list-w'); if(v)LS.setItem(KEY,v.trim());
    window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',stop);
    window.removeEventListener('touchmove',onMove); window.removeEventListener('touchend',stop);
  }
  function start(e){ dragging=true; rz.classList.add('dragging');
    document.body.classList.add('col-resizing');
    window.addEventListener('mousemove',onMove); window.addEventListener('mouseup',stop);
    window.addEventListener('touchmove',onMove,{passive:false}); window.addEventListener('touchend',stop);
    e.preventDefault();
  }
  rz.addEventListener('mousedown',start);
  rz.addEventListener('touchstart',start,{passive:false});
  rz.addEventListener('dblclick',()=>{ main.style.removeProperty('--list-w'); LS.removeItem(KEY); });
})();

// ---- 이 기기의 접속 자격이 해제됐을 때: 놓칠 수 없는 안내 + 재페어링 유도 ----
// (로컬 웹에서 기기를 삭제하거나 🔄 QR 로 재발급하면 이 기기의 자격이 즉시 무효가 된다)
function showAuthLost(err){
  if(window._authLost) return;          // 요청마다 반복해서 뜨지 않게
  window._authLost=true;
  try{ conn._stopped=true; conn.logout&&conn.logout(); }catch(e){}   // 무의미한 재접속 중단
  const body=el('div');
  const line=(t)=>body.appendChild(el('div','cwd',t));
  line(err==='auth_invalid'
    ? '이 기기의 접속 자격이 해제되었습니다.'
    : '이 기기가 더 이상 등록되어 있지 않습니다.');
  line('PC 의 로컬 웹에서 이 기기를 삭제했거나, 🔄 QR 로 자격을 다시 발급한 경우입니다. 이전 QR·링크는 무효가 됩니다.');
  line('다시 쓰려면: PC 로컬 웹 → 📱 → 해당 기기의 🔄 QR (또는 ＋새 기기 추가) → 새 QR 스캔.');
  const b=el('button','btn','🔗 새 QR/링크로 다시 연결');
  b.style.marginTop='10px';
  b.onclick=()=>{ clearPairing(false);   // 현재 PC 자격만 정리(다른 PC 목록은 보존)
    closeModal(); location.reload(); };
  body.appendChild(b);
  const keep=pcsLoad().length>1;
  if(keep) body.appendChild(el('div','cwd','다른 PC 는 목록에 그대로 남아 있어 계속 쓸 수 있습니다.'));
  openModal('🔒 접속 자격 해제됨', body);
}

function renderPairPcs(){
  const host=$('#p-pcs'); if(!host) return;
  host.innerHTML='';
  const list=pcsLoad().sort((a,b)=>(b.last||0)-(a.last||0));
  if(!list.length) return;
  host.appendChild(el('label',null,'저장된 PC'));
  const wrap=el('div'); wrap.style.cssText='display:flex;flex-direction:column;gap:8px;margin:8px 0 18px';
  list.forEach(pc=>{
    const b=el('button','btn ghost','🖥 '+pcName(pc));
    b.style.cssText='justify-content:space-between;text-align:left';
    b.onclick=async()=>{
      pcsActivate(pc.room);
      $('#p-err').textContent=''; b.textContent='연결 중… '+pcName(pc);
      conn._stopped=false; conn._retry=0;
      try{ await conn.connect(pc.room, LS.getItem('sm_token')||'');
           LS.setItem('sm_room',pc.room); T=relayT; enterApp(); refreshPcsBtn(); }

// ---- 연결 해제 / 완전 로그아웃 ----
// 주의: 어느 쪽도 PC 의 클로드 세션(~/.claude/projects)을 건드리지 않는다.
//       브라우저에 저장된 '접속 자격'만 지운다.
const PAIR_KEYS_ACTIVE=['sm_room','sm_token','sm_cs','sm_cp','sm_devtoken','sm_cjwt','sm_grace'];
const PAIR_KEYS_ALL=PAIR_KEYS_ACTIVE.concat(['sm_pcs','sm_hint_done']);
function clearPairing(all){
  (all?PAIR_KEYS_ALL:PAIR_KEYS_ACTIVE).forEach(k=>LS.removeItem(k));
  try{ conn.devToken=''; }catch(e){}
  setTitle(''); const sel=$('#pcname'); if(sel) sel.classList.add('hidden');   // 헤더 PC 표시 숨김
}

// ---- PC 전환 (여러 PC 를 페어링해 두고 골라 접속) ----
function refreshPcsBtn(){
  const b=$('#btn-pcs'); if(!b) return;
  const list=pcsLoad();
  if(MODE!=='relay'||list.length===0){ b.classList.add('hidden'); return; }

function showPcs(){
  const list=pcsLoad(), curRoom=LS.getItem('sm_room');
  const body=el('div');
  body.appendChild(el('div','cwd','페어링해 둔 PC 목록입니다. 선택하면 그 PC 로 전환합니다.'));
  const wrap=el('div'); wrap.style.marginTop='8px';
  list.sort((a,b)=>(b.last||0)-(a.last||0)).forEach(pc=>{

    info.appendChild(el('div','devname',(isCur?'✅ ':'🖥 ')+pcName(pc)));
    const meta=[pc.room.slice(0,14)+'…'];
    if(pc.last) meta.push('최근 '+relTs(Math.floor(pc.last/1000)));
    if(!(pc.cs&&pc.cp)) meta.push('구 방식(공유토큰)');
    info.appendChild(el('div','devmeta',meta.join(' · ')));
    row.appendChild(info);
    if(!isCur){
      const go=el('button','btn ghost sm','전환');
      go.onclick=()=>{ closeModal(); switchToPc(pc); };

    rn.title='이름 변경';
    rn.onclick=()=>{ const n=prompt('이 PC 의 표시 이름', pcName(pc));
      if(n!==null){ pc.name=n.trim(); pcsUpsert(pc); showPcs(); refreshPcsBtn(); } };
    row.appendChild(rn);
    const del=el('button','btn ghost sm','🗑');
    del.title='목록에서 제거';
    del.onclick=()=>{ if(!confirm('"'+pcName(pc)+'" 을 목록에서 제거할까요? (PC 자체는 그대로이며, 다시 페어링하면 됩니다)'))return;
      pcsRemove(pc.room); showPcs(); refreshPcsBtn(); };
    row.appendChild(del);
    wrap.appendChild(row);
  });

  body.appendChild(wrap);
  body.appendChild(el('div','cwd','다른 PC 를 추가하려면 그 PC 의 로컬 웹에서 📱 → ＋새 기기 추가 로 QR 을 만들어 스캔하세요.'));
  openModal('🖧 내 PC', body);
}

function doPair(){
  // ① 페어링 링크를 붙여넣었으면 거기서 값을 뽑는다(권장 경로)
  const link=($('#p-link')?$('#p-link').value:'').trim();
  let room='', token='', cs='', cp='', dev='';
  if(link){
    let q=null;
    try{ q=new URL(link).searchParams; }
    catch(e){ try{ q=new URLSearchParams(link.replace(/^[^?]*\?/,'')); }catch(_){ q=null; } }
    if(!q||!q.get('room')){ $('#p-err').textContent='페어링 링크를 인식하지 못했습니다. 전체 링크를 복사해 붙여넣으세요.'; return; }
    room=q.get('room')||''; cs=q.get('cs')||''; cp=q.get('cp')||'';
    dev=q.get('dev')||''; token=q.get('token')||'';
  }else{
    room=$('#p-room').value.trim();
    token=$('#p-token').value.trim();
    cp=($('#p-cp')?$('#p-cp').value.trim():'');
    if(token.startsWith('cli_')){ cs=token; token=''; }
  }
  if(!room||!(cs||token)){ $('#p-err').textContent='페어링 링크를 붙여넣거나, 직접 입력을 채워주세요'; return; }
  if(cs&&!cp){ $('#p-err').textContent='cli_ 자격을 쓰려면 CLIENT PUBLIC ID(cpub_…)도 필요합니다'; return; }

  // 자격 저장 → connect() 가 cs 를 단기 JWT 로 교환해 사용한다
  if(dev){ LS.setItem('sm_devtoken',dev); conn.devToken=dev; }
  if(cs&&cp){ LS.setItem('sm_cs',cs); LS.setItem('sm_cp',cp); LS.removeItem('sm_cjwt'); }
  else { LS.removeItem('sm_cs'); LS.removeItem('sm_cp'); LS.removeItem('sm_cjwt'); }

  $('#p-err').textContent=''; $('#p-go').textContent='연결 중…';
  conn.connect(room,token).then(()=>{
    LS.setItem('sm_room',room);
    if(token) LS.setItem('sm_token',token); else LS.removeItem('sm_token');
    pcsUpsert({room, cs, cp, dev});
    T=relayT; enterApp(); refreshPcsBtn();
  }).catch(e=>{ $('#p-err').textContent=e.message; $('#p-go').textContent='연결'; });
}

// ---- 버전 표기 -------------------------------------------------------------
// 로컬: 이 PC 설치본 버전 + 새 버전 여부(update/status). 원격: 접속한 PC 의 버전(auth 응답).
// 헤더 PC 선택 select — 로컬=localhost, 원격=저장된 닉네임. 목록에서 골라 전환.
const LOCAL_DEFAULT_URL='http://127.0.0.1:5100/';
let RELAY_APP_URL='https://clewpath.pyongso.com/relay/app';   // /api/owner/connection 에서 갱신
function localAppUrl(){ return (MODE==='local') ? (location.origin+'/') : LOCAL_DEFAULT_URL; }
function setTitle(nick){ document.title='ClewPath'+(nick?(' — '+nick):''); }
function roomLabel(room){ return 'PC '+String(room||'').replace(/^rm_/,'').slice(0,6); }
// 지금 선택된 대상의 표시 이름(로컬=localhost, 원격=닉네임)
function curPcLabel(){
  if(MODE==='local') return 'localhost';
  const room=LS.getItem('sm_room'); if(!room) return '';
  const pc=pcsLoad().find(x=>x.room===room);
  return pc ? pcName(pc) : roomLabel(room);
}
// 로컬 origin 에 저장하는 '릴레이 PC 목록 거울'(room+name 만, 토큰 없음). 릴레이 저장소는
// origin 이 달라 직접 못 읽어, 팝업(첫 파티 릴레이 페이지)이 postMessage 로 넘겨준 걸 여기 담는다.
function relayPcsLoad(){ try{ const a=JSON.parse(LS.getItem('sm_pcs_relay')||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function relayPcsSave(a){ LS.setItem('sm_pcs_relay', JSON.stringify(a)); }
function refreshPcSelect(){
  const sel=$('#pcname'); if(!sel) return;
  const curRoom=LS.getItem('sm_room');
  const opts=[{v:'__local__', t:'🖥 localhost'}];
  if(MODE==='relay'){
    const seen=new Set();
    pcsLoad().forEach(pc=>{ opts.push({v:pc.room, t:'🖥 '+pcName(pc)}); seen.add(pc.room); });
    if(curRoom && !seen.has(curRoom)) opts.push({v:curRoom, t:'🖥 '+roomLabel(curRoom)});
  } else {
    // 로컬: 릴레이에서 동기화해 둔 외부 PC 목록. 고르면 릴레이로 이동해 그 PC 가 선택된다.
    relayPcsLoad().forEach(pc=>{ opts.push({v:'relay:'+pc.room, t:'🖥 '+(pc.name||roomLabel(pc.room))}); });
    opts.push({v:'__sync__', t:'🔄 릴레이에서 PC 목록 동기화'});
  }
  sel.innerHTML='';
  opts.forEach(o=>{ const op=document.createElement('option'); op.value=o.v; op.textContent=o.t; sel.appendChild(op); });
  sel.value = (MODE==='local') ? '__local__' : (curRoom||'__local__');
  setTitle(curPcLabel());
  sel.classList.remove('hidden');
}
// 릴레이 목록 동기화 — 릴레이 앱을 팝업으로 열면 그 페이지가 자기 목록을 postMessage 로 넘긴다.
function syncRelayPcs(){
  const w=window.open(RELAY_APP_URL+'?pcexport='+encodeURIComponent(location.origin),
                      'clewpath_pcsync','width=440,height=340');
  if(!w) toast('팝업이 차단됐습니다 — 팝업 허용 후 다시 시도하세요.');
}
// 팝업(릴레이)에서 넘어온 PC 목록 수신 — 릴레이 origin 만 신뢰, room+name 만 저장.
function onRelayPcsMessage(ev){
  try{
    if(ev.origin !== new URL(RELAY_APP_URL).origin) return;
    const d=ev.data;
    if(d && d.type==='clewpath_pcs' && Array.isArray(d.pcs)){
      relayPcsSave(d.pcs.map(x=>({room:String(x.room||''),name:String(x.name||'')})).filter(x=>x.room));
      refreshPcSelect();
      toast('릴레이 PC 목록 동기화됨 ('+d.pcs.length+'대)');
    }
  }catch(e){}
}
// 릴레이 앱이 ?pcexport 로 열렸을 때: 자기 PC 목록(room+name)을 opener(로컬)로 넘기고 끝.
function doExport(target){
  const ok=/^https?:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(target||'');   // 로컬 오리진만
  if(ok && window.opener){
    const list=pcsLoad().map(pc=>({room:pc.room, name:pc.name||''}));         // 토큰 제외
    try{ window.opener.postMessage({type:'clewpath_pcs', pcs:list}, target); }catch(e){}
  }
  document.body.innerHTML='<div style="padding:24px;font:15px system-ui;color:#e6edf3;'+
    'background:#0d1117;height:100vh">PC 목록을 로컬 앱으로 전송했습니다. 이 창은 닫으셔도 됩니다.</div>';
}
async function switchToPc(pc){
  pcsActivate(pc.room);
  toast(pcName(pc)+' 로 전환 중…');
  try{ conn.logout(); }catch(e){}
  conn._stopped=false; conn._retry=0;
  try{ await conn.connect(pc.room, LS.getItem('sm_token')||'');
       T=relayT; enterApp(); refreshPcsBtn(); refreshPcSelect(); toast(pcName(pc)+' 연결됨'); }
  catch(e){ toast('전환 실패: '+e.message); refreshPcSelect(); }
}
function onPcSelect(){
  const sel=$('#pcname'); if(!sel) return;
  const v=sel.value;
  if(v==='__local__'){ if(MODE==='local') return; location.href=localAppUrl(); return; }  // localhost 로
  if(v==='__sync__'){ syncRelayPcs(); refreshPcSelect(); return; }                        // 목록 동기화
  if(v.indexOf('relay:')===0){ location.href=RELAY_APP_URL+'?switch='+encodeURIComponent(v.slice(6)); return; } // 릴레이로 그 PC
  if(v===LS.getItem('sm_room')){ return; }                                                // 현재와 같음
  if(MODE==='relay'){ const pc=pcsLoad().find(x=>x.room===v)||{room:v,name:''}; switchToPc(pc); }
}
function showVer(cur, latest){
  const b=$('#ver'); if(!b||!cur) return;
  b.classList.remove('hidden');
  if(latest){
    b.textContent=`v${cur} → ${latest}`;
    b.classList.add('upd');
    b.title='새 버전이 있습니다. 클릭하면 지금 업데이트.';
    // 로컬=직접 적용, 릴레이=커넥터 프록시로 원격 PC 에 적용 — 둘 다 가능.
    b.onclick=()=>showUpdateApply(cur,latest);
  } else {
    b.textContent='v'+cur; b.classList.remove('upd');
    // 최신이어도 뱃지를 눌러 업데이트를 확인/재설치할 수 있게 — 발견성 확보(로컬·릴레이 공통).
    b.title='클릭하면 업데이트를 확인합니다'; b.onclick=()=>checkUpdateNow(cur);
  }
}
// 로컬: 뱃지 클릭 → 지금 업데이트 확인. 있으면 적용 모달, 없으면 '최신' 안내.
async function checkUpdateNow(cur){
  const body=el('div');
  const status=el('p',null,'업데이트 확인 중…'); body.appendChild(status);
  openModal('업데이트', body, []);
  try{
    const s=await T.api('GET','/api/owner/update/status',{query:{refresh:1}});
    if(s && s.dev){ status.textContent=`개발 소스에서 실행 중입니다 (v${s.current||cur}). 이 PC 는 git 으로 갱신하세요 — 자동 업데이트는 소스 트리 보호를 위해 막혀 있습니다.`; }
    else if(s && s.available && s.latest){ closeModal(); showUpdateApply(s.current||cur, s.latest); }
    else{ status.textContent=`현재 v${(s&&s.current)||cur} — 최신 버전입니다.`; }
  }catch(e){ status.textContent='업데이트 서버에 연결하지 못했습니다.'; }
}
// 원격/폰: 적용은 로컬에서만 되므로 방법만 안내
function showUpdateInfo(cur,latest){

  openModal('업데이트', body, []);

// 로컬: 실제 적용 버튼
function showUpdateApply(cur,latest){
  const body=el('div');
  body.appendChild(el('p',null,`새 버전 ${latest} 이 나왔습니다 (현재 v${cur}).`));
  body.appendChild(el('p',null,'서명·해시를 검증한 뒤 적용하고, 실패하면 자동으로 이전 버전으로 되돌립니다. 설정·기기·페어링은 그대로 유지됩니다.'));
  const status=el('div'); status.style.cssText='margin-top:10px;color:var(--ink2)'; body.appendChild(status);
  const go=el('button','btn full',`지금 v${latest} 로 업데이트`);
  go.onclick=async()=>{
    go.disabled=true; go.textContent='적용 중…'; status.textContent='서버가 새 버전을 받아 검증하고 있습니다…';
    try{
      const j=await T.api('POST','/api/owner/update/apply');   // 로컬=직접, 릴레이=원격 PC 에 적용
      if(j && j.applied){
        status.innerHTML='적용을 시작했습니다. 서비스가 잠시 재기동됩니다 — <b>30초 뒤 자동으로 새로고침</b>됩니다.';
        go.textContent='재기동 대기…';
        setTimeout(()=>location.reload(), 30000);
      } else {
        go.disabled=false; go.textContent=`지금 v${latest} 로 업데이트`;
        status.textContent='적용하지 못했습니다: '+((j&&(j.error||j.reason))||'알 수 없는 오류');
      }
    }catch(e){
      if(e && e.json && (e.json.error||e.json.reason)){   // 서버가 명시적으로 거부(예: 개발 소스)
        go.disabled=false; go.textContent=`지금 v${latest} 로 업데이트`;
        status.textContent='적용하지 못했습니다: '+(e.json.error||e.json.reason);
      } else {
        // 응답 전에 (원격이면 커넥터가) 재기동하며 연결이 끊긴 경우 — 정상 진행 신호.
        status.innerHTML='요청을 보냈습니다. 서비스가 재기동 중일 수 있습니다 — <b>30초 뒤 새로고침</b>하세요.';
        setTimeout(()=>location.reload(), 30000);
      }
    }
  };
  openModal('업데이트', body, [go]);
}
async function refreshVer(){
  try{
    // 로컬=직접 fetch, 릴레이=커넥터 프록시(T.api). refresh=1 로 캐시 아닌 '지금' 확인 →
    // 방금 게시된 새 버전도 화면 열자마자 감지. 원격 PC 도 동일하게 확인된다.
    const s=await T.api('GET','/api/owner/update/status',{query:{refresh:1}});
    if(!s) return;
    // 개발 소스면 자동적용이 막혀 있으므로 '업데이트 있음' 뱃지를 띄우지 않는다(눌러도 실패).
    showVer(s.current, (s.available&&s.latest&&!s.dev)?s.latest:null);
  }catch(e){}
}

// 모드별 부팅: local=페어링 없이 바로, relay=room/token 페어링
const _pcexport=new URLSearchParams(location.search).get('pcexport');
if(_pcexport){
  // 로컬 앱이 목록 동기화를 위해 이 릴레이 페이지를 팝업으로 열었다 — 목록만 넘기고 끝(부팅 안 함).
  doExport(_pcexport);
}else if(MODE==='local'){
  $('#btn-logout').classList.add('hidden');      // 로컬은 로그아웃 개념 없음
  $('#btn-devices').classList.remove('hidden');  // 기기 관리는 로컬 전용 → 로컬에서만 노출
  window.addEventListener('message', onRelayPcsMessage);   // 팝업 동기화 수신
  refreshConnBadge();                            // 접속 인증 모드 배지(JWT/fallback)
  setInterval(refreshConnBadge, 60000);
  refreshVer();                                  // 버전 + 새 버전 알림
  setInterval(refreshVer, 6*3600*1000);
  setStatus(true,true);
  enterApp();
  maybeShowFirstRunHint();
}else{
  // 원격(릴레이)에서는 2FA 패널을 숨긴다 — 설정 변경은 로컬 전용이라 상태 표시뿐이고,
  // 유일한 실행 동작이던 'grace 해제'는 ⏻ 연결 해제가 sm_grace 를 지우므로 대체된다.
  $('#btn-security').classList.add('hidden');
  const p=new URLSearchParams(location.search);
  // 페어링 딥링크(QR): ?room=&token=&dev= → 저장 후 주소창에서 비밀 제거
  const dev=p.get('dev');
  if(dev){ LS.setItem('sm_devtoken',dev); conn.devToken=dev; }
  // 기기 전용 client 자격증명(공유 토큰 대체). 있으면 저장하고 JWT 로 교환해 쓴다.
  const cs=p.get('cs'), cpid=p.get('cp');
  if(cs&&cpid){ LS.setItem('sm_cs',cs); LS.setItem('sm_cp',cpid); LS.removeItem('sm_cjwt'); }
  if(p.get('room')) pcsUpsert({room:p.get('room'), cs:cs||'', cp:cpid||'', dev:dev||''});
  // ?switch=room : 로컬 페이지에서 고른 PC. 저장돼 있으면(자격 포함) 그 방을 활성화해 자동 접속.
  const swRoom=p.get('switch');
  if(swRoom){ const spc=pcsLoad().find(x=>x.room===swRoom); if(spc) pcsActivate(spc.room); }
  const room=p.get('room')||LS.getItem('sm_room')||'';
  const token=p.get('token')||LS.getItem('sm_token')||'';
  if(p.get('dev')||p.get('token')||p.get('cs')||swRoom){   // 주소창에서 파라미터 제거(캐시/공유 방지)
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
  }
  $('#p-room').value=room; $('#p-token').value=token;
  // 저장된 자격이 있으면 자동 접속(기기 자격 cs 또는 구 공유 토큰)
  const hasCs=!!(LS.getItem('sm_cs')&&LS.getItem('sm_cp'));
  renderPairPcs();                       // 저장된 PC 가 있으면 페어링 화면에서 바로 고를 수 있게
  if(room&&(hasCs||token)){
    $('#p-err').textContent=''; $('#p-go').textContent='연결 중…';
    conn.connect(room,token).then(()=>{ LS.setItem('sm_room',room); T=relayT; enterApp(); refreshPcsBtn(); })
      .catch(e=>{ $('#p-err').textContent=e.message; $('#p-go').textContent='연결'; });
  }
}
</script>
</body>
</html>
