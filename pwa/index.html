// 입력 중이면 20초 자동 갱신이 폼을 갈아엎지 않게
function teamEditing(){
  if(TEAM_NEW||Object.values(TEAM_UI).some(u=>u.adding)) return true;
  const a=document.activeElement; return !!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName||'')&&a.closest&&a.closest('#paneList'));
}
const TEAM_ERR={alias_taken:'같은 별칭이 이미 있습니다', already_member:'이미 이 팀 구성원입니다', manager_cannot_leave:'관리는 뺄 수 없습니다',
  no_monitor_group:'관리 세션이 없어 관제·알림이 없습니다', name_required:'이름을 적으세요', alias_required:'별칭을 적으세요',
  team_not_found:'팀을 찾을 수 없습니다'};
function teamErrText(m){ m=String(m||''); return TEAM_ERR[m]||m; }
// 팀 → 관제 그룹 모양(관리 + 구성원 + 라벨). 관제 화면·알림은 이 그룹 id 로 돈다(내부).
function teamAsGroup(t){
  const mgr=(t.members||[]).find(m=>m.member_role==='manager'&&m.session_id);
  if(!t.monitor_group_id||!mgr) return null;
  const labels={}, subs=[];
  (t.members||[]).forEach(m=>{ if(!m.session_id) return; labels[m.session_id]=m.alias+(m.role?' · '+m.role:'');
    if(m!==mgr) subs.push(m.session_id); });
  return {id:t.monitor_group_id, name:t.name, manager:mgr.session_id, subs, labels};
}
function teamSummary(t){
  const ms=t.members||[]; const live=ms.filter(m=>m.live).length; const k=t.tasks||{};
  const parts=['구성원 '+ms.length+(live?' · 🟢 '+live:'')];
  if(k.assigned) parts.push('진행 '+k.assigned);
  if(k.submitted) parts.push('제출 '+k.submitted+' ⚠');
  if(k.blocked) parts.push('막힘 '+k.blocked);
  if(k.rejected) parts.push('반려 '+k.rejected);
  if(t.archived) parts.push('보관됨');
  return parts.join(' · ');
}
function memberSess(m){ return m.session_id?(SESSIONS||[]).find(s=>s.session_id===m.session_id)||null:null; }

function renderTeamRows(wrap){
  wrap.innerHTML='';
  if(TEAMS===null){ wrap.appendChild(el('div','spin')); return; }
  const port=TEAMS.filter(t=>t.kind==='portfolio');
  const act=TEAMS.filter(t=>t.kind!=='portfolio'&&!t.archived);
  const arch=TEAMS.filter(t=>t.kind!=='portfolio'&&t.archived);
  port.forEach(t=>wrap.appendChild(teamCard(t,{assistant:true})));
  if(!act.length) wrap.appendChild(el('div','empty','아직 팀이 없습니다. 아래 ＋ 새 팀으로 만들거나, 관리 세션에서 clewpath-workers 스킬로 만드세요.'));
  act.forEach(t=>wrap.appendChild(teamCard(t)));
  if(TEAM_NEW) wrap.appendChild(newTeamForm());
  else { const b=el('button','btn gnew','＋ 새 팀'); b.onclick=()=>{ TEAM_NEW={name:'', mgr:'', members:[]}; teamRerender(); }; wrap.appendChild(b); }
  if(arch.length){
    const h=el('button','tarch-h',(TEAM_ARCH_OPEN?'▾':'▸')+' 🗄 보관된 팀 '+arch.length);
    h.onclick=()=>{ TEAM_ARCH_OPEN=!TEAM_ARCH_OPEN; teamRerender(); }; wrap.appendChild(h);
    if(TEAM_ARCH_OPEN) arch.forEach(t=>wrap.appendChild(teamCard(t)));
  }
}
function teamCard(t,o){
  o=o||{};
  const card=el('div','tcard'+(t.archived?' arch':'')); card.dataset.code=t.code;
  const open=TEAM_OPEN.has(t.code);
  const g=t.archived?null:teamAsGroup(t);
  const gh=el('div','ghead grp'+(g&&MON_INLINE&&MON_INLINE.gid===g.id?' sel':'')); if(g) gh.dataset.gid=g.id;
  const gt=el('button','gtext');
  const nm=el('div','gbase',o.assistant?'🧑‍💼 개인비서':(t.archived?'🗄 ':'👥 ')+t.name);
  if(!o.assistant) nm.appendChild(el('span','tcode',t.code));
  gt.appendChild(nm);
  const k=t.tasks||{};
  gt.appendChild(el('div','gpath'+(k.submitted?' warn':''), o.assistant?assistantLine(t):teamSummary(t)));
  gt.onclick=()=>toggleTeam(t);
  gh.appendChild(gt);
  if(g){ const op=el('button','gopen','🎬'); op.title='관제 열기'; op.onclick=()=>openMonitorGroup(g); gh.appendChild(op); }
  const cv=el('button','gset',open?'▾':'▸'); cv.title=open?'접기':'펼치기'; cv.onclick=()=>toggleTeam(t); gh.appendChild(cv);
  card.appendChild(gh);
  if(open) card.appendChild(o.assistant?assistantBody(t):teamBody(t));
  return card;
}
function toggleTeam(t){
  const code=t.code;
  if(TEAM_OPEN.has(code)) TEAM_OPEN.delete(code);
  else {
    TEAM_OPEN.add(code);
    if(!TEAM_DET[code]&&t.kind!=='portfolio') refreshTeamDetail(code).then(teamRerender);
    const g=t.archived?null:teamAsGroup(t);
    if(g&&monInlineWanted()) openMonitorGroup(g,{inline:true});   // PC: 펼치면 오른쪽에 그 팀 관제
  }
  lsSet('sm_team_open',[...TEAM_OPEN]); teamRerender();
}

// ── 🧑‍💼 개인비서 칸(포트폴리오 팀) ──
function assistantLine(t){
  const m=(t.members||[]).find(x=>x.member_role==='manager')||(t.members||[])[0];
  return (m&&m.live?'● 실행 중':'꺼져 있음')+' · 사장님 프로필';
}
const PROFILE_STATUS_T={proposed:'제안',confirmed:'확정',rejected:'거절',deleted:'삭제'};
function assistantBody(t){
  const b=el('div','tbody'); const u=tui(t.code);
  const row=el('div','tacts');
  const op=el('button','btn sm','🧑‍💼 비서 열기'); op.onclick=()=>openAssistant(); row.appendChild(op);
  b.appendChild(row);
  b.appendChild(el('div','tsec','사장님 프로필'));
  b.appendChild(el('div','tnote','비서가 장부에서 배운 작업 습관·선호입니다. 확정해야 비서가 기준으로 씁니다.'));
  if(!u.profile){
    b.appendChild(el('div','spin'));
    if(!u.profLoading){ u.profLoading=true;
      T.api('GET','/api/owner/profile').then(r=>{ u.profile=(r&&r.profile)||[]; })
        .catch(e=>{ u.profile=[]; toast('프로필 조회 실패: '+e.message); }).finally(()=>{ u.profLoading=false; teamRerender(); }); }
    return b;
  }
  if(!u.profile.length) b.appendChild(el('div','cwd','아직 항목이 없습니다.'));
  u.profile.forEach(p=>{
    const r=el('div','tline'); r.textContent=(p.status==='confirmed'?'📌 ':'💡 ')+p.statement;
    b.appendChild(r);
    b.appendChild(el('div','tnote',(PROFILE_STATUS_T[p.status]||p.status)+(p.topic?' · '+p.topic:'')+' · 확신 '+Math.round((p.confidence||0)*100)+'%'));
    const acts=el('div','tacts');
    const mk=(label, decision, extra)=>{ const x=el('button','btn ghost sm',label);
      x.onclick=()=>{ const args=Object.assign({id:p.id, decision}, extra?extra():{});
        if('statement' in args && !args.statement) return;
        requestApproval('profile_decide', args, ()=>{ u.profile=null; teamRerender(); }); };
      acts.appendChild(x); };
    if(p.status==='proposed') mk('확정','confirm');
    mk('수정','edit', ()=>({statement: prompt('수정할 문장', p.statement)}));
    if(p.status==='proposed') mk('거절','reject');
    mk('삭제','delete');
    b.appendChild(acts);
  });
  return b;
}

// ── 팀 칸 본문(탭) ──
function teamBody(t){
  const b=el('div','tbody'); const code=t.code; const u=tui(code);
  const tab=TEAM_TAB[code]||'members';
  const tabs=el('div','ttabs');
  const k=t.tasks||{}; const nOpen=TASK_OPEN_ST.reduce((n,s)=>n+(k[s]||0),0);
  TEAM_TABS.forEach(([v,l])=>{
    const lab=v==='members'?l+' '+(t.members||[]).length:(v==='tasks'&&nOpen?l+' '+nOpen:l);
    const x=el('button',tab===v?'on':'',lab); x.dataset.tab=v;
    x.onclick=()=>{ TEAM_TAB[code]=v; lsSet('sm_team_tab',TEAM_TAB); teamRerender(); }; tabs.appendChild(x); });
  b.appendChild(tabs);
  if(tab==='members'){ b.appendChild(teamMembers(t)); return b; }   // 구성원은 목록 값만으로(상세 안 기다림)
  const d=TEAM_DET[code];
  if(!d){ b.appendChild(el('div','spin')); if(!u.loading) refreshTeamDetail(code).then(teamRerender); return b; }
  if(d.error){ b.appendChild(el('div','cwd','불러오기 실패: '+d.error)); return b; }
  if(tab==='tasks') b.appendChild(teamTasks(t,d));
  else if(tab==='records') b.appendChild(teamRecords(t,d));
  else b.appendChild(teamSettings(t,d));
  return b;
}

// 구성원: 상태 점·별칭·관리·역할·지금 세션 → 누르면 세션, 경력은 그 줄 아래 펼침
function teamMembers(t){
  const w=el('div','tlist'); const u=tui(t.code);
  (t.members||[]).forEach(m=>{
    const s=memberSess(m);
    const row=el('div','srow tm'+(s?'':' dim')); row.dataset.agent=m.agent_id;
    const info=el('button','sinfo'); const r1=el('div','sr1');
    const bd=s&&sessionBadge(s);
    if(bd){ const dd=el('span','sdot'+(bd.pulse?' pulse':'')); dd.style.setProperty('--c',bd.c); r1.appendChild(dd); }
    r1.appendChild(el('span','sname',m.alias));
    if(m.member_role==='manager') r1.appendChild(el('span','schip','관리'));
    if(bd){ const st=el('span','sstate',bd.text); st.style.setProperty('--c',bd.c); r1.appendChild(st); }
    info.appendChild(r1);
    const where=s?sessLabel(s):(m.session_id?'세션 '+m.session_id.slice(0,8)+' · 목록에 없음':'세션 없음');
    info.appendChild(el('div','smeta2',[m.role,where].filter(Boolean).join(' · ')));
    if(s) info.onclick=()=>loadDetail(s);
    row.appendChild(info);
    const cb=el('button','tmini',u.career===m.agent_id?'경력 ▾':'경력 ›'); cb.onclick=()=>toggleCareer(t,m); row.appendChild(cb);
    w.appendChild(row);
    if(u.career===m.agent_id) w.appendChild(careerBlock(t,m));
  });
  if(t.archived) return w;
  if(u.adding) w.appendChild(addMemberForm(t));
  else { const a=el('button','tadd','＋ 구성원 추가'); a.onclick=()=>{ u.adding=true; u.add={sid:'', alias:'', role:''}; teamRerender(); }; w.appendChild(a); }
  return w;
}
function toggleCareer(t,m){
  const u=tui(t.code);
  if(u.career===m.agent_id){ u.career=null; teamRerender(); return; }
  u.career=m.agent_id; u.careerData=null; teamRerender();
  T.api('GET','/api/owner/teams/'+encodeURIComponent(t.code)+'/members/'+encodeURIComponent(m.agent_id)+'/history')
    .then(h=>{ if(u.career===m.agent_id){ u.careerData=h; teamRerender(); } })
    .catch(e=>{ if(u.career===m.agent_id){ u.careerData={error:e.message}; teamRerender(); } });
}
function careerBlock(t,m){
  const u=tui(t.code); const h=u.careerData; const b=el('div','tinner');
  if(!h){ b.appendChild(el('div','spin')); return b; }
  if(h.error){ b.appendChild(el('div','cwd','불러오기 실패: '+h.error)); return b; }
  const k=h.counts||{};
  b.appendChild(el('div','diag','토큰 '+fmtTok(h.tokens&&h.tokens.total)+' · 메시지 '+(k.messages_sent|0)+' · 제출 '+(k.submitted|0)
    +' · 승인 '+(k.accepted|0)+' · 반려 '+(k.rejected|0)+' · 사장님 입력 '+(k.human_inputs|0)));
  const ss=h.sessions||[];
  if(ss.length){ b.appendChild(el('div','tsec','세션 이력'));
    ss.forEach(s=>b.appendChild(el('div','tline',(s.ended?'· ':'● ')+s.session_id.slice(0,8)+' · '+s.reason+' · '+tsText(s.started)+(s.ended?' ~ '+tsText(s.ended):'')))); }
  const owned=h.tasks_owned||[];
  b.appendChild(el('div','tsec','맡은 일감 '+owned.length));
  owned.slice(0,20).forEach(x=>{ const r=el('button','tline link',x.id+' · '+(TEAM_STATUS[x.status]||x.status)+' · '+x.goal);
    r.onclick=()=>{ TEAM_TAB[t.code]='tasks'; lsSet('sm_team_tab',TEAM_TAB); u.filter='all'; openTask(t,x.id); }; b.appendChild(r); });
  if(!t.archived && m.member_role!=='manager'){
    const lv=el('button','btn ghost sm tdanger','이 팀에서 빼기');
    lv.onclick=async()=>{ if(!confirm(`'${m.alias}' 을(를) ${t.name} 에서 뺄까요? (세션·경력은 그대로)`)) return;
      try{ const r=await T.api('POST','/api/owner/teams/'+encodeURIComponent(t.code)+'/members/'+encodeURIComponent(m.agent_id)+'/leave');
        if(r&&r.error) throw new Error(r.error); u.career=null; toast('뺐습니다'); reloadTeams(t.code); }
      catch(e){ toast('빼기 실패: '+teamErrText(e.message)); } };
    b.appendChild(lv);
  }
  return b;
}
function sessionSelect(val, exclude, onChange){
  const sel=el('select','tsel');
  const o0=el('option',null,'세션 고르기…'); o0.value=''; sel.appendChild(o0);
  [...(SESSIONS||[])].filter(s=>!s.headless&&!s.continued_in&&!(exclude&&exclude.has(s.session_id)))
    .sort((a,b)=>(b.mtime||0)-(a.mtime||0)).slice(0,300)
    .forEach(s=>{ const o=el('option',null,sessLabel(s)+' · '+baseName(s.cwd||'')); o.value=s.session_id; sel.appendChild(o); });
  sel.value=val||''; sel.onchange=()=>onChange(sel.value); return sel;
}
function sessTitleOf(sid){ const s=(SESSIONS||[]).find(x=>x.session_id===sid); return s?String(sessLabel(s)).slice(0,40):''; }
function addMemberForm(t){
  const u=tui(t.code); const f=el('div','tform');
  const inTeam=new Set((t.members||[]).map(m=>m.session_id).filter(Boolean));
  const al=inputEl(u.add.alias||''); al.placeholder='팀 안에서 부를 이름'; al.oninput=()=>{ u.add.alias=al.value; };
  f.appendChild(field('세션', sessionSelect(u.add.sid, inTeam, v=>{ u.add.sid=v; if(!u.add.alias){ u.add.alias=sessTitleOf(v); al.value=u.add.alias; } })));
  f.appendChild(field('별칭', al));
  const rl=inputEl(u.add.role||''); rl.placeholder='맡은 일(선택)'; rl.oninput=()=>{ u.add.role=rl.value; }; f.appendChild(field('역할', rl));
  const acts=el('div','tacts');
  const no=el('button','btn ghost sm','취소'); no.onclick=()=>{ u.adding=false; teamRerender(); };
  const ok=el('button','btn sm','추가');
  ok.onclick=async()=>{
    const alias=String(u.add.alias||'').trim();
    if(!u.add.sid||!alias){ toast('세션과 별칭을 정하세요'); return; }
    ok.disabled=true;
    try{ const r=await T.api('POST','/api/owner/teams/'+encodeURIComponent(t.code)+'/members',
        {body:{session_id:u.add.sid, alias, role:String(u.add.role||'').trim()}});
      if(r&&r.error) throw new Error(r.error);
      u.adding=false; toast('구성원을 추가했습니다'); reloadTeams(t.code); }
    catch(e){ ok.disabled=false; toast('추가 실패: '+teamErrText(e.message)); } };
  acts.appendChild(no); acts.appendChild(ok); f.appendChild(acts);
  return f;
}

// 일감: 진행 중 / 제출됨 / 전체 · 줄을 누르면 그 아래 타임라인 · 제출된 일감은 승인/반려(승인 요청)
function teamTasks(t,d){
  const u=tui(t.code); const w=el('div','tlist');
  const chips=el('div','tchips');
  [['open','진행 중'],['submitted','제출됨'],['all','전체']].forEach(([v,l])=>{
    const c=el('button',u.filter===v?'on':'',l); c.onclick=()=>{ u.filter=v; teamRerender(); }; chips.appendChild(c); });
  w.appendChild(chips);
  const alias={}; (d.members||t.members||[]).forEach(m=>{ alias[m.agent_id]=m.alias; });
  const tasks=(d.tasks||[]).filter(x=>u.filter==='all'||(u.filter==='open'?TASK_OPEN_ST.includes(x.status):x.status===u.filter));
  if(!tasks.length) w.appendChild(el('div','cwd',u.filter==='all'?'일감이 없습니다.':'해당하는 일감이 없습니다.'));
  tasks.forEach(x=>{
    const row=el('div','srow tk'+(x.status==='submitted'?' warn':'')); row.dataset.task=x.id;
    const info=el('button','sinfo'); const r1=el('div','sr1');
    r1.appendChild(el('span','tid',x.id));
    r1.appendChild(el('span','sname',x.goal));
    r1.appendChild(el('span','tst st-'+x.status,TEAM_STATUS[x.status]||x.status));
    info.appendChild(r1);
    info.appendChild(el('div','smeta2',(alias[x.owner]||x.owner||'')+' · '+tsText(x.created)+(x.closed?' ~ '+tsText(x.closed):'')));
    info.onclick=()=>openTask(t,x.id);
    row.appendChild(info); w.appendChild(row);
    if(x.status==='submitted'&&!t.archived){
      const acts=el('div','tacts');
      const mk=(label,action)=>{ const b=el('button','btn sm'+(action==='reject'?' ghost':''),label);
        b.onclick=()=>{ const args={team:t.code, task:x.id, action, assignment_ver:x.assignment_ver};
          if(action==='reject'){ const note=prompt('반려 사유(작업자에게 전달됩니다)',''); if(note===null) return; args.note=note; }
          requestApproval('task_decide', args, ()=>{ toast(action==='accept'?'승인했습니다':'반려했습니다'); reloadTeams(t.code); }); };
        acts.appendChild(b); };
      mk('✔ 승인','accept'); mk('✖ 반려','reject'); w.appendChild(acts);
    }
    if(u.task===x.id) w.appendChild(timelineBlock(t));
  });
  return w;
}
function openTask(t,id){
  const u=tui(t.code);
  if(u.task===id){ u.task=null; teamRerender(); return; }
  u.task=id; u.tl=null; teamRerender();
  T.api('GET','/api/owner/teams/'+encodeURIComponent(t.code)+'/tasks/'+encodeURIComponent(id)+'/timeline')
    .then(r=>{ if(u.task===id){ u.tl=r; teamRerender(); } })
    .catch(e=>{ if(u.task===id){ u.tl={error:e.message}; teamRerender(); } });
}
function timelineBlock(t){
  const u=tui(t.code); const r=u.tl; const b=el('div','tinner');
  if(!r){ b.appendChild(el('div','spin')); return b; }
  if(r.error){ b.appendChild(el('div','cwd','불러오기 실패: '+r.error)); return b; }
  b.appendChild(el('div','diag',(TEAM_STATUS[r.status]||r.status)+' · 배정 v'+r.assignment_ver+' · 토큰(추정) '+fmtTok(r.tokens_estimate&&r.tokens_estimate.total)));
  (r.events||[]).forEach(e=>{
    const who=(e.agent||'')+(e.to?' → '+e.to:'');
    const row=el('div','tline tl-'+e.kind);
    row.appendChild(el('b',null,(TEAM_KIND[e.kind]||e.kind)+(who?' · '+who:'')));
    row.appendChild(el('small',null,' '+tsText(e.t)+' · '+teamEventText(e)));
    const full=(e.payload&&(e.payload.body||e.payload.text))||'';
    if(full){ row.classList.add('link'); row.onclick=()=>{
      if(row.nextSibling&&row.nextSibling.classList&&row.nextSibling.classList.contains('tl-full')) row.nextSibling.remove();
      else { const pre=el('pre','tl-full',full); pre.style.whiteSpace='pre-wrap'; row.after(pre); } }; }
    b.appendChild(row);
  });
  return b;
}

// 기록: 토큰 · 규칙 위반 · 사장님 입력 검색(그 자리에서)
function teamRecords(t,d){
  const w=el('div','tlist'); const u=tui(t.code);
  const us=d.usage||{};
  w.appendChild(el('div','tsec','🧮 토큰 '+fmtTok(us.total&&us.total.total)));
  (us.by_agent||[]).forEach(a=>w.appendChild(el('div','tline',(a.alias||a.agent_id)+' · '+fmtTok(a.total))));
  w.appendChild(el('div','tnote','일감별 토큰은 추정입니다.'));
  const vs=d.violations||[];
  w.appendChild(el('div','tsec','⚠ 규칙 위반 '+vs.length));
  vs.slice(0,20).forEach(x=>w.appendChild(el('div','tline',x.text+(x.task?' · '+x.task:'')+' · '+(x.who||[]).join(' → ')+' · '+tsText(x.t)+(x.notified?' · 알림됨':''))));
  w.appendChild(el('div','tsec','🙋 사장님 입력 검색'));
  const sb=el('div','tsearch'); const q=inputEl(u.q||''); q.placeholder='이 팀 세션에서 친 말(3자 이상은 전문 검색)';
  q.oninput=()=>{ u.q=q.value; };
  const run=async(before)=>{
    try{ const r=await T.api('GET','/api/owner/teams/'+encodeURIComponent(t.code)+'/inputs',
        {query:Object.assign({limit:30}, u.q?{q:u.q.trim()}:{}, before?{before}:{})});
      const items=(r&&r.items)||[];
      u.inputs=before?(u.inputs||[]).concat(items):items; u.inputsNext=r&&r.next_before; teamRerender(); }
    catch(e){ toast('검색 실패: '+e.message); } };
  q.onkeydown=(ev)=>{ if(ev.key==='Enter') run(); };
  const go=el('button','btn sm','검색'); go.onclick=()=>run();
  sb.appendChild(q); sb.appendChild(go); w.appendChild(sb);
  if(u.inputs){
    if(!u.inputs.length) w.appendChild(el('div','cwd','결과가 없습니다.'));
    u.inputs.forEach(x=>{ w.appendChild(el('div','tnote','🙋 '+(x.agent||'')+(x.task?' · '+x.task:'')+' · '+tsText(x.t)));
      const pre=el('pre','tl-full',x.text); pre.style.whiteSpace='pre-wrap'; w.appendChild(pre); });
    if(u.inputsNext){ const more=el('button','btn ghost sm','더 보기'); more.onclick=()=>run(u.inputsNext); w.appendChild(more); }
  }
  return w;
}

// 설정: 알림 · 이름 · 보관 · 보존본 지우기
function teamSettings(t,d){
  const w=el('div','tlist'); const code=t.code;
  if(!t.archived){
    w.appendChild(el('div','tsec','🔔 알림 (앱을 닫아도 폰으로)'));
    const nf=d.notify||t.notify;
    if(!nf) w.appendChild(el('div','cwd','관리 세션이 없어 관제·알림이 아직 없습니다.'));
    else Object.keys(MON_NOTIFY_LABELS).forEach(k=>{
      const lab=el('label','tcheck'); const cb=el('input'); cb.type='checkbox';
      cb.checked=!!((k in nf)?nf[k]:MON_NOTIFY_DEFAULT[k]);
      cb.onchange=async()=>{ try{ const r=await T.api('POST','/api/owner/teams/'+encodeURIComponent(code)+'/notify',{body:{notify:{[k]:cb.checked}}});
          if(r&&r.error) throw new Error(r.error); d.notify=r.notify; t.notify=r.notify; toast('알림 설정 저장됨'); }
        catch(e){ cb.checked=!cb.checked; toast('저장 실패: '+teamErrText(e.message)); } };
      lab.appendChild(cb); lab.appendChild(document.createTextNode(' '+MON_NOTIFY_LABELS[k])); w.appendChild(lab);
    });
    w.appendChild(el('div','tsec','이름'));
    const sb=el('div','tsearch'); const nm=inputEl(t.name); const sv=el('button','btn sm','저장');
    sv.onclick=async()=>{ const v=nm.value.trim(); if(!v||v===t.name) return;
      try{ const r=await T.api('POST','/api/owner/teams/'+encodeURIComponent(code)+'/rename',{body:{name:v}});
        if(r&&r.error) throw new Error(r.error); toast('이름을 바꿨습니다'); reloadTeams(code); }
      catch(e){ toast('저장 실패: '+teamErrText(e.message)); } };
    sb.appendChild(nm); sb.appendChild(sv); w.appendChild(sb);
  }
  w.appendChild(el('div','tsec',t.archived?'보관된 팀':'팀 끝내기'));
  if(t.archived){
    w.appendChild(el('div','tnote','장부·이력은 그대로 남아 있습니다. 풀면 관제·알림이 다시 켜집니다.'));
    w.appendChild(teamRow('↩','보관 풀기','다시 목록·알림에 넣기 — 승인 필요',
      ()=>requestApproval('team_archive', {team:code, on:false}, ()=>{ toast('보관을 풀었습니다'); reloadTeams(code); })));
  } else {
    w.appendChild(teamRow('🗄','이 팀 보관','목록·알림에서 빼기(장부·이력은 그대로) — 승인 필요',
      ()=>requestApproval('team_archive', {team:code, on:true}, ()=>{ toast('보관했습니다'); TEAM_OPEN.delete(code); lsSet('sm_team_open',[...TEAM_OPEN]); reloadTeams(); })));
  }
  w.appendChild(teamRow('🧽','보존본 지우기','보존 원본·사람 입력·메시지 전문 삭제(일감·토큰 수는 남음) — 승인 필요',
    ()=>requestApproval('team_purge', {team:code}, ()=>{ toast('보존본을 지웠습니다'); reloadTeams(code); })));
  return w;
}

// ＋ 새 팀: 이름 · 관리 세션 · 구성원(세션·별칭·역할) → 승인 요청(team_create)
function newTeamForm(){
  const s=TEAM_NEW; const f=el('div','tform tnew');
  f.appendChild(el('div','tsec','＋ 새 팀'));
  const nm=inputEl(s.name); nm.placeholder='팀 이름(예: 포털 개발)'; nm.oninput=()=>{ s.name=nm.value; }; f.appendChild(field('이름', nm));
  f.appendChild(field('관리 세션', sessionSelect(s.mgr, new Set(s.members.map(m=>m.sid).filter(Boolean)), v=>{ s.mgr=v; teamRerender(); })));
  f.appendChild(el('div','tnote','관리 세션이 구성원에게 일을 나누고 결과를 받습니다(clewpath-workers 스킬).'));
  s.members.forEach((m,i)=>{
    const r=el('div','tmem');
    const others=new Set([s.mgr].concat(s.members.filter((_,j)=>j!==i).map(x=>x.sid)).filter(Boolean));
    r.appendChild(sessionSelect(m.sid, others, v=>{ m.sid=v; if(!m.alias) m.alias=sessTitleOf(v); teamRerender(); }));
    const a=inputEl(m.alias); a.placeholder='별칭'; a.oninput=()=>{ m.alias=a.value; }; r.appendChild(a);
    const rl=inputEl(m.role); rl.placeholder='역할'; rl.oninput=()=>{ m.role=rl.value; }; r.appendChild(rl);
    const x=el('button','tmini','✕'); x.title='빼기'; x.onclick=()=>{ s.members.splice(i,1); teamRerender(); }; r.appendChild(x);
    f.appendChild(r);
  });
  const add=el('button','tadd','＋ 구성원'); add.onclick=()=>{ s.members.push({sid:'', alias:'', role:''}); teamRerender(); }; f.appendChild(add);
  const acts=el('div','tacts');
  const no=el('button','btn ghost sm','취소'); no.onclick=()=>{ TEAM_NEW=null; teamRerender(); };
  const ok=el('button','btn sm','만들기(승인 요청)');
  ok.onclick=()=>{
    const name=String(s.name||'').trim();
    if(!name){ toast('팀 이름을 적으세요'); return; }
    if(!s.mgr){ toast('관리 세션을 고르세요'); return; }
    const members=s.members.filter(m=>m.sid&&String(m.alias||'').trim())
      .map(m=>({session_id:m.sid, alias:String(m.alias).trim(), role:String(m.role||'').trim()}));
    requestApproval('team_create', {name, manager_session:s.mgr, manager_alias:'관리', members},
      (r)=>{ TEAM_NEW=null; toast('팀을 만들었습니다'); if(r&&r.code){ TEAM_OPEN.add(r.code); lsSet('sm_team_open',[...TEAM_OPEN]); } reloadTeams(r&&r.code); });
  };
  acts.appendChild(no); acts.appendChild(ok); f.appendChild(acts);
  return f;
}

// opts.gid/name: 팀의 관제로 열었을 때 — 서버가 팀 구성원 변경을 밀어 준다(gid).
// 데스크톱 그룹 보기: 왼쪽 = 그룹 목록, 오른쪽(상세 칸) = 그 그룹 관제(2026-10-12 사장님). 폰은 전체 화면 오버레이 그대로.
let MON_INLINE=null;   // {gid, close}
function closeInlineMonitor(){ const m=MON_INLINE; MON_INLINE=null; if(m){ try{ m.close(); }catch(e){} } }
function monInlineWanted(){ return innerWidth>=880; }
function openMonitor(ids, manager, labels, opts){
  opts=opts||{};
  const inline=!!opts.inline;
  const ov=el('div','mon-ov'+(inline?' inline':'')); ov.id='mon-ov';
  const head=el('div','mon-head');
  head.appendChild(el('h3',null,opts.name?'🎬 '+opts.name:'🎬 오케스트레이션 관제'));
  const live=el('div','mon-live off'); live.appendChild(el('span','dot2'));
  const lt=el('span',null,'연결 중…'); live.appendChild(lt); head.appendChild(live);
  const vtoggle=el('button','mon-vtoggle','◨'); vtoggle.title='뷰어 패널 접기/펼치기'; head.appendChild(vtoggle);
  const x=el('button','x','✕'); head.appendChild(x);
  const legend=el('div','mon-legend');
  const fbar=el('div','mon-filter');   // 타임라인 필터(종류 + 세션별 숨김)
  // 분할: 좌 타임라인(bodyW) / 우 선택세션 뷰어(viewer)
  const split=el('div','mon-split');
  const bodyW=el('div','mon-body');
  bodyW.appendChild(el('div','mon-empty','이벤트를 기다리는 중… 세션에서 대화가 오가면 여기에 실시간으로 표시됩니다.'));
  const viewer=el('div','mon-viewer');
  const vhead=el('div','mon-vhead');
  const vwrap=el('div','mon-vbody');
  vwrap.appendChild(el('div','empty','위에서 세션을 클릭하면 여기에 그 세션 대화가 실시간으로 보입니다.'));
  viewer.appendChild(vhead); viewer.appendChild(vwrap);
  const rez=el('div','mon-resizer'); rez.title='드래그로 좌우 폭 조절 · 더블클릭 초기화';
  split.appendChild(bodyW); split.appendChild(rez); split.appendChild(viewer);
  ov.appendChild(head); ov.appendChild(legend); ov.appendChild(fbar); ov.appendChild(split);
  if(inline){
    const main=paneDetail();
    if(main.classList.contains('term-mode')) leaveTerminalView();
    closeLiveViewer(); CURRENT_TERM_SID=null;
    closeInlineMonitor(); main.classList.remove('term-mode','fb-mode'); main.innerHTML=''; main.classList.add('mon-mode');
    main.appendChild(ov); $('#head').textContent='관제'; showDetailPane();
  } else {
    const old=document.getElementById('mon-ov'); if(old&&old.classList.contains('inline')) closeInlineMonitor();
    document.body.appendChild(ov);
  }
  vtoggle.onclick=()=>{ const hid=viewer.classList.toggle('hide'); rez.classList.toggle('gone',hid); };
  // 좌우 폭 드래그 조절(저장·복원, 더블클릭 초기화). 폰(오버레이)은 CSS 로 숨김.
  (function(){
    const KEY='sm_monvw', saved=LS.getItem(KEY);
    if(saved){ viewer.style.width=saved; viewer.style.maxWidth='none'; }
    let drag=false;
    const ptX=e=>e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX;
    function move(e){ if(!drag)return; const r=split.getBoundingClientRect();
      let w=r.right-ptX(e); w=Math.max(240, Math.min(w, r.width-320));
      viewer.style.width=Math.round(w)+'px'; viewer.style.maxWidth='none'; e.preventDefault(); }
    function stop(){ if(!drag)return; drag=false; rez.classList.remove('dragging');
      document.body.classList.remove('col-resizing');
      if(viewer.style.width) LS.setItem(KEY,viewer.style.width);
      window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',stop);
      window.removeEventListener('touchmove',move); window.removeEventListener('touchend',stop); }
    function begin(e){ if(viewer.classList.contains('hide'))return; drag=true; rez.classList.add('dragging');
      document.body.classList.add('col-resizing');
      window.addEventListener('mousemove',move); window.addEventListener('mouseup',stop);
      window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',stop);
      e.preventDefault(); }
    rez.addEventListener('mousedown',begin); rez.addEventListener('touchstart',begin,{passive:false});
    rez.addEventListener('dblclick',()=>{ viewer.style.width=''; viewer.style.maxWidth=''; LS.removeItem(KEY); });
  })();

  const gmap={}; let lastSeq=0; let emptyShown=true;
  // 활성 그룹 상태(동적 추가/삭제 반영). sid -> {label,color,role}
  const group={};
  (ids||[]).forEach(sid=>{ group[sid]={label:(labels&&labels[sid])||sid.slice(0,8),
                                       color:null, role:(sid===manager?'manager':'sub')}; });
  if(labels) Object.keys(labels).forEach(sid=>{ gmap[sid]={label:labels[sid]}; });  // 호출선 라벨 선점

  // ---- 우측 뷰어(선택 세션 실시간) 상태 ----
  let selectedSid=null, autoFollow=false, lastActiveSid=null;
  let viewerPend={}, viewerLastTs='', selGen=0;
  const activity={};   // sid -> 미확인 활동 여부(자동추적 꺼짐일 때 범례 점)

  function renderVHead(){
    vhead.innerHTML='';
    const g=selectedSid&&group[selectedSid];
    const nm=el('span','vname', selectedSid?((g&&g.label)||selectedSid.slice(0,8)):'세션 미선택');
    if(g&&g.color) nm.style.color=g.color;
    vhead.appendChild(nm);
    const vlv=el('span','vlive '+(selectedSid?'on':'off')); vlv.appendChild(el('span','vdot'));
    vlv.appendChild(el('span',null,selectedSid?'● 실시간':'대기')); vhead.appendChild(vlv);
    const fl=el('label','mon-follow'); const cb=el('input'); cb.type='checkbox'; cb.checked=autoFollow;
    cb.onchange=()=>{ autoFollow=cb.checked; if(autoFollow&&lastActiveSid) selectSession(lastActiveSid); };
    fl.appendChild(cb); fl.appendChild(document.createTextNode('자동 추적'));
    vhead.appendChild(fl);
  }
  renderVHead();

  async function selectSession(sid){
    if(!sid || sid===selectedSid) return;
    selectedSid=sid; delete activity[sid]; const gen=++selGen;
    renderLegend(); renderVHead();
    viewerPend={}; viewerLastTs='';
    vwrap.innerHTML=''; vwrap.appendChild(el('div','spin'));
    try{
      const msgs=await fetchRecentMessages(sid,200);
      if(gen!==selGen) return;   // 그새 다른 세션 선택됨(경쟁 방지)
      vwrap.innerHTML='';
      if(!msgs.length) vwrap.appendChild(el('div','empty','표시할 대화 없음'));
      for(const mm of msgs){ renderHistoryMsg(vwrap,mm,viewerPend);
        if(mm.timestamp&&mm.timestamp>viewerLastTs) viewerLastTs=mm.timestamp; }
      vwrap.scrollTop=vwrap.scrollHeight;
    }catch(e){ if(gen===selGen){ vwrap.innerHTML=''; vwrap.appendChild(el('div','empty','뷰어 실패: '+e.message)); } }
  }

  function feedRight(ev){
    lastActiveSid=ev.session_id;
    if(!selectedSid){ selectSession(ev.session_id); return; }   // 최초 이벤트 자동 선택
    if(autoFollow && ev.session_id!==selectedSid){ selectSession(ev.session_id); return; }
    if(ev.session_id===selectedSid){
      if(ev.ts && viewerLastTs && ev.ts<=viewerLastTs) return;   // 스냅샷 중복 제거
      if(ev.ts) viewerLastTs=ev.ts;
      const stick=vwrap.scrollHeight-vwrap.scrollTop-vwrap.clientHeight<120;
      renderHistoryMsg(vwrap, ev, viewerPend);
      if(stick) vwrap.scrollTop=vwrap.scrollHeight;
    } else if(group[ev.session_id]){   // 비선택 세션 활동 → 범례에 활동 점
      if(!activity[ev.session_id]){ activity[ev.session_id]=true; renderLegend(); }
    }
  }

  let handle=null;
  // ---- 타임라인 필터: 종류 단일 선택 + 세션별 숨김. 행은 렌더 시 data-sid·종류 클래스를 갖고,
  //      필터는 .fhid 토글만 한다(재렌더 없음). 우측 뷰어·자동 추적·활동점은 필터와 무관(표시만 거름).
  let fKind='all'; const fHide=new Set(); let fTotal=0, fShown=0;
  const F_KINDS=[['all','전체'],['call','→ 호출선'],['text','💬 대화'],['err','⚠ 오류']];
  const rowMatches=(row)=>{
    if(fHide.has(row.dataset.sid)) return false;
    return fKind==='all' || row.classList.contains('has-'+fKind);
  };
  const fcount=el('span','fcount');
  function renderFilterCount(){ fcount.textContent=(fKind!=='all'||fHide.size)?`표시 ${fShown} / 전체 ${fTotal}`:`전체 ${fTotal}`; }
  function applyFilter(){
    const stick=nearBottom();
    fShown=0;
    for(const row of bodyW.children){ if(!row.classList.contains('mrow')) continue;
      const ok=rowMatches(row); row.classList.toggle('fhid',!ok); if(ok) fShown++; }
    renderFilterCount();
    if(stick) bodyW.scrollTop=bodyW.scrollHeight;
  }
  function renderFilterBar(){
    fbar.innerHTML='';
    F_KINDS.forEach(([k,label])=>{
      const b=el('button','fchip'+(fKind===k?' on':''),label); b.title='이 종류의 이벤트만 표시';
      b.onclick=()=>{ fKind=k; renderFilterBar(); applyFilter(); };
      fbar.appendChild(b);
    });
    const sids=Object.keys(group);
    if(sids.length){ fbar.appendChild(el('span','fsep')); }
    sids.forEach(sid=>{
      const g=group[sid]; const hid=fHide.has(sid);
      const b=el('button','fchip'+(hid?' off':'')); b.title=hid?'이 세션 다시 표시':'이 세션 숨기기';
      const dot=el('span','ldot'); dot.style.background=g.color||'var(--muted)'; b.appendChild(dot);
      b.appendChild(document.createTextNode((hid?'':'👁 ')+(g.role==='manager'?'★ ':'')+(g.label||sid.slice(0,8))));
      b.onclick=()=>{ if(hid) fHide.delete(sid); else fHide.add(sid); renderFilterBar(); applyFilter(); };
      fbar.appendChild(b);
    });
    fbar.appendChild(fcount); renderFilterCount();
  }
  function renderLegend(){
    legend.innerHTML='';
    Object.keys(group).forEach(sid=>{
      const g=group[sid];
      const chip=el('span','lchip'+(sid===selectedSid?' sel':''));
      const dot=el('span','ldot'); dot.style.background=g.color||'var(--muted)'; chip.appendChild(dot);
      chip.appendChild(el('span',null,(g.role==='manager'?'★ ':'')+(g.label||sid.slice(0,8))));
      if(activity[sid]&&sid!==selectedSid) chip.appendChild(el('span','lact'));   // 미확인 활동
      const rm=el('span','lx','×'); rm.title='관전에서 제거';
      rm.onclick=(e)=>{ e.stopPropagation(); if(handle){ handle.remove(sid); } };
      chip.appendChild(rm);
      chip.onclick=()=>selectSession(sid);   // 클릭 → 우측 뷰어 대상
      legend.appendChild(chip);
    });
    const add=el('button','ladd','+ 세션 추가');
    add.onclick=()=>showAddSessionPicker(group, sid=>{ if(handle) handle.add(sid,'sub'); });
    legend.appendChild(add);
    renderFilterBar();   // 세션 집합·색·라벨 변동을 필터 토글에도 반영
  }
  renderLegend();
  // 구성원의 정본은 팀(팀 통합 U7, 2026-10-13) — 관제 중 ＋ 세션 추가는 이번 관전에만, 저장은 팀 칸의 ＋ 구성원 추가로
  const fmtT=(ts)=>{ try{ return ts?new Date(ts).toLocaleTimeString():''; }catch(e){ return ''; } };
  const nearBottom=()=> bodyW.scrollHeight-bodyW.scrollTop-bodyW.clientHeight < 90;
  const setLive=(on,txt)=>{ live.className='mon-live '+(on?'on':'off'); lt.textContent=txt; };

  function renderEvent(ev){
    if(ev.seq!=null){ if(ev.seq<=lastSeq) return; lastSeq=ev.seq; }
    if(emptyShown){ bodyW.innerHTML=''; emptyShown=false; }
    gmap[ev.session_id]={label:ev.session_label,color:ev.color};
    if(group[ev.session_id]){ const g=group[ev.session_id];
      if(!g.color&&ev.color){ g.color=ev.color; g.label=ev.session_label||g.label; renderLegend(); } }
    const row=el('div','mrow'+(ev.session_role==='sub'?' sub':''));
    row.style.cursor='pointer'; row.onclick=()=>selectSession(ev.session_id);   // 행 클릭 → 뷰어
    if(ev.color) row.style.borderLeftColor=ev.color;
    // 필터용 표식: 세션 + 종류(호출선/대화/도구/오류). 필터는 이 표식만 보고 .fhid 를 토글한다.
    row.dataset.sid=ev.session_id;
    if((ev.calls_out||[]).length) row.classList.add('has-call');
    if(ev.text) row.classList.add('has-text');
    if((ev.tools||[]).length) row.classList.add('has-tool');
    if((ev.tool_results||[]).some(r=>r.is_error)) row.classList.add('has-err');
    fTotal++; if(rowMatches(row)) fShown++; else row.classList.add('fhid');
    renderFilterCount();
    const h=el('div','mrow-h');
    const lab=el('span','mlab',ev.session_label||ev.session_id.slice(0,8)); if(ev.color)lab.style.color=ev.color;
    h.appendChild(lab);
    if(ev.role) h.appendChild(el('span','mtool',ev.role));
    if(ev.from_peer){   // 다른 세션이 SendMessage 로 보낸 일감(v0.9.0 워커 방식) — 발신자 표시
      const fp=el('span','mcall'); fp.appendChild(el('b',null,'📨 '+ev.from_peer)); fp.title='SendMessage 로 받은 메시지'; h.appendChild(fp); }
    h.appendChild(el('span','mtime',fmtT(ev.ts)));
    row.appendChild(h);
    (ev.calls_out||[]).forEach(c=>{
      const tl=(gmap[c.target_session_id]&&gmap[c.target_session_id].label)||c.target_session_id.slice(0,8);
      const call=el('div','mcall'); call.appendChild(el('b',null,(c.via==='message'?'✉ → ':'→ ')+tl));
      if(c.via==='message') call.title='SendMessage 로 보낸 일감';
      if(c.prompt) call.appendChild(el('span',null,'“'+c.prompt+'”'));
      row.appendChild(call);
    });
    if(ev.text){ row.appendChild(el('div','mtext',ev.text.length>1200?ev.text.slice(0,1200)+'…':ev.text)); }
    (ev.tools||[]).forEach(nm=>row.appendChild(el('span','mtool','⚙ '+nm)));
    (ev.tool_results||[]).forEach(r=>{ if(r.text){ row.appendChild(el('div','mres',
      (r.is_error?'⚠ ':'↳ ')+(r.text.length>400?r.text.slice(0,400)+'…':r.text))); } });
    bodyW.appendChild(row);
    feedRight(ev);   // 우측 뷰어에도 반영(선택/자동추적/활동점)
  }

  function onMsg(dataStr, eof, error){
    if(eof){ setLive(false, error?('종료: '+error):'연결 종료'); return; }
    let m; try{ m=JSON.parse(dataStr); }catch(e){ return; }
    if(m.type==='heartbeat'){ setLive(true,'● live'); return; }
    if(m.type==='error'){ setLive(false,'오류: '+(m.error||'')); toast('관제 오류: '+(m.error||'')); return; }
    if(m.type==='group'){
      if(m.action==='add' && m.session_id && !group[m.session_id]){
        const nm=(SESSIONS.find(s=>s.session_id===m.session_id)||{});
        group[m.session_id]={label:(nm.title||nm.label_name||nm.slug||m.session_id.slice(0,8)),
                             color:null, role:'sub'};
        renderLegend(); toast(m.origin==='sync'?'팀 구성원 추가됨':'세션 추가됨');
      } else if(m.action==='remove' && m.session_id){
        delete group[m.session_id]; delete activity[m.session_id];
        if(selectedSid===m.session_id){ selectedSid=null; renderVHead();
          vwrap.innerHTML=''; vwrap.appendChild(el('div','empty','세션이 제거되었습니다. 다른 세션을 선택하세요.')); }
        renderLegend(); toast('세션 제거됨');
      }
      return;
    }
    if(m.type==='snapshot'||m.type==='events'){
      const stick=nearBottom();
      (m.events||[]).forEach(renderEvent);
      setLive(true,'● live');
      if(stick) bodyW.scrollTop=bodyW.scrollHeight;
    }
  }

  try{ handle=T.monitor(ids.join(','), manager, onMsg, opts.gid||null); }
  catch(e){ setLive(false,'연결 실패'); toast('관제 연결 실패: '+e.message); }
  const shut=()=>{ try{ handle&&handle.close(); }catch(e){} };
  if(inline){
    MON_INLINE={gid:opts.gid||null, close:shut};
    x.title='관제 닫기';
    x.onclick=()=>{ closeInlineMonitor(); paneDetail().classList.remove('mon-mode'); detailPlaceholder('왼쪽에서 팀을 고르세요');
      highlightGroup(null); };
    highlightGroup(opts.gid||null);
  } else x.onclick=()=>{ shut(); ov.remove(); };
}

function field(label,inp){ const f=el('div','field'); f.appendChild(el('label',null,label)); f.appendChild(inp); return f; }
function inputEl(val){ const i=el('input'); i.value=(val==null?'':val); return i; }
function askOtp(){ const c=prompt('2차 인증 코드 (인증앱 6자리):'); if(c==null)return null; return (c||'').trim(); }
// 특권(in-place/터미널) 자격 확보: 유효 grace 있으면 코드 없이, 없으면 OTP 1회 → grace 캐시.
// 반환 {grace} / {} (로컬) / null(취소·실패)
async function ensurePriv(){
  if(MODE!=='relay') return {};
  let st; try{ st=await T.api('GET','/api/owner/2fa/status'); }catch(e){ st={required:false}; }
  if(!st.required) return {};   // 2FA 꺼짐 → 코드 불필요
  let g=null; try{ g=JSON.parse(LS.getItem('sm_grace')||'null'); }catch(e){}
  if(g&&g.exp&&g.exp*1000>Date.now()+5000) return {grace:g.grace};
  const otp=askOtp(); if(otp==null) return null;
  try{ const r=await T.grant(otp); if(r&&r.grace)LS.setItem('sm_grace',JSON.stringify(r));
    return {grace:r&&r.grace}; }
  catch(e){ toast('인증 실패: '+otpErrMsg(e.message)); return null; }
}
function clearGrace(){ LS.removeItem('sm_grace'); }
function otpErrMsg(err){ return err==='2fa_invalid'?'2차 인증 실패(코드 불일치/만료)'
  :err==='2fa_required'?'2차 인증 미설정 — PC에서 🔒 보안에서 먼저 설정하세요':(err||''); }

// ---- 보안(2차 인증) 켜기/끄기/설정 ----
async function showSecurity(){
  let st; try{ st=await T.api('GET','/api/owner/2fa/status'); }catch(e){ st={required:false,has_secret:false}; }
  const body=el('div');
  const line=(t)=>body.appendChild(el('div','cwd',t));
  line('2차 인증(TOTP): '+(st.required?'켜짐 ✅':'꺼짐 ⚠'));
  line(st.required
    ? '외부에서 in-place 재개·터미널(실제 세션 조작)에 인증앱 6자리 코드가 필요합니다. 한 번 인증하면 일정 시간 이 기기를 신뢰합니다.'
    : '외부에서 in-place 재개·터미널이 코드 없이 릴레이 토큰만으로 가능합니다(보안 약함). 켜는 것을 권장합니다.');
  // grace(기기 신뢰) 상태 + 해제
  let gr=null; try{ gr=JSON.parse(LS.getItem('sm_grace')||'null'); }catch(e){}
  if(st.required && gr&&gr.exp&&gr.exp*1000>Date.now()){
    const mins=Math.round((gr.exp*1000-Date.now())/60000);
    line('이 기기 인증 유지 중 — 약 '+(mins>=60?Math.round(mins/60)+'시간':mins+'분')+' 남음');
    const unlock=el('button','btn ghost','🔓 이 기기 인증 해제'); unlock.style.marginTop='8px';
    unlock.onclick=()=>{ clearGrace(); toast('인증 해제됨'); closeModal(); };
    body.appendChild(unlock);
  }
  if(MODE!=='local'){
    line('켜기/끄기·설정 변경은 이 PC(로컬 127.0.0.1)에서만 가능합니다.');
    openModal('🔒 보안 · 2차 인증', body); return;
  }
  // ---- 로컬: 설정(QR) 표시 ----
  const doProvision=async()=>{
    try{
      const r=await T.api('POST','/api/owner/2fa/provision',{body:{}});
      body.innerHTML='';
      body.appendChild(el('div','cwd','2차 인증이 켜졌습니다. 인증앱(Google Authenticator·Authy 등)으로 QR을 스캔하거나 비밀키를 입력하세요. 창을 닫으면 다시 볼 수 없습니다:'));
      if(r.qr_svg){ const qb=el('div','qrbox'); const im=document.createElement('img');
        im.src=r.qr_svg; im.alt='2FA QR'; qb.appendChild(im); body.appendChild(qb); }
      body.appendChild(field('비밀키 (수동 입력용)', inputEl(r.secret)));
      body.appendChild(field('otpauth URI', inputEl(r.otpauth)));
    }catch(e){ toast('설정 실패: '+e.message); }
  };
  const toggle=async(on)=>{
    try{ await T.api('POST','/api/owner/2fa/toggle',{body:{on}}); toast(on?'2FA 켜짐':'2FA 꺼짐'); showSecurity(); }
    catch(e){ if(e.status===409){ doProvision(); } else toast('실패: '+e.message); }
  };
  const foot=[];
  if(st.required){
    const off=el('button','btn ghost','2FA 끄기'); off.onclick=()=>{
      if(confirm('2차 인증을 끄면 외부에서 코드 없이 실제 세션 조작이 가능해집니다. 계속?')) toggle(false); };
    const re=el('button','btn','QR 재설정'); re.onclick=doProvision;
    foot.push(off, re);
  }else if(st.has_secret){
    const on=el('button','btn','2FA 켜기'); on.onclick=()=>toggle(true);
    const re=el('button','btn ghost','새 QR로 설정'); re.onclick=doProvision;
    foot.push(re, on);
  }else{
    const setup=el('button','btn','2FA 설정(켜기)'); setup.onclick=doProvision;
    foot.push(setup);
  }
  openModal('🔒 보안 · 2차 인증', body, foot);
}

// ---- 외부 접속 기기(조회/등록/삭제) — 로컬 전용. 기기 인증은 항상 켜짐(끌 수 없음) ----
function relTs(sec){ if(!sec)return '미접속';
  const d=Date.now()/1000-sec; if(d<60)return '방금'; if(d<3600)return Math.floor(d/60)+'분 전';
  if(d<86400)return Math.floor(d/3600)+'시간 전'; return Math.floor(d/86400)+'일 전'; }
async function showDevices(){
  let st; try{ st=await T.api('GET','/api/owner/devices'); }catch(e){ toast('기기 목록 실패: '+e.message); return; }
  const body=el('div');
  const active=st.active|0, total=st.total|0;
  // 🩺 진단 한 줄(B-10). CP 동기화 시각은 0.11.0(meta.cp_synced)에서 붙는다.
  const synced=st.cp_synced?(' · CP 동기화 '+relTs(st.cp_synced)):'';
  body.appendChild(el('div','diag','🩺 활성 '+active+' · 총 '+total+((st.phone_revoked|0)?(' · 📵 '+st.phone_revoked):'')+synced
    +(active?'':' · 🛑 외부 접속 전면 차단중(등록 기기 없음)')));
  body.appendChild(el('div','cwd','등록된 기기만 외부에서 접속할 수 있습니다. 페어링을 해제하면 다음 요청부터 차단되고 열린 연결도 끊깁니다 — 이 보호는 끌 수 없습니다.'));
  const list=el('div'); list.style.marginTop='8px';
  (st.devices||[]).forEach(d=>{
    // 칩은 행당 1개(우선순위 📵 > 🔗). 📵/⏳/💤 는 0.11.0 에서 서버 상태로 채워진다.
    // 행당 칩 1개, 우선순위 📵 > ⏳ > 🔗 > 💤 (DR-6)
    const stale=!d.revoked && d.last_seen && (Date.now()/1000 - d.last_seen) > 90*86400;
    // 삭제를 누른 행(delete_pending)은 📵 보다 ⏳ 가 먼저 — 눌렀는데 그대로인 것처럼 보이지 않게
    const chip = (d.delete_pending||d.cp_pending) ? {icon:'⏳', text:'삭제 대기', tone:'warn'}
               : (d.revoked && d.revoked_by==='phone') ? {icon:'📵', text:'폰에서 해제함', tone:'crit'}
               : d.revoked ? {icon:'📵', text:'해제됨', tone:'muted'}
               : (!d.client_scoped ? {icon:'🔗', text:'공유 자격(구형)', tone:'warn', dimtext:true}
               : (stale ? {icon:'💤', text:'90일 미접속', tone:'muted'} : null));
    const btns=[];
    if(!d.revoked){
      const re=el('button','btn ghost sm','QR 다시 만들기'); re.onclick=()=>reissueDevice(d); btns.push(re);
      const un=el('button','btn ghost sm','페어링 해제'); un.onclick=()=>deleteDevice(d); btns.push(un);
    }else{
      const del=el('button','btn ghost sm','삭제'); del._keep=true; del.onclick=()=>deleteDevice(d); btns.push(del);
    }
    list.appendChild(pairRow({name:d.name, id:d.id, chip, off:!!d.revoked, buttons:btns,
      meta:[d.last_seen?('최근 '+relTs(d.last_seen)):'미접속', (!d.client_scoped&&!d.revoked)?'QR 다시 만들기 권장':null,
            stale?'오래 안 쓴 기기면 페어링 해제 권장':null, (d.delete_pending||d.cp_pending)?'서버 폐기 확인되면 사라짐':null]}));
  });
  if(!(st.devices||[]).length) list.appendChild(el('div','cwd','아직 페어링된 기기가 없습니다 — 폰으로 QR 을 찍으면 여기 나타납니다.'));
  body.appendChild(list);
  const add=el('button','btn','＋ 기기 추가'); add.onclick=addDevice;
  openModal('📱 페어링된 기기', body, [add]);
}
function deleteDevice(d){
  return confirmSheet({title:'페어링 해제', main:'"'+d.name+'" 기기의 페어링을 해제할까요?',
    sub:'이 기기의 접속 자격이 무효가 되고 열린 연결도 즉시 끊깁니다. 다시 쓰려면 새 QR 로 페어링해야 합니다.',
    action:'페어링 해제', danger:true, busyText:'해제 중…',
    run: async()=>{ const r=await T.api('POST','/api/owner/devices/'+d.id+'/delete',{body:{}}); d._pending=!!(r&&r.pending); }})
    .then(ok=>{ if(ok){ toast(d._pending?'서버 폐기 확인을 기다리는 중 — 확인되면 목록에서 사라집니다(최대 5분)':'페어링 해제됨'); showDevices(); } });
}
async function copyText(t){
  // 127.0.0.1/https 는 보안 컨텍스트라 clipboard API 사용 가능. 실패 시 구식 방법으로 폴백.
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{
      const ta=document.createElement('textarea');
      ta.value=t; ta.style.cssText='position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      const ok=document.execCommand('copy'); ta.remove(); return ok;
    }catch(_){ return false; }
  }
}
function fieldWithCopy(label, value){
  const f=el('div','field');
  f.appendChild(el('label',null,label));
  const row=el('div'); row.style.cssText='display:flex;gap:6px;align-items:stretch';
  const inp=inputEl(value); inp.readOnly=true; inp.style.flex='1';
  inp.onclick=()=>inp.select();
  const btn=el('button','btn ghost sm','📋 복사'); btn.style.flex='none';
  btn.onclick=async()=>{
    const ok=await copyText(value);
    btn.textContent = ok ? '✓ 복사됨' : '복사 실패';
    if(ok) toast('클립보드에 복사됨');
    setTimeout(()=>{ btn.textContent='📋 복사'; }, 1800);
  };
  row.appendChild(inp); row.appendChild(btn);
  f.appendChild(row);
  return f;
}
// QR 모달이 열린 동안 등록부만 3초마다 폴링(CP 무접촉) → 이 QR 로 만든 기기가 발급 시각 이후 접속하면 ✅ 로 교체(design DR-11).
function pairingSeen(rows, id, issuedAt){
  return (rows||[]).some(d=>d && d.id===id && d.last_seen && d.last_seen>=issuedAt);
}
function watchPairing(body, id, issuedAt){
  if(!id) return null;
  let done=false;
  const stop=()=>{ done=true; clearInterval(t); };
  const t=setInterval(async()=>{
    if(done) return;
    if(!$('#overlay') || body.isConnected===false){ stop(); return; }      // 모달 닫힘 → 폴링 중단
    let st=null; try{ st=await T.api('GET','/api/owner/devices'); }catch(e){ return; }
    if(done) return;                                                     // 늦게 도착한 응답은 버린다
    const rows=(st&&st.devices)||[];
    if(!pairingSeen(rows, id, issuedAt)) return;
    stop();
    const d=rows.find(x=>x.id===id)||{};
    const nm=(d.name&&!/^[0-9a-f]{8}$/.test(d.name))?d.name:'';
    body.innerHTML='';
    const ok=el('div',null,'✅'); ok.style.cssText='font-size:2.4rem;text-align:center;margin:8px 0';
    body.appendChild(ok);
    body.appendChild(el('div','sheet-main', nm?('"'+nm+'" 연결됨'):'기기 연결됨 · 이름 확인 중…')).style.textAlign='center';
    body.appendChild(el('div','cwd','이 창을 닫고 📱 목록에서 확인하세요.'));
    const x=el('button','btn','닫기'); x.style.marginTop='10px'; x.onclick=()=>{ closeModal(); showDevices(); };
    body.appendChild(x);
  }, 3000);
  return stop;
}
function showPairResult(body, r, title){
  body.innerHTML='';
  watchPairing(body, r&&r.id, Math.floor(Date.now()/1000)-2);
  body.appendChild(el('div','cwd','폰 카메라로 이 QR 을 스캔하면 앱이 열리며 자동 페어링됩니다. 창을 닫으면 다시 볼 수 없습니다(필요하면 🔄 QR 로 다시 만드세요):'));
  if(r.qr_svg){ const qb=el('div','qrbox'); const im=document.createElement('img');
    im.src=r.qr_svg; im.alt='pair QR'; qb.appendChild(im); body.appendChild(qb); }
  if(r.pair_url){ body.appendChild(fieldWithCopy('페어링 링크(외부 PC 는 이걸 붙여넣기)', r.pair_url)); }
  else { body.appendChild(el('div','cwd','⚠ 공개 앱 주소(SM_APP_URL) 미설정 → 링크 생성 불가. 앱에 아래 값을 수동 입력하세요:'));
    body.appendChild(field('room', inputEl(r.room||'')));
    body.appendChild(field('기기 토큰(dev)', inputEl(r.token))); }
  if(r.client_scoped===false)
    body.appendChild(el('div','cwd','⚠ 기기 전용 자격 발급에 실패해 공유 토큰 방식으로 만들어졌습니다(컨트롤플레인 확인 필요).'));
}

async function reissueDevice(d){
  const ok=await confirmSheet({title:'QR 다시 만들기', main:'"'+d.name+'" 의 QR 을 다시 만들까요?',

async function addDevice(){
  // 이름 입력 없이 바로 QR(B-1): 이름은 폰이 접속하면 스스로 채워진다. CP 연결 실패(503)면 행이 안 생기고 다시 시도.
  const body=el('div'); body.appendChild(el('div','cwd','QR 을 만드는 중…'));
  openModal('＋ 기기 추가', body);
  try{
    const r=await T.api('POST','/api/owner/devices',{body:{name:''}});
    showPairResult(body, r);
    body.appendChild(el('div','cwd','이름은 폰이 접속하면 채워집니다(나중에 ✎ 로 바꿀 수 있습니다).'));

// ---- 2패널 폭 드래그 조절(데스크톱) ----
(function initResizer(){
  const rz=$('#resizer'), main=$('#main'); if(!rz||!main)return;
  const KEY='sm_listw', MINL=260, MIND=380;
  const saved=LS.getItem(KEY); if(saved)main.style.setProperty('--list-w',saved);
  let dragging=false;
  function ptX(e){ return e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX; }
  function onMove(e){ if(!dragging)return;
    const rect=main.getBoundingClientRect();
    let w=ptX(e)-rect.left;
    w=Math.max(MINL, Math.min(w, rect.width-MIND-7));   // 7px = 구분선 폭
    main.style.setProperty('--list-w', Math.round(w)+'px');
    e.preventDefault();
  }
  function stop(){ if(!dragging)return; dragging=false;
    rz.classList.remove('dragging'); document.body.classList.remove('col-resizing');
    const v=main.style.getPropertyValue('--list-w'); if(v)LS.setItem(KEY,v.trim());
    window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',stop);
    window.removeEventListener('touchmove',onMove); window.removeEventListener('touchend',stop);
  }
  function start(e){ dragging=true; rz.classList.add('dragging');
    document.body.classList.add('col-resizing');
    window.addEventListener('mousemove',onMove); window.addEventListener('mouseup',stop);
    window.addEventListener('touchmove',onMove,{passive:false}); window.addEventListener('touchend',stop);
    e.preventDefault();
  }
  rz.addEventListener('mousedown',start);
  rz.addEventListener('touchstart',start,{passive:false});
  rz.addEventListener('dblclick',()=>{ main.style.removeProperty('--list-w'); LS.removeItem(KEY); });
})();

const PAIR_KEYS_ACTIVE=['sm_room','sm_token','sm_cs','sm_cp','sm_devtoken','sm_cjwt','sm_grace'];
const PAIR_KEYS_ALL=PAIR_KEYS_ACTIVE.concat(['sm_pcs','sm_hint_done']);

  (all?PAIR_KEYS_ALL:PAIR_KEYS_ACTIVE).forEach(k=>LS.removeItem(k));

// 폰 쪽 해제 2종(B-3/DR-2): 행 단위 = unpairPc(이 PC 페어링 해제), 기기 단위 = resetDevice(이 기기 초기화).
// 0.10.0: 폰에서 해제는 로컬 제거뿐 → 부 문장이 정직하게 알린다(E-D4). 0.11.0 이 self-revoke 를 붙이면

function pairSituationText(){

// ---- E-2 '앱에서 열기'(design DR-8): 릴레이 웹(브리지 앱 아님) + 모바일 UA + 페어링 fragment 가 있는 첫 진입에만.
let PAIR_FRAG='';
function e2Available(ua){
  if(!PAIR_FRAG) return false;
  try{ if(window.ClewBridge&&ClewBridge.isApp()) return false; }catch(e){}
  return /iPhone|iPad|Android/.test(ua||navigator.userAgent||'');
}
function e2Url(){
  const base=location.pathname.replace(/\/(app|index\.html)\/?$/,'').replace(/\/$/,'');
  return 'clewpath://pair?relay='+encodeURIComponent(location.host+base)+'#'+PAIR_FRAG;
}
function renderE2Button(){
  const host=$('#p-e2'); if(!host) return; host.innerHTML='';
  if(!e2Available()) return;
  const b=el('button','btn ghost','앱에서 열기'); const note=el('div','cwd'); note.hidden=true;
  b.onclick=()=>{
    // 앱이 열리면 이 페이지는 숨겨진다(visibilitychange/pagehide) → 안내 타이머 취소. 2초 뒤에도 그대로면 웹으로 계속.
    let gone=false; const onHide=()=>{ gone=true; };
    try{ document.addEventListener('visibilitychange', onHide, {once:true}); window.addEventListener('pagehide', onHide, {once:true}); }catch(e){}
    try{ location.href=e2Url(); }catch(e){}
    setTimeout(()=>{ if(gone||document.hidden) return;
      note.hidden=false; note.textContent='앱이 열리지 않았나요? 앱이 없으면 이 화면(웹)에서 그대로 계속 쓸 수 있습니다.'; }, 2000);
  };
  host.appendChild(b); host.appendChild(note);
}
// ---- iOS Safari 탭 안내(design DR-12, eng E-D21): 홈 화면 미설치 Safari 는 7일 미사용 시 저장소를 지운다.
function iosHintNeeded(ua, standalone, isApp){
  ua=ua||navigator.userAgent||'';
  if(isApp) return false;
  if(!/iPhone|iPad/.test(ua) || !/Safari/.test(ua)) return false;
  if(/CriOS|FxiOS|EdgiOS|KAKAOTALK|Instagram|FBAN|FBAV|Line\//i.test(ua)) return false;   // 인앱·타 브라우저는 제외
  return !standalone;
}
function maybeShowIosHint(){
  try{
    if(MODE!=='relay' || LS.getItem('sm_hint_ios')==='1') return;
    const isApp=!!(window.ClewBridge&&ClewBridge.isApp());
    if(!iosHintNeeded(navigator.userAgent, !!navigator.standalone, isApp)) return;
    const host=$('#paneList'); if(!host || $('#ios-hint')) return;
    const b=el('div','firstrun'); b.id='ios-hint';
    b.innerHTML='<b>홈 화면에 추가해 앱처럼 열어보세요.</b> Safari 탭은 오래 안 쓰면 페어링이 지워질 수 있습니다.';

// 서버까지 해제되는 PC 인가: 기기 자격(cs/cp)이 있고 Host 가 0.11.0 규약(pv≥2)을 안다(E-D17). 아니면 '이 폰에서만'.
function serverUnpairable(pc){ return !!(pc&&pc.cs&&pc.cp&&(pc.pv|0)>=2); }
function unpairPc(room){
  const pc=pcsLoad().find(x=>x.room===room); const name=pc?pcName(pc):room;
  const full=serverUnpairable(pc);
  return confirmSheet({title:'이 PC 페어링 해제', main:'"'+name+'" 의 페어링을 해제할까요?',
    sub: full ? '이 폰의 접속 자격을 서버에서 폐기하고 PC 의 기기 목록에도 📵 로 표시됩니다(오프라인이면 다음 접속 때 처리).'
              : UNPAIR_SUB_LOCAL,
    action:'페어링 해제', danger:true, busyText:'해제 중…',
    run: async()=>{
      const cur=LS.getItem('sm_room')===room;
      await revokeEnqueue(pc);                               // ① 재시도 자료를 먼저 영속화(E-D18)
      if(cur && full){                                       // ② 연결돼 있으면 PC 에 바로 알림(📵 즉시 반영)
        try{ await Promise.race([conn.req('bye_device',{}), new Promise(r=>setTimeout(r,2000))]); }catch(e){}
      }
      pcsRemove(room);                                       // ③ 로컬 제거
      let fl={done:[]}; try{ fl=await Promise.race([revokeFlush(), new Promise(r=>setTimeout(()=>r({done:[]}),5000))]); }catch(e){}
      const serverDone=full && (fl.done||[]).includes(room);
      pc && (pc._unpairResult=serverDone);
      if(!cur) return;
      // 현재 PC 였으면: 다른 PC 가 있으면 최근 것으로 전환, 없으면 #pair(상황 줄)로.
      clearPairing(false);
      const next=pcsLoad().sort((a,b)=>(b.last||0)-(a.last||0))[0];
      if(next){ pcsActivate(next.room); }
      else { setPairReason(serverDone?'unpaired_server':'unpaired', name); }
      setTimeout(()=>location.reload(), 300);
    }}).then(ok=>{
      if(ok) toast(pc&&pc._unpairResult ? '"'+name+'" 페어링 해제됨(서버 폐기 완료)'
                 : full ? '"'+name+'" 이 폰에서 제거함 — 서버 폐기는 다음 접속 때 다시 시도'
                        : '"'+name+'" 이 폰에서 제거함 — PC 에서도 기기를 삭제하세요');
      return ok; });
}

  const n=pcsLoad().length;

// ---- 앱 전용: 네이티브 QR 스캔 → 페어링 링크 처리(브리지 캡슐화: 앱 여부는 브리지 함수 유무로만 안다) ----
function appScanAvailable(){ const B=window.ClewBridge; return !!(B&&B.scanQr&&B.pairFromUrl); }
async function appScanPair(){
  if(!appScanAvailable()) return false;
  const B=window.ClewBridge;
  let v='';
  try{ v=await B.scanQr(); }
  catch(e){                                              // 취소는 '' 로 오고, 여기는 진짜 실패 — 이유를 보인다
    const m=String((e&&e.message)||e||'');
    toast(/unavailable|not implemented|UNIMPLEMENTED/i.test(m)
      ? 'QR 스캐너를 열 수 없습니다 — 앱을 최신 빌드로 업데이트하거나, 카메라 앱으로 QR 을 찍으세요'
      : /permission|denied|authoriz|camera access|BARC-0007/i.test(m)
        ? '카메라 권한이 필요합니다 — 설정 → ClewPath → 카메라를 켜세요'
        : 'QR 스캔 실패: '+m);
    return false;
  }
  if(!v) return false;                                   // 사용자가 취소 — 조용히
  const r=B.pairFromUrl(v);                              // 'ok' 면 리로드로 이어진다(부트 파서가 PC 추가)
  if(r!=='ok') toast(B.pairErrorText(r)||'링크를 인식하지 못했습니다');
  return r==='ok';
}

function teamEventText(e){
  const p=e.payload||{};
  if(e.kind==='msg'||e.kind==='msg_in'){ const cw=p.cw||{}; const first=String(p.body||'').split('\n')[0];
    return (cw.type?cw.type+' ':'')+(cw.thread?'['+cw.thread+'] ':'')+first; }
  if(e.kind==='human_input'||e.kind==='prompt_in') return String(p.text||'').slice(0,200);
  if(e.kind==='submitted'){ const ev=p.evidence||{}; return '산출물 '+((ev.artifacts||[]).length)+'개'+(p.note?' · '+p.note:''); }
  if(e.kind==='violation') return (p.rule||'')+(p.thread?' · '+p.thread:'');
  if(e.kind==='msg_failed') return String(p.error||'').slice(0,120);
  return p.note||p.goal||'';
}

  delegate:'일감 위임', task_decide:'결과 승인/반려/취소', profile_decide:'사장님 프로필 결정'};
async function showApprovals(){
  let r; try{ r=await T.api('GET','/api/owner/approvals'); }catch(e){ toast('승인 목록 실패: '+e.message); return; }
  const body=el('div'); const list=(r&&r.approvals)||[];
  if(!list.length) body.appendChild(el('div','cwd','대기 중인 승인 요청이 없습니다.'));
  list.forEach(a=>body.appendChild(teamRow('✅', a.summary, (APPROVAL_KIND[a.kind]||a.kind)+' · '+tsText(a.created)
    +' · 만료 '+tsText(a.expires), ()=>{ closeModal(); showApprovalSheet(a); })));
  openModal('✅ 승인 대기', body, []);
}
async function openApprovalById(id){
  let a; try{ a=await T.api('GET','/api/owner/approvals/'+encodeURIComponent(id)); }catch(e){ toast('승인 요청을 찾지 못했습니다'); return; }
  showApprovalSheet(a);
}
function approvalErrText(m){
  m=String(m||'');
  if(m.includes('human_proof_required')) return MODE==='local'
    ? '2차 인증 코드가 필요합니다(설정 → 2차 인증을 켜거나, 폰 알림에서 승인하세요).'
    : '이 기기로는 승인할 수 없습니다(페어링을 확인하세요).';
  if(m.includes('expired')) return '만료된 요청입니다(30분).';
  if(m.includes('not_pending')) return '이미 처리된 요청입니다.';
  return '실패: '+m;
}
// opts.execute: 승인 직후 이 화면(PC 로컬)에서 실행까지. opts.onDone(result): 실행 결과 콜백.
function showApprovalSheet(a, opts){
  opts=opts||{};
  const body=el('div');
  body.appendChild(el('div','setsec', APPROVAL_KIND[a.kind]||a.kind));
  body.appendChild(el('div','cwd', a.summary));
  if(a.kind==='session_send'){       // 비서 → 일반 세션 전달: 받는 세션과 보낼 글 그대로(승인하면 이 글이 그 세션에 들어간다)
    const sx=(SESSIONS||[]).find(x=>x.session_id===(a.args||{}).session_id);
    body.appendChild(el('div','cwd','받는 세션: '+(sx?sessLabel(sx)+' · '+baseName(sx.cwd||''):String((a.args||{}).session_id||'').slice(0,8))
      +(sx&&sessionIsLive(sx)?' (실행 중)':' (꺼져 있으면 자동 허용 모드로 띄운 뒤 전달)')));
    const q=el('pre','tl-full',String((a.args||{}).message||'')); q.style.whiteSpace='pre-wrap'; body.appendChild(q);
  } else { const pre=el('pre','tl-full', JSON.stringify(a.args||{}, null, 2)); pre.style.whiteSpace='pre-wrap'; body.appendChild(pre); }
  body.appendChild(el('div','diag','요청 '+tsText(a.created)+(a.requested_by==='owner'?' · 사장님 화면':a.requested_by?' · 세션 '+String(a.requested_by).slice(0,8):'')
    +' · 만료 '+tsText(a.expires)+' · 상태 '+a.status));
  let otp=null;
  if(MODE==='local' && a.status==='pending'){
    body.appendChild(el('div','cwd','PC 에서는 2차 인증 코드로 승인합니다(또는 폰 알림에서 탭).'));
    otp=el('input','inp'); otp.placeholder='2차 인증 6자리'; otp.inputMode='numeric'; body.appendChild(otp);
  }
  const err=el('div','cwd'); body.appendChild(err);
  const decide=async(approve)=>{
    err.textContent='';
    try{
      const d=await T.api('POST','/api/owner/approvals/'+encodeURIComponent(a.id)+'/decide',
        {body:Object.assign({approve}, otp&&otp.value?{otp:otp.value.trim()}:{})});
      if(d && d.error) throw new Error(d.error);
      if(!approve){ toast('거절했습니다'); closeModal(); return 'rejected'; }
      if(opts.execute){                    // 화면에서 낸 요청 — 승인 즉시 실행(폰에서도, 팀 통합 U5)
        const x=await T.api('POST','/api/owner/approvals/'+encodeURIComponent(a.id)+'/execute');
        if(x && x.error) throw new Error(x.error);
        closeModal(); toast('승인·실행했습니다'); if(opts.onDone) opts.onDone(x&&x.result); return 'executed';
      }
      closeModal(); toast('승인했습니다 — 요청한 세션이 실행합니다'); return 'approved';
    }catch(e){ err.textContent=approvalErrText(e.message||e); return 'error'; }
  };
  globalThis.__approvalDecide=decide;      // 테스트 훅
  if(a.status!=='pending'){ openModal('✅ 승인 요청', body, []); return; }
  const yes=el('button','btn','승인'); yes.onclick=()=>decide(true);
  const no=el('button','btn ghost','거절'); no.onclick=()=>decide(false);
  openModal('✅ 승인 요청', body, [no, yes]);
}
// PC 로컬 화면에서 영향 큰 동작을 할 때: 승인 요청을 만들고 바로 그 승인 화면(2FA 또는 폰)을 띄운다.
async function requestApproval(kind, args, onDone){
  let a; try{ a=await T.api('POST','/api/owner/approvals',{body:{kind, args}}); }catch(e){ toast('요청 실패: '+e.message); return null; }
  if(!a || a.error){ toast('요청 실패: '+((a&&a.error)||'')); return null; }
  closeModal(); showApprovalSheet(a, {execute:true, onDone});
  return a;
}

// ---- 팝 메뉴(⋯ · 🔔, 화면 재배치 2단계): PC 는 버튼 옆 작은 상자, 폰은 아래에서 올라오는 시트 ----
let POP=null;
function closePop(){
  if(!POP) return; const p=POP; POP=null;
  try{ p.bg.remove(); p.box.remove(); }catch(e){}
  try{ document.removeEventListener('keydown',p.onKey); }catch(e){}
}
function popItem(icon,label,sub,fn,cls){
  const b=el('button','popi'+(cls?' '+cls:'')); b.setAttribute('role','menuitem');
  b.appendChild(el('span','pi',icon)); const t=el('span','pt'); t.appendChild(el('span',null,label));
  if(sub) t.appendChild(el('small',null,sub)); b.appendChild(t);
  b.onclick=(e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); closePop(); return fn&&fn(); };
  return b;
}
function openPop(anchor,content,title){
  closePop();
  const bg=el('div','popbg'), box=el('div','pop'); box.setAttribute('role','menu');
  if(title) box.appendChild(el('div','poph',title));
  box.appendChild(content);
  bg.onclick=()=>closePop();
  document.body.appendChild(bg); document.body.appendChild(box);
  const onKey=(e)=>{ if(e.key==='Escape') closePop(); };
  document.addEventListener('keydown',onKey);
  POP={bg,box,anchor,onKey};
  // PC: 누른 버튼 바로 아래(화면 밖이면 위로). 폰은 CSS 가 아래 시트로 고정한다.
  try{ if(innerWidth>=880&&anchor&&anchor.getBoundingClientRect){ const r=anchor.getBoundingClientRect();
    const bw=box.offsetWidth||260, bh=box.offsetHeight||240;
    let top=r.bottom+4; if(top+bh>innerHeight-8) top=Math.max(8,r.top-bh-4);
    box.style.left=Math.max(8,Math.min(innerWidth-bw-8,r.right-bw))+'px'; box.style.top=top+'px'; box.style.right='auto'; } }catch(e){}
  try{ const f=box.querySelector('.popi'); if(f&&f.focus) f.focus(); }catch(e){}
  return box;
}
// 목록 줄 ⋯ 메뉴(2026-10-12 사장님: 재개·뷰어·이름 변경·상세 보기… + 삭제). 삭제는 휴지통(30일 복구)·확인창이라
// 맨 아래 구분선 뒤 빨간 글씨로만 둔다. 강제 종료·되돌리기는 넣지 않는다 — 상세의 「위험 구역」에서만(원격 2차 인증).
function rowMenuItems(s){
  const it=[]; const bd=sessionBadge(s);
  if(bd&&bd.text==='권한 대기') it.push(['✋','원격 승인','claude 가 도구 사용 허락을 기다립니다',()=>showApprove(s),'warn']);
  if(s.live_terminal||TABS.list.some(x=>x.s.session_id===s.session_id&&!tabGone(x,s))) it.push(['🖥','터미널 열기','실행 중인 화면으로 바로',()=>jumpToSession(s)]);
  else if(s.peer) it.push([rowResumeIcon(s),'재개…',peerOriginLabel(s.peer).text+'에서 실행 중 — 방식 선택',()=>showResumeChooser(s)]);
  else it.push(['▶','재개','웹 / 터미널 선택',()=>showResumeChooser(s)]);
  it.push(['💬','대화 보기',null,()=>loadViewer(s)]);
  it.push(['✎','이름 바꾸기',null,()=>renameNative(s)]);
  if(s.cwd) it.push(['📂','파일 보기',baseName(s.cwd),()=>openFilesFor(s)]);
  it.push(['ℹ','상세 보기','정보 · 포크 · 내보내기 · 위험 구역',()=>loadDetail(s)]);
  if(sessionIsLive(s)) it.push(['🗑','삭제','실행 중 — 먼저 끝내야 지울 수 있습니다(상세의 위험 구역)',()=>loadDetail(s),'danger']);
  else it.push(['🗑','삭제','휴지통으로 · 30일 안에 되살릴 수 있음',()=>doDelete(s),'danger']);
  return it;
}
function rowMenu(s,anchor){
  const box=el('div');
  for(const [i,l,sub,fn,cls] of rowMenuItems(s)){
    if(cls==='danger') box.appendChild(el('div','popsep'));   // 위험한 것은 떨어뜨려 둔다
    box.appendChild(popItem(i,l,sub,fn,cls)); }
  return openPop(anchor,box,sessLabel(s));
}
// ---- 🔔 할 일(ux-reorg §4-5): 사람이 손대야 풀리는 것만 모은다 — 승인 요청 · 권한 대기 · 입력 대기 (+ 최근 완료 참고) ----
let TODO_APPROVALS=[], TODO_AT=0;
function todoSessions(){
  const by=(t)=>(SESSIONS||[]).filter(s=>{ const b=sessionBadge(s); return !!b&&b.text===t; });
  const ra=(s)=>(s.runtime&&s.runtime.ready_at)||0;
  const gone=(SESSIONS||[]).filter(s=>{ const d=cleanupLeft(s); return d!=null&&d<=CLEANUP_SOON&&!s.headless; })
    .sort((a,b)=>a.cleanup_at-b.cleanup_at);
  return {perm:by('권한 대기'), wait:by('입력 대기'), ready:by('완료').sort((a,b)=>ra(b)-ra(a)).slice(0,6), gone};
}
// 숫자 = 사람이 손대야 풀리는 것 + 3일 안에 claude 가 지울 세션(7일 안은 목록에만 보인다)
function todoCount(){ const t=todoSessions();
  return TODO_APPROVALS.length+t.perm.length+t.wait.length+t.gone.filter(s=>cleanupLeft(s)<=CLEANUP_ALERT).length; }
function renderTodoBadge(){
  const b=$('#btn-todo'); if(!b) return;
  const n=todoCount(), bd=b.querySelector('.tbadge');
  if(bd){ bd.textContent=n>99?'99+':String(n); bd.classList.toggle('hidden',!n); }
  b.title=n?('할 일 '+n+'건 — 승인·권한·입력 대기 · 곧 지워질 세션'):'할 일 — 승인·권한·입력 대기 · 곧 지워질 세션';
}
async function refreshTodo(){
  TODO_AT=Date.now();
  try{ const r=await T.api('GET','/api/owner/approvals');
    TODO_APPROVALS=((r&&r.approvals)||[]).filter(a=>!a.status||a.status==='pending'); }catch(e){}
  renderTodoBadge();
}
// 상대 시각(한국어): 지난 시각 → 'N분 전', 남은 시각 → 'N분 남음'
function todoAgo(t){ if(!t) return ''; const d=Math.max(0,Date.now()/1000+CLOCK_SKEW-t);
  return d<60?'방금':d<3600?Math.floor(d/60)+'분 전':d<86400?Math.floor(d/3600)+'시간 전':Math.floor(d/86400)+'일 전'; }
function todoLeft(t){ if(!t) return ''; const d=t-(Date.now()/1000+CLOCK_SKEW);
  return d<=0?'만료됨':d<3600?Math.ceil(d/60)+'분 남음':Math.floor(d/3600)+'시간 남음'; }
function todoItem(k,icon,title,sub,meta,fn,soon){
  const b=popItem(icon,title,sub,fn,'todo-it k-'+k);
  if(meta) b.appendChild(el('span','tm'+(soon?' soon':''),meta));
  return b;
}
async function showTodo(){
  await refreshTodo();
  const box=el('div'), t=todoSessions(), n=todoCount();
  const head=el('div','todo-head'); head.appendChild(el('b',null,'할 일'));
  head.appendChild(el('span',n?'hot':null, n?('기다리는 일 '+n+'건'):'모두 처리됨')); box.appendChild(head);
  const sec=(k,label,cnt)=>{ const h=el('div','todo-sec k-'+k,label); if(cnt!=null) h.appendChild(el('span','n',String(cnt))); box.appendChild(h); };
  const fold=(s)=>baseName(s.cwd||'')||'';
  const rt=(s,f)=>(s.runtime&&s.runtime[f])||0;
  if(TODO_APPROVALS.length){ sec('approve','승인 요청',TODO_APPROVALS.length);
    for(const a of TODO_APPROVALS){ const left=a.expires?(a.expires-(Date.now()/1000+CLOCK_SKEW)):1e9;
      box.appendChild(todoItem('approve','📝',a.summary||APPROVAL_KIND[a.kind]||a.kind,APPROVAL_KIND[a.kind]||a.kind,
        todoLeft(a.expires),()=>showApprovalSheet(a),left<600)); } }
  if(t.perm.length){ sec('perm','권한 대기',t.perm.length);
    for(const s of t.perm) box.appendChild(todoItem('perm','✋',sessLabel(s),fold(s)+' · 도구 사용 허락 필요',todoAgo(rt(s,'permission_at')),()=>showApprove(s))); }
  if(t.wait.length){ sec('wait','입력 대기',t.wait.length);
    for(const s of t.wait) box.appendChild(todoItem('wait','💬',sessLabel(s),fold(s)+' · 답을 기다림',todoAgo(rt(s,'waiting_at')),()=>jumpToSession(s))); }
  if(t.gone.length){ sec('gone','곧 지워질 세션',t.gone.length);
    for(const s of t.gone){ const d=cleanupLeft(s);
      box.appendChild(todoItem('gone','⏳',sessLabel(s),fold(s)+' · claude 보관 기간 끝',cleanupText(s).replace(' 지워짐',''),
        ()=>loadDetail(s),d<=CLEANUP_ALERT)); } }
  if(!n&&!t.gone.length){ const e=el('div','popempty'); e.appendChild(el('div','ei','✓')); e.appendChild(el('b',null,'기다리는 일이 없습니다'));
    e.appendChild(el('small',null,'승인 요청 · 권한 대기 · 입력 대기가 생기면 🔔 에 숫자가 뜹니다'));
    box.appendChild(e); }
  if(t.ready.length){ sec('done','최근 끝난 작업');
    for(const s of t.ready){ const b=todoItem('done','',sessLabel(s),fold(s),todoAgo(rt(s,'ready_at')),()=>jumpToSession(s));
      b.classList.add('done'); box.appendChild(b); } }
  openPop($('#btn-todo'),box,null);   // (async 라 상자를 돌려주지 않는다 — 열린 팝은 POP.box)
  try{ POP.box.classList.add('todo-pop'); POP.box.setAttribute('aria-label','할 일'); }catch(e){}
}
// ---- 폰 아래 탭 막대(ux-reorg §4-2) — PC 는 목록 칸 위 탭 막대(.lview)가 같은 일을 한다. 둘 다 오른쪽(상세 칸)은 안 바꾼다 ----
function syncTabbar(){
  for(const b of document.querySelectorAll('#tabbar button')) b.classList.toggle('on',b.dataset.v===LIST_VIEW);
}
function tabbarGo(v){
  if(v==='assist') return openAssistant();
  const changed=LIST_VIEW!==v;
  if(changed) setListView(v);
  const onList=$('#app').getAttribute('data-view')==='list';

  if(onList){ const pl=paneList(); if(pl) pl.scrollTop=0; }   // 보던 탭을 또 누르면 맨 위로

}

// ---- 🧑‍💼 개인 비서(단계 3, A-7) — 헤더 버튼: PC·폰 어디서든 비서 세션 터미널 ----

// ---- 🧑‍💼 사장님 프로필(A-8) — 비서가 제안, 사장님이 승인으로 확정·거절·수정·삭제 ----
const PROFILE_STATUS={proposed:'제안', confirmed:'확정'};
// 동봉 스킬 설치(v0.9.0) — claude 가 읽는 ~/.claude/skills 에 새 파일을 만드는 행위라 반드시
// 확인창을 거친다(불가침 원칙 예외, 2026-09-23). 이미 있으면 덮어쓰기를 다시 묻는다.
const BUNDLED_SKILLS={
  workers:{name:'clewpath-workers', title:'워커 스킬', desc:'여러 세션이 한 팀으로 일하는 운영 규칙(clewpath-workers 스킬)을 설치합니다. 관리 세션에서 /clewpath-workers 로 부릅니다.'},
  assistant:{name:'clewpath-assistant', title:'비서 스킬', desc:'개인 비서 세션의 규칙(clewpath-assistant 스킬)을 설치합니다. 비서 세션에서 /clewpath-assistant 로 부릅니다.'}};
function installWorkersSkill(){ return installBundledSkill('workers'); }
async function installBundledSkill(key){
  const k=BUNDLED_SKILLS[key]; if(!k) return;
  let st={}; try{ st=await T.api('GET','/api/owner/skills/'+key); }catch(e){ toast('상태 조회 실패: '+e.message); return; }
  const body=el('div');
  body.appendChild(el('p',null,k.desc));

// 폰이 auth 때 보고하는 자기 이름(B-1): 앱은 브리지의 기기 모델, 웹은 UA 요약. Host 가 40자·제어문자 정리.
function deviceSelfName(){
  try{ const B=window.ClewBridge; if(B&&B.deviceName){ const n=B.deviceName(); if(n) return String(n); } }catch(e){}
  const ua=(navigator.userAgent||'');
  const dev=/iPad/.test(ua)?'iPad':/iPhone/.test(ua)?'iPhone':/Android/.test(ua)?'Android':/Macintosh/.test(ua)?'Mac':/Windows/.test(ua)?'Windows':'기기';
  const br=/CriOS|Chrome/.test(ua)?'Chrome':/FxiOS|Firefox/.test(ua)?'Firefox':/Safari/.test(ua)?'Safari':'';
  return br?dev+' '+br:dev;
}
// 페어링 실패 되돌리기: 방금 쓴 자격·룸 키를 지우고, 이전에 쓰던 PC 가 있으면 그 자격을 되살린다.
function pairRollback(room, prevRoom, hadRk){
  try{ conn._stopped=true; if(conn.ws) conn.ws.close(); }catch(e){}
  ['sm_devtoken','sm_cs','sm_cp','sm_cjwt','sm_token'].forEach(k=>LS.removeItem(k));
  if(!hadRk) LS.removeItem('sm_e2ee_'+room);
  conn.devToken='';
  if(prevRoom && prevRoom!==room && pcsLoad().some(x=>x.room===prevRoom)) pcsActivate(prevRoom);
}
function doPair(){
  // ① 페어링 링크를 붙여넣었으면 거기서 값을 뽑는다(권장 경로)
  const link=($('#p-link')?$('#p-link').value:'').trim();
  // 앱(오버레이 폐기, T15): 붙여넣은 https 링크는 브리지가 릴레이 주소까지 저장하고 부트 파서로 넘긴다
  if(link && window.ClewBridge && ClewBridge.pairFromUrl && /^(https?:|clewpath:)/i.test(link)){
    const r=ClewBridge.pairFromUrl(link);
    if(r!=='ok') $('#p-err').textContent=ClewBridge.pairErrorText(r)||'링크를 인식하지 못했습니다';
    return;
  }
  let room='', token='', cs='', cp='', dev='';
  let rk='';
  if(link){
    let q=null;
    try{
      const u=new URL(link);
      // 신형 링크는 fragment(#room=..) — 비밀이 서버 로그에 안 남는 형식. 구형(?room=)도 병행 수용.
      q=(u.hash&&u.hash.length>1)?new URLSearchParams(u.hash.slice(1)):u.searchParams;
    }
    catch(e){ try{ q=new URLSearchParams(link.replace(/^[^?#]*[?#]/,'')); }catch(_){ q=null; } }
    if(!q||!q.get('room')){ $('#p-err').textContent='페어링 링크를 인식하지 못했습니다. 전체 링크를 복사해 붙여넣으세요.'; return; }
    room=q.get('room')||''; cs=q.get('cs')||''; cp=q.get('cp')||'';
    dev=q.get('dev')||''; token=q.get('token')||''; rk=q.get('rk')||'';
  }else{
    room=$('#p-room').value.trim();
    token=$('#p-token').value.trim();
    cp=($('#p-cp')?$('#p-cp').value.trim():'');
    if(token.startsWith('cli_')){ cs=token; token=''; }
  }
  if(!room||!(cs||token)){ $('#p-err').textContent='페어링 링크를 붙여넣거나, 직접 입력을 채워주세요'; return; }
  if(cs&&!cp){ $('#p-err').textContent='cli_ 자격을 쓰려면 CLIENT PUBLIC ID(cpub_…)도 필요합니다'; return; }

  // 실패 시 되돌릴 이전 상태(E-D16: 잘못된/만료된 QR 은 아무것도 바꾸지 않는다)
  const prevRoom=LS.getItem('sm_room')||'', hadRk=!!LS.getItem('sm_e2ee_'+room);
  const prevPc=pcsLoad().find(x=>x.room===room)||null;     // B-7: 같은 PC 의 새 QR 이면 성공 뒤 옛 cpub 폐기
  // 자격 저장 → connect() 가 cs 를 단기 JWT 로 교환해 사용한다
  if(dev){ LS.setItem('sm_devtoken',dev); conn.devToken=dev; }
  // E2EE 룸 키 — 링크로 수동 페어링해도 부트 경로와 동일하게 저장(빠지면 평문 접속이 돼버림)
  if(rk&&room){ LS.setItem('sm_e2ee_'+room, rk);
    if(window.ClewBridge) ClewBridge.syncRoomKey(room, rk); }
  if(cs&&cp){ LS.setItem('sm_cs',cs); LS.setItem('sm_cp',cp); LS.removeItem('sm_cjwt'); }
  else { LS.removeItem('sm_cs'); LS.removeItem('sm_cp'); LS.removeItem('sm_cjwt'); }

  $('#p-err').textContent=''; $('#p-go').textContent='연결 중…';
  conn._pairing=true; conn._stopped=false;
  conn.connect(room,token).then((r)=>{
    conn._pairing=false;
    const a=r&&r.auth;
    if(dev && !(a&&a.ok)){
      // 기기 인증 실패 = 이 QR 은 Host 에서 이미 무효(삭제·재발급·만료). 저장하지 않고 이전 상태로.
      pairRollback(room, prevRoom, hadRk);
      $('#p-err').textContent = (a&&a.error==='auth_invalid')
        ? '이 QR 은 더 이상 유효하지 않습니다 — PC 의 📱 기기 목록에서 새 QR 을 만드세요'
        : 'PC 인증 실패: '+((a&&a.error)||'unknown');
      $('#p-go').textContent='연결';
      return;
    }
    LS.setItem('sm_room',room);
    if(token) LS.setItem('sm_token',token); else LS.removeItem('sm_token');
    pcsUpsert({room, cs, cp, dev, name:(a&&a.data&&a.data.hostname)||'', pv:(a&&a.data&&a.data.pv)|0});
    if(prevPc && prevPc.cp && prevPc.cp!==cp){ revokeEnqueue(prevPc).then(()=>revokeFlush()).catch(()=>{}); }
    T=relayT; enterApp();
  }).catch(e=>{ conn._pairing=false; $('#p-err').textContent=e.message; $('#p-go').textContent='연결'; });
}

// ---- 버전 표기 -------------------------------------------------------------
// 로컬: 이 PC 설치본 버전 + 새 버전 여부(update/status). 원격: 접속한 PC 의 버전(auth 응답).
// 헤더 PC 선택 select — 로컬=localhost, 원격=저장된 닉네임. 목록에서 골라 전환.
const LOCAL_DEFAULT_URL='http://127.0.0.1:5100/';
let RELAY_APP_URL='https://clewpath.pyongso.com/relay/app';   // /api/owner/connection 에서 갱신
function localAppUrl(){ return (MODE==='local') ? (location.origin+'/') : LOCAL_DEFAULT_URL; }
function setTitle(nick){ document.title='ClewPath'+(nick?(' — '+nick):''); }
function roomLabel(room){ return 'PC '+String(room||'').replace(/^rm_/,'').slice(0,6); }
// 지금 선택된 대상의 표시 이름(로컬=localhost, 원격=닉네임)
function curPcLabel(){
  if(MODE==='local') return 'localhost';
  const room=LS.getItem('sm_room'); if(!room) return '';
  const pc=pcsLoad().find(x=>x.room===room);
  return pc ? pcName(pc) : roomLabel(room);
}
function refreshPcSelect(){
  const sel=$('#pcname'); if(!sel) return;
  const curRoom=LS.getItem('sm_room');
  // localhost 항목: 폰에서는 무의미(폰에 로컬 서비스 없음) — 앱은 브리지가 숨기고,
  // 모바일 브라우저(릴레이 화면 + 터치 기기)에서도 숨긴다.
  const allowLocal=(!window.ClewBridge||ClewBridge.showLocalPcOption())
    && !(MODE==='relay'&&matchMedia('(pointer: coarse)').matches);
  const opts=allowLocal?[{v:'__local__', t:'🖥 localhost'}]:[];
  if(MODE==='relay'){
    const seen=new Set();
    pcsLoad().forEach(pc=>{ opts.push({v:pc.room, t:'🖥 '+pcName(pc)}); seen.add(pc.room); });
    if(curRoom && !seen.has(curRoom)) opts.push({v:curRoom, t:'🖥 '+roomLabel(curRoom)});
    opts.push({v:'__add__', t:'＋ 새 PC 추가…'});                // 접속한 채로 새 PC 페어링 화면으로(사장님 2026-10-02)
    opts.push({v:'__manage__', t:'🖧 PC 추가·관리…'});          // 1대뿐이어도 전환·추가 입구가 헤더에 남게(사장님 2026-09-30)
  } else {
    // 로컬: 릴레이 앱에 저장된 다른 PC 목록(room+name, 토큰 없음)을 숨은 iframe 으로 받아 그대로 나열한다(사장님 2026-09-30).
    // 고르면 릴레이 앱으로 이동해 그 PC 가 선택된다(?switch=room). 목록이 아직 없으면 릴레이 열기 항목만.
    const rp=relayPcsLoad();
    rp.forEach(pc=>{ opts.push({v:'relay:'+pc.room, t:'🖥 '+(pc.name||roomLabel(pc.room))}); });
    opts.push({v:'__relay__', t: rp.length?'🖧 릴레이 앱 열기…':'🖧 다른 PC (릴레이)…'});
    opts.push({v:'__sync__', t:'🔄 PC 목록 새로고침'});
  }
  const btn=$('#btn-pcs'); if(btn){ if(MODE==='relay') btn.classList.remove('hidden'); else btn.classList.add('hidden'); }
  // 로컬 화면은 localhost 만(E-4): 릴레이 PC 목록 미러(sm_pcs_relay)·팝업 동기화는 0.10.0 에서 제거.
  sel.innerHTML='';
  opts.forEach(o=>{ const op=document.createElement('option'); op.value=o.v; op.textContent=o.t; sel.appendChild(op); });
  sel.value = (MODE==='local') ? '__local__' : (curRoom||(opts[0]&&opts[0].v)||'');
  setTitle(curPcLabel());
  // 선택지가 1개 이하면 select 는 소음(DR-3) — 숨기고 제목 텍스트만 남긴다(로컬·릴레이 공통)
  if(opts.length<=1) sel.classList.add('hidden'); else sel.classList.remove('hidden');
}
// ---- 로컬 화면의 '다른 PC 목록' 거울(sm_pcs_relay: room+name 만, 토큰 없음) ----
// 릴레이 앱(clewpath.pyongso.com)의 저장 목록은 origin 이 달라 직접 못 읽는다 → 로컬 부팅 때 릴레이 앱을
// 숨은 iframe 으로 열면(?pcexport=<로컬 origin>) 그 페이지가 자기 목록을 postMessage 로 넘긴다. 클릭 없음.
function relayPcsLoad(){ try{ const a=JSON.parse(LS.getItem('sm_pcs_relay')||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function relayPcsSave(a){ LS.setItem('sm_pcs_relay', JSON.stringify(a)); }
let _pcsSyncFrame=null;
// 왕복 동기화: 로컬 → 릴레이 앱(?pcexport=<로컬 origin>, 최상위 문맥이라 저장소 분리 없음) → 목록을 #pcs= 조각에 실어 로컬로 복귀.
// Chrome 은 서드파티 iframe 의 localStorage 를 분리(partitioning)해 iframe 방식은 빈 목록만 돌려준다(실측 2026-09-30).
// 조각(#)은 서버로 가지 않고, 내용은 room+name 뿐(토큰 없음). 세션당 1회만 자동, 나머지는 '🔄 PC 목록 새로고침'.
function relayPcsRoundTrip(){
  if(MODE!=='local' || !RELAY_APP_URL) return false;
  try{ if(sessionStorage.getItem('sm_pcs_rt')==='1') return false; sessionStorage.setItem('sm_pcs_rt','1'); }catch(e){}
  try{ location.href=RELAY_APP_URL+'?pcexport='+encodeURIComponent(location.origin); }catch(e){ return false; }
  return true;
}
// 복귀 시 #pcs=<json> 소비(부팅 최초에 호출) — 저장 뒤 주소창에서 지운다
function consumeRelayPcsHash(){
  const m=(location.hash||'').match(/[#&]pcs=([^&]+)/); if(!m) return false;
  try{ const a=JSON.parse(decodeURIComponent(m[1]));
    if(Array.isArray(a)) relayPcsSave(a.map(x=>({room:String(x.room||''),name:String(x.name||'')})).filter(x=>x.room)); }catch(e){}
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  return true;
}
function syncRelayPcs(){
  if(MODE!=='local' || !RELAY_APP_URL) return;
  try{
    if(_pcsSyncFrame){ _pcsSyncFrame.remove(); _pcsSyncFrame=null; }
    const f=document.createElement('iframe');
    f.src=RELAY_APP_URL+'?pcexport='+encodeURIComponent(location.origin);
    f.setAttribute('aria-hidden','true'); f.tabIndex=-1;
    f.style.cssText='position:absolute;width:0;height:0;border:0;opacity:0;pointer-events:none';
    document.body.appendChild(f); _pcsSyncFrame=f;

function onRelayPcsMessage(ev){
  try{
    if(ev.origin !== new URL(RELAY_APP_URL).origin) return;
    const d=ev.data;
    if(d && d.type==='clewpath_pcs' && Array.isArray(d.pcs)){
      const list=d.pcs.map(x=>({room:String(x.room||''),name:String(x.name||'')})).filter(x=>x.room);
      if(list.length) relayPcsSave(list);          // 빈 목록은 저장소 분리(partitioning)일 수 있어 기존 값을 지우지 않는다
      if(_pcsSyncFrame){ try{ _pcsSyncFrame.remove(); }catch(e){} _pcsSyncFrame=null; }
      refreshPcSelect();
      if(!list.length && !relayPcsLoad().length && navigator.onLine!==false) relayPcsRoundTrip();

}

function doExport(target){
  const ok=/^https?:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(target||'');   // 로컬 오리진만
  const to=(window.parent&&window.parent!==window)?window.parent:window.opener;
  const list=pcsLoad().map(pc=>({room:pc.room, name:pc.name||''}));           // 토큰 제외
  if(ok && to){
    try{ to.postMessage({type:'clewpath_pcs', pcs:list}, target); }catch(e){}
    document.body.innerHTML='';
  } else if(ok){
    // 최상위 문맥(왕복): 로컬 앱으로 돌아가며 목록을 fragment 에 싣는다(서버 무전송)
    try{ location.replace(target.replace(/\/$/,'')+'/#pcs='+encodeURIComponent(JSON.stringify(list))); }catch(e){}
  } else {
    document.body.innerHTML='';
  }
}

  if(p.get('room')) pcsUpsert({room:p.get('room'), cs:cs||'', cp:cpid||'', dev:dev||''});
  // ?switch=room : 로컬 페이지에서 고른 PC. 저장돼 있으면(자격 포함) 그 방을 활성화해 자동 접속.
  const swRoom=p.get('switch');
  if(swRoom){ const spc=pcsLoad().find(x=>x.room===swRoom); if(spc) pcsActivate(spc.room); }
  const room=p.get('room')||LS.getItem('sm_room')||'';
  const token=p.get('token')||LS.getItem('sm_token')||'';
  if(p.get('dev')||p.get('token')||p.get('cs')||p.get('rk')||swRoom){   // 주소창에서 비밀 제거
    try{ history.replaceState(null,'',location.pathname); }catch(e){}   // hash 도 함께 지워진다
  }
  $('#p-room').value=room; $('#p-token').value=token;
  // 앱이면 페어링 화면에도 네이티브 QR 스캔 버튼(재페어링·기기 자격 해제 뒤 재연결 경로)
  if(appScanAvailable()){ const sb=$('#p-scan'); if(sb){ sb.hidden=false; sb.onclick=appScanPair; } }
  // 저장된 자격이 있으면 자동 접속(기기 자격 cs 또는 구 공유 토큰)
  const hasCs=!!(LS.getItem('sm_cs')&&LS.getItem('sm_cp'));
  renderPairPcs(); applyPairSituation(); // 저장된 PC 가 있으면 페어링 화면에서 바로 고를 수 있게 + 상황 줄 1개(DR-1)
  if(revokeQLoad().length) setTimeout(()=>{ revokeFlush().catch(()=>{}); }, 3000);   // 폐기 대기 재시도(오프라인 해제분)
  const _curPc=pcsLoad().find(x=>x.room===room);
  if(room&&(hasCs||token)&&!(_curPc&&_curPc.state&&!_hashPair)){   // ⛔/🔄 PC 는 자동 재접속하지 않는다
    $('#p-err').textContent=''; $('#p-go').textContent='연결 중…';
    if(_hashPair) conn._pairing=true;
    conn.connect(room,token).then(async(r)=>{
      conn._pairing=false;
      const a=r&&r.auth;
      if(_hashPair && !(a&&a.ok)){
        if(_prevPc){ pcsUpsert({..._prevPc}); pcsActivate(_prevPc.room); }   // 옛 페어링 복원
        else { pcsRemove(room); clearPairing(false); }
        $('#p-err').textContent=(a&&a.error==='auth_invalid')?'이 QR 은 더 이상 유효하지 않습니다 — PC 의 📱 기기 목록에서 새 QR 을 만드세요':'PC 인증 실패: '+((a&&a.error)||'unknown');
        $('#p-go').textContent='연결'; renderPairPcs(); return;
      }
      if(a&&a.ok&&a.data){ pcsUpsert({room, cs:LS.getItem('sm_cs')||'', cp:LS.getItem('sm_cp')||'', dev:LS.getItem('sm_devtoken')||'',
                                      name:a.data.hostname||'', pv:a.data.pv|0}); }
      if(_hashPair && _prevPc && _prevPc.cp && _prevPc.cp!==LS.getItem('sm_cp')){
        await revokeEnqueue(_prevPc); revokeFlush().catch(()=>{});                  // B-7: 옛 cpub 은 새 자격 성공 뒤 폐기
      }
      LS.setItem('sm_room',room); T=relayT; enterApp(); })
      .catch(e=>{ conn._pairing=false; $('#p-err').textContent=e.message; $('#p-go').textContent='연결'; });
  }
}
</script>
