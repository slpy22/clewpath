// ---- 터미널 재개 (로컬=iframe terminal.html, 외부=내장 xterm+릴레이 스트림) ----
// ---- 멀티탭 터미널: 탭 상태(TABS) + 단일 화면(termView) ----
// TABS.list = 열린 터미널 탭들 [{key, s}]. key = fork_id||session_id — webterm 의 _ACTIVE 키와
// 같은 규칙이라 같은 PTY 를 두 탭이 가리킬 수 없다(= dedupe 의 근거). TABS.active = 전경 탭 key.
// 전경 탭만 라이브 WS 를 갖고(Phase1 = 단일 xterm 재접속) 배경 탭은 서버 persist PTY 로만
// 살아있다(설계 문서 docs/2026-09-10-multi-terminal-tabs-design.md §9).
// 이전엔 이 전부가 loadTerminal 클로저 지역변수 + 전역 _term={close} 였다 — "화면"과
// "어느 세션에 붙었나"를 분리해 객체로 들어야 탭 전환이 가능하다.
const TABS={ list:[], active:null };
const tabKey=(s)=>(s.fork_id||s.session_id);
const findTab=(key)=>TABS.list.find(t=>t.key===key)||null;

// termView: 터미널 영역(wrap) 안에 탭별 화면 인스턴스(릴레이=xterm, 로컬=iframe)를 보유한다.
//  · 전환은 즉시다: 이전 탭은 tc 만 닫고(stream_close → 서버 화면 detach, PTY·xterm 버퍼 유지)
//    host 를 숨기고, 대상 탭 host 를 보여 fit 한 뒤 tc 를 연다. 서버는 그 화면(screen_id)이 못 본
//    출력만 델타 리플레이하므로 이중 렌더도 공백도 없다(v0.8.0, webterm 화면 커서).
//  · 라이브 WS 는 전경 탭 1개뿐(모바일 안전). 배경 탭은 서버 persist PTY 로 살아있다.
//  · 로컬 iframe 은 탭별로 보유해 항상 붙어 있다(로컬은 WS 수 부담이 없다).
//  · dispose 는 뷰를 떠날 때 전부 해체. screenId 는 페이지 수명 동안만 — 새로고침 뒤엔 버퍼가
//    비므로 새 id 로 전체 tail 을 받는다(sm_tabs 에 저장하지 않는 이유).
const termView={
  main:null, wrap:null, strip:null, wl:null, ro:null, onWin:null,
  tabs:{},              // key -> {host, term, fit, ux, tc, frame, screenId, lastDim, ended}
  active:null,          // 전경 탭 key
  sid:null, disconnected:false,
  // 이 pane 에 터미널 뷰가 떠 있는가 — 탭 전환 fast-path(재구축 없이 attach 만)의 조건
  mounted(main){ return !!main && this.main===main && main.classList.contains('term-mode') && !!this.wrap; },
  cur(){ return this.active?this.tabs[this.active]:null; },
  send(obj){ const c=this.cur(); if(c&&c.tc){ try{c.tc.send(obj);}catch(e){} } },
  // 전경 탭만 fit. 크기가 실제로 바뀔 때만 통지(ResizeObserver 가 자주 불려도 과다 전송 방지)
  resize(){ const c=this.cur(); if(!c||!c.term||!c.fit) return;
    try{ c.fit.fit(); const dim=c.term.cols+'x'+c.term.rows;
      if(dim!==c.lastDim){ c.lastDim=dim; this.send({type:'resize',cols:c.term.cols,rows:c.term.rows}); } }catch(e){} },
  _newScreenId(){ return 'scr-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); },
  // 터미널 영역(wrap)과 뷰 공용 자원(wakeLock·리사이즈 감시)을 만든다. 로드 실패는 throw.
  async mount(main){
    this.main=main;
    const wrap=el('div','term-wrap'); main.appendChild(wrap); this.wrap=wrap;
    if(MODE==='local') return;
    await loadXterm();
    // 터미널 표시 중 화면꺼짐 방지(§5) — 뷰당 1개. 실패해도 무해(iOS<16.4 등).
    if(navigator.wakeLock&&navigator.wakeLock.request){
      navigator.wakeLock.request('screen').then(l=>{this.wl=l;}).catch(()=>{}); }
    this.onWin=()=>this.resize(); window.addEventListener('resize',this.onWin);
    // wrap 이 실제 크기를 얻거나 바뀔 때마다 전경 탭을 채운다 — 초기 레이아웃/창 리사이즈 모두.
    if(window.ResizeObserver){ this.ro=new ResizeObserver(()=>this.resize()); this.ro.observe(wrap); }
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>this.resize());
  },
  // 탭 인스턴스 보장(없으면 생성). host 는 wrap 안에 절대배치, 기본 숨김(.on 만 표시).
  _ensure(key, s, safe){
    let t=this.tabs[key]; if(t) return t;
    const host=el('div','thost'); this.wrap.appendChild(host);
    t={host, term:null, fit:null, ux:null, tc:null, frame:null, lastDim:'', ended:false, screenId:this._newScreenId()};
    if(MODE==='local'){
      // 로컬: 탭별 iframe(terminal.html 무수정). 숨겨도 자기 WS 로 계속 붙어 있다.
      const frame=document.createElement('iframe'); frame.setAttribute('allow','clipboard-read; clipboard-write');
      frame.src=`${APIBASE}/terminal?id=${encodeURIComponent(s.session_id)}&skip=${safe?0:1}`;
      host.appendChild(frame); t.frame=frame;
    } else {
      // 핀치로 조절한 글자 크기는 기기별로 기억한다(M2 스파이크)
      const savedFs=parseInt(LS.getItem('sm_term_fs')||'',10);
      const term=new Terminal({fontSize:(savedFs>=8&&savedFs<=22)?savedFs:13,cursorBlink:true,scrollback:10000,
        fontFamily:'ui-monospace,"Cascadia Code",Consolas,monospace',
        theme:{background:'#0d1117',foreground:'#e6edf3',cursor:'#58a6ff'}});
      const fit=new FitAddon.FitAddon(); term.loadAddon(fit); term.open(host);
      t.term=term; t.fit=fit;
      // 모바일 터치 UX(탭별). 입력은 이 탭이 전경일 때만 보낸다 — 숨은 xterm 이 포커스를 얻어도 유실/오전송 없음
      t.ux=attachMobileTermUX(host, term, {
        send:(d)=>{ if(this.active===key) this.send({type:'input',data:d}); },
        onFont:(fs)=>{ LS.setItem('sm_term_fs',String(fs)); this.resize(); }});
      // Ctrl 토글(보조키 바)은 실키보드 입력에도 적용된다 — transform 경유
      term.onData(d=>{ if(this.active===key) this.send({type:'input',data:t.ux.transform(d)}); });
    }
    this.tabs[key]=t; return t;
  },
  // 전경 탭을 세션 s 로 바꾼다. 이전 전경은 화면(tc)만 뗀다(PTY·xterm 버퍼 유지).
  attach(s, cred, safe, wasDead){
    const key=tabKey(s);
    if(this.active && this.active!==key){
      const p=this.tabs[this.active];
      if(p){ if(p.tc){ try{p.tc.close();}catch(e){} p.tc=null; } p.host.classList.remove('on'); if(p.ux&&p.ux.bar) p.ux.bar.remove(); }
    }
    const t=this._ensure(key, s, safe);
    this.active=key; this.sid=s.session_id; this.disconnected=false;
    t.host.classList.add('on');
    // PTY 가 죽어 새로 스폰되는 경우(복원 시점에 죽어 있던 탭, 또는 서버가 이 화면에 '세션 종료'를
    // 알린 탭): 이전 화면은 지난 프로세스의 것이라 비우고 새 screen id 로 받는다(서버 커서도 새 세션).
    // SESSIONS.live_terminal 은 20초 폴링이라 stale — 이걸 쓰면 살아있는 탭까지 비워 델타가 무너진다(실측).
    const fresh=!!wasDead||t.ended;
    if(MODE==='local'){
      if(fresh&&t.frame){ t.frame.src=t.frame.src; t.ended=false; }
      try{ t.frame&&t.frame.contentWindow&&t.frame.contentWindow.dispatchEvent(new Event('resize')); }catch(e){}
      return;
    }
    if(t.tc) return;                       // 이미 라이브(같은 탭 재호출)
    const term=t.term;
    if(fresh){ term.reset(); t.lastDim=''; t.screenId=this._newScreenId(); t.ended=false; }
    // 보조키 바는 터치 기기에서만, 전경 탭 것만 붙인다
    if(matchMedia('(pointer: coarse)').matches && t.ux&&t.ux.bar) this.main.appendChild(t.ux.bar);
    // 세션 잠금 감지: 이전 Host 강제종료로 남은 고아가 claude bg 에이전트로
    // 승격되면 --resume 이 이 문구로 거부된다. 원문 에러만 흘리지 말고 원인과
    // 출구(포크)를 안내한다. 자동 정리는 하지 않음 - 사용자가 직접 만든 bg
    // 에이전트일 수도 있어(불가침 원칙) 구분이 안 되는 정리는 위험하다.
    let _bgLockNotified=false;
    const _detectBgLock=(chunk)=>{
      if(_bgLockNotified||chunk.indexOf('running as a background agent')<0) return;
      _bgLockNotified=true;
      const body=el('div');
      body.appendChild(el('p',null,'이 세션이 백그라운드 실행에 잠겨 있어 이어서 재개할 수 없습니다.'));
      const why=el('div','cwd'); why.style.whiteSpace='pre-line';
      why.textContent='가능한 원인:\n'
        +'  · 이전에 열어둔 터미널이 백그라운드로 남아 있음 (PC 재시작·업데이트 후 흔함)\n'
        +'  · 직접 만든 백그라운드 에이전트가 이 세션을 쓰는 중\n\n'
        +'해결:\n'
        +'  · 아래 [포크로 재개] - 원본을 건드리지 않는 사본에서 바로 이어서 작업 (권장)\n'
        +'  · 또는 PC 터미널에서 claude agents 로 해당 실행을 확인·종료한 뒤 다시 재개';
      body.appendChild(why);
      const go=el('button','btn full','🔱 포크로 재개');
      go.onclick=()=>{ closeModal(); leaveTerminalView(); loadResume(s,false); };
      openModal('세션이 잠겨 있습니다', body, [go]);
    };
    // screen: 서버가 이 화면에 보낸 오프셋을 기억 → 재접속 때 못 본 델타만 리플레이(배너 없음)
    t.tc=T.terminal(s.session_id,(data,eof,err)=>{
      if(eof){ const dead=t.tc; t.tc=null;
        if(dead){ try{dead.close();}catch(e){} }         // 핸들러 제거(eof 뒤 남으면 conn.streams 누수)
        if(this.active===key) this.disconnected=true;   // 재연결·화면 복귀 시 reattachForegroundTab 의 근거
        if(err==='2fa_invalid'||err==='2fa_required') clearGrace();
        term.write('\r\n\x1b[91m── '+(err?otpErrMsg(err):'연결 종료')+' ──\x1b[0m\r\n'); }
      else { _detectBgLock(data);
        if(data.indexOf('세션이 종료되었습니다')>=0) t.ended=true;   // 다음 attach 는 새 스폰 → 화면 비움
        term.write(data); } }, Object.assign({}, cred||{}, {screen:t.screenId}));
    setTimeout(()=>this.resize(),80); setTimeout(()=>this.resize(),300); term.focus();
  },
  // 전경 화면만 뗀다(PTY·버퍼 유지). tc.close() → stream_close → 서버 화면 detach.
  detach(){ const c=this.cur(); if(c&&c.tc){ try{c.tc.close();}catch(e){} c.tc=null; } this.sid=null; },
  // 탭 하나의 인스턴스 해체(탭 닫기). 로컬 iframe 은 about:blank 로 WS 를 닫게 한다.
  closeTabInstance(key){ const t=this.tabs[key]; if(!t) return;
    if(t.tc){ try{t.tc.close();}catch(e){} t.tc=null; }
    if(t.ux){ try{t.ux.dispose();}catch(e){} if(t.ux.bar) t.ux.bar.remove(); }
    if(t.term){ try{t.term.dispose();}catch(e){} }
    if(t.frame){ try{t.frame.src='about:blank';}catch(e){} }
    t.host.remove(); delete this.tabs[key];
    if(this.active===key){ this.active=null; this.sid=null; } },
  // 전부 해체(뷰를 떠날 때). 탭 목록(TABS)은 건드리지 않는다 — 배경 PTY 는 살아있다.
  dispose(){ for(const k of Object.keys(this.tabs)) this.closeTabInstance(k); tabBadge.close();
    if(this.onWin){ window.removeEventListener('resize',this.onWin); this.onWin=null; }
    if(this.ro){ try{this.ro.disconnect();}catch(e){} this.ro=null; }
    if(this.wl){ try{this.wl.release();}catch(e){} this.wl=null; }
    if(this.wrap){ this.wrap.remove(); this.wrap=null; }
    this.main=null; this.strip=null; this.active=null; this.sid=null; this.disconnected=false; },
};
// 터미널 뷰를 떠날 때(상세/이력/종료/포크) 화면 전부 해체. 탭 목록은 유지(배경 PTY 살아있음).
function leaveTerminalView(){ termView.dispose(); }
function removeTab(key){ TABS.list=TABS.list.filter(t=>t.key!==key); if(TABS.active===key) TABS.active=null;
  termView.closeTabInstance(key); }   // 보유하던 xterm/iframe 해제

// ---- 멀티탭 동작: 탭 스트립·전환·닫기·추가·저장/복원·재접속 ----
const TAB_SOFT_CAP=6;   // 클라 경고선. 서버 하드 상한(SM_MAX_TERMINALS, 기본 8)은 webterm 이 따로 막는다.
function sessLabel(s){ return s.title||s.label_name||s.slug||(s.session_id||'').slice(0,8); }
// 세션 색: 모니터 색은 서버(webmonitor)가 주지만 터미널엔 없다 → 클라에서 결정적 hash→hsl.
function tabColor(sid){ let h=0; for(const c of String(sid)) h=(h*31+c.charCodeAt(0))>>>0; return `hsl(${h%360},62%,58%)`; }
function saveTabs(){
  try{ LS.setItem('sm_tabs',JSON.stringify({active:TABS.active,
    list:TABS.list.map(t=>({key:t.key,sid:t.s.session_id,safe:!!t.safe}))})); }catch(e){}
}
// 부팅 후 SESSIONS 가 준비된 시점에 1회. 탭 '목록'만 복원하고 터미널은 열지 않는다 — 자동으로
// 붙이면 다른 기기가 쥔 화면을 탈취한다(세션당 화면 1개, webterm 점유 규칙). live_terminal 이
// false 면 dead(PTY 없음, 다시 열면 새 스폰)로 표시. 삭제/이사돼 목록에 없는 세션은 버린다.
let _tabsRestored=false;
function restoreTabsOnce(){
  if(_tabsRestored) return; _tabsRestored=true;
  let saved=null; try{ saved=JSON.parse(LS.getItem('sm_tabs')||'null'); }catch(e){}
  if(!saved||!Array.isArray(saved.list)||!saved.list.length) return;
  const byId=new Map((SESSIONS||[]).map(s=>[s.session_id,s]));
  let n=0;
  for(const it of saved.list){
    const s=byId.get(it.sid); if(!s||findTab(it.key)) continue;
    TABS.list.push({key:it.key,s,safe:!!it.safe,dead:!s.live_terminal}); n++;
  }
  if(saved.active&&findTab(saved.active)) TABS.active=saved.active;
  if(n) toast(`터미널 탭 ${n}개 복원됨 (터미널을 열면 탭 스트립에 보입니다)`);
  saveTabs();
}
// 탭 스트립을 그린다(termView.strip). 모니터 범례 칩 CSS 재사용(lchip/ldot/lx/ladd/sel).
// 배지 이벤트 종류(툴팁용): 모니터 이벤트의 role/tools/tool_results 로 사람이 읽을 한 줄.
function tabEvKind(ev){
  if(ev.role==='assistant'){ const tl=ev.tools||[]; return tl.length? '도구 실행('+tl.slice(0,3).join(', ')+(tl.length>3?' 외':'')+')' : '응답'; }
  if(ev.role==='user') return (ev.tool_results&&ev.tool_results.length)? '도구 결과' : '프롬프트 입력';
  return '이벤트';
}
function relIso(iso){ const sec=Date.parse(iso||'')/1000; return isNaN(sec)?'':relTs(sec); }
function renderTabBar(){
  const strip=termView.strip; if(!strip) return;
  strip.innerHTML='';
  TABS.list.forEach(t=>{
    // 표시는 목록의 최신 객체로(제목·훅 상태 변동 반영). t.s 자체는 switchTab 이 갱신한다.
    const s=(SESSIONS||[]).find(x=>x.session_id===t.s.session_id)||t.s, on=(t.key===TABS.active);
    const chip=el('span','lchip'+(on?' sel':'')+(t.dead?' dead':''));
    const lines=[(t.dead?'[중지됨 — 열면 새로 시작] ':'')+sessLabel(s), s.session_id];
    const dot=el('span','ldot'); dot.style.background=tabColor(s.session_id); chip.appendChild(dot);
    chip.appendChild(el('span','lname',sessLabel(s)));
    // 상태 밑줄 — 목록 뱃지(훅 상태, 신선도 게이트 포함)와 같은 판정·색. 중지된 탭은 상태 없음.
    const st=t.dead?null:sessionBadge(s);
    if(st){ chip.classList.add('st'); if(st.pulse) chip.classList.add('stpulse'); chip.style.setProperty('--st',st.c); lines.push('상태: '+st.text); }
    if(t.act&&!on){ const a=el('span','lact'); a.title='새 출력 있음'; chip.appendChild(a);
      lines.push('● 새 출력 '+(t.actN||1)+'건'+(t.last?' · 최근: '+t.last.what+' ('+relIso(t.last.at)+')':'')); }
    chip.title=lines.join('\n');
    const x=el('span','lx','×'); x.title='탭 닫기';
    x.onclick=(ev)=>{ ev.stopPropagation(); closeTab(t.key); };
    chip.appendChild(x);
    chip.onclick=()=>switchTab(t.key);
    strip.appendChild(chip);
  });
  const add=el('button','ladd','+ 탭'); add.title='다른 세션을 터미널 탭으로 추가';
  add.onclick=openTabPicker; strip.appendChild(add);
  // 활성 칩이 보이도록 스크롤(모바일 가로 스트립) — 활성 탭이 바뀐 렌더에서만(주기 재렌더가
  // 사용자가 넘겨 둔 스트립 스크롤을 되돌리지 않게)
  const sel=strip.querySelector('.lchip.sel');
  if(sel&&sel.scrollIntoView&&strip._sel!==TABS.active){ strip._sel=TABS.active; try{ sel.scrollIntoView({inline:'nearest',block:'nearest'}); }catch(e){} }
  tabBadge.sync();   // 탭 집합이 바뀔 때마다 배지 구독을 맞춘다(생성/차분/재구독)
}
// 이벤트마다 스트립을 갈아엎지 않게 300ms 로 모아 렌더(툴팁 건수·상태 갱신용).
let _tabBarTimer=null;
function renderTabBarSoon(){ if(_tabBarTimer) return; _tabBarTimer=setTimeout(()=>{ _tabBarTimer=null; renderTabBar(); },300); }
// ---- 배경 탭 활동 배지: 모니터 tail 스트림 1개 재사용 (설계 §4) ----
// 열린 탭 sid 들을 모니터 그룹으로 구독한다(라이브 터미널 WS 1 + 모니터 WS 1 = 총 2).
// 배경 탭에 '구독 이후' 새 이벤트가 오면 칩에 점(.lact). webmonitor 는 snapshot 뿐 아니라
// add 직후에도 그 세션의 과거 이벤트를 `events` 로 리플레이하므로 타입으로는 못 거른다 —
// 구독 시각(서버 시계 보정) 이후 ts 만 인정한다. 그 탭으로 전환하면 소거(loadTerminal).
const tabBadge={
  h:null, subs:new Set(), armedAt:{},
  _now(){ const skew=(typeof CLOCK_SKEW==='number')?CLOCK_SKEW:0; return new Date(Date.now()+skew*1000).toISOString(); },
  // renderTabBar 마다 호출: 없으면 구독 생성, 있으면 탭 집합과의 차분만 add/remove.
  sync(){
    const want=TABS.list.map(t=>t.s.session_id);
    if(!termView.main||!want.length){ this.close(); return; }
    if(!this.h){
      const arm=this._now(); this.subs=new Set(want); want.forEach(s=>{ this.armedAt[s]=arm; });
      try{ this.h=T.monitor(want.join(','), null, (data,eof)=>{
        if(eof){ this.h=null; this.subs=new Set(); return; }   // 재연결 등 — 다음 sync 가 재구독
        this._on(data); }); }
      catch(e){ this.h=null; }
      return;
    }
    for(const s of want){ if(!this.subs.has(s)){ this.armedAt[s]=this._now(); this.subs.add(s); try{this.h.add(s,'sub');}catch(e){} } }
    for(const s of [...this.subs]){ if(want.indexOf(s)<0){ this.subs.delete(s); delete this.armedAt[s]; try{this.h.remove(s);}catch(e){} } }
  },
  _on(data){
    let m; try{ m=JSON.parse(data); }catch(e){ return; }

// ---- 모바일 터미널 UX (M2 스파이크, 기획서 §5) ----
// 원칙: 웹뷰 기본 스크롤/줌에 기대지 않는다 — 전부 xterm API 로 처리(웹뷰 줌·바운스 배제).
//  · 한 손가락 스크롤: 일반 버퍼 → scrollLines(관성 포함) / TUI(alternate 버퍼) → 화살표 키
//    (alternate 버퍼는 스크롤백이 없어 scrollLines 가 무의미 — 데스크톱 터미널들의 휠 관례처럼
//     ↑/↓ 시퀀스로 변환해야 claude 같은 TUI 의 선택지·이력이 움직인다)
//  · 두 손가락 핀치: fontSize 조절 + fit 재계산 (변경은 opts.onFont 로 통지 → resize 전파)
//  · "↓ 최신" 복귀 버튼: 위로 스크롤 중일 때만 표시

function attachMobileTermUX(host, term, opts){
  host.style.position='relative';
  const cellH=()=>{ const r=host.querySelector('.xterm-rows'); const c=r&&r.firstElementChild;
    const h=c?c.getBoundingClientRect().height:0; return h>4?h:(term.options.fontSize||13)*1.6; };
  const isAlt=()=>term.buffer&&term.buffer.active&&term.buffer.active.type==='alternate';

  // 복귀 버튼 — onScroll(뷰포트 이동)마다 표시 갱신
  const jump=el('button','term-jump','↓ 최신');
  jump.onclick=()=>{ term.scrollToBottom(); };
  host.appendChild(jump);
  const updJump=()=>{ const b=term.buffer.active;
    jump.style.display=(!isAlt()&&b.viewportY<b.baseY)?'block':'none'; };
  const offScroll=term.onScroll(updJump);

  let ty=null, tx=null, moved=false, acc=0, arrowAcc=0;
  let vel=0, lastY=0, lastT=0, raf=0;
  let pinch=null;  // {d0, fs0}

  const applyPx=(dy)=>{            // 아래로 dy px 끌면 위 이력이 보인다(자연 방향)
    const h=cellH();
    if(isAlt()){
      // TUI(alternate 버퍼): claude 등은 이력 스크롤이 PageUp/PageDown 이다.
      // 화살표로 보내면 스크롤이 아니라 입력 이력·커서를 건드린다(iPhone 실기기 확인).
      // 반 화면 분량을 끌 때마다 페이지 1회 — 페이지 단위라 과민하지 않게.
      const page=Math.max(h*4, (term.rows||24)/2*h);
      arrowAcc+=dy;
      while(arrowAcc>=page){ arrowAcc-=page; opts.send('\x1b[5~'); }   // PageUp
      while(arrowAcc<=-page){ arrowAcc+=page; opts.send('\x1b[6~'); }  // PageDown
      return;
    }
    acc+=dy;
    const lines=Math.trunc(acc/h);
    if(lines){ acc-=lines*h; term.scrollLines(-lines); updJump(); }
  };
  host.addEventListener('touchstart',e=>{
    stopInertia();
    if(e.touches.length===2){        // 핀치 시작
      const dx=e.touches[0].clientX-e.touches[1].clientX,
            dy=e.touches[0].clientY-e.touches[1].clientY;
      pinch={d0:Math.hypot(dx,dy)||1, fs0:term.options.fontSize||13};
      ty=null; return;
    }
    if(e.touches.length===1){ ty=lastY=e.touches[0].clientY; tx=e.touches[0].clientX;
      lastT=e.timeStamp; moved=false; acc=0; arrowAcc=0; }
  }, {passive:true, capture:true});
  host.addEventListener('touchmove',e=>{
    if(pinch&&e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX,
            dy=e.touches[0].clientY-e.touches[1].clientY;
      const fs=Math.max(8,Math.min(22,Math.round(pinch.fs0*Math.hypot(dx,dy)/pinch.d0)));
      if(fs!==term.options.fontSize){ term.options.fontSize=fs; opts.onFont(fs); }
      e.preventDefault(); e.stopPropagation(); return;
    }
    if(ty==null||e.touches.length!==1) return;
    const y=e.touches[0].clientY;
    if(!moved&&Math.hypot(y-ty,e.touches[0].clientX-tx)<6) return;  // 탭/긴누름 보호
    moved=true;

    if(pinch){ if(e.touches.length<2) pinch=null; return; }
    if(ty==null) return;

    if(!moved||isAlt()||Math.abs(vel)<0.25) { vel=0; return; }

  let ctrlArmed=null;   // {btn} 버튼 참조(무장 해제 시 표시 복원)
  const transform=(d)=>{
    if(ctrlArmed&&d.length===1){
      const c=d.toUpperCase().charCodeAt(0);
      ctrlArmed.btn.classList.remove('armed'); ctrlArmed=null;
      if(c>=64&&c<=95) return String.fromCharCode(c&31);   // A~Z, [ 등 → ^A..
    }
    return d;
  };

  // 보조키 바(기획서 §5 키맵 그대로). 이스케이프 시퀀스를 PTY 로 직접 전송(IME 우회).
  // pointerdown+preventDefault: 버튼이 포커스를 뺏어 소프트 키보드가 닫히는 것을 방지.
  // 키 구성은 실기기 사용 피드백으로 확정: Tab/좌우/숫자는 실사용 빈도가 낮아 제거

              ['PgUp','\x1b[5~'],['PgDn','\x1b[6~'],['Enter','\r']];
  const bar=el('div','term-keybar');
  for(const [label,seq] of KEYS){
    const b=el('button',null,label);
    b.addEventListener('pointerdown',ev=>{
      ev.preventDefault();
      if(seq===null){                       // Ctrl 토글
        if(ctrlArmed){ ctrlArmed.btn.classList.remove('armed'); ctrlArmed=null; }
        else { b.classList.add('armed'); ctrlArmed={btn:b}; }
        return;
      }
      opts.send(transform(seq));
    });
    bar.appendChild(b);
  }

  return { bar, transform,
    dispose(){ stopInertia(); try{offScroll.dispose();}catch(e){} } };
}

  }catch(e){ wrap.innerHTML=''; wrap.appendChild(el('div','empty','뷰어 실패: '+e.message)); return; }
  // 실시간 tail: 단일 세션 monitor 스트림을 붙여 새 메시지를 같은 카드로 append
  const setBadge=(on,txt)=>{ badge.className='vlive '+(on?'on':'off'); bt.textContent=txt; };
  const nearBot=()=> main.scrollHeight-main.scrollTop-main.clientHeight < 120;
  function onMsg(dataStr,eof){
    if(eof){ setBadge(false,'연결 끊김'); return; }
    let m; try{ m=JSON.parse(dataStr); }catch(e){ return; }
    if(m.type==='heartbeat'){ setBadge(true,'● 실시간'); return; }
    if(m.type==='snapshot'||m.type==='events'){
      const stick=nearBot(); const empty=wrap.querySelector('.empty');
      (m.events||[]).forEach(ev=>{
        if(ev.ts && lastTs && ev.ts<=lastTs) return;   // 스냅샷과 중복 제거
        if(ev.ts) lastTs=ev.ts;
        if(empty) empty.remove();
        renderHistoryMsg(wrap, ev, pend);
      });
      setBadge(true,'● 실시간');
      if(stick) main.scrollTop=main.scrollHeight;
    }
  }
  try{ _liveViewer=T.monitor(s.session_id, s.session_id, onMsg); }
  catch(e){ setBadge(false,'실시간 불가'); }
}

// 서버가 깔끔한 대화만(메타/도구인자/thinking 제외) 최근 limit개 준다.

// 깔끔 렌더: user=플레인, assistant=마크다운 + 사용도구 칩
function renderHistoryMsg(wrap,m,pend){
  const text=(m.text||'').trim();
  if(m.role==='user'){
    // 도구 결과 레코드면 해당 카드에 결과를 채운다(말풍선 아님)
    if(m.tool_results&&m.tool_results.length) feedToolResults(m.tool_results,pend||{});
    if(text){ const d=el('div','msg user'); d.textContent=text; wrap.appendChild(d); }
    return;
  }
  if(m.role==='assistant'){
    if(text){ const d=el('div','msg assistant'); d.innerHTML=mdToHtml(text); wrap.appendChild(d); }
    if(m.tool_calls&&m.tool_calls.length){
      m.tool_calls.forEach(tc=>renderToolUse(wrap,tc,pend||{}));
    } else if(m.tools&&m.tools.length){   // 구버전 서버 호환(이름만 올 때)
      wrap.appendChild(el('div','tool','🔧 '+[...new Set(m.tools)].join(', ')));
    }
  }
}

// 최소 마크다운 → HTML. XSS 안전: 먼저 이스케이프하고 내가 넣는 태그만 허용.
function mdToHtml(src){
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const inl=s=>{ s=esc(s);
    s=s.replace(/`([^`\n]+)`/g,(m,c)=>'<code>'+c+'</code>');
    s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
    return s; };
  const fences=[];
  src=String(src).replace(/```[^\n]*\n?([\s\S]*?)```/g,(m,code)=>{
    fences.push(code); return '\uE010'+(fences.length-1)+'\uE011'; });
  const lines=src.split('\n'); const out=[]; let i=0;
  const hasPipe=l=>l.indexOf('|')>=0;
  const isSep=l=>/^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(l);
  const cells=l=>{ let x=l.trim(); if(x[0]==='|')x=x.slice(1); if(x[x.length-1]==='|')x=x.slice(0,-1);
    return x.split('|').map(c=>c.trim()); };
  while(i<lines.length){
    const l=lines[i];
    if(hasPipe(l) && i+1<lines.length && isSep(lines[i+1])){
      const head=cells(l); i+=2; const body=[];
      while(i<lines.length && hasPipe(lines[i]) && lines[i].trim()){ body.push(cells(lines[i])); i++; }
      let tb='<table><thead><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead>';
      if(body.length) tb+='<tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody>';
      out.push(tb+'</table>'); continue;
    }
    let h=l.match(/^#{1,6}\s+(.+)$/); if(h){ out.push('<strong>'+inl(h[1])+'</strong>'); i++; continue; }
    let b=l.match(/^\s*[-*]\s+(.+)$/); if(b){ out.push('\u2022 '+inl(b[1])); i++; continue; }
    out.push(inl(l)); i++;
  }
  let html=out.join('\n');
  html=html.replace(/\uE010(\d+)\uE011/g,(m,k)=>'<pre>'+esc(fences[+k])+'</pre>');
  return html;
}

// ---- 재개(스트리밍 + 입력) ----
async function loadResume(s, inplace, safe){
  const isIn = inplace!==false;   // 기본 in-place(실제 세션)
  let cred={};
  if(isIn){ cred=await ensurePriv(); if(cred===null) return; }   // 외부 in-place → grace/2차 인증
  if(safe) cred={...cred, safe:true};   // 일반 모드: 도구 자동허용 없이(웹은 물을 수 없어 거부됨)
  const main=paneDetail(); main.classList.remove('term-mode'); main.innerHTML='';
  $('#head').textContent='재개'+(safe?' (일반)':'');
  main.appendChild(backbar('상세',()=>{sess&&sess.close();loadDetail(s);}));
  showDetailPane();
  const stream=el('div','stream'); main.appendChild(stream);
  stream.appendChild(el('div','result', isIn
    ? '⚠ 실제 세션을 그대로 이어갑니다 (in-place)'
    // 포크 혼동 예방(실사용자 사고): 화면에 과거 대화가 안 보여 "이력이
    // 사라졌다"고 오인하기 쉽다 - 맥락은 이어받았고 원본은 그대로임을 명시.
    : '🔱 복제본에서 진행 — 이전 대화 맥락은 이어받았습니다. 화면에 과거 이력이 '
      +'안 보이는 건 정상이며, 원본 세션의 이력은 그대로 보존됩니다.'));
  // composer (상세 pane 하단 고정)
  const comp=el('div','composer');
  const ta=el('textarea'); ta.rows=1; ta.placeholder='메시지 입력…';
  ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';};
  const send=el('button','send','↑');
  comp.appendChild(ta); comp.appendChild(send);
  main.appendChild(comp);
  let sess=null, busy=false, busyEl=null;
  const cleanup=()=>{ comp.remove(); };
  // back 시 composer 제거
  const obs=new MutationObserver(()=>{ if(!document.contains(stream)){cleanup();obs.disconnect();} });
  obs.observe(main,{childList:true});
  // busyEl 이 있으면 그 위에 삽입(진행표시기는 항상 맨 아래 유지)
  const push=(cls,txt)=>{ const d=el('div',cls); if(txt!=null)d.textContent=txt;
    if(busyEl) stream.insertBefore(d,busyEl); else stream.appendChild(d);
    main.scrollTop=main.scrollHeight; return d; };
  const setBusy=(on)=>{ busy=on; send.disabled=on;
    send.classList.toggle('working',on); send.textContent=on?'…':'↑';
    if(on){ if(!busyEl){ busyEl=el('div','busy');
      busyEl.innerHTML='<span class="bdot"></span><span class="bdot"></span><span class="bdot"></span>'
        +'<span style="margin-left:6px">작업 중…</span>';
      stream.appendChild(busyEl); main.scrollTop=main.scrollHeight; } }
    else if(busyEl){ busyEl.remove(); busyEl=null; } };
  // 과거 이력 먼저 표시(끝부분)
  const loading=push('msg sys','과거 대화 불러오는 중…');
  try{ const hist=await fetchRecentMessages(s.session_id,120); loading.remove();
    const hpend={};
    for(const m of hist) renderHistoryMsg(stream,m,hpend);
    if(hist.length) stream.appendChild(el('div','result','── 여기서 이어서 대화 ──'));
  }catch(e){ loading.textContent='(과거 이력 로드 실패)'; }
  main.scrollTop=main.scrollHeight;
  // 카드 버튼이 답을 보낼 때 쓰는 헬퍼(사용자 말풍선 + 전송). busy 여도 보낸다 -
  // 도구 실패 직후 턴이 아직 도는 중일 수 있고, stream-json 입력은 큐잉된다.
  const sendText=(t)=>{ push('msg user',t); setBusy(true); try{ sess.input(t); }catch(e){} };
  const toolPend={};   // tool_use id -> 결과 핸들러 (구조화 카드 짝맞춤)
  sess=T.resume(s.session_id,(f)=>{
    if(f.eof){ setBusy(false);
      if(f.error==='2fa_invalid'||f.error==='2fa_required') clearGrace();  // 만료 → 재인증
      while(pend.length){ const it=pend.shift();                            // 대기분은 못 보냄
        it.chip.textContent='✖ 전송되지 않음 - 세션이 종료됨'; it.chip.classList.add('fail'); }
      push('result', f.error?('종료: '+otpErrMsg(f.error)):'— 세션 종료 —'); return; }
    const ev=f.data||{};
    if(ev.type==='system'){ if(ev.subtype==='init')push('msg sys','● 세션 시작'); return; }
    if(ev.type==='assistant'){ const c=ev.message&&ev.message.content;
      if(Array.isArray(c))for(const x of c){
        if(x.type==='text'){ const d=push('msg assistant',''); d.innerHTML=mdToHtml(x.text); }
        else if(x.type==='tool_use'){
          // 대화형 도구는 버튼 카드(선택지/플랜 승인), 나머지는 구조화 카드
          if(x.name==='AskUserQuestion' && renderAskCard(stream,x.input,sendText)){}
          else if(x.name==='ExitPlanMode' && renderPlanCard(stream,x.input,sendText,()=>ta.focus())){}
          else renderToolUse(stream,{id:x.id,name:x.name,input:x.input},toolPend);
          main.scrollTop=main.scrollHeight;
        }
      } return; }
    if(ev.type==='result'){ setBusy(false);
      const cost=ev.total_cost_usd!=null?(' · $'+ev.total_cost_usd):'';
      push('result','완료'+cost);
      drainPend();                       // 대기 중이던 메시지를 이어서 전송
      return; }
    if(ev.type==='user'){            // tool_result 를 카드에 짝 맞춰 채운다
      const c=ev.message&&ev.message.content;
      if(Array.isArray(c)) feedToolResults(
        c.filter(x=>x&&x.type==='tool_result')
         .map(x=>({tool_use_id:x.tool_use_id,is_error:!!x.is_error,text:_resultText(x.content)})),
        toolPend);
      return; }
  },Object.assign({inplace:isIn},cred));
  // 작업 중에도 입력을 받는다: busy 면 큐에 쌓고(대기 칩 표시) 턴이 끝나면 자동 전송.
  const pend=[];   // {t, chip}
  const doSend=()=>{ const t=ta.value.trim(); if(!t)return;
    ta.value=''; ta.style.height='auto';
    if(busy){
      const d=push('msg user',t);
      const chip=el('div','qchip','⏳ 현재 작업이 끝나면 전송됩니다');
      d.appendChild(chip); pend.push({t,chip});
      return;
    }
    push('msg user',t); setBusy(true); sess.input(t); };
  const drainPend=()=>{ if(!pend.length) return;
    const it=pend.shift(); it.chip.remove();
    setBusy(true); try{ sess.input(it.t); }catch(e){} };
  send.onclick=doSend;
  ta.onkeydown=(e)=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();} };
}

async function renameNative(s){

  if(name==null) return;

  try{
    await T.api('POST',`/api/sessions/${s.session_id}/title`,{body:{title:t}});
    s.custom_title=t; s.title=t;
    const it=SESSIONS.find(x=>x.session_id===s.session_id);
    if(it){ it.custom_title=t; it.title=t; }
    // 좌측 목록의 해당 행 이름도 즉시 갱신(데스크톱 2-pane)

    if(e.status===409) toast('실행 중 세션이라 변경 불가');
    else toast('실패: '+e.message);
  }
}

// ---- export / import ----
function b64toBlob(b64,type){ const bin=atob(b64); const n=bin.length; const arr=new Uint8Array(n);
  for(let i=0;i<n;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:type||'application/zip'}); }
function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>{ const s=String(r.result); const i=s.indexOf(','); res(i>=0?s.slice(i+1):s); };
  r.onerror=()=>rej(new Error('파일 읽기 실패')); r.readAsDataURL(file); }); }
function chk(label){ const wrap=el('label'); wrap.style.cssText='display:flex;align-items:center;gap:8px;margin:10px 0;font-size:.9rem;cursor:pointer';
  const input=document.createElement('input'); input.type='checkbox'; wrap.appendChild(input);
  wrap.appendChild(document.createTextNode(' '+label)); return {wrap,input}; }
function dlBlob(blob,filename){ const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000); }

function exportSession(s){
  const body=el('div');
  body.appendChild(el('div','cwd','세션 대화(JSONL) + 메모리/todos 사이드파일을 zip 으로 내보냅니다.'));
  const wd=chk('작업 폴더도 포함(.gitignore 존중, 용량 커질 수 있음)'); body.appendChild(wd.wrap);
  const go=el('button','btn','📤 내보내기');
  go.onclick=()=>{ closeModal(); doExport(s, wd.input.checked); };
  openModal('📤 세션 내보내기 — '+s.session_id.slice(0,8), body, [go]);
}
async function doExport(s, wd){
  const fname='session_'+s.session_id.slice(0,8)+'.zip';
  if(MODE!=='relay'){
    // 로컬: 브라우저 직접 다운로드(바이너리 그대로)
    const a=document.createElement('a');
    a.href=APIBASE+`/api/sessions/${s.session_id}/export?include_workdir=${wd?'true':'false'}`;
    a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    toast('다운로드 시작');
    return;
  }
  // 릴레이: 커넥터가 zip 을 base64 로 터널링 → 브라우저에서 Blob 복원
  toast(wd?'내보내는 중… (작업폴더 포함, 시간 걸릴 수 있음)':'내보내는 중…');
  try{
    const r=await T.exportSession(s.session_id, wd);   // {b64, filename}
    dlBlob(b64toBlob(r.b64), r.filename||fname);
    toast('내보내기 완료');
  }catch(e){ toast('내보내기 실패: '+e.message); }
}

function importSession(){
  const body=el('div');
  const file=document.createElement('input'); file.type='file'; file.accept='.zip,application/zip';
  body.appendChild(field('세션 zip 파일', file));
  const cwd=inputEl(''); cwd.placeholder='비우면 원본 경로 그대로';
  body.appendChild(field('새 작업 폴더(선택)', cwd));
  const ow=chk('같은 ID 세션이 있으면 덮어쓰기'); body.appendChild(ow.wrap);
  const rw=chk('작업 폴더 파일도 복원(zip 에 포함된 경우)'); body.appendChild(rw.wrap);
  const go=el('button','btn','📥 가져오기');
  go.onclick=async()=>{
    const f=file.files&&file.files[0];
    if(!f){ toast('zip 파일을 선택하세요'); return; }
    go.disabled=true; const orig=go.textContent; go.textContent='가져오는 중…';
    try{
      const r=await T.importSession(f,{ new_cwd:cwd.value.trim()||null,
        overwrite:ow.input.checked, restore_workdir:rw.input.checked });
      if(r && r.error){ toast('실패: '+r.error); go.disabled=false; go.textContent=orig; return; }
      const sid=(r&&(r.session_id||r.imported))||'';
      toast('가져오기 완료'+(sid?(' ('+String(sid).slice(0,8)+')'):'')); closeModal(); loadList();
    }catch(e){ toast('실패: '+e.message); go.disabled=false; go.textContent=orig; }
  };
  openModal('📥 세션 가져오기', body, [go]);
}

// ---- 저장된 관제 그룹(Host 사이드카) — 앱이 닫혀 있어도 관제 알림을 받는 근거 ----
// 그룹은 Host 의 monitor_groups.json 에 산다. 알림 소스는 훅(관리 Stop/하위 Stop/하위 시작),
// 발송은 Host 의 웹푸시. 알림 클릭 → #monitor=<gid> → 그 그룹 오버레이.
async function fetchMonGroups(){ try{ const r=await T.api('GET','/api/owner/monitor/groups'); return (r&&r.groups)||[]; }catch(e){ return []; } }
function openMonitorGroup(g){
  const ids=[g.manager].concat((g.subs||[]).filter(s=>s!==g.manager));
  openMonitor(ids, g.manager, Object.assign({}, g.labels||{}));
}
async function openMonitorGroupById(gid){
  if(!gid) return;
  const g=(await fetchMonGroups()).find(x=>x.id===gid);
  if(!g){ toast('저장된 관제 그룹을 찾을 수 없습니다'); return; }
  if(document.getElementById('mon-ov')) return;   // 이미 관제 중이면 갈아엎지 않는다
  openMonitorGroup(g);
}
function consumePendingMonitor(){
  if(!PENDING_OPEN_GID) return;
  const gid=PENDING_OPEN_GID; PENDING_OPEN_GID='';
  openMonitorGroupById(gid);
}
const MON_NOTIFY_LABELS={manager_stop:'관리 턴 종료', sub_stop:'하위 응답 완료', sub_start:'하위 작업 시작', error:'하위 호출 실패'};
const MON_NOTIFY_DEFAULT={manager_stop:true, sub_stop:true, sub_start:false, error:true}; // 옛 Host 가 키를 빠뜨려도 실효값 표시

function showMonitorPicker(){
  const body=el('div');
  // ── 저장된 그룹 ──
  const savedWrap=el('div'); savedWrap.style.marginBottom='10px'; body.appendChild(savedWrap);
  const renderSaved=(groups)=>{
    savedWrap.innerHTML='';
    if(!groups.length) return;
    savedWrap.appendChild(el('div','cwd','저장된 관제 그룹 — 열거나, 알림을 켜고 끄거나, 지웁니다. 알림은 앱을 닫아도 옵니다(훅 기반).'));
    groups.forEach(g=>{
      const row=el('div','mpick'); row.style.flexWrap='wrap';
      const nm=el('div','mp-name',`${g.name}  ·  ${1+(g.subs||[]).length}개 세션`); nm.style.flex='1 1 100%';
      const open=el('button','btn','열기'); open.style.padding='6px 12px';
      open.onclick=()=>{ closeModal(); openMonitorGroup(g); };
      row.appendChild(nm); row.appendChild(open);
      Object.keys(MON_NOTIFY_LABELS).forEach(k=>{
        const lab=el('label','mp-mgr'); const cb=el('input'); cb.type='checkbox';
        cb.checked=!!((g.notify&&(k in g.notify))?g.notify[k]:MON_NOTIFY_DEFAULT[k]);
        cb.onchange=async()=>{ try{ await T.api('POST',`/api/owner/monitor/groups/${encodeURIComponent(g.id)}/notify`,{body:{notify:{[k]:cb.checked}}}); toast('알림 설정 저장됨'); }
          catch(e){ cb.checked=!cb.checked; toast('저장 실패: '+e.message); } };
        lab.appendChild(cb); lab.appendChild(document.createTextNode('🔔 '+MON_NOTIFY_LABELS[k]));
        row.appendChild(lab);
      });
      const del=el('button','btn ghost','삭제'); del.style.cssText='padding:6px 10px;color:#e66';
      del.onclick=async()=>{ if(!confirm(`'${g.name}' 그룹을 지울까요? (세션은 그대로, 알림만 멈춥니다)`)) return;
        try{ await T.api('POST',`/api/owner/monitor/groups/${encodeURIComponent(g.id)}/delete`); renderSaved(await fetchMonGroups()); toast('그룹 삭제됨'); }
        catch(e){ toast('삭제 실패: '+e.message); } };
      row.appendChild(del);
      savedWrap.appendChild(row);
    });
  };
  fetchMonGroups().then(renderSaved);
  // ── 새 그룹 고르기 ──
  body.appendChild(el('div','cwd','관리 에이전트 1개 + 하위 세션들을 골라 실시간 관전합니다. 관리는 하위를 claude -p 로 호출하는 세션입니다. 읽기전용이라 세션에 영향을 주지 않습니다.'));
  const list=el('div'); list.style.margin='10px 0'; body.appendChild(list);
  const rows=[];
  (SESSIONS||[]).forEach(s=>{
    const row=el('div','mpick');
    const cb=el('input'); cb.type='checkbox';
    const nm=el('div','mp-name',monSessName(s));
    const ml=el('label','mp-mgr'); const mr=el('input'); mr.type='radio'; mr.name='mon-mgr';
    mr.onclick=()=>{ cb.checked=true; };   // 관리로 지정하면 자동 포함
    ml.appendChild(mr); ml.appendChild(document.createTextNode('관리'));
    row.appendChild(cb); row.appendChild(nm); row.appendChild(ml);
    list.appendChild(row); rows.push({cb,mr,s});
  });
  if(!rows.length) list.appendChild(el('div','empty','세션이 없습니다.'));
  const nameIn=inputEl(''); nameIn.placeholder='그룹 이름(저장할 때만, 비우면 관리 세션 이름)';
  body.appendChild(field('저장 이름', nameIn));
  const pick=()=>{
    const picked=rows.filter(r=>r.cb.checked);
    if(picked.length<1){ toast('세션을 1개 이상 선택하세요'); return null; }
    const mgrRow=rows.find(r=>r.mr.checked);
    const mgr=mgrRow?mgrRow.s.session_id:picked[0].s.session_id;
    if(!picked.some(r=>r.s.session_id===mgr)) picked.unshift(rows.find(r=>r.s.session_id===mgr));
    const labels={}; picked.forEach(r=>{ labels[r.s.session_id]=monSessName(r.s); });
    return {ids:picked.map(r=>r.s.session_id), mgr, labels};
  };
  const go=el('button','btn','관전 시작');
  go.onclick=()=>{ const p=pick(); if(!p) return; closeModal(); openMonitor(p.ids, p.mgr, p.labels); };
  const save=el('button','btn','💾 저장하고 관전'); save.title='Host 에 그룹을 저장해 앱을 닫아도 관제 알림을 받습니다';
  save.onclick=async()=>{ const p=pick(); if(!p) return;
    try{ await T.api('POST','/api/owner/monitor/groups',{body:{name:nameIn.value.trim(), manager:p.mgr, subs:p.ids.filter(s=>s!==p.mgr), labels:p.labels}}); toast('관제 그룹 저장됨 — 알림이 켜졌습니다'); }
    catch(e){ toast('저장 실패: '+e.message); return; }
    closeModal(); openMonitor(p.ids, p.mgr, p.labels); };
  openModal('🎬 오케스트레이션 관제 — 그룹 선택', body, [go, save]);
}

function openMonitor(ids, manager, labels){
  const ov=el('div','mon-ov'); ov.id='mon-ov';
  const head=el('div','mon-head');
  head.appendChild(el('h3',null,'🎬 오케스트레이션 관제'));
  const live=el('div','mon-live off'); live.appendChild(el('span','dot2'));
  const lt=el('span',null,'연결 중…'); live.appendChild(lt); head.appendChild(live);
  const vtoggle=el('button','mon-vtoggle','◨'); vtoggle.title='뷰어 패널 접기/펼치기'; head.appendChild(vtoggle);
  const x=el('button','x','✕'); head.appendChild(x);
  const legend=el('div','mon-legend');
  const fbar=el('div','mon-filter');   // 타임라인 필터(종류 + 세션별 숨김)
  // 분할: 좌 타임라인(bodyW) / 우 선택세션 뷰어(viewer)
  const split=el('div','mon-split');
  const bodyW=el('div','mon-body');
  bodyW.appendChild(el('div','mon-empty','이벤트를 기다리는 중… 세션에서 대화가 오가면 여기에 실시간으로 표시됩니다.'));
  const viewer=el('div','mon-viewer');
  const vhead=el('div','mon-vhead');
  const vwrap=el('div','mon-vbody');
  vwrap.appendChild(el('div','empty','위에서 세션을 클릭하면 여기에 그 세션 대화가 실시간으로 보입니다.'));
  viewer.appendChild(vhead); viewer.appendChild(vwrap);
  const rez=el('div','mon-resizer'); rez.title='드래그로 좌우 폭 조절 · 더블클릭 초기화';
  split.appendChild(bodyW); split.appendChild(rez); split.appendChild(viewer);
  ov.appendChild(head); ov.appendChild(legend); ov.appendChild(fbar); ov.appendChild(split);
  document.body.appendChild(ov);
  vtoggle.onclick=()=>{ const hid=viewer.classList.toggle('hide'); rez.classList.toggle('gone',hid); };
  // 좌우 폭 드래그 조절(저장·복원, 더블클릭 초기화). 폰(오버레이)은 CSS 로 숨김.
  (function(){
    const KEY='sm_monvw', saved=LS.getItem(KEY);
    if(saved){ viewer.style.width=saved; viewer.style.maxWidth='none'; }
    let drag=false;
    const ptX=e=>e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX;
    function move(e){ if(!drag)return; const r=split.getBoundingClientRect();
      let w=r.right-ptX(e); w=Math.max(240, Math.min(w, r.width-320));
      viewer.style.width=Math.round(w)+'px'; viewer.style.maxWidth='none'; e.preventDefault(); }
    function stop(){ if(!drag)return; drag=false; rez.classList.remove('dragging');
      document.body.classList.remove('col-resizing');
      if(viewer.style.width) LS.setItem(KEY,viewer.style.width);
      window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',stop);
      window.removeEventListener('touchmove',move); window.removeEventListener('touchend',stop); }
    function begin(e){ if(viewer.classList.contains('hide'))return; drag=true; rez.classList.add('dragging');
      document.body.classList.add('col-resizing');
      window.addEventListener('mousemove',move); window.addEventListener('mouseup',stop);
      window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',stop);
      e.preventDefault(); }
    rez.addEventListener('mousedown',begin); rez.addEventListener('touchstart',begin,{passive:false});
    rez.addEventListener('dblclick',()=>{ viewer.style.width=''; viewer.style.maxWidth=''; LS.removeItem(KEY); });
  })();

  const gmap={}; let lastSeq=0; let emptyShown=true;
  // 활성 그룹 상태(동적 추가/삭제 반영). sid -> {label,color,role}
  const group={};
  (ids||[]).forEach(sid=>{ group[sid]={label:(labels&&labels[sid])||sid.slice(0,8),
                                       color:null, role:(sid===manager?'manager':'sub')}; });
  if(labels) Object.keys(labels).forEach(sid=>{ gmap[sid]={label:labels[sid]}; });  // 호출선 라벨 선점

  // ---- 우측 뷰어(선택 세션 실시간) 상태 ----
  let selectedSid=null, autoFollow=false, lastActiveSid=null;
  let viewerPend={}, viewerLastTs='', selGen=0;
  const activity={};   // sid -> 미확인 활동 여부(자동추적 꺼짐일 때 범례 점)

  function renderVHead(){
    vhead.innerHTML='';
    const g=selectedSid&&group[selectedSid];
    const nm=el('span','vname', selectedSid?((g&&g.label)||selectedSid.slice(0,8)):'세션 미선택');
    if(g&&g.color) nm.style.color=g.color;
    vhead.appendChild(nm);
    const vlv=el('span','vlive '+(selectedSid?'on':'off')); vlv.appendChild(el('span','vdot'));
    vlv.appendChild(el('span',null,selectedSid?'● 실시간':'대기')); vhead.appendChild(vlv);
    const fl=el('label','mon-follow'); const cb=el('input'); cb.type='checkbox'; cb.checked=autoFollow;
    cb.onchange=()=>{ autoFollow=cb.checked; if(autoFollow&&lastActiveSid) selectSession(lastActiveSid); };
    fl.appendChild(cb); fl.appendChild(document.createTextNode('자동 추적'));
    vhead.appendChild(fl);
  }
  renderVHead();

  async function selectSession(sid){
    if(!sid || sid===selectedSid) return;
    selectedSid=sid; delete activity[sid]; const gen=++selGen;
    renderLegend(); renderVHead();
    viewerPend={}; viewerLastTs='';
    vwrap.innerHTML=''; vwrap.appendChild(el('div','spin'));
    try{
      const msgs=await fetchRecentMessages(sid,200);
      if(gen!==selGen) return;   // 그새 다른 세션 선택됨(경쟁 방지)
      vwrap.innerHTML='';
      if(!msgs.length) vwrap.appendChild(el('div','empty','표시할 대화 없음'));
      for(const mm of msgs){ renderHistoryMsg(vwrap,mm,viewerPend);
        if(mm.timestamp&&mm.timestamp>viewerLastTs) viewerLastTs=mm.timestamp; }
      vwrap.scrollTop=vwrap.scrollHeight;
    }catch(e){ if(gen===selGen){ vwrap.innerHTML=''; vwrap.appendChild(el('div','empty','뷰어 실패: '+e.message)); } }
  }

  function feedRight(ev){
    lastActiveSid=ev.session_id;
    if(!selectedSid){ selectSession(ev.session_id); return; }   // 최초 이벤트 자동 선택
    if(autoFollow && ev.session_id!==selectedSid){ selectSession(ev.session_id); return; }
    if(ev.session_id===selectedSid){
      if(ev.ts && viewerLastTs && ev.ts<=viewerLastTs) return;   // 스냅샷 중복 제거
      if(ev.ts) viewerLastTs=ev.ts;
      const stick=vwrap.scrollHeight-vwrap.scrollTop-vwrap.clientHeight<120;
      renderHistoryMsg(vwrap, ev, viewerPend);
      if(stick) vwrap.scrollTop=vwrap.scrollHeight;
    } else if(group[ev.session_id]){   // 비선택 세션 활동 → 범례에 활동 점
      if(!activity[ev.session_id]){ activity[ev.session_id]=true; renderLegend(); }
    }
  }

  let handle=null;
  // ---- 타임라인 필터: 종류 단일 선택 + 세션별 숨김. 행은 렌더 시 data-sid·종류 클래스를 갖고,
  //      필터는 .fhid 토글만 한다(재렌더 없음). 우측 뷰어·자동 추적·활동점은 필터와 무관(표시만 거름).
  let fKind='all'; const fHide=new Set(); let fTotal=0, fShown=0;
  const F_KINDS=[['all','전체'],['call','→ 호출선'],['text','💬 대화'],['err','⚠ 오류']];
  const rowMatches=(row)=>{
    if(fHide.has(row.dataset.sid)) return false;
    return fKind==='all' || row.classList.contains('has-'+fKind);
  };
  const fcount=el('span','fcount');
  function renderFilterCount(){ fcount.textContent=(fKind!=='all'||fHide.size)?`표시 ${fShown} / 전체 ${fTotal}`:`전체 ${fTotal}`; }
  function applyFilter(){
    const stick=nearBottom();
    fShown=0;
    for(const row of bodyW.children){ if(!row.classList.contains('mrow')) continue;
      const ok=rowMatches(row); row.classList.toggle('fhid',!ok); if(ok) fShown++; }
    renderFilterCount();
    if(stick) bodyW.scrollTop=bodyW.scrollHeight;
  }
  function renderFilterBar(){
    fbar.innerHTML='';
    F_KINDS.forEach(([k,label])=>{
      const b=el('button','fchip'+(fKind===k?' on':''),label); b.title='이 종류의 이벤트만 표시';
      b.onclick=()=>{ fKind=k; renderFilterBar(); applyFilter(); };
      fbar.appendChild(b);
    });
    const sids=Object.keys(group);
    if(sids.length){ fbar.appendChild(el('span','fsep')); }
    sids.forEach(sid=>{
      const g=group[sid]; const hid=fHide.has(sid);
      const b=el('button','fchip'+(hid?' off':'')); b.title=hid?'이 세션 다시 표시':'이 세션 숨기기';
      const dot=el('span','ldot'); dot.style.background=g.color||'var(--muted)'; b.appendChild(dot);
      b.appendChild(document.createTextNode((hid?'':'👁 ')+(g.role==='manager'?'★ ':'')+(g.label||sid.slice(0,8))));
      b.onclick=()=>{ if(hid) fHide.delete(sid); else fHide.add(sid); renderFilterBar(); applyFilter(); };
      fbar.appendChild(b);
    });
    fbar.appendChild(fcount); renderFilterCount();
  }
  function renderLegend(){
    legend.innerHTML='';
    Object.keys(group).forEach(sid=>{
      const g=group[sid];
      const chip=el('span','lchip'+(sid===selectedSid?' sel':''));
      const dot=el('span','ldot'); dot.style.background=g.color||'var(--muted)'; chip.appendChild(dot);
      chip.appendChild(el('span',null,(g.role==='manager'?'★ ':'')+(g.label||sid.slice(0,8))));
      if(activity[sid]&&sid!==selectedSid) chip.appendChild(el('span','lact'));   // 미확인 활동
      const rm=el('span','lx','×'); rm.title='관전에서 제거';
      rm.onclick=(e)=>{ e.stopPropagation(); if(handle){ handle.remove(sid); } };
      chip.appendChild(rm);
      chip.onclick=()=>selectSession(sid);   // 클릭 → 우측 뷰어 대상
      legend.appendChild(chip);
    });
    const add=el('button','ladd','+ 세션 추가');
    add.onclick=()=>showAddSessionPicker(group, sid=>{ if(handle) handle.add(sid,'sub'); });
    legend.appendChild(add);
    renderFilterBar();   // 세션 집합·색·라벨 변동을 필터 토글에도 반영
  }
  renderLegend();
  const fmtT=(ts)=>{ try{ return ts?new Date(ts).toLocaleTimeString():''; }catch(e){ return ''; } };
  const nearBottom=()=> bodyW.scrollHeight-bodyW.scrollTop-bodyW.clientHeight < 90;
  const setLive=(on,txt)=>{ live.className='mon-live '+(on?'on':'off'); lt.textContent=txt; };

  function renderEvent(ev){
    if(ev.seq!=null){ if(ev.seq<=lastSeq) return; lastSeq=ev.seq; }
    if(emptyShown){ bodyW.innerHTML=''; emptyShown=false; }
    gmap[ev.session_id]={label:ev.session_label,color:ev.color};
    if(group[ev.session_id]){ const g=group[ev.session_id];
      if(!g.color&&ev.color){ g.color=ev.color; g.label=ev.session_label||g.label; renderLegend(); } }
    const row=el('div','mrow'+(ev.session_role==='sub'?' sub':''));
    row.style.cursor='pointer'; row.onclick=()=>selectSession(ev.session_id);   // 행 클릭 → 뷰어
    if(ev.color) row.style.borderLeftColor=ev.color;
    // 필터용 표식: 세션 + 종류(호출선/대화/도구/오류). 필터는 이 표식만 보고 .fhid 를 토글한다.
    row.dataset.sid=ev.session_id;
    if((ev.calls_out||[]).length) row.classList.add('has-call');
    if(ev.text) row.classList.add('has-text');
    if((ev.tools||[]).length) row.classList.add('has-tool');
    if((ev.tool_results||[]).some(r=>r.is_error)) row.classList.add('has-err');
    fTotal++; if(rowMatches(row)) fShown++; else row.classList.add('fhid');
    renderFilterCount();
    const h=el('div','mrow-h');
    const lab=el('span','mlab',ev.session_label||ev.session_id.slice(0,8)); if(ev.color)lab.style.color=ev.color;
    h.appendChild(lab);
    if(ev.role) h.appendChild(el('span','mtool',ev.role));
    h.appendChild(el('span','mtime',fmtT(ev.ts)));
    row.appendChild(h);
    (ev.calls_out||[]).forEach(c=>{
      const tl=(gmap[c.target_session_id]&&gmap[c.target_session_id].label)||c.target_session_id.slice(0,8);
      const call=el('div','mcall'); call.appendChild(el('b',null,'→ '+tl));
      if(c.prompt) call.appendChild(el('span',null,'“'+c.prompt+'”'));
      row.appendChild(call);
    });
    if(ev.text){ row.appendChild(el('div','mtext',ev.text.length>1200?ev.text.slice(0,1200)+'…':ev.text)); }
    (ev.tools||[]).forEach(nm=>row.appendChild(el('span','mtool','⚙ '+nm)));
    (ev.tool_results||[]).forEach(r=>{ if(r.text){ row.appendChild(el('div','mres',
      (r.is_error?'⚠ ':'↳ ')+(r.text.length>400?r.text.slice(0,400)+'…':r.text))); } });
    bodyW.appendChild(row);
    feedRight(ev);   // 우측 뷰어에도 반영(선택/자동추적/활동점)
  }

  function onMsg(dataStr, eof, error){
    if(eof){ setLive(false, error?('종료: '+error):'연결 종료'); return; }
    let m; try{ m=JSON.parse(dataStr); }catch(e){ return; }
    if(m.type==='heartbeat'){ setLive(true,'● live'); return; }
    if(m.type==='error'){ setLive(false,'오류: '+(m.error||'')); toast('관제 오류: '+(m.error||'')); return; }
    if(m.type==='group'){
      if(m.action==='add' && m.session_id && !group[m.session_id]){
        const nm=(SESSIONS.find(s=>s.session_id===m.session_id)||{});
        group[m.session_id]={label:(nm.title||nm.label_name||nm.slug||m.session_id.slice(0,8)),
                             color:null, role:'sub'};
        renderLegend(); toast('세션 추가됨');
      } else if(m.action==='remove' && m.session_id){
        delete group[m.session_id]; delete activity[m.session_id];
        if(selectedSid===m.session_id){ selectedSid=null; renderVHead();
          vwrap.innerHTML=''; vwrap.appendChild(el('div','empty','세션이 제거되었습니다. 다른 세션을 선택하세요.')); }
        renderLegend(); toast('세션 제거됨');
      }
      return;
    }
    if(m.type==='snapshot'||m.type==='events'){
      const stick=nearBottom();
      (m.events||[]).forEach(renderEvent);
      setLive(true,'● live');
      if(stick) bodyW.scrollTop=bodyW.scrollHeight;
    }
  }

  try{ handle=T.monitor(ids.join(','), manager, onMsg); }
  catch(e){ setLive(false,'연결 실패'); toast('관제 연결 실패: '+e.message); }
  x.onclick=()=>{ try{ handle&&handle.close(); }catch(e){} ov.remove(); };
}

function field(label,inp){ const f=el('div','field'); f.appendChild(el('label',null,label)); f.appendChild(inp); return f; }
function inputEl(val){ const i=el('input'); i.value=(val==null?'':val); return i; }
function askOtp(){ const c=prompt('2차 인증 코드 (인증앱 6자리):'); if(c==null)return null; return (c||'').trim(); }
// 특권(in-place/터미널) 자격 확보: 유효 grace 있으면 코드 없이, 없으면 OTP 1회 → grace 캐시.
// 반환 {grace} / {} (로컬) / null(취소·실패)
async function ensurePriv(){
  if(MODE!=='relay') return {};
  let st; try{ st=await T.api('GET','/api/owner/2fa/status'); }catch(e){ st={required:false}; }
  if(!st.required) return {};   // 2FA 꺼짐 → 코드 불필요
  let g=null; try{ g=JSON.parse(LS.getItem('sm_grace')||'null'); }catch(e){}
  if(g&&g.exp&&g.exp*1000>Date.now()+5000) return {grace:g.grace};
  const otp=askOtp(); if(otp==null) return null;
  try{ const r=await T.grant(otp); if(r&&r.grace)LS.setItem('sm_grace',JSON.stringify(r));
    return {grace:r&&r.grace}; }
  catch(e){ toast('인증 실패: '+otpErrMsg(e.message)); return null; }
}
function clearGrace(){ LS.removeItem('sm_grace'); }
function otpErrMsg(err){ return err==='2fa_invalid'?'2차 인증 실패(코드 불일치/만료)'
  :err==='2fa_required'?'2차 인증 미설정 — PC에서 🔒 보안에서 먼저 설정하세요':(err||''); }

// ---- 보안(2차 인증) 켜기/끄기/설정 ----
async function showSecurity(){
  let st; try{ st=await T.api('GET','/api/owner/2fa/status'); }catch(e){ st={required:false,has_secret:false}; }
  const body=el('div');
  const line=(t)=>body.appendChild(el('div','cwd',t));
  line('2차 인증(TOTP): '+(st.required?'켜짐 ✅':'꺼짐 ⚠'));
  line(st.required
    ? '외부에서 in-place 재개·터미널(실제 세션 조작)에 인증앱 6자리 코드가 필요합니다. 한 번 인증하면 일정 시간 이 기기를 신뢰합니다.'
    : '외부에서 in-place 재개·터미널이 코드 없이 릴레이 토큰만으로 가능합니다(보안 약함). 켜는 것을 권장합니다.');
  // grace(기기 신뢰) 상태 + 해제
  let gr=null; try{ gr=JSON.parse(LS.getItem('sm_grace')||'null'); }catch(e){}
  if(st.required && gr&&gr.exp&&gr.exp*1000>Date.now()){
    const mins=Math.round((gr.exp*1000-Date.now())/60000);
    line('이 기기 인증 유지 중 — 약 '+(mins>=60?Math.round(mins/60)+'시간':mins+'분')+' 남음');
    const unlock=el('button','btn ghost','🔓 이 기기 인증 해제'); unlock.style.marginTop='8px';
    unlock.onclick=()=>{ clearGrace(); toast('인증 해제됨'); closeModal(); };
    body.appendChild(unlock);
  }
  if(MODE!=='local'){
    line('켜기/끄기·설정 변경은 이 PC(로컬 127.0.0.1)에서만 가능합니다.');
    openModal('🔒 보안 · 2차 인증', body); return;
  }
  // ---- 로컬: 설정(QR) 표시 ----
  const doProvision=async()=>{
    try{
      const r=await T.api('POST','/api/owner/2fa/provision',{body:{}});
      body.innerHTML='';
      body.appendChild(el('div','cwd','2차 인증이 켜졌습니다. 인증앱(Google Authenticator·Authy 등)으로 QR을 스캔하거나 비밀키를 입력하세요. 창을 닫으면 다시 볼 수 없습니다:'));
      if(r.qr_svg){ const qb=el('div','qrbox'); const im=document.createElement('img');
        im.src=r.qr_svg; im.alt='2FA QR'; qb.appendChild(im); body.appendChild(qb); }
      body.appendChild(field('비밀키 (수동 입력용)', inputEl(r.secret)));
      body.appendChild(field('otpauth URI', inputEl(r.otpauth)));
    }catch(e){ toast('설정 실패: '+e.message); }
  };
  const toggle=async(on)=>{
    try{ await T.api('POST','/api/owner/2fa/toggle',{body:{on}}); toast(on?'2FA 켜짐':'2FA 꺼짐'); showSecurity(); }
    catch(e){ if(e.status===409){ doProvision(); } else toast('실패: '+e.message); }
  };
  const foot=[];
  if(st.required){
    const off=el('button','btn ghost','2FA 끄기'); off.onclick=()=>{
      if(confirm('2차 인증을 끄면 외부에서 코드 없이 실제 세션 조작이 가능해집니다. 계속?')) toggle(false); };
    const re=el('button','btn','QR 재설정'); re.onclick=doProvision;
    foot.push(off, re);
  }else if(st.has_secret){
    const on=el('button','btn','2FA 켜기'); on.onclick=()=>toggle(true);
    const re=el('button','btn ghost','새 QR로 설정'); re.onclick=doProvision;
    foot.push(re, on);
  }else{
    const setup=el('button','btn','2FA 설정(켜기)'); setup.onclick=doProvision;
    foot.push(setup);
  }
  openModal('🔒 보안 · 2차 인증', body, foot);
}

// ---- 외부 접속 기기(조회/등록/삭제) — 로컬 전용. 기기 인증은 항상 켜짐(끌 수 없음) ----
function relTs(sec){ if(!sec)return '미접속';
  const d=Date.now()/1000-sec; if(d<60)return '방금'; if(d<3600)return Math.floor(d/60)+'분 전';
  if(d<86400)return Math.floor(d/3600)+'시간 전'; return Math.floor(d/86400)+'일 전'; }
async function showDevices(){
  let st; try{ st=await T.api('GET','/api/owner/devices'); }catch(e){ toast('기기 목록 실패: '+e.message); return; }
  const body=el('div'); const line=(t)=>body.appendChild(el('div','cwd',t));
  const blockAll = !st.active;   // 등록 기기 0 = 외부 전면 차단
  line('외부(릴레이) 기기 인증: '+(blockAll?'🛑 전면 차단중(등록 기기 없음)':'항상 켜짐 ✅'));
  line('등록된 기기만 외부에서 접속할 수 있습니다. 삭제하면 다음 요청부터 즉시 차단되며, 이미 열려 있던 연결도 끊깁니다.');
  line('이 보호는 끌 수 없습니다 — 끄면 기기 삭제가 실효를 잃기 때문입니다. (이 PC 로컬 접속은 항상 가능)');
  const list=el('div'); list.style.marginTop='8px';
  (st.devices||[]).forEach(d=>{
    const row=el('div','devrow'); const info=el('div');
    info.appendChild(el('div','devname',(d.revoked?'🚫 ':'📱 ')+d.name));
    const meta=[]; meta.push(d.last_seen?('최근 '+relTs(d.last_seen)):'미접속');
    if(d.revoked)meta.push('폐기됨');
    info.appendChild(el('div','devmeta',meta.join(' · ')));
    row.appendChild(info);
    if(!d.revoked){
      const qr=el('button','btn ghost sm','🔄 QR');

      try{ await T.api('POST','/api/owner/devices/'+d.id+'/delete',{body:{}}); toast('삭제됨'); showDevices(); }
      catch(e){ toast('실패: '+e.message); } };
    row.appendChild(del);
    list.appendChild(row);
  });
  if(!(st.devices||[]).length) list.appendChild(el('div','cwd','아직 등록된 기기가 없습니다.'));
  body.appendChild(list);
  const add=el('button','btn','＋ 새 기기 추가'); add.onclick=addDevice;
  openModal('📱 외부 접속 기기', body, [add]);
}
async function copyText(t){
  // 127.0.0.1/https 는 보안 컨텍스트라 clipboard API 사용 가능. 실패 시 구식 방법으로 폴백.
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{
      const ta=document.createElement('textarea');
      ta.value=t; ta.style.cssText='position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      const ok=document.execCommand('copy'); ta.remove(); return ok;
    }catch(_){ return false; }
  }
}
function fieldWithCopy(label, value){
  const f=el('div','field');

  btn.onclick=async()=>{
    const ok=await copyText(value);
    btn.textContent = ok ? '✓ 복사됨' : '복사 실패';
    if(ok) toast('클립보드에 복사됨');
    setTimeout(()=>{ btn.textContent='📋 복사'; }, 1800);
  };
  row.appendChild(inp); row.appendChild(btn);
  f.appendChild(row);
  return f;
}

function changeCwd(s){
  const body=el('div'); const inp=inputEl(s.cwd||'');

  // 콘텐츠 이동 체크박스(기본 꺼짐) - 실제 작업 폴더의 파일까지 목적 폴더로 이동
  const cw=el('label','ckrow'); cw.style.cssText='display:flex;align-items:center;gap:8px;margin:12px 0;font-size:.9rem';
  const ck=document.createElement('input'); ck.type='checkbox';
  cw.appendChild(ck); cw.appendChild(document.createTextNode('실제 작업 폴더 내용도 함께 이동'));
  body.appendChild(cw);
  const warn=el('div','cwd'); warn.style.cssText='color:#e8a03c;font-size:.78rem;display:none;margin-top:-4px';
  warn.textContent='⚠ 원본 폴더의 모든 파일·하위폴더가 목적 폴더로 실제 이동합니다(되돌리기 어려움).';
  body.appendChild(warn);
  ck.onchange=()=>{ warn.style.display=ck.checked?'block':'none'; };
  const save=el('button','btn','이사');
  save.onclick=async()=>{
    const nc=inp.value.trim(); if(!nc){ toast('경로를 입력하세요'); return; }
    const mc=ck.checked;
    var _base='세션을 "'+nc+'" 로 이사시킬까요? (세션 기록이 새 폴더로 옮겨집니다)';
    var _full='세션 이사 + 실제 작업 폴더 내용 이동을 진행할까요?\n\n원본 "'+(s.cwd||'?')+'" 의 모든 파일이 "'+nc+'" 로 실제 이동합니다. 되돌리기 어렵습니다.';
    if(!confirm(mc?_full:_base)) return;
    save.disabled=true; save.textContent='이동 중…';

// ---- 2패널 폭 드래그 조절(데스크톱) ----
(function initResizer(){
  const rz=$('#resizer'), main=$('#main'); if(!rz||!main)return;
  const KEY='sm_listw', MINL=260, MIND=380;
  const saved=LS.getItem(KEY); if(saved)main.style.setProperty('--list-w',saved);
  let dragging=false;
  function ptX(e){ return e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX; }
  function onMove(e){ if(!dragging)return;
    const rect=main.getBoundingClientRect();
    let w=ptX(e)-rect.left;
    w=Math.max(MINL, Math.min(w, rect.width-MIND-7));   // 7px = 구분선 폭
    main.style.setProperty('--list-w', Math.round(w)+'px');
    e.preventDefault();
  }
  function stop(){ if(!dragging)return; dragging=false;
    rz.classList.remove('dragging'); document.body.classList.remove('col-resizing');
    const v=main.style.getPropertyValue('--list-w'); if(v)LS.setItem(KEY,v.trim());
    window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',stop);
    window.removeEventListener('touchmove',onMove); window.removeEventListener('touchend',stop);
  }
  function start(e){ dragging=true; rz.classList.add('dragging');
    document.body.classList.add('col-resizing');
    window.addEventListener('mousemove',onMove); window.addEventListener('mouseup',stop);
    window.addEventListener('touchmove',onMove,{passive:false}); window.addEventListener('touchend',stop);
    e.preventDefault();
  }
  rz.addEventListener('mousedown',start);
  rz.addEventListener('touchstart',start,{passive:false});
  rz.addEventListener('dblclick',()=>{ main.style.removeProperty('--list-w'); LS.removeItem(KEY); });
})();

function doPair(){
  // ① 페어링 링크를 붙여넣었으면 거기서 값을 뽑는다(권장 경로)
  const link=($('#p-link')?$('#p-link').value:'').trim();
  let room='', token='', cs='', cp='', dev='';
  let rk='';
  if(link){
    let q=null;
    try{
      const u=new URL(link);
      // 신형 링크는 fragment(#room=..) — 비밀이 서버 로그에 안 남는 형식. 구형(?room=)도 병행 수용.
      q=(u.hash&&u.hash.length>1)?new URLSearchParams(u.hash.slice(1)):u.searchParams;
    }
    catch(e){ try{ q=new URLSearchParams(link.replace(/^[^?#]*[?#]/,'')); }catch(_){ q=null; } }
    if(!q||!q.get('room')){ $('#p-err').textContent='페어링 링크를 인식하지 못했습니다. 전체 링크를 복사해 붙여넣으세요.'; return; }
    room=q.get('room')||''; cs=q.get('cs')||''; cp=q.get('cp')||'';
    dev=q.get('dev')||''; token=q.get('token')||''; rk=q.get('rk')||'';
  }else{
    room=$('#p-room').value.trim();
    token=$('#p-token').value.trim();
    cp=($('#p-cp')?$('#p-cp').value.trim():'');
    if(token.startsWith('cli_')){ cs=token; token=''; }
  }
  if(!room||!(cs||token)){ $('#p-err').textContent='페어링 링크를 붙여넣거나, 직접 입력을 채워주세요'; return; }
  if(cs&&!cp){ $('#p-err').textContent='cli_ 자격을 쓰려면 CLIENT PUBLIC ID(cpub_…)도 필요합니다'; return; }

  // 자격 저장 → connect() 가 cs 를 단기 JWT 로 교환해 사용한다
  if(dev){ LS.setItem('sm_devtoken',dev); conn.devToken=dev; }
  // E2EE 룸 키 — 링크로 수동 페어링해도 부트 경로와 동일하게 저장(빠지면 평문 접속이 돼버림)
  if(rk&&room){ LS.setItem('sm_e2ee_'+room, rk);
    if(window.ClewBridge) ClewBridge.syncRoomKey(room, rk); }
  if(cs&&cp){ LS.setItem('sm_cs',cs); LS.setItem('sm_cp',cp); LS.removeItem('sm_cjwt'); }
  else { LS.removeItem('sm_cs'); LS.removeItem('sm_cp'); LS.removeItem('sm_cjwt'); }

  $('#p-err').textContent=''; $('#p-go').textContent='연결 중…';
  conn.connect(room,token).then(()=>{
    LS.setItem('sm_room',room);
    if(token) LS.setItem('sm_token',token); else LS.removeItem('sm_token');
    pcsUpsert({room, cs, cp, dev});
    T=relayT; enterApp(); refreshPcsBtn();
  }).catch(e=>{ $('#p-err').textContent=e.message; $('#p-go').textContent='연결'; });
}

// ---- 버전 표기 -------------------------------------------------------------
// 로컬: 이 PC 설치본 버전 + 새 버전 여부(update/status). 원격: 접속한 PC 의 버전(auth 응답).
// 헤더 PC 선택 select — 로컬=localhost, 원격=저장된 닉네임. 목록에서 골라 전환.
const LOCAL_DEFAULT_URL='http://127.0.0.1:5100/';
let RELAY_APP_URL='https://clewpath.pyongso.com/relay/app';   // /api/owner/connection 에서 갱신
function localAppUrl(){ return (MODE==='local') ? (location.origin+'/') : LOCAL_DEFAULT_URL; }
function setTitle(nick){ document.title='ClewPath'+(nick?(' — '+nick):''); }
function roomLabel(room){ return 'PC '+String(room||'').replace(/^rm_/,'').slice(0,6); }
// 지금 선택된 대상의 표시 이름(로컬=localhost, 원격=닉네임)
function curPcLabel(){
  if(MODE==='local') return 'localhost';
  const room=LS.getItem('sm_room'); if(!room) return '';
  const pc=pcsLoad().find(x=>x.room===room);
  return pc ? pcName(pc) : roomLabel(room);
}
// 로컬 origin 에 저장하는 '릴레이 PC 목록 거울'(room+name 만, 토큰 없음). 릴레이 저장소는
// origin 이 달라 직접 못 읽어, 팝업(첫 파티 릴레이 페이지)이 postMessage 로 넘겨준 걸 여기 담는다.
function relayPcsLoad(){ try{ const a=JSON.parse(LS.getItem('sm_pcs_relay')||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function relayPcsSave(a){ LS.setItem('sm_pcs_relay', JSON.stringify(a)); }
function refreshPcSelect(){
  const sel=$('#pcname'); if(!sel) return;
  const curRoom=LS.getItem('sm_room');
  // localhost 항목: 폰에서는 무의미(폰에 로컬 서비스 없음) — 앱은 브리지가 숨기고,
  // 모바일 브라우저(릴레이 화면 + 터치 기기)에서도 숨긴다.
  const allowLocal=(!window.ClewBridge||ClewBridge.showLocalPcOption())
    && !(MODE==='relay'&&matchMedia('(pointer: coarse)').matches);
  const opts=allowLocal?[{v:'__local__', t:'🖥 localhost'}]:[];
  if(MODE==='relay'){
    const seen=new Set();
    pcsLoad().forEach(pc=>{ opts.push({v:pc.room, t:'🖥 '+pcName(pc)}); seen.add(pc.room); });
    if(curRoom && !seen.has(curRoom)) opts.push({v:curRoom, t:'🖥 '+roomLabel(curRoom)});
  } else {
    // 로컬: 릴레이에서 동기화해 둔 외부 PC 목록. 고르면 릴레이로 이동해 그 PC 가 선택된다.
    relayPcsLoad().forEach(pc=>{ opts.push({v:'relay:'+pc.room, t:'🖥 '+(pc.name||roomLabel(pc.room))}); });
    opts.push({v:'__sync__', t:'🔄 릴레이에서 PC 목록 동기화'});
  }
  sel.innerHTML='';
  opts.forEach(o=>{ const op=document.createElement('option'); op.value=o.v; op.textContent=o.t; sel.appendChild(op); });
  sel.value = (MODE==='local') ? '__local__' : (curRoom||(opts[0]&&opts[0].v)||'');
  setTitle(curPcLabel());
  sel.classList.remove('hidden');
}
// 릴레이 목록 동기화 — 릴레이 앱을 팝업으로 열면 그 페이지가 자기 목록을 postMessage 로 넘긴다.
function syncRelayPcs(){
  const w=window.open(RELAY_APP_URL+'?pcexport='+encodeURIComponent(location.origin),
                      'clewpath_pcsync','width=440,height=340');
  if(!w) toast('팝업이 차단됐습니다 — 팝업 허용 후 다시 시도하세요.');
}
// 팝업(릴레이)에서 넘어온 PC 목록 수신 — 릴레이 origin 만 신뢰, room+name 만 저장.
function onRelayPcsMessage(ev){
  try{
    if(ev.origin !== new URL(RELAY_APP_URL).origin) return;
    const d=ev.data;
    if(d && d.type==='clewpath_pcs' && Array.isArray(d.pcs)){
      relayPcsSave(d.pcs.map(x=>({room:String(x.room||''),name:String(x.name||'')})).filter(x=>x.room));
      refreshPcSelect();
      toast('릴레이 PC 목록 동기화됨 ('+d.pcs.length+'대)');
    }
  }catch(e){}
}
// 릴레이 앱이 ?pcexport 로 열렸을 때: 자기 PC 목록(room+name)을 opener(로컬)로 넘기고 끝.
function doExport(target){
  const ok=/^https?:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(target||'');   // 로컬 오리진만
  if(ok && window.opener){
    const list=pcsLoad().map(pc=>({room:pc.room, name:pc.name||''}));         // 토큰 제외
    try{ window.opener.postMessage({type:'clewpath_pcs', pcs:list}, target); }catch(e){}
  }
  document.body.innerHTML='<div style="padding:24px;font:15px system-ui;color:#e6edf3;'+
    'background:#0d1117;height:100vh">PC 목록을 로컬 앱으로 전송했습니다. 이 창은 닫으셔도 됩니다.</div>';
}
async function switchToPc(pc){
  pcsActivate(pc.room);
  toast(pcName(pc)+' 로 전환 중…');
  try{ conn.logout(); }catch(e){}
  conn._stopped=false; conn._retry=0;
  try{ await conn.connect(pc.room, LS.getItem('sm_token')||'');
       T=relayT; enterApp(); refreshPcsBtn(); refreshPcSelect(); toast(pcName(pc)+' 연결됨'); }
  catch(e){ toast('전환 실패: '+e.message); refreshPcSelect(); }
}
function onPcSelect(){
  const sel=$('#pcname'); if(!sel) return;
  const v=sel.value;
  if(v==='__local__'){ if(MODE==='local') return; location.href=localAppUrl(); return; }  // localhost 로
  if(v==='__sync__'){ syncRelayPcs(); refreshPcSelect(); return; }                        // 목록 동기화
  if(v.indexOf('relay:')===0){ location.href=RELAY_APP_URL+'?switch='+encodeURIComponent(v.slice(6)); return; } // 릴레이로 그 PC
  if(v===LS.getItem('sm_room')){ return; }                                                // 현재와 같음
  if(MODE==='relay'){ const pc=pcsLoad().find(x=>x.room===v)||{room:v,name:''}; switchToPc(pc); }
}
// 버전 상태는 설정 화면(⑤ 정보)이 소비한다. 헤더의 ⚙ 에는 새 버전일 때만 점 표시.
let VERSTATE={cur:null, latest:null};
function showVer(cur, latest){
  if(!cur) return;
  VERSTATE={cur, latest: latest||null};
  const g=$('#btn-settings');
  if(g) g.classList.toggle('upd', !!latest);
}
// 로컬: 뱃지 클릭 → 지금 업데이트 확인. 있으면 적용 모달, 없으면 '최신' 안내.
async function checkUpdateNow(cur){
  const body=el('div');
  const status=el('p',null,'업데이트 확인 중…'); body.appendChild(status);
  openModal('업데이트', body, []);
  try{
    const s=await T.api('GET','/api/owner/update/status',{query:{refresh:1}});
    if(s && s.dev){ status.textContent=`개발 소스에서 실행 중입니다 (v${s.current||cur}). 이 PC 는 git 으로 갱신하세요 — 자동 업데이트는 소스 트리 보호를 위해 막혀 있습니다.`; }
    else if(s && s.available && s.latest){ closeModal(); showUpdateApply(s.current||cur, s.latest); }
    else{ status.textContent=`현재 v${(s&&s.current)||cur} — 최신 버전입니다.`; }
  }catch(e){ status.textContent='업데이트 서버에 연결하지 못했습니다.'; }
}
// 원격/폰: 적용은 로컬에서만 되므로 방법만 안내
function showUpdateInfo(cur,latest){
  const body=el('div');
  if(latest) body.appendChild(el('p',null,`새 버전 ${latest} 이 나왔습니다 (현재 v${cur}).`));
  else body.appendChild(el('p',null,`접속한 PC 의 ClewPath 버전: v${cur} (최신 여부는 그 PC 로컬 웹에서 확인).`));
  body.appendChild(el('p',null,'업데이트는 그 PC의 로컬 웹(127.0.0.1:5100)에서 "지금 업데이트"를 누르거나, PowerShell 에서 설치 명령을 다시 실행하면 됩니다.'));
  const c=el('div','cwd','irm https://clewpath.pyongso.com/get | iex'); c.style.userSelect='all'; body.appendChild(c);
  openModal('업데이트', body, []);
}
// 로컬: 실제 적용 버튼
function showUpdateApply(cur,latest){
  const body=el('div');
  body.appendChild(el('p',null,`새 버전 ${latest} 이 나왔습니다 (현재 v${cur}).`));
  body.appendChild(el('p',null,'서명·해시를 검증한 뒤 적용하고, 실패하면 자동으로 이전 버전으로 되돌립니다. 설정·기기·페어링은 그대로 유지됩니다.'));
  // 업데이트 = 재기동: 영향 범위를 정확히 고지(실질 주의점은 열린 터미널의 진행 중 턴 하나뿐)
  body.appendChild(el('div','cwd',
    '※ ClewPath 로 열어둔 터미널·웹재개 화면은 재기동과 함께 닫힙니다 - 진행 중이던 '
    +'작업 턴은 중단되니 끝난 뒤 업데이트를 권장합니다. (대화 이력은 보존되어 재개하면 '
    +'이어지고, 직접 연 터미널의 claude 는 영향받지 않습니다)'));
  const status=el('div'); status.style.cssText='margin-top:10px;color:var(--ink2)'; body.appendChild(status);
  const go=el('button','btn full',`지금 v${latest} 로 업데이트`);
  go.onclick=async()=>{
    go.disabled=true; go.textContent='적용 중…'; status.textContent='서버가 새 버전을 받아 검증하고 있습니다…';
    try{
      const j=await T.api('POST','/api/owner/update/apply');   // 로컬=직접, 릴레이=원격 PC 에 적용
      if(j && j.applied){
        status.innerHTML='적용을 시작했습니다. 서비스가 잠시 재기동됩니다 — <b>30초 뒤 자동으로 새로고침</b>됩니다.';
        go.textContent='재기동 대기…';
        setTimeout(()=>location.reload(), 30000);
      } else {
        go.disabled=false; go.textContent=`지금 v${latest} 로 업데이트`;
        status.textContent='적용하지 못했습니다: '+((j&&(j.error||j.reason))||'알 수 없는 오류');
      }
    }catch(e){
      if(e && e.json && (e.json.error||e.json.reason)){   // 서버가 명시적으로 거부(예: 개발 소스)
        go.disabled=false; go.textContent=`지금 v${latest} 로 업데이트`;
        status.textContent='적용하지 못했습니다: '+(e.json.error||e.json.reason);
      } else {
        // 응답 전에 (원격이면 커넥터가) 재기동하며 연결이 끊긴 경우 — 정상 진행 신호.
        status.innerHTML='요청을 보냈습니다. 서비스가 재기동 중일 수 있습니다 — <b>30초 뒤 새로고침</b>하세요.';
        setTimeout(()=>location.reload(), 30000);
      }
    }
  };
  openModal('업데이트', body, [go]);
}
async function refreshVer(){
  try{
    // 로컬=직접 fetch, 릴레이=커넥터 프록시(T.api). refresh=1 로 캐시 아닌 '지금' 확인 →
    // 방금 게시된 새 버전도 화면 열자마자 감지. 원격 PC 도 동일하게 확인된다.
    const s=await T.api('GET','/api/owner/update/status',{query:{refresh:1}});
    if(!s) return;
    // 개발 소스면 자동적용이 막혀 있으므로 '업데이트 있음' 뱃지를 띄우지 않는다(눌러도 실패).
    showVer(s.current, (s.available&&s.latest&&!s.dev)?s.latest:null);
  }catch(e){}
}

// 모드별 부팅: local=페어링 없이 바로, relay=room/token 페어링
const _pcexport=new URLSearchParams(location.search).get('pcexport');
if(_pcexport){
  // 로컬 앱이 목록 동기화를 위해 이 릴레이 페이지를 팝업으로 열었다 — 목록만 넘기고 끝(부팅 안 함).
  doExport(_pcexport);
}else if(MODE==='local'){
  window.addEventListener('message', onRelayPcsMessage);   // 팝업 동기화 수신
  refreshConnBadge();                            // 접속 인증 모드 배지(JWT/fallback)
  setInterval(refreshConnBadge, 60000);
  refreshVer();                                  // 버전 + 새 버전 알림
  setInterval(refreshVer, 6*3600*1000);
  setStatus(true,true);
  enterApp();
  maybeShowFirstRunHint();
}else{
  // 페어링 파라미터: fragment(#) 우선 - query 는 릴레이 접근로그에 남을 수 있어
  // 신형 링크는 전부 fragment 로 온다. 구형(query) 링크도 계속 수용.
  const p=new URLSearchParams(location.search);
  if(location.hash.length>1){
    try{ new URLSearchParams(location.hash.slice(1)).forEach((v,k)=>p.set(k,v)); }catch(e){}
  }
  // E2EE 룸 키: 이 브라우저에만 저장(fragment 라 서버엔 안 감)
  if(p.get('rk')&&p.get('room')){ LS.setItem('sm_e2ee_'+p.get('room'), p.get('rk'));
    // ⑤ 앱: 룸 키를 네이티브 저장소에도 미러(M3 에서 iOS NSE 알림 복호가 읽는다). 웹=no-op.
    if(window.ClewBridge) ClewBridge.syncRoomKey(p.get('room'), p.get('rk'));
  }
  const dev=p.get('dev');
  if(dev){ LS.setItem('sm_devtoken',dev); conn.devToken=dev; }
  // 기기 전용 client 자격증명(공유 토큰 대체). 있으면 저장하고 JWT 로 교환해 쓴다.
  const cs=p.get('cs'), cpid=p.get('cp');
  if(cs&&cpid){ LS.setItem('sm_cs',cs); LS.setItem('sm_cp',cpid); LS.removeItem('sm_cjwt'); }
  if(p.get('room')) pcsUpsert({room:p.get('room'), cs:cs||'', cp:cpid||'', dev:dev||''});
  // ?switch=room : 로컬 페이지에서 고른 PC. 저장돼 있으면(자격 포함) 그 방을 활성화해 자동 접속.
  const swRoom=p.get('switch');
  if(swRoom){ const spc=pcsLoad().find(x=>x.room===swRoom); if(spc) pcsActivate(spc.room); }
  const room=p.get('room')||LS.getItem('sm_room')||'';
  const token=p.get('token')||LS.getItem('sm_token')||'';
  if(p.get('dev')||p.get('token')||p.get('cs')||p.get('rk')||swRoom){   // 주소창에서 비밀 제거
    try{ history.replaceState(null,'',location.pathname); }catch(e){}   // hash 도 함께 지워진다
  }
  $('#p-room').value=room; $('#p-token').value=token;
  // 저장된 자격이 있으면 자동 접속(기기 자격 cs 또는 구 공유 토큰)
  const hasCs=!!(LS.getItem('sm_cs')&&LS.getItem('sm_cp'));
  renderPairPcs();                       // 저장된 PC 가 있으면 페어링 화면에서 바로 고를 수 있게
  if(room&&(hasCs||token)){
    $('#p-err').textContent=''; $('#p-go').textContent='연결 중…';
    conn.connect(room,token).then(()=>{ LS.setItem('sm_room',room); T=relayT; enterApp(); refreshPcsBtn(); })
      .catch(e=>{ $('#p-err').textContent=e.message; $('#p-go').textContent='연결'; });
  }
}
</script>
