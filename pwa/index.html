// ---- 원격 권한 승인 (권한 대기 세션 -> PTY 키 주입) ----
const _approveBusy=new Set();
function showApprove(s){
  const rt=s.runtime||{};
  const body=el('div');
  body.appendChild(el('p',null,'세션이 도구 실행 권한을 기다리고 있습니다.'));
  if(rt.note) body.appendChild(el('div','cwd',rt.note));
  const status=el('div'); status.style.cssText='margin-top:8px;color:var(--ink2)';
  const act=async(action,label)=>{
    if(_approveBusy.has(s.session_id)) return;      // 이중 주입 방지
    _approveBusy.add(s.session_id);
    status.textContent=label+' 전송 중…';
    try{
      await T.api('POST',`/api/owner/sessions/${encodeURIComponent(s.session_id)}/respond`,{body:{action}});
      closeModal(); toast(label+' 했습니다');
      if(LIST_CTX) setTimeout(()=>LIST_CTX.rerender(), 400);
    }catch(e){
      if(e&&e.json&&e.json.error==='no_terminal')
        status.textContent='이 세션은 ClewPath 터미널(권한확인 유지)로 실행 중이 아니라 원격 승인이 안 됩니다. PC 화면에서 응답해 주세요.';
      else status.textContent='실패: '+e.message;
    }finally{ _approveBusy.delete(s.session_id); }
  };
  const b1=el('button','btn full','✅ 허용');
  b1.onclick=()=>act('allow','허용');
  const b2=el('button','btn ghost full','이 세션에서 계속 허용');
  b2.style.marginTop='8px'; b2.onclick=()=>act('allow_session','계속 허용');
  const b3=el('button','btn ghost full','❌ 거부');
  b3.style.cssText='margin-top:8px;color:#f85149';
  b3.onclick=()=>act('deny','거부');
  body.appendChild(status);
  openModal('✋ 권한 승인', body, [b1,b2,b3]);
}
// 옛 줄(continued-in) → 목록에 있는 이어받은 세션으로 따라간다(최대 8홉, 없으면 원래 것)
function continuedTarget(s){
  let cur=s, hops=0;
  while(cur&&cur.continued_in&&hops<8){
    const n=(SESSIONS||[]).find(x=>x.session_id===cur.continued_in); if(!n) break; cur=n; hops++;
  }
  return cur;
}
function renderRows(wrap,q){
  q=(q||'').toLowerCase().trim();
  const rows=SESSIONS.filter(s=>{
    if(ACTIVE_LABEL && !(s.labels||[]).includes(ACTIVE_LABEL)) return false;
    if(!q)return true;
    return ((s.cwd||'')+(s.title||'')+(s.slug||'')+(s.label_name||'')+(s.project_folder||'')).toLowerCase().includes(q); });
  wrap.innerHTML='';
  if(!rows.length){ wrap.appendChild(el('div','empty',
    (q||ACTIVE_LABEL)?'해당 세션 없음':'세션 없음')); return; }
  // 폴더(project_folder)별 그룹핑
  const groups=new Map();
  for(const s of rows){ const k=s.project_folder||'(기타)';
    if(!groups.has(k))groups.set(k,[]); groups.get(k).push(s); }
  // (claude -p 단발 기록은 Host 가 목록에서 아예 뺀다 — 2026-10-12 사장님. 지금 돌고 있는 것만 🤖 칩으로 보인다)
  const arr=[...groups.entries()].map(([k,list])=>({k,list,
    latest:list.reduce((m,s)=>Math.max(m,Date.parse(s.ended_at||'')||0),0)}));
  arr.sort((a,b)=>b.latest-a.latest);

  for(const g of arr){
    const repr=groupRepr(g.list);
    const collapsed = q ? false : COLLAPSED.has(g.k);  // 검색 중엔 항상 펼침
    const gh=el('button','ghead');
    gh.appendChild(el('span','chev',collapsed?'▶':'▼'));
    const gt=el('div','gtext');
    gt.appendChild(el('div','gbase','📁 '+baseName(repr)));
    gt.appendChild(el('div','gpath',repr));
    gh.appendChild(gt);
    gh.appendChild(el('span','gcount',g.list.length+''));
    gh.onclick=()=>{ if(COLLAPSED.has(g.k))COLLAPSED.delete(g.k); else COLLAPSED.add(g.k);
      renderRows(wrap,q); };
    wrap.appendChild(gh);
    if(collapsed) continue;
    const glist=el('div','glist');
    const mkRow=(s)=>{
      const srow=el('div','srow'); srow.dataset.sid=s.session_id;
      if(s.session_id===SELECTED_ID) srow.classList.add('sel');
      if((s.picker_hidden && !s.picker_expose) || s.headless) srow.classList.add('dim');  // 픽커 미표시·자동 실행 = 흐리게
      // 탭 영역(정보) → 상세
      const info=el('button','sinfo');
      const r1=el('div','sr1');
      const bd=sessionBadge(s);
      if(bd){ const d=el('span','sdot'+(bd.pulse?' pulse':'')); d.style.setProperty('--c',bd.c); r1.appendChild(d); }
      r1.appendChild(el('span','sname',s.title||s.label_name||s.slug||s.session_id.slice(0,8)));
      if(bd){ const t=el('span','sstate',bd.text); t.style.setProperty('--c',bd.c);
        if(bd.text==='권한 대기'){ t.style.cursor='pointer'; t.onclick=(e)=>{e.stopPropagation();showApprove(s);}; }
        r1.appendChild(t); }
      if(s.agent&&s.agent.kind==='background'){
        const g=el('span','schip agentbg','🤖 '+(s.agent.name||'에이전트'));
        g.title='백그라운드 에이전트가 이 세션 사용 중 - 이어재개 잠김(포크는 가능)';
        r1.appendChild(g);
      }
      // 피어(다른 곳에서 살아 있는 세션)는 칩 대신 오른쪽 재개 버튼 아이콘이 출처를 보여 준다(2026-09-30 사장님:
      // 'worker-3-ax-52' 같은 SendMessage 이름 칩은 봐도 이해가 안 됨)
      if(s.headless){
        const g=el('span','schip gear','🤖 자동 실행');
        g.title='claude -p(비대화형) 단발 실행 — 다른 세션·스크립트가 맡긴 일감. 끝나면 목록에서 사라집니다';
        r1.appendChild(g);
      } else if(s.picker_hidden&&!s.picker_expose){
        const g=el('span','schip gear','⚙ 에이전트');
        g.title='claude 재개 목록(피커)에 없는 세션 - 에이전트/포크 산물. 상세에서 설명 보기';
        r1.appendChild(g);
      }
      if(s.continued_in){
        // 옛 줄(continued-in): claude 가 대화를 새 세션으로 이어갔다. 열면 그 세션으로 보낸다(0.9.9)
        const tgt=(SESSIONS||[]).find(x=>x.session_id===s.continued_in);
        const g=el('span','schip cont','⏩ 이어받음');
        g.title='이 세션은 '+s.continued_in.slice(0,8)+'… 로 이어졌습니다'+(tgt?' — 열면 그 세션으로 갑니다':' (이어받은 세션이 목록에 없음)');
        r1.appendChild(g); srow.classList.add('dim');
      }
      // #라벨 칩은 목록에서 뺐다(2026-10-12 사장님) — 위 라벨 필터는 그대로. 대신 돌고 있는 쉘·모니터 수.
      { const d=cleanupLeft(s); if(d!=null&&d<=CLEANUP_SOON&&!s.headless){ const g=el('span','schip gone'+(d<=CLEANUP_ALERT?' hot':''),'⏳ '+cleanupText(s));
        g.title='claude 가 보관 기간이 지난 대화 기록을 '+cleanupDate(s)+'쯤 지웁니다 — 재개해서 한 번 주고받으면 기한이 늘어납니다'; r1.appendChild(g); } }
      { const t=bgText(s); if(t){ const g=el('span','schip bg',t);
        g.title='백그라운드에서 돌고 있는 쉘·모니터 — 남아 있는 동안은 「완료」로 바뀌지 않습니다'; r1.appendChild(g); } }
      if(s.resume_model){
        const mc=el('span','schip model'+(s.model_override?' set':''),'🧠 '+modelShort(s.resume_model));
        mc.title='재개 모델'+(s.model_override?'(설정됨)':'(감지값)')+' — 클릭해 변경';
        mc.onclick=(e)=>{ e.stopPropagation(); showModelPicker(s); };
        r1.appendChild(mc);
      }
      info.appendChild(r1);
      const meta=el('div','smeta2');
      meta.appendChild(el('span',null,(s.message_count||0)+' msgs'));
      meta.appendChild(el('span',null,fmtBytes(s.size_bytes)));
      { const rt=relFrom(s); if(rt)meta.appendChild(el('span',null,rt)); }
      info.appendChild(meta);
      if(s.cwd&&s.cwd!==repr) info.appendChild(el('div','spath',s.cwd));
      // 실행 중인 클루패스 터미널(또는 열린 탭)이면 바로 그 화면, 아니면 상세(2026-10-12 사장님)
      info.onclick=()=>jumpToSession(continuedTarget(s));
      // 큰 터치 버튼: (권한대기면 승인) / 재개
      if(bd&&bd.text==='권한 대기'){
        const bA=el('button','sbtn resume','✋'); bA.title='원격 승인';
        bA.style.color='#e8a03c'; bA.onclick=()=>showApprove(s);
        srow.appendChild(info); srow.appendChild(bA);
      } else { srow.appendChild(info); }
      const bR=el('button','sbtn resume', rowResumeIcon(s));
      bR.title=rowResumeTitle(s);
      bR.onclick=()=>showResumeChooser(continuedTarget(s));
      srow.appendChild(bR);
      // ⋯ 메뉴: 재개·대화 보기·이름 바꾸기·파일·상세(위험 동작은 넣지 않는다 — 상세의 위험 구역에서만)
      const bM=el('button','sbtn more','⋯'); bM.title='메뉴 — 재개 · 대화 보기 · 이름 바꾸기 · 파일 · 상세';
      bM.setAttribute('aria-label','세션 메뉴'); bM.setAttribute('aria-haspopup','menu');
      bM.onclick=(e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); return rowMenu(continuedTarget(s),bM); };
      srow.appendChild(bM);
      return srow;
    };
    for(const s of g.list) glist.appendChild(mkRow(s));
    wrap.appendChild(glist);
  }
}

// ---- 상세: 태그(라벨) 보기·설정 — ClewPath 자체 저장소(labels)만 쓴다(claude 파일 무접촉) ----
function allLabelNames(){ const m=new Map(); for(const x of (SESSIONS||[])) for(const l of (x.labels||[])) m.set(l,(m.get(l)||0)+1);
  return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(e=>e[0]); }
async function saveSessionLabels(s,next){
  const clean=[...new Set((next||[]).map(x=>String(x).trim().replace(/^#/,'')).filter(Boolean))];
  try{ await T.api('POST','/api/sessions/'+s.session_id+'/labels',{body:{labels:clean}}); }
  catch(e){ toast('태그 저장 실패: '+e.message); return false; }
  s.labels=clean;
  const o=(SESSIONS||[]).find(x=>x.session_id===s.session_id); if(o&&o!==s) o.labels=clean.slice();
  if(ACTIVE_LABEL&&!allLabelNames().includes(ACTIVE_LABEL)) ACTIVE_LABEL='';
  if(LIST_CTX&&LIST_VIEW==='sessions') LIST_CTX.rerender();      // 위 태그 필터 칩도 함께
  return true;
}
function renderDetailTags(wrap,s){
  wrap.innerHTML='';
  for(const l of (s.labels||[])){
    const c=el('span','dtag'); c.appendChild(el('span',null,'#'+l));
    const x=el('button','dtagx','×'); x.title='태그 빼기: '+l; x.setAttribute('aria-label','태그 빼기 '+l);
    x.onclick=async()=>{ if(await saveSessionLabels(s,(s.labels||[]).filter(v=>v!==l))) renderDetailTags(wrap,s); };
    c.appendChild(x); wrap.appendChild(c);
  }
  const add=el('button','dtagadd',(s.labels&&s.labels.length)?'＋ 태그':'＋ 태그 달기');
  add.title='태그를 달면 목록 위 태그 필터로 모아 볼 수 있습니다';
  add.onclick=()=>editSessionTags(s,()=>renderDetailTags(wrap,s));
  wrap.appendChild(add);
}
function editSessionTags(s,onDone){
  const body=el('div'); const cur=new Set(s.labels||[]);
  body.appendChild(el('div','cwd','새 태그를 적거나(쉼표로 여러 개), 아래에서 눌러 고르세요.'));
  const inp=el('input','inp dtaginp'); inp.placeholder='예: 북한법, 논문'; inp.setAttribute('autocapitalize','off'); body.appendChild(inp);
  const box=el('div','dtagpick'); body.appendChild(box);
  const draw=()=>{ box.innerHTML='';
    const names=[...new Set([...cur,...allLabelNames()])];
    if(!names.length) box.appendChild(el('div','cwd','아직 다른 태그가 없습니다.'));
    for(const l of names){ const b=el('button','fchip'+(cur.has(l)?' on':''),'#'+l);
      b.onclick=()=>{ if(cur.has(l)) cur.delete(l); else cur.add(l); draw(); }; box.appendChild(b); } };
  draw();
  const save=el('button','btn','저장');
  save.onclick=async()=>{ for(const t of String(inp.value||'').split(/[,，\s]+/)) { const v=t.trim().replace(/^#/,''); if(v) cur.add(v); }
    if(await saveSessionLabels(s,[...cur])){ closeModal(); toast('태그를 저장했습니다'); if(onDone) onDone(); } };
  inp.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault&&e.preventDefault(); save.onclick(); } };
  const cancel=el('button','btn ghost','취소'); cancel.onclick=()=>closeModal();
  openModal('🏷 태그 — '+sessLabel(s), body, [cancel, save]);
  return {body,inp,box,save,cur};
}

// ---- 🧹 정기 작업(2026-10-12): Host 의 작업 줄 하나가 차례로 돈다 — 쉬는 세션 정리 · 모델 목록 갱신 ----
async function hkPost(path,body){
  let cred={};
  if(MODE==='relay'){ cred=await ensurePriv(); if(cred===null) throw new Error('2차 인증이 필요합니다'); }
  return T.api('POST',path,{body,grace:cred.grace,otp:cred.otp});
}
async function toggleKeep(s,redraw){
  const next=!s.keep;
  try{ await T.api('POST','/api/sessions/'+s.session_id+'/keep',{body:{keep:next}}); }
  catch(e){ toast('바꾸지 못했습니다: '+e.message); return; }
  s.keep=next; const o=(SESSIONS||[]).find(x=>x.session_id===s.session_id); if(o) o.keep=next;
  if(redraw) redraw();
  toast(next?'항상 켜 둡니다 — 오래 쉬어도 자동으로 끄지 않습니다':'쉬는 세션 정리 대상에 다시 넣었습니다');
}
function hkAgo(sec){ if(!sec) return '아직 안 돎'; const d=Date.now()/1000+CLOCK_SKEW-sec;
  if(d<90) return '방금'; if(d<3600) return Math.floor(d/60)+'분 전'; if(d<86400) return Math.floor(d/3600)+'시간 전'; return Math.floor(d/86400)+'일 전'; }
function hkEvery(s){ return s>=86400?(s/86400)+'일마다':s>=3600?(s/3600)+'시간마다':(s/60)+'분마다'; }
async function showHousekeeping(){
  const body=el('div'); body.appendChild(el('div','spin'));
  openModal('🧹 정기 작업', body, []);
  let st; try{ st=await T.api('GET','/api/owner/housekeeping'); }
  catch(e){ body.innerHTML=''; body.appendChild(el('div','cwd','불러오지 못했습니다: '+e.message)); return; }
  renderHousekeeping(body,st);
}
function renderHousekeeping(body,st){
  body.innerHTML='';
  body.appendChild(el('div','cwd','PC 안의 작업 줄 하나가 아래 작업을 차례로 돌립니다(겹쳐 돌지 않음). Host 를 켠 뒤 5분 지나 시작합니다.'));
  const reload=async()=>{ try{ renderHousekeeping(body,await T.api('GET','/api/owner/housekeeping')); }catch(e){} };
  for(const j of (st.jobs||[])){
    const card=el('div','hkcard');
    const h=el('div','hkh'); h.appendChild(el('b',null,j.name)); h.appendChild(el('span','hkev',hkEvery(j.interval_s)));
    const tog=el('button','hktog'+(j.enabled?' on':''),j.enabled?'켜짐':'꺼짐'); tog.title=j.enabled?'끄기':'켜기';
    tog.onclick=async()=>{ try{ renderHousekeeping(body,Object.assign(await hkPost('/api/owner/housekeeping',{job:j.id,on:!j.enabled}),{idle_candidates:st.idle_candidates})); }
      catch(e){ toast('바꾸지 못했습니다: '+e.message); } };
    h.appendChild(tog); card.appendChild(h);
    card.appendChild(el('div','hkd',j.desc));
    card.appendChild(el('div','hkd','마지막: '+(j.running?'지금 도는 중…':hkAgo(j.last_run))+(j.last_summary?' · '+j.last_summary:'')+(j.last_ok===false?' ⚠':'')));
    if(j.id==='idle_sessions'){
      const hr=el('div','hkhours'); hr.appendChild(el('span',null,'기준:'));
      for(const n of (st.idle_hours_choices||[])){ const b=el('button','fchip'+(n===st.idle_hours?' on':''),n+'시간');
        b.onclick=async()=>{ if(n===st.idle_hours) return; try{ const r=await hkPost('/api/owner/housekeeping',{hours:n}); r.idle_candidates=null; renderHousekeeping(body,r); reload(); }
          catch(e){ toast('바꾸지 못했습니다: '+e.message); } }; hr.appendChild(b); }
      card.appendChild(hr);
      const c=st.idle_candidates;
      if(Array.isArray(c)) card.appendChild(el('div','hkd',c.length?('지금 기준이면 끌 세션 '+c.length+'개: '+c.slice(0,4).map(x=>x.title+'('+Math.floor(x.idle_s/3600)+'시간)').join(', ')+(c.length>4?' 외':'')):'지금 기준이면 끌 세션 없음'));
      card.appendChild(el('div','hkd','끄지 않는 경우: 화면을 보고 있음 · 권한 승인 대기 · 백그라운드 쉘·모니터가 남음 · 📌 항상 켜 두기(세션 상세 → 더 보기). 터미널에서 직접 띄운 claude 는 건드리지 않습니다. 끈 세션은 다시 열면 이어집니다.'));
    }
    const run=el('button','btn ghost sm','지금 실행');
    run.onclick=async()=>{ run.disabled=true; try{ await hkPost('/api/owner/housekeeping/'+j.id+'/run',{}); toast(j.name+' — 줄에 세웠습니다');
        setTimeout(reload,2500); }catch(e){ toast('실행하지 못했습니다: '+e.message); run.disabled=false; } };
    card.appendChild(run);
    body.appendChild(card);
  }
  if(st.builtin&&st.builtin.length){
    body.appendChild(el('div','setsec','항상 도는 것(설정 없음)'));
    for(const b of st.builtin) body.appendChild(el('div','hkd','· '+b.name+' — '+b.every+' · '+b.desc));
  }
}

function backbar(label,onback,cls){ const b=el('div','backbar'+(cls?' '+cls:''));
  const btn=el('button','toback','‹ '+label); btn.onclick=onback; b.appendChild(btn); return b; }
// 터미널·뷰어·재개는 상세와 같은 층(2026-10-14 사장님: 목록 줄 메뉴에서 바로 들어간다) — 되돌아가기는 '목록'(폰)뿐
const listBack=(onleave)=>backbar('목록',()=>{ if(onleave) onleave(); showListPane(); },'toonly');

async function loadDetail(s){
  closeLiveViewer();                       // 뷰어 실시간 스트림 정리(있으면)
  SELECTED_ID=s.session_id; highlightSelected();
  CURRENT_TERM_SID=null;                   // 터미널 화면에서 벗어남
  const main=paneDetail(); closeInlineMonitor(); main.classList.remove('term-mode','fb-mode','mon-mode'); main.innerHTML=''; $('#head').textContent='세션 상세';
  main.appendChild(backbar('목록',()=>showListPane(),'tolist'));
  showDetailPane();
  // 화면 재배치(2026-10-12, docs/designs/ux-reorg.md §4-3): 위 = 이름·상태·주 동작, 아래로 갈수록 덜 쓰는 것,
  // 맨 아래 「위험 구역」(되돌리기·강제 종료·삭제)만 따로 — 오터치로 위험 동작 확인창이 뜨지 않게, 무엇을 하는지 한 줄씩.
  const d=el('div','detail');

  const ren=el('button','dren','✎ 이름'); ren.title='이름 바꾸기'; ren.setAttribute('aria-label','이름 바꾸기'); ren.onclick=()=>renameNative(s);
  t1.appendChild(ren);
  const bd=sessionBadge(s);
  if(bd){ const b=el('span','dbadge',bd.text); b.style.setProperty('--c',bd.c); t1.appendChild(b); }
  else if(sessionIsLive(s)){ const b=el('span','dbadge','실행 중'); b.style.setProperty('--c','#3fb950'); t1.appendChild(b); }

  hd.appendChild(t1);

  // 태그: 목록 줄에선 뺐고(2026-10-12) 여기서 보고 바꾼다. 위 목록의 태그 필터는 이 값을 쓴다.
  const tg=el('div','dtags'); renderDetailTags(tg,s); hd.appendChild(tg);
  d.appendChild(hd);
  { const left=cleanupLeft(s); if(left!=null&&left<=CLEANUP_SOON&&!s.headless)
    d.appendChild(el('div','dnote warn','⏳ claude 가 이 대화 기록을 '+cleanupDate(s)+'쯤 지웁니다('+cleanupText(s)+'). '
      +'claude 는 마지막으로 쓴 뒤 보관 기간(기본 30일)이 지난 기록을 스스로 지웁니다. 재개해서 한 번 주고받으면 기한이 다시 늘어나고, '
      +'아래 「더 보기 → 내보내기」로 따로 보관할 수도 있습니다.')); }
  // 2. 주 동작: 재개(실행 중이면 터미널로) · 대화 보기 · 파일
  const prim=el('div','dprim');
  const bResume=el('button','btn dmain', s.live_terminal?'🖥 터미널로 돌아가기 (실행 중)':'▶ 재개');
  bResume.onclick=()=>showResumeChooser(s);

  bFiles.onclick=()=>openFilesFor(s);

  d.appendChild(prim);
  // 3. 요약 한 줄(마지막 · 메시지 · 모델 · 비용) + 자세히(정보·토큰)
  const sumCard=el('div','card dsum');

  const statBody=el('div','dstat'); statBody.appendChild(el('div','spin')); sumBody.appendChild(statBody);

// ---- 터미널 재개 (로컬=iframe terminal.html, 외부=내장 xterm+릴레이 스트림) ----
// ---- 멀티탭 터미널: 탭 상태(TABS) + 단일 화면(termView) ----
// TABS.list = 열린 터미널 탭들 [{key, s}]. key = fork_id||session_id — webterm 의 _ACTIVE 키와
// 같은 규칙이라 같은 PTY 를 두 탭이 가리킬 수 없다(= dedupe 의 근거). TABS.active = 전경 탭 key.
// 전경 탭만 라이브 WS 를 갖고(Phase1 = 단일 xterm 재접속) 배경 탭은 서버 persist PTY 로만
// 살아있다(설계 문서 docs/2026-09-10-multi-terminal-tabs-design.md §9).
// 이전엔 이 전부가 loadTerminal 클로저 지역변수 + 전역 _term={close} 였다 — "화면"과
// "어느 세션에 붙었나"를 분리해 객체로 들어야 탭 전환이 가능하다.
const TABS={ list:[], active:null };
const tabKey=(s)=>(s.fork_id||s.session_id);
const findTab=(key)=>TABS.list.find(t=>t.key===key)||null;

// termView: 터미널 영역(wrap) 안에 탭별 화면 인스턴스(릴레이=xterm, 로컬=iframe)를 보유한다.
//  · 전환은 즉시다: 이전 탭은 tc 만 닫고(stream_close → 서버 화면 detach, PTY·xterm 버퍼 유지)
//    host 를 숨기고, 대상 탭 host 를 보여 fit 한 뒤 tc 를 연다. 서버는 그 화면(screen_id)이 못 본
//    출력만 델타 리플레이하므로 이중 렌더도 공백도 없다(v0.8.0, webterm 화면 커서).
//  · 라이브 WS 는 전경 탭 1개뿐(모바일 안전). 배경 탭은 서버 persist PTY 로 살아있다.
//  · 로컬 iframe 은 탭별로 보유해 항상 붙어 있다(로컬은 WS 수 부담이 없다).
//  · dispose 는 뷰를 떠날 때 전부 해체. screenId 는 페이지 수명 동안만 — 새로고침 뒤엔 버퍼가
//    비므로 새 id 로 전체 tail 을 받는다(sm_tabs 에 저장하지 않는 이유).
const termView={
  main:null, wrap:null, strip:null, wl:null, ro:null, onWin:null,
  tabs:{},              // key -> {host, term, fit, ux, tc, frame, screenId, lastDim, ended}
  active:null,          // 전경 탭 key
  sid:null, disconnected:false,
  // 이 pane 에 터미널 뷰가 떠 있는가 — 탭 전환 fast-path(재구축 없이 attach 만)의 조건
  mounted(main){ return !!main && this.main===main && main.classList.contains('term-mode') && !!this.wrap; },
  cur(){ return this.active?this.tabs[this.active]:null; },
  send(obj){ const c=this.cur(); if(c&&c.tc){ try{c.tc.send(obj);}catch(e){} } },
  // 전경 탭만 fit. 크기가 실제로 바뀔 때만 통지(ResizeObserver 가 자주 불려도 과다 전송 방지)
  resize(){ const c=this.cur(); if(!c||!c.term||!c.fit) return;
    try{ c.fit.fit(); const dim=c.term.cols+'x'+c.term.rows;
      if(dim!==c.lastDim){ c.lastDim=dim; this.send({type:'resize',cols:c.term.cols,rows:c.term.rows}); } }catch(e){} },
  _newScreenId(){ return 'scr-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); },
  // 터미널 영역(wrap)과 뷰 공용 자원(wakeLock·리사이즈 감시)을 만든다. 로드 실패는 throw.
  async mount(main){
    this.main=main;
    const wrap=el('div','term-wrap'); main.appendChild(wrap); this.wrap=wrap;
    if(MODE==='local') return;
    await loadXterm();
    // 터미널 표시 중 화면꺼짐 방지(§5) — 뷰당 1개. 실패해도 무해(iOS<16.4 등).
    if(navigator.wakeLock&&navigator.wakeLock.request){
      navigator.wakeLock.request('screen').then(l=>{this.wl=l;}).catch(()=>{}); }
    this.onWin=()=>this.resize(); window.addEventListener('resize',this.onWin);
    // wrap 이 실제 크기를 얻거나 바뀔 때마다 전경 탭을 채운다 — 초기 레이아웃/창 리사이즈 모두.
    if(window.ResizeObserver){ this.ro=new ResizeObserver(()=>this.resize()); this.ro.observe(wrap); }
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>this.resize());
  },
  // 탭 인스턴스 보장(없으면 생성). host 는 wrap 안에 절대배치, 기본 숨김(.on 만 표시).
  _ensure(key, s, safe){
    let t=this.tabs[key]; if(t) return t;
    const host=el('div','thost'); this.wrap.appendChild(host);
    t={host, term:null, fit:null, ux:null, tc:null, frame:null, lastDim:'', ended:false, screenId:this._newScreenId()};
    if(MODE==='local'){
      // 로컬: 탭별 iframe(terminal.html 무수정). 숨겨도 자기 WS 로 계속 붙어 있다.
      const frame=document.createElement('iframe'); frame.setAttribute('allow','clipboard-read; clipboard-write');
      frame.src=`${APIBASE}/terminal?id=${encodeURIComponent(s.session_id)}&skip=${safe?0:1}`;
      host.appendChild(frame); t.frame=frame;
    } else {
      // 핀치로 조절한 글자 크기는 기기별로 기억한다(M2 스파이크)
      const savedFs=parseInt(LS.getItem('sm_term_fs')||'',10);
      const term=new Terminal({fontSize:(savedFs>=8&&savedFs<=22)?savedFs:13,cursorBlink:true,scrollback:10000,
        fontFamily:'ui-monospace,"Cascadia Code",Consolas,monospace',
        theme:{background:'#0d1117',foreground:'#e6edf3',cursor:'#58a6ff'}});
      const fit=new FitAddon.FitAddon(); term.loadAddon(fit); term.open(host);
      t.term=term; t.fit=fit;
      // 모바일 터치 UX(탭별). 입력은 이 탭이 전경일 때만 보낸다 — 숨은 xterm 이 포커스를 얻어도 유실/오전송 없음
      t.ux=attachMobileTermUX(host, term, {
        send:(d)=>{ if(this.active===key) this.send({type:'input',data:d}); },
        onFont:(fs)=>{ LS.setItem('sm_term_fs',String(fs)); this.resize(); }});
      // Ctrl 토글(보조키 바)은 실키보드 입력에도 적용된다 — transform 경유
      term.onData(d=>{ if(this.active!==key) return;
        if(matchMedia('(pointer: coarse)').matches && t.ux.intercept(d)) return;   // 깨진 한글 자모 → 입력창으로
        this.send({type:'input',data:t.ux.transform(d)}); });
    }
    this.tabs[key]=t; return t;
  },
  // 전경 탭을 세션 s 로 바꾼다. 이전 전경은 화면(tc)만 뗀다(PTY·xterm 버퍼 유지).
  attach(s, cred, safe, wasDead, wasTaken){
    const key=tabKey(s);
    if(this.active && this.active!==key){
      const p=this.tabs[this.active];
      if(p){ if(p.tc){ try{p.tc.close();}catch(e){} p.tc=null; } p.host.classList.remove('on'); if(p.ux&&p.ux.bar) p.ux.bar.remove(); }
    }
    const t=this._ensure(key, s, safe);
    this.active=key; this.sid=s.session_id; this.disconnected=false;
    t.host.classList.add('on');
    // PTY 가 죽어 새로 스폰되는 경우(복원 시점에 죽어 있던 탭, 또는 서버가 이 화면에 '세션 종료'를
    // 알린 탭): 이전 화면은 지난 프로세스의 것이라 비우고 새 screen id 로 받는다(서버 커서도 새 세션).
    // SESSIONS.live_terminal 은 20초 폴링이라 stale — 이걸 쓰면 살아있는 탭까지 비워 델타가 무너진다(실측).
    const fresh=!!wasDead||t.ended;
    if(MODE==='local'){
      // 빼앗겼던 iframe 은 WS 가 이미 끊겨 있다 → 리로드로 다시 붙는다(서버가 tail 리플레이). 릴레이는 델타 재접속이라 해당 없음
      if((fresh||wasTaken)&&t.frame){ t.frame.src=t.frame.src; t.ended=false; }
      try{ t.frame&&t.frame.contentWindow&&t.frame.contentWindow.dispatchEvent(new Event('resize')); }catch(e){}
      return;
    }
    if(t.tc) return;                       // 이미 라이브(같은 탭 재호출)
    const term=t.term;
    if(fresh){ term.reset(); t.lastDim=''; t.screenId=this._newScreenId(); t.ended=false; }
    // 보조키 바는 터치 기기에서만, 전경 탭 것만 붙인다
    if(matchMedia('(pointer: coarse)').matches && t.ux&&t.ux.bar) this.main.appendChild(t.ux.bar);
    // 세션 잠금 감지: 이전 Host 강제종료로 남은 고아가 claude bg 에이전트로
    // 승격되면 --resume 이 이 문구로 거부된다. 원문 에러만 흘리지 말고 원인과
    // 출구(포크)를 안내한다. 자동 정리는 하지 않음 - 사용자가 직접 만든 bg
    // 에이전트일 수도 있어(불가침 원칙) 구분이 안 되는 정리는 위험하다.
    let _bgLockNotified=false;
    const _detectBgLock=(chunk)=>{
      if(_bgLockNotified||chunk.indexOf('running as a background agent')<0) return;
      _bgLockNotified=true;
      const body=el('div');
      body.appendChild(el('p',null,'이 세션이 백그라운드 실행에 잠겨 있어 이어서 재개할 수 없습니다.'));
      const why=el('div','cwd'); why.style.whiteSpace='pre-line';
      why.textContent='가능한 원인:\n'
        +'  · 이전에 열어둔 터미널이 백그라운드로 남아 있음 (PC 재시작·업데이트 후 흔함)\n'
        +'  · 직접 만든 백그라운드 에이전트가 이 세션을 쓰는 중\n\n'
        +'해결:\n'
        +'  · 아래 [포크로 재개] - 원본을 건드리지 않는 사본에서 바로 이어서 작업 (권장)\n'
        +'  · 또는 PC 터미널에서 claude agents 로 해당 실행을 확인·종료한 뒤 다시 재개';
      body.appendChild(why);
      const go=el('button','btn full','🔱 포크로 재개');
      go.onclick=()=>{ closeModal(); leaveTerminalView(); loadResume(s,false); };
      openModal('세션이 잠겨 있습니다', body, [go]);
    };
    // screen: 서버가 이 화면에 보낸 오프셋을 기억 → 재접속 때 못 본 델타만 리플레이(배너 없음)
    const tabRec=findTab(key); if(tabRec) tabRec.taken=false;   // 붙는 순간 '빼앗김' 해제
    t.tc=T.terminal(s.session_id,(data,eof,err)=>{
      if(eof){ const dead=t.tc; t.tc=null;
        if(dead){ try{dead.close();}catch(e){} }         // 핸들러 제거(eof 뒤 남으면 conn.streams 누수)
        const rec=findTab(key);
        if(rec&&rec.taken){
          // 다른 화면이 가져간 것(v0.9.4): 장애가 아니므로 자동 재접속(disconnected) 대상에서 뺀다 —
          // 화면 복귀 때 다시 빼앗아 핑퐁이 나지 않게. 가져오려면 사용자가 탭을 누른다(확인창).
          term.write('\r\n\x1b[93m── 다른 기기에서 보는 중 — 다시 가져오려면 탭을 누르세요 ──\x1b[0m\r\n');
          renderTabBarSoon(); return; }
        if(this.active===key) this.disconnected=true;   // 재연결·화면 복귀 시 reattachForegroundTab 의 근거
        if(err==='2fa_invalid'||err==='2fa_required') clearGrace();
        term.write('\r\n\x1b[91m── '+(err?otpErrMsg(err):'연결 종료')+' ──\x1b[0m\r\n'); }
      else { _detectBgLock(data);
        if(data.indexOf('세션이 종료되었습니다')>=0) t.ended=true;   // 다음 attach 는 새 스폰 → 화면 비움
        if(data.indexOf(TAKEOVER_NOTE)>=0){ const rec=findTab(key); if(rec) rec.taken=true; }   // 서버 인계 통지
        term.write(data); } }, Object.assign({}, cred||{}, {screen:t.screenId}));
    setTimeout(()=>this.resize(),80); setTimeout(()=>this.resize(),300); term.focus();
  },
  // 전경 화면만 뗀다(PTY·버퍼 유지). tc.close() → stream_close → 서버 화면 detach.
  detach(){ const c=this.cur(); if(c&&c.tc){ try{c.tc.close();}catch(e){} c.tc=null; } this.sid=null; },
  // 탭 하나의 인스턴스 해체(탭 닫기). 로컬 iframe 은 about:blank 로 WS 를 닫게 한다.
  closeTabInstance(key){ const t=this.tabs[key]; if(!t) return;
    if(t.tc){ try{t.tc.close();}catch(e){} t.tc=null; }
    if(t.ux){ try{t.ux.dispose();}catch(e){} if(t.ux.bar) t.ux.bar.remove(); }
    if(t.term){ try{t.term.dispose();}catch(e){} }
    if(t.frame){ try{t.frame.src='about:blank';}catch(e){} }
    t.host.remove(); delete this.tabs[key];
    if(this.active===key){ this.active=null; this.sid=null; } },
  // 전부 해체(뷰를 떠날 때). 탭 목록(TABS)은 건드리지 않는다 — 배경 PTY 는 살아있다.
  dispose(){ for(const k of Object.keys(this.tabs)) this.closeTabInstance(k); tabBadge.close();
    if(this.onWin){ window.removeEventListener('resize',this.onWin); this.onWin=null; }
    if(this.ro){ try{this.ro.disconnect();}catch(e){} this.ro=null; }
    if(this.wl){ try{this.wl.release();}catch(e){} this.wl=null; }
    if(this.wrap){ this.wrap.remove(); this.wrap=null; }
    this.main=null; this.strip=null; this.active=null; this.sid=null; this.disconnected=false; },
};
// 터미널 뷰를 떠날 때(상세/이력/종료/포크) 화면 전부 해체. 탭 목록은 유지(배경 PTY 살아있음).
function leaveTerminalView(){ termView.dispose(); }
function removeTab(key){ TABS.list=TABS.list.filter(t=>t.key!==key); if(TABS.active===key) TABS.active=null;
  termView.closeTabInstance(key); }   // 보유하던 xterm/iframe 해제

// ---- 멀티탭 동작: 탭 스트립·전환·닫기·추가·저장/복원·재접속 ----
const TAB_SOFT_CAP=6;   // 클라 경고선. 서버 하드 상한(SM_MAX_TERMINALS, 기본 8)은 webterm 이 따로 막는다.
function sessLabel(s){ return s.title||s.label_name||s.slug||(s.session_id||'').slice(0,8); }
// 서버(webterm.TAKEOVER_NOTE)가 밀려나는 화면에 보내는 인계 통지 문구 — 스트림에서 감지해 탭을 taken 으로
const TAKEOVER_NOTE='다른 화면이 이 세션을 가져갔습니다';
// 다른 화면이 붙어 있는 세션을 가져오기 전 확인(v0.9.4). t0 = 이 페이지의 탭(있으면), s.screen = 목록의 참고값.
function shouldConfirmTakeover(s, t0){
  if(t0&&t0.taken) return true;                                   // 우리 화면이 밀려난 걸 확실히 안다
  // 로컬(iframe)은 화면 id 가 없어 목록의 screen 이 '내 iframe' 인지 남인지 못 가린다 → 통지(taken)로만 판단
  if(MODE==='local') return false;
  const sc=s&&s.screen; if(!sc||!sc.attached) return false;      // 붙은 화면 없음(또는 stale false — 상대 통지가 메운다)
  const mine=t0&&termView.tabs&&termView.tabs[t0.key]&&termView.tabs[t0.key].screenId;
  return !(mine&&sc.screen_id===mine);                            // 붙은 화면이 내 것이면 그냥 재접속
}
// 세션 색: 모니터 색은 서버(webmonitor)가 주지만 터미널엔 없다 → 클라에서 결정적 hash→hsl.
function tabColor(sid){ let h=0; for(const c of String(sid)) h=(h*31+c.charCodeAt(0))>>>0; return `hsl(${h%360},62%,58%)`; }
function saveTabs(){
  try{ LS.setItem('sm_tabs',JSON.stringify({active:TABS.active,
    list:TABS.list.map(t=>({key:t.key,sid:t.s.session_id,safe:!!t.safe}))})); }catch(e){}
}
// 부팅 후 SESSIONS 가 준비된 시점에 1회. 탭 '목록'만 복원하고 터미널은 열지 않는다 — 자동으로
// 붙이면 다른 기기가 쥔 화면을 탈취한다(세션당 화면 1개, webterm 점유 규칙). live_terminal 이
// false 면 dead(PTY 없음, 다시 열면 새 스폰)로 표시. 삭제/이사돼 목록에 없는 세션은 버린다.
let _tabsRestored=false;
function restoreTabsOnce(){
  if(_tabsRestored) return; _tabsRestored=true;
  let saved=null; try{ saved=JSON.parse(LS.getItem('sm_tabs')||'null'); }catch(e){}
  if(!saved||!Array.isArray(saved.list)||!saved.list.length) return;
  const byId=new Map((SESSIONS||[]).map(s=>[s.session_id,s]));
  let n=0;
  for(const it of saved.list){
    const s=byId.get(it.sid); if(!s||findTab(it.key)) continue;
    TABS.list.push({key:it.key,s,safe:!!it.safe,dead:!s.live_terminal}); n++;
  }
  if(saved.active&&findTab(saved.active)) TABS.active=saved.active;
  if(n) toast(`터미널 탭 ${n}개 복원됨 (터미널을 열면 탭 스트립에 보입니다)`);
  saveTabs();
}
// 탭 스트립을 그린다(termView.strip). 모니터 범례 칩 CSS 재사용(lchip/ldot/lx/ladd/sel).
// 배지 이벤트 종류(툴팁용): 모니터 이벤트의 role/tools/tool_results 로 사람이 읽을 한 줄.
function tabEvKind(ev){
  if(ev.role==='assistant'){ const tl=ev.tools||[]; return tl.length? '도구 실행('+tl.slice(0,3).join(', ')+(tl.length>3?' 외':'')+')' : '응답'; }
  if(ev.role==='user') return (ev.tool_results&&ev.tool_results.length)? '도구 결과' : '프롬프트 입력';
  return '이벤트';
}
function relIso(iso){ const sec=Date.parse(iso||'')/1000; return isNaN(sec)?'':relTs(sec); }
function renderTabBar(){
  const strip=termView.strip; if(!strip) return;
  strip.innerHTML='';
  TABS.list.forEach(t=>{
    // 표시는 목록의 최신 객체로(제목·훅 상태 변동 반영). t.s 자체는 switchTab 이 갱신한다.
    const s=(SESSIONS||[]).find(x=>x.session_id===t.s.session_id)||t.s, on=(t.key===TABS.active);
    const chip=el('span','lchip'+(on?' sel':'')+(t.dead?' dead':'')+(t.taken?' taken':''));
    const lines=[(t.dead?'[중지됨 — 열면 새로 시작] ':'')+(t.taken?'[다른 기기에서 보는 중 — 누르면 가져오기] ':'')+sessLabel(s), s.session_id];
    const dot=el('span','ldot'); dot.style.background=tabColor(s.session_id); chip.appendChild(dot);
    chip.appendChild(el('span','lname',sessLabel(s)));
    // 상태 밑줄 — 목록 뱃지(훅 상태, 신선도 게이트 포함)와 같은 판정·색. 중지된 탭은 상태 없음.
    const st=t.dead?null:sessionBadge(s);
    if(st){ chip.classList.add('st'); if(st.pulse) chip.classList.add('stpulse'); chip.style.setProperty('--st',st.c); lines.push('상태: '+st.text); }
    if(t.act&&!on){ const a=el('span','lact'); a.title='새 출력 있음'; chip.appendChild(a);
      lines.push('● 새 출력 '+(t.actN||1)+'건'+(t.last?' · 최근: '+t.last.what+' ('+relIso(t.last.at)+')':'')); }
    chip.title=lines.join('\n');
    const x=el('span','lx','×'); x.title='탭 닫기';
    x.onclick=(ev)=>{ ev.stopPropagation(); closeTab(t.key); };
    chip.appendChild(x);
    chip.onclick=()=>switchTab(t.key);
    strip.appendChild(chip);
  });
  const add=el('button','ladd','+ 탭'); add.title='다른 세션을 터미널 탭으로 추가';
  add.onclick=openTabPicker; strip.appendChild(add);
  // 활성 칩이 보이도록 스크롤(모바일 가로 스트립) — 활성 탭이 바뀐 렌더에서만(주기 재렌더가
  // 사용자가 넘겨 둔 스트립 스크롤을 되돌리지 않게)
  const sel=strip.querySelector('.lchip.sel');
  if(sel&&sel.scrollIntoView&&strip._sel!==TABS.active){ strip._sel=TABS.active; try{ sel.scrollIntoView({inline:'nearest',block:'nearest'}); }catch(e){} }
  tabBadge.sync();   // 탭 집합이 바뀔 때마다 배지 구독을 맞춘다(생성/차분/재구독)
}
// 이벤트마다 스트립을 갈아엎지 않게 300ms 로 모아 렌더(툴팁 건수·상태 갱신용).
let _tabBarTimer=null;
function renderTabBarSoon(){ if(_tabBarTimer) return; _tabBarTimer=setTimeout(()=>{ _tabBarTimer=null; renderTabBar(); },300); }
// ---- 배경 탭 활동 배지: 모니터 tail 스트림 1개 재사용 (설계 §4) ----
// 열린 탭 sid 들을 모니터 그룹으로 구독한다(라이브 터미널 WS 1 + 모니터 WS 1 = 총 2).
// 배경 탭에 '구독 이후' 새 이벤트가 오면 칩에 점(.lact). webmonitor 는 snapshot 뿐 아니라
// add 직후에도 그 세션의 과거 이벤트를 `events` 로 리플레이하므로 타입으로는 못 거른다 —
// 구독 시각(서버 시계 보정) 이후 ts 만 인정한다. 그 탭으로 전환하면 소거(loadTerminal).
const tabBadge={
  h:null, subs:new Set(), armedAt:{},
  _now(){ const skew=(typeof CLOCK_SKEW==='number')?CLOCK_SKEW:0; return new Date(Date.now()+skew*1000).toISOString(); },
  // renderTabBar 마다 호출: 없으면 구독 생성, 있으면 탭 집합과의 차분만 add/remove.
  sync(){
    const want=TABS.list.map(t=>t.s.session_id);
    if(!termView.main||!want.length){ this.close(); return; }
    if(!this.h){
      const arm=this._now(); this.subs=new Set(want); want.forEach(s=>{ this.armedAt[s]=arm; });
      try{ this.h=T.monitor(want.join(','), null, (data,eof)=>{
        if(eof){ this.h=null; this.subs=new Set(); return; }   // 재연결 등 — 다음 sync 가 재구독
        this._on(data); }); }
      catch(e){ this.h=null; }
      return;
    }
    for(const s of want){ if(!this.subs.has(s)){ this.armedAt[s]=this._now(); this.subs.add(s); try{this.h.add(s,'sub');}catch(e){} } }
    for(const s of [...this.subs]){ if(want.indexOf(s)<0){ this.subs.delete(s); delete this.armedAt[s]; try{this.h.remove(s);}catch(e){} } }
  },
  _on(data){
    let m; try{ m=JSON.parse(data); }catch(e){ return; }
    if(m.type!=='events'||!Array.isArray(m.events)) return;   // snapshot/heartbeat/group/error 무시
    let changed=false;
    for(const ev of m.events){
      const sid=ev.session_id; if(!sid) continue;
      const t=TABS.list.find(x=>x.s.session_id===sid);
      if(!t||t.key===TABS.active) continue;                    // 전경 탭은 눈으로 보고 있다
      const arm=this.armedAt[sid]; if(!arm||!ev.ts||ev.ts<=arm) continue;   // 프라임/과거 이벤트
      if(!t.act){ t.act=true; t.actN=0; }
      t.actN=(t.actN||0)+1; t.last={what:tabEvKind(ev), at:ev.ts};        // 툴팁: 건수·최근 종류
      changed=true;
    }
    if(changed) renderTabBarSoon();
  },
  close(){ if(this.h){ try{this.h.close();}catch(e){} } this.h=null; this.subs=new Set(); this.armedAt={}; },
};
function switchTab(key){
  const t=findTab(key); if(!t) return;
  // 이미 전경 — 단 터미널 화면이 실제로 떠 있을 때만(상세/목록으로 나간 뒤엔 탭이 '활성'이어도
  // 화면이 없다 → 다시 구축해야 한다. 알림→탭 점프 e2e 에서 발견)
  if(key===TABS.active&&termView.sid===t.s.session_id&&!termView.disconnected&&!t.taken&&paneDetail().classList.contains('term-mode')) return;
  // 목록의 최신 세션 객체로 갱신(제목·live_terminal 변동 반영)
  const fresh=(SESSIONS||[]).find(s=>s.session_id===t.s.session_id); if(fresh) t.s=fresh;
  loadTerminal(t.s, t.safe);   // 뷰가 떠 있으면 fast-path(attach 만), 아니면 구축
}
// 탭 닫기: 결정 2 — '화면만 닫기(PTY 유지)' vs '세션 종료(PTY 종료, 원격은 OTP)'.
function closeTab(key){
  const t=findTab(key); if(!t) return;
  const s=t.s;
  const body=el('div');
  body.appendChild(el('p',null,`'${sessLabel(s)}' 탭을 닫습니다.`));
  const why=el('div','cwd'); why.style.whiteSpace='pre-line';
  why.textContent=t.dead
    ? '이 탭의 claude 프로세스는 이미 없습니다(중지됨). 탭만 내립니다.'
    : '· 화면만 닫기: claude 프로세스는 계속 실행됩니다. 나중에 다시 열면 그대로 이어집니다.\n'
     +'· 세션 종료: claude 프로세스까지 끝냅니다(작업 중이면 중단). 대화 기록은 남습니다.';
  body.appendChild(why);
  const after=()=>{ closeModal();
    const wasActive=(TABS.active===key);
    removeTab(key); saveTabs();
    if(!wasActive){ renderTabBar(); return; }
    // 전경 탭을 닫았다: 이웃 탭으로, 없으면 뷰를 떠난다
    const next=TABS.list[0];
    if(next){ switchTab(next.key); } else { leaveTerminalView(); loadDetail(s); }
  };
  const bDetach=el('button','btn',t.dead?'탭 닫기':'화면만 닫기');
  bDetach.onclick=()=>{ if(TABS.active===key) termView.detach(); after(); };
  const btns=[bDetach];
  if(!t.dead){
    const bStop=el('button','btn','⏹ 세션 종료'); bStop.style.color='#e66';
    bStop.onclick=async()=>{ if(await stopSessionTerminal(s)) after(); };
    btns.push(bStop);
  }
  openModal('탭 닫기', body, btns);
}
// 터미널 프로세스 종료. 원격은 OTP/grace 동반 — stop 도 start 와 같은 2FA 게이트를 탄다(커넥터).
async function stopSessionTerminal(s){
  let cred={};
  if(MODE==='relay'){ cred=await ensurePriv(); if(cred===null) return false; }
  try{ await T.api('POST',`/api/sessions/${s.session_id}/terminal/stop`,{grace:cred.grace,otp:cred.otp});
    toast('터미널을 종료했습니다'); return true; }
  catch(e){ if(e.message==='2fa_invalid'||e.message==='2fa_required') clearGrace();
    toast('종료 실패: '+e.message); return false; }
}
function openTabPicker(){
  if(TABS.list.length>=TAB_SOFT_CAP &&
     !confirm(`터미널 탭이 ${TABS.list.length}개 열려 있습니다.\n각 탭은 이 PC 에서 claude 프로세스 1개를 띄웁니다(메모리·CPU). 더 여시겠어요?`)) return;
  const group={}; TABS.list.forEach(t=>{ group[t.s.session_id]=true; });
  showAddSessionPicker(group, sid=>{
    const s=(SESSIONS||[]).find(x=>x.session_id===sid); if(!s) return;
    loadTerminal(s);
  }, {title:'➕ 터미널 탭 추가', hint:'터미널로 열어 탭에 추가할 세션을 고르세요. 이미 열린 탭은 목록에 없습니다.'});
}
// 릴레이 재연결·화면 복귀 시: 전경 탭이 끊겨 있으면 persist PTY 에 다시 붙인다(서버가 tail 리플레이).
function reattachForegroundTab(){
  // disconnected && active = "사용자가 보고 있던 전경 터미널이 발밑에서 죽었다"는 뜻이다
  // (사용자가 스스로 떠났으면 leaveTerminalView→dispose 가 disconnected 를 지운다).

      if(m.timestamp&&m.timestamp>lastTs) lastTs=m.timestamp; }
    main.scrollTop=main.scrollHeight;
  }catch(e){ wrap.innerHTML=''; wrap.appendChild(el('div','empty','뷰어 실패: '+e.message)); return; }
  // 실시간 tail: 단일 세션 monitor 스트림을 붙여 새 메시지를 같은 카드로 append
  const setBadge=(on,txt)=>{ badge.className='vlive '+(on?'on':'off'); bt.textContent=txt; };
  const nearBot=()=> main.scrollHeight-main.scrollTop-main.clientHeight < 120;
  function onMsg(dataStr,eof){
    if(eof){ setBadge(false,'연결 끊김'); return; }
    let m; try{ m=JSON.parse(dataStr); }catch(e){ return; }
    if(m.type==='heartbeat'){ setBadge(true,'● 실시간'); return; }
    if(m.type==='snapshot'||m.type==='events'){
      const stick=nearBot(); const empty=wrap.querySelector('.empty');
      (m.events||[]).forEach(ev=>{
        if(ev.ts && lastTs && ev.ts<=lastTs) return;   // 스냅샷과 중복 제거
        if(ev.ts) lastTs=ev.ts;
        if(empty) empty.remove();
        renderHistoryMsg(wrap, ev, pend);
      });
      setBadge(true,'● 실시간');
      if(stick) main.scrollTop=main.scrollHeight;
    }
  }
  try{ _liveViewer=T.monitor(s.session_id, s.session_id, onMsg); }
  catch(e){ setBadge(false,'실시간 불가'); }
}

// 서버가 깔끔한 대화만(메타/도구인자/thinking 제외) 최근 limit개 준다.
async function fetchRecentMessages(sid,limit=200){

// 깔끔 렌더: user=플레인, assistant=마크다운 + 사용도구 칩
function renderHistoryMsg(wrap,m,pend){
  const text=(m.text||'').trim();
  if(m.role==='user'){
    // 도구 결과 레코드면 해당 카드에 결과를 채운다(말풍선 아님)
    if(m.tool_results&&m.tool_results.length) feedToolResults(m.tool_results,pend||{});
    if(text){ const d=el('div','msg user'); d.textContent=text; wrap.appendChild(d); }
    return;
  }
  if(m.role==='assistant'){
    if(text){ const d=el('div','msg assistant'); d.innerHTML=mdToHtml(text); wrap.appendChild(d); }
    if(m.tool_calls&&m.tool_calls.length){
      m.tool_calls.forEach(tc=>renderToolUse(wrap,tc,pend||{}));
    } else if(m.tools&&m.tools.length){   // 구버전 서버 호환(이름만 올 때)
      wrap.appendChild(el('div','tool','🔧 '+[...new Set(m.tools)].join(', ')));
    }
  }
}

// 최소 마크다운 → HTML. XSS 안전: 먼저 이스케이프하고 내가 넣는 태그만 허용.
function mdToHtml(src){
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const inl=s=>{ s=esc(s);
    s=s.replace(/`([^`\n]+)`/g,(m,c)=>'<code>'+c+'</code>');
    s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
    return s; };
  const fences=[];
  src=String(src).replace(/```[^\n]*\n?([\s\S]*?)```/g,(m,code)=>{
    fences.push(code); return '\uE010'+(fences.length-1)+'\uE011'; });
  const lines=src.split('\n'); const out=[]; let i=0;
  const hasPipe=l=>l.indexOf('|')>=0;
  const isSep=l=>/^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(l);
  const cells=l=>{ let x=l.trim(); if(x[0]==='|')x=x.slice(1); if(x[x.length-1]==='|')x=x.slice(0,-1);
    return x.split('|').map(c=>c.trim()); };
  while(i<lines.length){
    const l=lines[i];
    if(hasPipe(l) && i+1<lines.length && isSep(lines[i+1])){
      const head=cells(l); i+=2; const body=[];
      while(i<lines.length && hasPipe(lines[i]) && lines[i].trim()){ body.push(cells(lines[i])); i++; }
      let tb='<table><thead><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead>';
      if(body.length) tb+='<tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody>';
      out.push(tb+'</table>'); continue;
    }
    let h=l.match(/^#{1,6}\s+(.+)$/); if(h){ out.push('<strong>'+inl(h[1])+'</strong>'); i++; continue; }
    let b=l.match(/^\s*[-*]\s+(.+)$/); if(b){ out.push('\u2022 '+inl(b[1])); i++; continue; }
    out.push(inl(l)); i++;
  }
  let html=out.join('\n');
  html=html.replace(/\uE010(\d+)\uE011/g,(m,k)=>'<pre>'+esc(fences[+k])+'</pre>');
  return html;
}

// ---- 재개(스트리밍 + 입력) ----
async function loadResume(s, inplace, safe){
  const isIn = inplace!==false;   // 기본 in-place(실제 세션)
  let cred={};
  if(isIn){ cred=await ensurePriv(); if(cred===null) return; }   // 외부 in-place → grace/2차 인증
  if(safe) cred={...cred, safe:true};   // 일반 모드: 도구 자동허용 없이(웹은 물을 수 없어 거부됨)
  const main=paneDetail(); closeInlineMonitor(); main.classList.remove('term-mode','fb-mode','mon-mode'); main.innerHTML='';
  $('#head').textContent='재개'+(safe?' (일반)':'');
  main.appendChild(listBack(()=>{ sess&&sess.close(); }));
  showDetailPane();
  const stream=el('div','stream'); main.appendChild(stream);
  stream.appendChild(el('div','result', isIn
    ? '⚠ 실제 세션을 그대로 이어갑니다 (in-place)'
    // 포크 혼동 예방(실사용자 사고): 화면에 과거 대화가 안 보여 "이력이
    // 사라졌다"고 오인하기 쉽다 - 맥락은 이어받았고 원본은 그대로임을 명시.
    : '🔱 복제본에서 진행 — 이전 대화 맥락은 이어받았습니다. 화면에 과거 이력이 '
      +'안 보이는 건 정상이며, 원본 세션의 이력은 그대로 보존됩니다.'));
  // composer (상세 pane 하단 고정)
  const comp=el('div','composer');
  const ta=el('textarea'); ta.rows=1; ta.placeholder='메시지 입력…';
  ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';};
  const send=el('button','send','↑');
  comp.appendChild(ta); comp.appendChild(send);
  main.appendChild(comp);
  let sess=null, busy=false, busyEl=null;
  const cleanup=()=>{ comp.remove(); };
  // back 시 composer 제거
  const obs=new MutationObserver(()=>{ if(!document.contains(stream)){cleanup();obs.disconnect();} });
  obs.observe(main,{childList:true});
  // busyEl 이 있으면 그 위에 삽입(진행표시기는 항상 맨 아래 유지)
  const push=(cls,txt)=>{ const d=el('div',cls); if(txt!=null)d.textContent=txt;
    if(busyEl) stream.insertBefore(d,busyEl); else stream.appendChild(d);
    main.scrollTop=main.scrollHeight; return d; };
  const setBusy=(on)=>{ busy=on; send.disabled=on;
    send.classList.toggle('working',on); send.textContent=on?'…':'↑';
    if(on){ if(!busyEl){ busyEl=el('div','busy');
      busyEl.innerHTML='<span class="bdot"></span><span class="bdot"></span><span class="bdot"></span>'
        +'<span style="margin-left:6px">작업 중…</span>';
      stream.appendChild(busyEl); main.scrollTop=main.scrollHeight; } }
    else if(busyEl){ busyEl.remove(); busyEl=null; } };
  // 과거 이력 먼저 표시(끝부분)
  const loading=push('msg sys','과거 대화 불러오는 중…');
  try{ const hist=await fetchRecentMessages(s.session_id,120); loading.remove();
    const hpend={};
    for(const m of hist) renderHistoryMsg(stream,m,hpend);
    if(hist.length) stream.appendChild(el('div','result','── 여기서 이어서 대화 ──'));
  }catch(e){ loading.textContent='(과거 이력 로드 실패)'; }
  main.scrollTop=main.scrollHeight;
  // 카드 버튼이 답을 보낼 때 쓰는 헬퍼(사용자 말풍선 + 전송). busy 여도 보낸다 -
  // 도구 실패 직후 턴이 아직 도는 중일 수 있고, stream-json 입력은 큐잉된다.
  const sendText=(t)=>{ push('msg user',t); setBusy(true); try{ sess.input(t); }catch(e){} };
  const toolPend={};   // tool_use id -> 결과 핸들러 (구조화 카드 짝맞춤)
  sess=T.resume(s.session_id,(f)=>{
    if(f.eof){ setBusy(false);
      if(f.error==='2fa_invalid'||f.error==='2fa_required') clearGrace();  // 만료 → 재인증
      while(pend.length){ const it=pend.shift();                            // 대기분은 못 보냄
        it.chip.textContent='✖ 전송되지 않음 - 세션이 종료됨'; it.chip.classList.add('fail'); }
      push('result', f.error?('종료: '+otpErrMsg(f.error)):'— 세션 종료 —'); return; }
    const ev=f.data||{};
    if(ev.type==='system'){ if(ev.subtype==='init')push('msg sys','● 세션 시작'); return; }
    if(ev.type==='assistant'){ const c=ev.message&&ev.message.content;
      if(Array.isArray(c))for(const x of c){
        if(x.type==='text'){ const d=push('msg assistant',''); d.innerHTML=mdToHtml(x.text); }
        else if(x.type==='tool_use'){
          // 대화형 도구는 버튼 카드(선택지/플랜 승인), 나머지는 구조화 카드
          if(x.name==='AskUserQuestion' && renderAskCard(stream,x.input,sendText)){}
          else if(x.name==='ExitPlanMode' && renderPlanCard(stream,x.input,sendText,()=>ta.focus())){}
          else renderToolUse(stream,{id:x.id,name:x.name,input:x.input},toolPend);
          main.scrollTop=main.scrollHeight;
        }
      } return; }
    if(ev.type==='result'){ setBusy(false);
      const cost=ev.total_cost_usd!=null?(' · $'+ev.total_cost_usd):'';
      push('result','완료'+cost);
      drainPend();                       // 대기 중이던 메시지를 이어서 전송
      return; }
    if(ev.type==='user'){            // tool_result 를 카드에 짝 맞춰 채운다
      const c=ev.message&&ev.message.content;
      if(Array.isArray(c)) feedToolResults(
        c.filter(x=>x&&x.type==='tool_result')
         .map(x=>({tool_use_id:x.tool_use_id,is_error:!!x.is_error,text:_resultText(x.content)})),
        toolPend);
      return; }
  },Object.assign({inplace:isIn},cred));
  // 작업 중에도 입력을 받는다: busy 면 큐에 쌓고(대기 칩 표시) 턴이 끝나면 자동 전송.
  const pend=[];   // {t, chip}
  const doSend=()=>{ const t=ta.value.trim(); if(!t)return;
    ta.value=''; ta.style.height='auto';
    if(busy){
      const d=push('msg user',t);
      const chip=el('div','qchip','⏳ 현재 작업이 끝나면 전송됩니다');
      d.appendChild(chip); pend.push({t,chip});
      return;
    }
    push('msg user',t); setBusy(true); sess.input(t); };
  const drainPend=()=>{ if(!pend.length) return;
    const it=pend.shift(); it.chip.remove();
    setBusy(true); try{ sess.input(it.t); }catch(e){} };
  send.onclick=doSend;
  ta.onkeydown=(e)=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();} };
}

async function renameNative(s){

  if(name==null) return;

    await T.api('POST',`/api/sessions/${s.session_id}/title`,{body:{title:t}});
    s.custom_title=t; s.title=t;
    const it=SESSIONS.find(x=>x.session_id===s.session_id);
    if(it){ it.custom_title=t; it.title=t; }
    // 좌측 목록의 해당 행 이름도 즉시 갱신(데스크톱 2-pane)

  }
}

// ---- export / import ----
function b64toBlob(b64,type){ const bin=atob(b64); const n=bin.length; const arr=new Uint8Array(n);
  for(let i=0;i<n;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:type||'application/zip'}); }
function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>{ const s=String(r.result); const i=s.indexOf(','); res(i>=0?s.slice(i+1):s); };
  r.onerror=()=>rej(new Error('파일 읽기 실패')); r.readAsDataURL(file); }); }
function chk(label){ const wrap=el('label'); wrap.style.cssText='display:flex;align-items:center;gap:8px;margin:10px 0;font-size:.9rem;cursor:pointer';
  const input=document.createElement('input'); input.type='checkbox'; wrap.appendChild(input);
  wrap.appendChild(document.createTextNode(' '+label)); return {wrap,input}; }
function dlBlob(blob,filename){ const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000); }

function exportSession(s){
  const body=el('div');
  body.appendChild(el('div','cwd','세션 대화(JSONL) + 메모리/todos 사이드파일을 zip 으로 내보냅니다.'));
  const wd=chk('작업 폴더도 포함(.gitignore 존중, 용량 커질 수 있음)'); body.appendChild(wd.wrap);
  const go=el('button','btn','📤 내보내기');
  go.onclick=()=>{ closeModal(); doExport(s, wd.input.checked); };
  openModal('📤 세션 내보내기 — '+s.session_id.slice(0,8), body, [go]);
}
async function doExport(s, wd){
  const fname='session_'+s.session_id.slice(0,8)+'.zip';
  if(MODE!=='relay'){
    // 로컬: 브라우저 직접 다운로드(바이너리 그대로)
    const a=document.createElement('a');
    a.href=APIBASE+`/api/sessions/${s.session_id}/export?include_workdir=${wd?'true':'false'}`;
    a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    toast('다운로드 시작');
    return;
  }
  // 릴레이: 커넥터가 zip 을 base64 로 터널링 → 브라우저에서 Blob 복원
  toast(wd?'내보내는 중… (작업폴더 포함, 시간 걸릴 수 있음)':'내보내는 중…');
  try{
    const r=await T.exportSession(s.session_id, wd);   // {b64, filename}
    dlBlob(b64toBlob(r.b64), r.filename||fname);
    toast('내보내기 완료');
  }catch(e){ toast('내보내기 실패: '+e.message); }
}

function importSession(){
  const body=el('div');
  const file=document.createElement('input'); file.type='file'; file.accept='.zip,application/zip';
  body.appendChild(field('세션 zip 파일', file));

  body.appendChild(field('새 작업 폴더(선택)', cwd));
  const ow=chk('같은 ID 세션이 있으면 덮어쓰기'); body.appendChild(ow.wrap);
  const rw=chk('작업 폴더 파일도 복원(zip 에 포함된 경우)'); body.appendChild(rw.wrap);
  const go=el('button','btn','📥 가져오기');
  go.onclick=async()=>{

    go.disabled=true; const orig=go.textContent; go.textContent='가져오는 중…';
    try{
      const r=await T.importSession(f,{ new_cwd:cwd.value.trim()||null,
        overwrite:ow.input.checked, restore_workdir:rw.input.checked });
      if(r && r.error){ toast('실패: '+r.error); go.disabled=false; go.textContent=orig; return; }
      const sid=(r&&(r.session_id||r.imported))||'';
      toast('가져오기 완료'+(sid?(' ('+String(sid).slice(0,8)+')'):'')); closeModal(); loadList();
    }catch(e){ toast('실패: '+e.message); go.disabled=false; go.textContent=orig; }
  };
  openModal('📥 세션 가져오기', body, [go]);
}

// ---- 모달 시스템 ----
let _modalOpener=null;
function closeModal(){
  const o=$('#overlay'); if(o)o.remove();
  try{ document.removeEventListener('keydown', _modalKey); }catch(e){}
  // 닫힌 뒤 포커스는 모달을 연 버튼으로(DR-13)
  try{ if(_modalOpener && _modalOpener.focus){ _modalOpener.focus(); } }catch(e){}
  _modalOpener=null;
}
function _modalKey(e){ if(e.key==='Escape'){ closeModal(); } }
function openModal(title, bodyEl, footChildren){
  closeModal();
  try{ _modalOpener=(document.activeElement&&document.activeElement.tagName==='BUTTON')?document.activeElement:null; }catch(e){}
  const ov=el('div','overlay'); ov.id='overlay';
  const m=el('div','modal');

    if(o.sub) body.appendChild(el('div','sheet-sub',o.sub));
    if(o.subNode) body.appendChild(o.subNode);
    const err=el('div','err'); body.appendChild(err);
    const cancel=el('button','btn ghost','취소'); cancel.onclick=()=>{ closeModal(); resolve(false); };
    const go=el('button','btn'+(o.danger?' danger':''),o.action||'확인');
    go.onclick=async()=>{

      go.disabled=true; const orig=go.textContent; go.textContent=o.busyText||(orig+' 중…'); err.textContent='';

function fbWalk(tree,rk,rel,depth){

// 키보드: ↑↓ 이동, → 펼치기/첫 자식, ← 접기/부모, Enter 열기(고정), Space 미리보기, Home/End
function fbVisiblePaths(){ return FB.tree?[...FB.tree.querySelectorAll('.fbrow')].map(r=>r.dataset.path):[]; }
function fbSelect(id){ FB.sel=id; if(!FB.tree) return;
  FB.tree.querySelectorAll('.fbrow').forEach(r=>{ const on=r.dataset.path===id; r.classList.toggle('sel',on);
    if(on&&r.scrollIntoView) r.scrollIntoView({block:'nearest'}); }); }
function fbTreeKey(ev){
  const k=ev.key, list=fbVisiblePaths(); if(!list.length) return;
  const i=list.indexOf(FB.sel), p=FB.sel, e=FB.ent[p], dir=e&&e.type==='dir', parent=p?fbParentId(p):null;
  let done=true;
  if(k==='ArrowDown') fbSelect(list[Math.min(list.length-1,i+1)]);
  else if(k==='ArrowUp') fbSelect(list[Math.max(0,i<0?0:i-1)]);
  else if(k==='Home') fbSelect(list[0]);
  else if(k==='End') fbSelect(list[list.length-1]);
  else if(k==='ArrowRight'&&dir){ if(!FB.open.has(p)) fbToggle(p); else if(list[i+1]&&fbParentId(list[i+1])===p) fbSelect(list[i+1]); }
  else if(k==='ArrowLeft'){ if(dir&&FB.open.has(p)) fbToggle(p); else if(parent!==null) fbSelect(parent); }
  else if(k==='Enter'&&e){ if(dir) fbToggle(p); else fbOpen(p,{pin:true}); }
  else if(k===' '&&e&&!dir) fbOpen(p,{pin:false});

function fbToggle(id){ if(FB.open.has(id)) FB.open.delete(id); else { FB.open.add(id); delete FB.errs[id]; } fbSaveState(); return fbRenderTree(); }
// 이동 경로를 누르면 탐색기에서 그 폴더까지 펼쳐 보여준다(모바일은 탐색기 화면으로)
function fbReveal(id){ let p=id; while(p!==null){ FB.open.add(p); p=fbParentId(p); }

    const prev=FB.tabs.find(x=>!x.pinned), nt=fbNewTab(rk,path,!!pin);
    if(prev&&!pin){ fbDisposeTab(prev); for(const k of Object.keys(prev)) delete prev[k]; Object.assign(prev,nt); t=prev; }
    else { t=nt; FB.tabs.push(t); }

function fbRootName(rk){ const r=fbRoot(rk); return r?r.name:baseName(rk); }

async function fbDownload(t){

// Monaco(VS Code 편집기) — 📁 파일을 처음 열 때만 받는다(평소 앱 로딩 무영향). vendor/monaco.js 는
// ops/build_monaco_vendor.py 가 만든 한 파일 번들(릴레이 /vendor 는 하위 폴더를 서빙하지 않는다).
let _monacoP=null;
function vendorBase(){ return MODE==='relay'
  ? location.pathname.replace(/\/(app|index\.html)\/?$/,'').replace(/\/$/,'')+'/vendor' : APIBASE+'/vendor'; }
function loadMonaco(){
  if(_monacoP) return _monacoP;
  _monacoP=new Promise((res,rej)=>{
    const base=vendorBase();
    const css=document.createElement('link'); css.rel='stylesheet'; css.href=base+'/monaco.css'; document.head.appendChild(css);
    // 언어 서비스 워커는 쓰지 않는다(문법 색만) — 빈 워커
    window.MonacoEnvironment={getWorker(){ return new Worker(URL.createObjectURL(new Blob(['self.onmessage=()=>{}'],{type:'text/javascript'}))); }};
    const s=document.createElement('script'); s.src=base+'/monaco.js';
    s.onload=()=>{ try{ window.require(['vs/editor/editor.main'],()=>{ fbMonacoSetup(window.monaco); res(window.monaco); },
                                         (e)=>{ _monacoP=null; rej(e instanceof Error?e:new Error('monaco')); }); }
                   catch(e){ _monacoP=null; rej(e); } };
    s.onerror=()=>{ _monacoP=null; rej(new Error('monaco.js 받기 실패')); };
    document.head.appendChild(s);
  });
  return _monacoP;
}
function fbMonacoSetup(mon){
  // JSON 은 언어 서비스(워커) 없이 쓰므로 간단한 문법 색을 직접 단다
  try{ mon.languages.setMonarchTokensProvider('json',{tokenizer:{root:[
    [/"(?:[^"\\]|\\.)*"(?=\s*:)/,'type'], [/"(?:[^"\\]|\\.)*"/,'string'],
    [/-?\d+(?:\.\d+)?(?:[eE][-+]?\d+)?/,'number'], [/\b(?:true|false|null)\b/,'keyword'], [/[{}[\],:]/,'delimiter']]}}); }catch(e){}
  try{ window.DOMPurify.addHook('afterSanitizeAttributes',(n)=>{ if(n.tagName==='A'){ n.setAttribute('target','_blank'); n.setAttribute('rel','noopener noreferrer'); } }); }catch(e){}
}
